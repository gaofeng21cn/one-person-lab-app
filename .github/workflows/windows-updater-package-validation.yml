name: Windows Updater Package Validation

on:
  workflow_dispatch:
    inputs:
      shell_ref:
        description: Exact 40-character active Shell commit to package.
        required: true
        type: string
      framework_ref:
        description: Exact 40-character OPL Framework commit bound into the package.
        required: true
        type: string
      release_version:
        description: Display version for the non-published validation package.
        required: true
        type: string
        default: 26.7.31-buildtest.1
      updater_version:
        description: Machine SemVer written into updater metadata.
        required: true
        type: string
        default: 26.7.3199

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-windows-updater-package-validation-${{ github.sha }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  validate-inputs:
    name: Validate immutable package inputs
    runs-on: ubuntu-latest
    steps:
      - name: Require exact source identities
        shell: bash
        env:
          APP_REF: ${{ github.sha }}
          SHELL_REF: ${{ inputs.shell_ref }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          UPDATER_VERSION: ${{ inputs.updater_version }}
        run: |
          set -euo pipefail
          [[ "$APP_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SHELL_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          [[ "$UPDATER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

  build:
    name: Build active Shell Windows updater package
    needs: validate-inputs
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: >-
        {"include":[{"platform":"windows-x64","os":"windows-latest","command":"node scripts/desktop/build-release.mjs --platform win32 --arch x64","artifact-name":"windows-x64-updater-validation","arch":"x64"}]}
      ref: ${{ github.sha }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      opl_release_version: ${{ inputs.release_version }}
      opl_updater_version: ${{ inputs.updater_version }}
      require_windows_updater_assets: true
      upload_installers_only: false
      append_commit_hash: false
      skip_code_quality: true
