      - name: Upload Actions cache plan and receipt
        if: ${{ steps.full_package_build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-actions-cache-evidence-${{ env.OPL_RELEASE_VERSION }}-${{ github.run_id }}
          path: |
            one-person-lab-app/dist/opl-full-release/actions-cache-plan.json
            one-person-lab-app/dist/opl-full-release/actions-cache-receipt.json
            one-person-lab-app/dist/opl-full-release/runtime-cache-events.json
            one-person-lab-app/dist/opl-full-release/full-runtime-currentness-probe.json
            one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json
