name: OPL Full First-Install Release

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup
        required: false
        default: execute
        type: string
      opl_version:
        description: OPL display version used by the release tag and Full asset names
        required: true
        type: string
      opl_updater_version:
        description: Monotonic machine SemVer stamped into the Full App bundle
        required: true
        type: string
      framework_ref:
        description: Exact frozen OPL Framework SHA to bundle
        required: true
        type: string
      shell_ref:
        description: Exact frozen opl-aion-shell SHA to bundle
        required: true
        type: string
      upload_full_package_artifact:
        description: Upload the complete Full output bundle for a downstream publisher; VM uses the DMG-only artifact
        required: false
        default: false
        type: boolean
      force_rebuild_runtime_cache:
        description: Ignore restored Full runtime layer cache and rebuild all layers
        required: false
        default: false
        type: boolean
      cache_only:
        description: Warm and validate Full runtime layer caches without building release assets
        required: false
        default: false
        type: boolean
      full_dmg_compression_level:
        description: zlib level for the Full DMG when full_dmg_format is UDZO.
        required: false
        default: '9'
        type: string
      full_dmg_format:
        description: Full DMG compression format. ULMO favors release size; UDZO keeps legacy zlib compatibility.
        required: false
        default: ULMO
        type: string
      release_bundle_digest:
        description: Exact immutable Framework Release Bundle digest for the live control plane.
        required: false
        default: ''
        type: string
      release_cohort_ref:
        description: Stable release cohort sha256 identity.
        required: false
        default: ''
        type: string
      target_standard_release_id:
        description: Exact mutable Standard Release database ID targeted by this same-tag Full append.
        required: false
        default: ''
        type: string
      target_standard_release_tag:
        description: Exact mutable Standard Release tag targeted by this same-tag Full append.
        required: false
        default: ''
        type: string
      target_standard_target_commitish:
        description: Exact mutable Standard Release target commit targeted by this same-tag Full append.
        required: false
        default: ''
        type: string
      artifact_app_sha: { description: Frozen artifact App SHA, required: false, default: '', type: string }
      operation: { description: Release operation inherited from the Bundle controller, required: false, default: '', type: string }
      operation_started_at: { description: Immutable outer operation start timestamp, required: false, default: '', type: string }
      operation_deadline_at: { description: Immutable outer operation deadline; never recomputed here, required: false, default: '', type: string }
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_ID_PASSWORD:
        required: false
      TEAM_ID:
        required: false
      IDENTITY:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APP_ID:
        required: false
      OPL_RELEASE_NOTES_CODEX_API_KEY:
        required: false
permissions:
  contents: read

concurrency:
  group: opl-full-first-install-build-${{ inputs.opl_version }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove Full build validation-only topology starts
        run: |
          test '${{ inputs.release_bundle_digest }}' = sha256:canary
          test '${{ inputs.operation }}' = append_full
          test '${{ inputs.framework_ref }}' = ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc

  full-first-install:
    if: ${{ inputs.mode != 'canary' }}
    name: Build App-owned Full first-install DMG
    runs-on: macos-latest
    timeout-minutes: ${{ inputs.operation == 'append_full' && 130 || 90 }}
    environment: release-stable
    permissions:
      contents: read
      actions: read
    outputs:
      finalizer_input_digest: ${{ steps.normalize_full_finalizer_input_digest.outputs.artifact_digest }}
      mas_scholar_skills_ref: ${{ steps.release_version.outputs.mas_scholar_skills_ref }}

    steps:
      - name: Admit one-shot release-bound Full build
        if: ${{ inputs.operation != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opl-full-admission"
          touch "$RUNNER_TEMP/opl-full-admission/stdout.txt" "$RUNNER_TEMP/opl-full-admission/stderr.txt"
          exec > >(tee -a "$RUNNER_TEMP/opl-full-admission/stdout.txt") 2> >(tee -a "$RUNNER_TEMP/opl-full-admission/stderr.txt" >&2)
          printf '%s\0' '${{ inputs.operation }}' '${{ inputs.operation_started_at }}' '${{ inputs.operation_deadline_at }}' \
            '${{ inputs.release_bundle_digest }}' '${{ inputs.artifact_app_sha }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}' \
            '${{ inputs.target_standard_release_id }}' '${{ inputs.target_standard_release_tag }}' '${{ inputs.target_standard_target_commitish }}' \
            | shasum -a 256 | awk '{print "sha256:"$1}' > "$RUNNER_TEMP/opl-full-admission/input-digest.txt"
          input_digest="$(cat "$RUNNER_TEMP/opl-full-admission/input-digest.txt")"
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          node <<'NODE' || { status=failed; reason=deadline_elapsed; }
          const started = Date.parse('${{ inputs.operation_started_at }}');
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          if [ "$status" = passed ] && [ '${{ inputs.operation }}' != append_full ]; then status=failed; reason=operation_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]; then status=failed; reason=bundle_digest_invalid; fi
          if [ "$status" = passed ] && [ '${{ inputs.release_bundle_digest }}' = sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 ]; then status=failed; reason=bundle_permanently_rejected; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.artifact_app_sha }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=app_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=shell_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=framework_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.target_standard_release_id }}' =~ ^[1-9][0-9]*$ ]]; then status=failed; reason=standard_release_id_invalid; fi
          if [ "$status" = passed ] && [ '${{ inputs.target_standard_release_tag }}' != "v${{ inputs.opl_version }}" ]; then status=failed; reason=standard_release_tag_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.target_standard_target_commitish }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=standard_release_target_invalid; fi
          jq -n --arg status "$status" --arg reason "$reason" --arg operation '${{ inputs.operation }}' --arg input_digest "$input_digest" \
            '{schema:"opl_release_nested_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,input_digest:$input_digest,evidence:{stdout:"stdout.txt",stderr:"stderr.txt"},run_id:env.GITHUB_RUN_ID,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > "$RUNNER_TEMP/opl-full-admission/admission.json"
          test "$status" = passed

      - name: Upload release-bound Full build admission
        if: ${{ always() && inputs.operation != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-full-build-admission-${{ github.run_id }}
          path: ${{ runner.temp }}/opl-full-admission
          if-no-files-found: error
          retention-days: 30

      - name: Verify Full signing and notarization credentials
        if: ${{ !inputs.cache_only }}
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          set -euo pipefail
          production_release="${{ inputs.operation == 'append_full' && inputs.upload_full_package_artifact }}"
          missing=()
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_ID APPLE_ID_PASSWORD TEAM_ID IDENTITY; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_csv="$(IFS=', '; echo "${missing[*]}")"
            if [ "$production_release" = "true" ]; then
              echo "::error title=Full production signing preflight failed::Missing GitHub Actions secrets: ${missing_csv}"
              echo "::error::Production Full assets require Developer ID signing and Apple notarization; local authorization fallback is forbidden."
              exit 1
            fi
            echo "::notice::Development-only Full build has no Apple credentials and will remain non-distributable."
            exit 0
          fi
          if ! printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode >/dev/null 2>&1; then
            echo "::error title=Full first-install release signing preflight failed::BUILD_CERTIFICATE_BASE64 is not valid base64."
            exit 1
          fi
          echo "Full first-install signing and notarization material is present."

      - name: Checkout frozen artifact App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: one-person-lab-app
          ref: ${{ inputs.artifact_app_sha || github.sha }}

      - name: Checkout canonical Full release executor
        if: ${{ inputs.operation == 'append_full' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-executor
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate frozen Full source SHAs
        run: |
          [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::shell_ref must be the exact frozen Shell SHA."; exit 1; }
          [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::framework_ref must be the exact frozen Framework SHA."; exit 1; }
          if [ -n '${{ inputs.release_bundle_digest }}' ] || [ '${{ inputs.cache_only }}' = 'true' ]; then
            [[ '${{ inputs.artifact_app_sha }}' =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::artifact_app_sha must be exact for release-bound Full builds."; exit 1; }
          fi

      - name: Validate immutable Release Bundle caller
        if: ${{ inputs.operation != '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::release_bundle_digest must be exact."; exit 1; }
          test '${{ inputs.release_bundle_digest }}' != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 || { echo "::error::release_bundle_digest is permanently rejected."; exit 1; }
          [[ '${{ inputs.artifact_app_sha }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::artifact_app_sha must be the exact frozen App SHA."; exit 1; }
          [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::shell_ref must be the exact frozen Shell SHA."; exit 1; }
          [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::framework_ref must be the exact frozen Framework SHA."; exit 1; }
          test '${{ inputs.release_cohort_ref }}' = '${{ inputs.release_bundle_digest }}' || { echo "::error::release_cohort_ref must equal the Bundle digest."; exit 1; }
          [[ '${{ inputs.target_standard_release_id }}' =~ ^[1-9][0-9]*$ ]] || { echo "::error::target_standard_release_id must be an exact positive GitHub Release ID."; exit 1; }
          test '${{ inputs.target_standard_release_tag }}' = "v${{ inputs.opl_version }}" || { echo "::error::target_standard_release_tag must bind the Full carrier version."; exit 1; }
          [[ '${{ inputs.target_standard_target_commitish }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_standard_target_commitish must be an exact lowercase SHA."; exit 1; }
          test "$(git -C "$GITHUB_WORKSPACE/release-executor" rev-parse HEAD)" = "$GITHUB_SHA" || { echo "::error::Full release executor checkout is not the active canonical workflow SHA."; exit 1; }
          test -f "$GITHUB_WORKSPACE/release-executor/scripts/notarize-macos-dmg.ts"
          test ! -L "$GITHUB_WORKSPACE/release-executor/scripts/notarize-macos-dmg.ts"

      - name: Enforce cache-only warmup boundary
        if: ${{ inputs.cache_only }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo "::error::Cache-only warmup is restricted to refs/heads/main."; exit 1; }
          test '${{ inputs.upload_full_package_artifact }}' = 'false' || { echo "::error::Cache-only warmup cannot upload a Full package."; exit 1; }

      - name: Checkout active shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref }}
          path: one-person-lab-app/shells/aionui

      - name: Checkout OPL Framework payload source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref }}
          path: one-person-lab

      - name: Resolve default Full build inputs
        id: full-build-inputs
        shell: bash
        run: |
          set -euo pipefail
          third_party="$GITHUB_WORKSPACE/one-person-lab-app/contracts/app-full-third-party-source-manifest.json"
          for output in officecli mineru ui_ux_pro_max; do
            ref="$(jq -er --arg id "$output" '.sources[$id].ref' "$third_party")"
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Third-party $output ref is missing or invalid."; exit 1; }
            echo "${output}_ref=$ref" >> "$GITHUB_OUTPUT"
          done
          for selector in \
            bun_version:.toolchain.bun.version go_version:.toolchain.go.version \
            python_version:.toolchain.python.version uv_version:.toolchain.uv.version zstd_version:.toolchain.zstd.version \
            temporal_version:.runtime_payloads.temporal_cli.version temporal_sha256:.runtime_payloads.temporal_cli.darwin_arm64_archive_sha256 \
            officecli_version:.runtime_payloads.officecli.version officecli_sha256:.runtime_payloads.officecli.darwin_arm64_asset_sha256; do
            output="${selector%%:*}"; query="${selector#*:}"; value="$(jq -er "$query" "$third_party")"
            echo "${output}=$value" >> "$GITHUB_OUTPUT"
          done
      - name: Checkout MAS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/med-autoscience
          ref: main
          path: med-autoscience

      - name: Checkout MAS Scholar Skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/mas-scholar-skills
          ref: main
          path: mas-scholar-skills

      - name: Checkout MAG
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/med-autogrant
          ref: main
          path: med-autogrant

      - name: Checkout RCA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/redcube-ai
          ref: main
          path: redcube-ai

      - name: Checkout OPL Meta Agent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-meta-agent
          ref: main
          path: opl-meta-agent

      - name: Checkout OPL BookForge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-bookforge
          ref: main
          path: opl-bookforge

      - name: Checkout OPL Flow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-flow
          ref: main
          path: opl-flow

      - name: Checkout OfficeCLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iOfficeAI/OfficeCLI
          ref: ${{ steps.full-build-inputs.outputs.officecli_ref }}
          path: OfficeCLI

      - name: Checkout MinerU Ecosystem
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opendatalab/MinerU-Ecosystem
          ref: ${{ steps.full-build-inputs.outputs.mineru_ref }}
          path: MinerU-Ecosystem

      - name: Checkout UI UX Pro Max skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nextlevelbuilder/ui-ux-pro-max-skill
          ref: ${{ steps.full-build-inputs.outputs.ui_ux_pro_max_ref }}
          path: ui-ux-pro-max-skill

      - name: Validate Full source roots
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            one-person-lab/package.json
            one-person-lab-app/shells/aionui/package.json
            med-autoscience/pyproject.toml
            mas-scholar-skills/.codex-plugin/plugin.json
            mas-scholar-skills/contracts/opl_capability_package_manifest.json
            med-autogrant/pyproject.toml
            redcube-ai/package.json
            opl-meta-agent/package.json
            opl-bookforge/package.json
            opl-flow/.codex-plugin/plugin.json
            OfficeCLI/README.md
            MinerU-Ecosystem/README.md
            ui-ux-pro-max-skill/README.md
          )
          for required_path in "${required_paths[@]}"; do
            if [ ! -f "$GITHUB_WORKSPACE/$required_path" ]; then
              echo "::error::Required Full source is missing: $required_path"
              exit 1
            fi
          done
          for repo in \
            med-autoscience mas-scholar-skills med-autogrant redcube-ai \
            opl-meta-agent opl-bookforge opl-flow OfficeCLI \
            MinerU-Ecosystem ui-ux-pro-max-skill; do
            commit="$(git -C "$GITHUB_WORKSPACE/$repo" rev-parse HEAD)"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$repo resolved an invalid commit."; exit 1; }
          done

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          mas_scholar_skills_ref="$(git -C mas-scholar-skills rev-parse HEAD)"
          echo "OPL_RELEASE_VERSION=${{ inputs.opl_version }}" >> "$GITHUB_ENV"
          echo "OPL_UPDATER_VERSION=${{ inputs.opl_updater_version }}" >> "$GITHUB_ENV"
          echo "OPL_FULL_FRAMEWORK_REF=${{ inputs.framework_ref }}" >> "$GITHUB_ENV"
          echo "OPL_FULL_MAS_REF=$(git -C med-autoscience rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_MAS_SCHOLAR_SKILLS_REF=$mas_scholar_skills_ref" >> "$GITHUB_ENV"
          echo "OPL_FULL_MAG_REF=$(git -C med-autogrant rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_RCA_REF=$(git -C redcube-ai rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_META_AGENT_REF=$(git -C opl-meta-agent rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_BOOKFORGE_REF=$(git -C opl-bookforge rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_OPL_FLOW_REF=$(git -C opl-flow rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_OFFICECLI_REF=$(git -C OfficeCLI rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_MINERU_REF=$(git -C MinerU-Ecosystem rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_UI_UX_PRO_MAX_REF=$(git -C ui-ux-pro-max-skill rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "OPL_FULL_WORKFLOW_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          echo "mas_scholar_skills_ref=$mas_scholar_skills_ref" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        id: node-cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            one-person-lab/package-lock.json
            redcube-ai/package-lock.json

      - name: Validate canonical Stable version
        working-directory: one-person-lab-app
        run: npm run release:version:validate -- --channel stable --version "$OPL_RELEASE_VERSION" --updater-version "$OPL_UPDATER_VERSION"

      - name: Verify frozen OfficeCLI source
        shell: bash
        run: |
          set -euo pipefail
          test "$OPL_FULL_OFFICECLI_REF" = "$(git -C "$GITHUB_WORKSPACE/OfficeCLI" rev-parse HEAD)"

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.full-build-inputs.outputs.bun_version }}

      - name: Restore Bun install cache
        if: ${{ !inputs.cache_only }}
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-${{ runner.arch }}-
            bun-install-${{ runner.os }}-

      - name: Restore Electron artifacts cache
        if: ${{ !inputs.cache_only }}
        id: electron-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-macos-arm64-arm64-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock') }}
          restore-keys: |
            electron-cache-macos-arm64-arm64-
            electron-cache-macos-arm64-

      - name: Setup bootstrap uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: '0.11.29'
          enable-cache: false

      - name: Restore uv artifacts cache
        id: uv-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/Library/Caches/uv
          key: full-uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('med-autoscience/uv.lock', 'med-autoscience/pyproject.toml', 'med-autogrant/uv.lock', 'med-autogrant/pyproject.toml') }}
          restore-keys: |
            full-uv-${{ runner.os }}-${{ runner.arch }}-
            full-uv-${{ runner.os }}-

      - name: Setup exact Python and packaged uv
        shell: bash
        env:
          EXPECTED_PYTHON_VERSION: ${{ steps.full-build-inputs.outputs.python_version }}
          EXPECTED_UV_VERSION: ${{ steps.full-build-inputs.outputs.uv_version }}
        run: |
          set -euo pipefail
          uv python install --managed-python "$EXPECTED_PYTHON_VERSION"
          python_executable="$(uv python find --managed-python "$EXPECTED_PYTHON_VERSION")"
          actual_version="$("$python_executable" --version 2>&1)"
          test "$actual_version" = "Python $EXPECTED_PYTHON_VERSION"
          python_root="$(cd "$(dirname "$python_executable")/.." && pwd -P)"
          toolchain_root="$RUNNER_TEMP/opl-python-toolchain"
          uv venv --python "$python_executable" "$toolchain_root"
          uv pip install --python "$toolchain_root/bin/python" --no-deps "uv==$EXPECTED_UV_VERSION"
          "$toolchain_root/bin/uv" --version | grep -F "uv $EXPECTED_UV_VERSION"
          echo "$toolchain_root/bin" >> "$GITHUB_PATH"
          {
            echo "OPL_FULL_PYTHON_ROOT=$python_root"
            echo "OPL_FULL_PYTHON_BIN=$python_executable"
            echo "OPL_FULL_UV_BIN=$toolchain_root/bin/uv"
          } >> "$GITHUB_ENV"
          export PATH="$toolchain_root/bin:$PATH"
          python --version | grep -Fx "Python $EXPECTED_PYTHON_VERSION"
          uv --version | grep -F "uv $EXPECTED_UV_VERSION"

      - name: Setup Go
        id: go-cache
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.full-build-inputs.outputs.go_version }}
          cache: true
          cache-dependency-path: MinerU-Ecosystem/cli/mineru-open-api/go.sum

      - name: Install zstd, Temporal CLI, OfficeCLI, and MinerU
        shell: bash
        run: |
          set -euo pipefail
          brew install zstd
          mineru_root="$GITHUB_WORKSPACE/MinerU-Ecosystem/cli/mineru-open-api"
          mineru_version="$(cat "$mineru_root/VERSION")"
          mineru_commit="$(git -C "$GITHUB_WORKSPACE/MinerU-Ecosystem" rev-parse --short HEAD)"
          mineru_built_at="$(git -C "$GITHUB_WORKSPACE/MinerU-Ecosystem" show -s --format=%cI HEAD)"
          (
            cd "$mineru_root"
            go install -ldflags "-X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.version=$mineru_version -X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.commit=$mineru_commit -X github.com/opendatalab/MinerU-Ecosystem/cli/mineru-open-api/cmd.date=$mineru_built_at" .
          )
          mkdir -p "$HOME/.local/bin"
          officecli_bin="$HOME/.local/bin/officecli"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/iOfficeAI/OfficeCLI/releases/download/v${{ steps.full-build-inputs.outputs.officecli_version }}/officecli-mac-arm64" \
            -o "$officecli_bin"
          echo '${{ steps.full-build-inputs.outputs.officecli_sha256 }}  '"$officecli_bin" | shasum -a 256 -c -
          chmod +x "$officecli_bin"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/go/bin:$HOME/.local/bin:$PATH"
          officecli --version
          mineru-open-api version
          temporal_version='${{ steps.full-build-inputs.outputs.temporal_version }}'
          temporal_archive="$RUNNER_TEMP/temporal_cli_${temporal_version}_darwin_arm64.tar.gz"
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            "https://github.com/temporalio/cli/releases/download/v${temporal_version}/temporal_cli_${temporal_version}_darwin_arm64.tar.gz" \
            -o "$temporal_archive"
          echo '${{ steps.full-build-inputs.outputs.temporal_sha256 }}  '"$temporal_archive" | shasum -a 256 -c -
          tar -xzf "$temporal_archive" -C "$HOME/.local/bin" temporal
          temporal --version | grep -F "temporal version $temporal_version"
          uv --version
          uv --version | grep -F 'uv ${{ steps.full-build-inputs.outputs.uv_version }}'
          zstd --version | grep -F 'v${{ steps.full-build-inputs.outputs.zstd_version }}'
          bun --version | grep -Fx '${{ steps.full-build-inputs.outputs.bun_version }}'
          go version | grep -F 'go${{ steps.full-build-inputs.outputs.go_version }}'
          python --version | grep -F 'Python ${{ steps.full-build-inputs.outputs.python_version }}'
          echo "OPL_FULL_BUN_BIN=$(command -v bun)" >> "$GITHUB_ENV"
          echo "OPL_FULL_TEMPORAL_CLI_BIN=$(command -v temporal)" >> "$GITHUB_ENV"
          echo "OPL_FULL_TEMPORAL_CLI_ARCHIVE=$temporal_archive" >> "$GITHUB_ENV"
          echo "OPL_FULL_TOOLCHAIN_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Write Full toolchain supply-chain observation receipt
        shell: bash
        env:
          EXPECTED_BUN_VERSION: ${{ steps.full-build-inputs.outputs.bun_version }}
          EXPECTED_GO_VERSION: ${{ steps.full-build-inputs.outputs.go_version }}
          EXPECTED_PYTHON_VERSION: ${{ steps.full-build-inputs.outputs.python_version }}
          EXPECTED_UV_VERSION: ${{ steps.full-build-inputs.outputs.uv_version }}
          EXPECTED_ZSTD_VERSION: ${{ steps.full-build-inputs.outputs.zstd_version }}
        run: |
          set -euo pipefail
          umask 077
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const path = require('node:path');
          const commands = [
            ['bun', ['--version'], process.env.EXPECTED_BUN_VERSION],
            ['go', ['version'], process.env.EXPECTED_GO_VERSION],
            ['python', ['--version'], process.env.EXPECTED_PYTHON_VERSION],
            ['uv', ['--version'], process.env.EXPECTED_UV_VERSION],
            ['zstd', ['--version'], process.env.EXPECTED_ZSTD_VERSION],
          ];
          const sha256File = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const components = Object.fromEntries(commands.map(([command, args, expectedVersion]) => {
            const executable = execFileSync('which', [command], { encoding: 'utf8' }).trim();
            const resolvedExecutable = fs.realpathSync(executable);
            const versionOutput = execFileSync(command, args, { encoding: 'utf8' }).trim();
            if (!expectedVersion || !versionOutput.includes(expectedVersion)) {
              throw new Error(`${command} version ${versionOutput} does not contain frozen ${expectedVersion}`);
            }
            return [command, {
              expected_version: expectedVersion,
              version_output: versionOutput,
              executable_path: executable,
              resolved_executable_path: resolvedExecutable,
              executable_sha256: sha256File(resolvedExecutable),
            }];
          }));
          const appRoot = path.join(process.env.GITHUB_WORKSPACE, 'one-person-lab-app');
          const sourceManifest = path.join(appRoot, 'contracts/app-full-third-party-source-manifest.json');
          const qualificationManifest = path.join(appRoot, 'contracts/app-release-qualification-input-manifest.json');
          const receipt = {
            schema: 'opl_app_full_toolchain_observation_receipt.v1',
            observed_at: new Date().toISOString(),
            source_authority: {
              full_input_manifest_sha256: sha256File(sourceManifest),
              qualification_input_manifest_sha256: sha256File(qualificationManifest),
            },
            components,
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'opl-full-toolchain-observation-receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`, { mode: 0o600 });
          NODE

      - name: Install Framework dependencies
        working-directory: one-person-lab
        run: |
          npm ci
          echo "OPL_FULL_FRAMEWORK_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build Framework CLI payload
        working-directory: one-person-lab
        run: |
          npm run build
          echo "OPL_FULL_FRAMEWORK_BUILD_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install App shell dependencies
        if: ${{ !inputs.cache_only }}
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run postinstall || true
          echo "OPL_FULL_SHELL_NODE_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify App product profile against Shell consumer
        if: ${{ !inputs.cache_only }}
        shell: bash
        run: |
          set -euo pipefail
          cd one-person-lab-app
          node --experimental-strip-types scripts/app-product-profile.ts
          cd shells/aionui
          bun vitest run tests/unit/common-config/oplProductProfile.test.ts

      - name: Verify Full bootstrap and Home readiness before packaging
        if: ${{ !inputs.cache_only }}
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          bun vitest run \
            tests/unit/opl-runtime/oplRuntimeBridge.test.ts \
            tests/unit/opl-runtime/firstRunVmSmoke.test.ts \
            tests/unit/opl-runtime/firstRunVmSmokeScripts.test.ts \
            tests/unit/guid/oplHomeAssistants.test.ts \
            tests/unit/guid/composerSurface.test.ts
          VITEST_INCLUDE_DOM=1 bun vitest run --project dom \
            tests/unit/guid/HomeStarters.dom.test.tsx \
            tests/unit/guid/GuidPage.dom.test.tsx \
            tests/unit/guid/useGuidSend.oplWhitelist.dom.test.tsx

      - name: Resolve App shell Electron version
        if: ${{ !inputs.cache_only }}
        id: shell-electron-version
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "require('./package.json').devDependencies.electron.replace(/^[~^]/, '')")"
          if [ -z "$electron_version" ] || [ "$electron_version" = "undefined" ]; then
            echo "Unable to resolve App shell Electron version from package.json." >&2
            exit 1
          fi
          echo "version=$electron_version" >> "$GITHUB_OUTPUT"
          echo "OPL_FULL_SHELL_ELECTRON_VERSION=$electron_version" >> "$GITHUB_ENV"

      - name: Rebuild App shell native modules for Electron
        if: ${{ !inputs.cache_only }}
        working-directory: one-person-lab-app/shells/aionui
        shell: bash
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: ${{ steps.shell-electron-version.outputs.version }}
          npm_config_target_arch: arm64
        run: |
          set -euo pipefail
          bunx electron-builder install-app-deps
          echo "OPL_FULL_SHELL_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore Full shell Vite output cache
        if: ${{ !inputs.cache_only }}
        id: restore-shell-vite-output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            one-person-lab-app/shells/aionui/out/main
            one-person-lab-app/shells/aionui/out/preload
            one-person-lab-app/shells/aionui/out/renderer
            one-person-lab-app/shells/aionui/out/.build-hash
          key: full-shell-vite-output-${{ runner.os }}-${{ runner.arch }}-${{ inputs.opl_version }}-${{ hashFiles('one-person-lab-app/shells/aionui/package.json', 'one-person-lab-app/shells/aionui/bun.lock', 'one-person-lab-app/shells/aionui/tsconfig.json', 'one-person-lab-app/shells/aionui/packages/desktop/electron.vite.config.ts', 'one-person-lab-app/shells/aionui/packages/desktop/src/**', 'one-person-lab-app/shells/aionui/public/**', 'one-person-lab-app/contracts/app-product-profile.json') }}

      - name: Prepare domain runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          domain_python="$OPL_FULL_PYTHON_BIN"
          test -x "$domain_python"
          uv sync --project med-autoscience --python "$domain_python" --no-dev
          uv sync --project med-autogrant --python "$domain_python" --no-dev
          npm ci --prefix redcube-ai
          npm install --prefix redcube-ai --no-save --package-lock=false "$GITHUB_WORKSPACE/one-person-lab"
          npm run --prefix redcube-ai build
          echo "OPL_FULL_DOMAIN_DEPS_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Resolve Full runtime cache keys
        id: runtime-cache-keys
        working-directory: release-executor
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$GITHUB_WORKSPACE/.opl-full-runtime-cache"
          export OPL_FRAMEWORK_ROOT="$GITHUB_WORKSPACE/one-person-lab"
          export OPL_FULL_BUN_BIN="${OPL_FULL_BUN_BIN:-$(command -v bun)}"
          export OPL_FULL_INCLUDE_BUN_RUNTIME="${OPL_FULL_INCLUDE_BUN_RUNTIME:-0}"
          export OPL_FULL_UV_BIN="$(command -v uv)"
          export OPL_FULL_TEMPORAL_CLI_BIN="${OPL_FULL_TEMPORAL_CLI_BIN:-$(command -v temporal)}"
          export OPL_FULL_MAS_ROOT="$GITHUB_WORKSPACE/med-autoscience"
          export OPL_FULL_MAS_SCHOLAR_SKILLS_ROOT="$GITHUB_WORKSPACE/mas-scholar-skills"
          export OPL_FULL_MAG_ROOT="$GITHUB_WORKSPACE/med-autogrant"
          export OPL_FULL_RCA_ROOT="$GITHUB_WORKSPACE/redcube-ai"
          export OPL_FULL_META_AGENT_ROOT="$GITHUB_WORKSPACE/opl-meta-agent"
          export OPL_FULL_BOOKFORGE_ROOT="$GITHUB_WORKSPACE/opl-bookforge"
          export OPL_FULL_OPL_FLOW_ROOT="$GITHUB_WORKSPACE/opl-flow"
          export OPL_FULL_OFFICECLI_ROOT="$GITHUB_WORKSPACE/OfficeCLI"
          export OPL_FULL_MINERU_ROOT="$GITHUB_WORKSPACE/MinerU-Ecosystem"
          export OPL_FULL_MINERU_OPEN_API_BIN="$(command -v mineru-open-api)"
          export OPL_FULL_MINERU_DOCUMENT_EXTRACTOR_ROOT="$GITHUB_WORKSPACE/one-person-lab-app/assets/companion-skills/mineru-document-extractor"
          export OPL_FULL_UI_UX_PRO_MAX_ROOT="$GITHUB_WORKSPACE/ui-ux-pro-max-skill"
          npm --silent run release:full -- \
            --version "$OPL_RELEASE_VERSION" \
            --gui-root "$GITHUB_WORKSPACE/one-person-lab-app/shells/aionui" \
            --out-dir "$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release" \
            --runtime-cache-dir "$cache_dir" \
            --runtime-cache-mode readwrite \
            --print-runtime-cache-keys > "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
          cat "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
          node - "$RUNNER_TEMP/opl-full-runtime-cache-keys.json" "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json" <<'NODE'
          const fs = require('node:fs');
          const input = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          fs.writeFileSync(process.argv[3], `${JSON.stringify(input.aggregate_key_input, null, 2)}\n`);
          NODE
          digest="$(shasum -a 256 "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json" | awk '{print $1}')"
          cache_key="opl-full-runtime-layers-${RUNNER_OS}-${RUNNER_ARCH}-${digest}"
          echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"
          echo "cache_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "cache_key=$cache_key" >> "$GITHUB_OUTPUT"
          node - "$RUNNER_TEMP/opl-full-runtime-cache-keys.json" "$cache_dir" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const path = require('node:path');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const cacheDir = process.argv[3];
          const outputNames = {
            toolchain: 'toolchain',
            'domain-runtime': 'domain_runtime',
            'opl-runtime': 'opl_runtime',
            skills: 'skills',
          };
          for (const [layerId, outputName] of Object.entries(outputNames)) {
            const key = report.layers[layerId];
            console.log(`${outputName}_cache_dir=${path.join(cacheDir, layerId)}`);
            console.log(`${outputName}_cache_key=opl-full-runtime-layer-${process.env.RUNNER_OS}-${process.env.RUNNER_ARCH}-${key}`);
          }
          NODE
          {
            echo "runtime_cache_key_report<<EOF"
            cat "$RUNNER_TEMP/opl-full-runtime-cache-keys.json"
            echo "EOF"
            echo "runtime_cache_aggregate_key_input<<EOF"
            cat "$RUNNER_TEMP/opl-full-runtime-cache-aggregate-key.json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write exact-cohort Actions cache plan
        working-directory: one-person-lab-app
        shell: bash
        run: |
          set -euo pipefail
          mode='full_package'
          if [ '${{ inputs.cache_only }}' = 'true' ]; then
            mode='cache_only_warmup'
          fi
          npm --silent run release:cache-plan -- plan \
            --output dist/opl-full-release/actions-cache-plan.json \
            --cache-catalog contracts/app-actions-cache-catalog.json \
            --runtime-key-report "$RUNNER_TEMP/opl-full-runtime-cache-keys.json" \
            --mode "$mode" \
            --workflow full-first-install-release.yml \
            --ref "$GITHUB_REF" \
            --app-sha "$(git rev-parse HEAD)" \
            --shell-sha "$(git -C shells/aionui rev-parse HEAD)" \
            --framework-sha "$(git -C "$GITHUB_WORKSPACE/one-person-lab" rev-parse HEAD)" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH"

      - name: Restore Full toolchain runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-toolchain
        env:
          OPL_ACTIONS_CACHE_CLASS: full_runtime_layer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.toolchain_cache_key }}

      - name: Restore Full domain runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-domain
        env:
          OPL_ACTIONS_CACHE_CLASS: full_runtime_layer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.domain_runtime_cache_key }}

      - name: Restore Full OPL runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-opl
        env:
          OPL_ACTIONS_CACHE_CLASS: full_runtime_layer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.opl_runtime_cache_key }}

      - name: Restore Full skills runtime cache
        if: ${{ !inputs.force_rebuild_runtime_cache }}
        id: restore-runtime-cache-skills
        env:
          OPL_ACTIONS_CACHE_CLASS: full_runtime_layer
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.runtime-cache-keys.outputs.skills_cache_dir }}
          key: ${{ steps.runtime-cache-keys.outputs.skills_cache_key }}

      - name: Reset Full runtime layer cache when forced
        if: ${{ inputs.force_rebuild_runtime_cache }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ steps.runtime-cache-keys.outputs.cache_dir }}"
          mkdir -p "${{ steps.runtime-cache-keys.outputs.cache_dir }}"

      - name: Prepare macOS Developer ID signing
        if: ${{ !inputs.cache_only }}
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          set -euo pipefail
          production_release="${{ inputs.operation == 'append_full' && inputs.upload_full_package_artifact }}"
          requires_distributable_assets="${{ inputs.upload_full_package_artifact }}"
          echo "OPL_FULL_DISTRIBUTABLE_ASSETS=$requires_distributable_assets" >> "$GITHUB_ENV"
          echo "OPL_MAC_STRICT_SIGNING_CHECKS=false" >> "$GITHUB_ENV"

          missing=()
          for secret_name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD APPLE_ID APPLE_ID_PASSWORD TEAM_ID IDENTITY; do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            missing_csv="$(IFS=', '; echo "${missing[*]}")"
            if [ "$production_release" = "true" ]; then
              echo "::error::Production Full signing material became incomplete after preflight: ${missing_csv}"
              exit 1
            fi
            echo "::notice::Development-only Full build remains non-distributable because Apple credentials are absent."
            exit 0
          fi

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          security find-identity -v -p codesigning build.keychain | grep -F "$IDENTITY" >/dev/null || {
            echo "::error::Configured IDENTITY does not resolve to an imported code-signing identity."
            exit 1
          }
          echo "OPL_MAC_STRICT_SIGNING_CHECKS=true" >> "$GITHUB_ENV"

      - name: Build Full first-install package
        id: full_package_build
        working-directory: release-executor
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ env.OPL_RELEASE_VERSION }}
          OPL_UPDATER_VERSION: ${{ env.OPL_UPDATER_VERSION }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          OPL_RUNTIME_CODESIGN_IDENTITY: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CI: true
          GH_TOKEN: ${{ github.token }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          OPL_FULL_DMG_FORMAT: ${{ inputs.full_dmg_format || 'ULMO' }}
          OPL_FULL_DMG_COMPRESSION_LEVEL: ${{ inputs.full_dmg_compression_level || '9' }}
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target: ${{ steps.shell-electron-version.outputs.version }}
          npm_config_target_arch: arm64
          OPERATION_DEADLINE_AT: ${{ inputs.operation_deadline_at }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          ulimit -n 65536 || true
          export OPL_FRAMEWORK_ROOT="$GITHUB_WORKSPACE/one-person-lab"
          export OPL_FULL_BUN_BIN="${OPL_FULL_BUN_BIN:-$(command -v bun)}"
          export OPL_FULL_INCLUDE_BUN_RUNTIME="${OPL_FULL_INCLUDE_BUN_RUNTIME:-0}"
          export OPL_FULL_UV_BIN="$(command -v uv)"
          export OPL_FULL_TEMPORAL_CLI_BIN="${OPL_FULL_TEMPORAL_CLI_BIN:-$(command -v temporal)}"
          export OPL_FULL_MAS_ROOT="$GITHUB_WORKSPACE/med-autoscience"
          export OPL_FULL_MAS_SCHOLAR_SKILLS_ROOT="$GITHUB_WORKSPACE/mas-scholar-skills"
          export OPL_FULL_MAG_ROOT="$GITHUB_WORKSPACE/med-autogrant"
          export OPL_FULL_RCA_ROOT="$GITHUB_WORKSPACE/redcube-ai"
          export OPL_FULL_META_AGENT_ROOT="$GITHUB_WORKSPACE/opl-meta-agent"
          export OPL_FULL_BOOKFORGE_ROOT="$GITHUB_WORKSPACE/opl-bookforge"
          export OPL_FULL_OPL_FLOW_ROOT="$GITHUB_WORKSPACE/opl-flow"
          export OPL_FULL_OFFICECLI_ROOT="$GITHUB_WORKSPACE/OfficeCLI"
          export OPL_FULL_MINERU_ROOT="$GITHUB_WORKSPACE/MinerU-Ecosystem"
          export OPL_FULL_MINERU_OPEN_API_BIN="$(command -v mineru-open-api)"
          export OPL_FULL_MINERU_DOCUMENT_EXTRACTOR_ROOT="$GITHUB_WORKSPACE/one-person-lab-app/assets/companion-skills/mineru-document-extractor"
          export OPL_FULL_UI_UX_PRO_MAX_ROOT="$GITHUB_WORKSPACE/ui-ux-pro-max-skill"
          FULL_BUILD_CMD=(
            npm run release:full --
            --version "$OPL_RELEASE_VERSION"
            --updater-version "$OPL_UPDATER_VERSION"
            --gui-root "$GITHUB_WORKSPACE/one-person-lab-app/shells/aionui"
            --out-dir "$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"
            --runtime-cache-dir "${{ steps.runtime-cache-keys.outputs.cache_dir }}"
            --runtime-cache-mode readwrite
          )
          if [ '${{ inputs.cache_only }}' = 'true' ]; then
            FULL_BUILD_CMD+=(--warm-runtime-cache-only)
          elif [ "${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }}" = "true" ]; then
            FULL_BUILD_CMD+=(--reuse-gui-vite-output)
          fi
          if [ "$RELEASE_OPERATION" = "append_full" ]; then
            full_build_timeout_ms="$(DEADLINE="$OPERATION_DEADLINE_AT" node --input-type=module -e '
              const deadlineMs = Date.parse(process.env.DEADLINE || "");
              const nowMs = Date.now();
              const postBuildReserveMs = 45 * 60_000;
              const remainingMs = deadlineMs - nowMs - postBuildReserveMs;
              if (!Number.isFinite(deadlineMs) || remainingMs < 1_000) process.exit(78);
              process.stdout.write(String(remainingMs));
            ')" || {
              echo "::error::operation_deadline_elapsed: less than 45 minutes remain for ARM finalization, verification, VM evidence, and publication."
              exit 78
            }
            FULL_BUILD_TIMEOUT_MS="$full_build_timeout_ms" node --input-type=module - "${FULL_BUILD_CMD[@]}" <<'NODE'
          import { spawn } from 'node:child_process';
          const timeoutMs = Number(process.env.FULL_BUILD_TIMEOUT_MS);
          const command = process.argv[2];
          const args = process.argv.slice(3);
          let deadlineElapsed = false;
          const child = spawn(command, args, { env: process.env, stdio: 'inherit' });
          const timer = setTimeout(() => {
            deadlineElapsed = true;
            child.kill('SIGTERM');
            setTimeout(() => child.kill('SIGKILL'), 10_000).unref();
          }, timeoutMs);
          child.once('error', (error) => {
            clearTimeout(timer);
            console.error(error);
            process.exit(1);
          });
          child.once('exit', (code, signal) => {
            clearTimeout(timer);
            if (deadlineElapsed) {
              console.error('operation_deadline_elapsed: npm run release:full exhausted its immutable operation budget.');
              process.exit(78);
            }
            if (signal) {
              console.error(`npm run release:full terminated by ${signal}.`);
              process.exit(1);
            }
            process.exit(code ?? 1);
          });
          NODE
          else
            "${FULL_BUILD_CMD[@]}"
          fi
          echo "OPL_FULL_PACKAGE_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify Full runtime payload before ARM finalization
        if: ${{ !inputs.cache_only && inputs.operation == 'append_full' }}
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          dmg_path="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg"
          mount_point="$(mktemp -d)"
          mounted=false
          cleanup_mount() {
            if [ "$mounted" = true ]; then hdiutil detach "$mount_point" >/dev/null 2>&1 || true; fi
            rm -rf "$mount_point"
          }
          trap cleanup_mount EXIT
          test -f "$dmg_path" && test ! -L "$dmg_path"
          hdiutil verify "$dmg_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          mounted=true
          app_paths=()
          while IFS= read -r candidate; do app_paths+=("$candidate"); done < <(
            find "$mount_point" -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          test "${#app_paths[@]}" -eq 1 || { echo "::error::Full finalizer input must contain exactly one App bundle."; exit 1; }
          mounted_app_path="${app_paths[0]}"
          mounted_runtime_root="$mounted_app_path/Contents/Resources/opl-full-runtime/runtime/current"
          codesign --verify --deep --strict --verbose=2 "$mounted_app_path"
          node --experimental-strip-types "$GITHUB_WORKSPACE/release-executor/scripts/assert-full-runtime-currentness.ts" \
            --runtime-root "$mounted_runtime_root" \
            --framework-root "$GITHUB_WORKSPACE/one-person-lab" \
            --mas-root "$GITHUB_WORKSPACE/med-autoscience" \
            --mas-scholar-skills-root "$GITHUB_WORKSPACE/mas-scholar-skills" \
            > one-person-lab-app/dist/opl-full-release/full-runtime-currentness-probe.json
          node --experimental-strip-types "$GITHUB_WORKSPACE/release-executor/scripts/verify-full-runtime-native-trust.ts" \
            --runtime-root "$mounted_runtime_root" \
            --expected-team-id "$EXPECTED_TEAM_ID" \
            --output one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json

      - name: Finalize Full Developer ID signing and notarization
        if: ${{ !inputs.cache_only && inputs.operation != 'append_full' }}
        working-directory: one-person-lab-app
        shell: bash
        env:
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          OPL_RUNTIME_CODESIGN_IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${OPL_MAC_STRICT_SIGNING_CHECKS:-false}" != true ]; then
            if [ '${{ inputs.operation }}' = append_full ]; then
              echo "::error::Production Full notarization cannot run without strict Developer ID signing."
              exit 1
            fi
            echo "::notice::Skipping notarization for development-only non-distributable Full output."
            exit 0
          fi
          node --experimental-strip-types "$GITHUB_WORKSPACE/release-executor/scripts/notarize-macos-dmg.ts" \
            --dmg "dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg" \
            --output dist/opl-full-release/full-apple-notarization-receipt.json \
            --operation-deadline-at '${{ inputs.operation_deadline_at }}'

      - name: Upload Full notarization terminal evidence
        if: ${{ always() && !inputs.cache_only && inputs.operation != 'append_full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-full-notarization-evidence-${{ env.OPL_RELEASE_VERSION }}-${{ github.run_id }}
          path: one-person-lab-app/dist/opl-full-release/full-apple-notarization-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify cache-only warmup emitted no release assets
        if: ${{ inputs.cache_only }}
        working-directory: one-person-lab-app
        shell: bash
        run: |
          set -euo pipefail
          output_dir='dist/opl-full-release'
          for evidence in actions-cache-plan.json runtime-cache-events.json full-runtime-currentness-probe.json full-runtime-native-trust.json; do
            test -f "$output_dir/$evidence" || { echo "::error::Cache-only evidence is missing: $evidence"; exit 1; }
          done
          jq -e '.mode == "cache_only_warmup" and .writer_eligible == true' "$output_dir/actions-cache-plan.json" >/dev/null
          forbidden="$(find "$output_dir" -maxdepth 1 -type f \( -name '*.dmg' -o -name 'opl-release-manifest.json' -o -name 'full-package-manifest.json' -o -name 'SHA256SUMS.txt' \) -print)"
          test -z "$forbidden" || { echo "::error::Cache-only warmup emitted forbidden release assets:"; printf '%s\n' "$forbidden"; exit 1; }

      - name: Verify Full package checksums and distribution trust
        if: ${{ !inputs.cache_only && inputs.operation != 'append_full' }}
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/one-person-lab-app/shells/aionui/out/mac-arm64/One Person Lab.app"
          dmg_path="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg"
          mounted_app_dir="$(mktemp -d)"
          mounted_app_path=""
          mounted_full_dmg="false"
          cleanup_mounted_full_dmg() {
            if [ "$mounted_full_dmg" = "true" ]; then
              hdiutil detach "$mounted_app_dir" >/dev/null 2>&1 || true
            fi
            rm -rf "$mounted_app_dir"
          }
          trap cleanup_mounted_full_dmg EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mounted_app_dir" >/dev/null
          mounted_full_dmg="true"
          mounted_app_paths=()
          while IFS= read -r candidate; do mounted_app_paths+=("$candidate"); done < <(
            find "$mounted_app_dir" -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          if [ "${#mounted_app_paths[@]}" -ne 1 ]; then
            echo "::error::Full first-install DMG must contain exactly one One Person Lab.app; found ${#mounted_app_paths[@]}."
            exit 1
          fi
          mounted_app_path="${mounted_app_paths[0]}"
          test -d "$mounted_app_path" && test ! -L "$mounted_app_path"
          mounted_runtime_root="$mounted_app_path/Contents/Resources/opl-full-runtime/runtime/current"
          node --experimental-strip-types one-person-lab-app/scripts/assert-full-runtime-currentness.ts \
            --runtime-root "$mounted_runtime_root" \
            --framework-root "$GITHUB_WORKSPACE/one-person-lab" \
            --mas-root "$GITHUB_WORKSPACE/med-autoscience" \
            --mas-scholar-skills-root "$GITHUB_WORKSPACE/mas-scholar-skills" \
            > one-person-lab-app/dist/opl-full-release/full-runtime-currentness-probe.json
          if [ "${OPL_MAC_STRICT_SIGNING_CHECKS:-false}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$mounted_app_path"
            codesign --verify --strict --verbose=2 "$dmg_path"
            xcrun stapler validate "$dmg_path"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
            spctl --assess --type execute --verbose=4 "$mounted_app_path"
            test -f one-person-lab-app/dist/opl-full-release/full-apple-notarization-receipt.json
            jq -e --arg team_id "$EXPECTED_TEAM_ID" '
              .schema == "opl_apple_notarized_dmg_receipt.v1"
              and .status == "passed"
              and .team_identifier == $team_id
              and .notarization.status == "Accepted"
              and .stapler_validate_status == "passed"
              and .dmg_spctl_status == "passed"
              and .app_spctl_status == "passed"
            ' one-person-lab-app/dist/opl-full-release/full-apple-notarization-receipt.json >/dev/null
            node --experimental-strip-types one-person-lab-app/scripts/verify-full-runtime-native-trust.ts \
              --runtime-root "$mounted_runtime_root" \
              --require-spctl \
              --expected-team-id "$EXPECTED_TEAM_ID" \
              --output one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json
            node -e 'const fs = require("node:fs"); const appPath = process.argv[1]; const runtimeTrust = JSON.parse(fs.readFileSync("one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json", "utf8")); const notarization = JSON.parse(fs.readFileSync("one-person-lab-app/dist/opl-full-release/full-apple-notarization-receipt.json", "utf8")); fs.writeFileSync("one-person-lab-app/dist/opl-full-release/full-gatekeeper-launch-policy.json", `${JSON.stringify({ schema: "opl_gatekeeper_launch_policy.v1", package_kind: "app_full_first_install", distribution_mode: "developer_id_notarized", app_path: appPath, team_identifier: notarization.team_identifier, codesign_status: "passed", spctl_status: "passed", dmg_codesign_status: "passed", dmg_spctl_status: "passed", stapler_validate_status: "passed", notarization_status: notarization.notarization.status, notarization_receipt_sha256: require("node:crypto").createHash("sha256").update(fs.readFileSync("one-person-lab-app/dist/opl-full-release/full-apple-notarization-receipt.json")).digest("hex"), runtime_native_trust_status: runtimeTrust.status, runtime_native_executable_count: runtimeTrust.executable_count, local_authorization_required: false, quarantine_removal_required: false }, null, 2)}\n`);' "$mounted_app_path"
            node -e 'const fs = require("node:fs"); const file = "one-person-lab-app/dist/opl-full-release/README-Full-First-Install.txt"; const text = fs.readFileSync(file, "utf8"); const next = text.replace(/Signing and notarization:.*(?:\n|$)/, "Signing and notarization: this package has completed Developer ID signing, Apple notarization, stapling, and Gatekeeper checks.\n"); fs.writeFileSync(file, next);'
          else
            if [ '${{ inputs.operation }}' = append_full ]; then
              echo "::error::Production Full verification cannot fall back to local authorization."
              exit 1
            fi
            echo "::notice::Development-only Full output is not a distributable release asset."
            codesign --verify --deep --strict --verbose=2 "$app_path" || true
            codesign --verify --deep --strict --verbose=2 "$mounted_app_path" || true
            spctl --assess --type execute --verbose=4 "$app_path" || true
            node --experimental-strip-types one-person-lab-app/scripts/local-authorization-policy.ts \
              --package-kind app_full_first_install \
              --app-path "$mounted_app_path" \
              --runtime-native-trust one-person-lab-app/dist/opl-full-release/full-runtime-native-trust.json \
              --output one-person-lab-app/dist/opl-full-release/full-local-authorization-policy.json
          fi
          node - "$OPL_RELEASE_VERSION" "$dmg_path" one-person-lab-app/dist/opl-full-release \
            '${{ inputs.target_standard_release_id }}' '${{ inputs.target_standard_release_tag }}' \
            '${{ inputs.target_standard_target_commitish }}' '${{ github.sha }}' \
            '${{ inputs.artifact_app_sha }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}' <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const version = process.argv[2];
          const dmgPath = process.argv[3];
          const outDir = process.argv[4];
          const targetStandardReleaseId = Number(process.argv[5]);
          const targetStandardReleaseTag = process.argv[6];
          const targetStandardTargetCommitish = process.argv[7];
          const releaseExecutorAppSha = process.argv[8];
          const fullContentAppSha = process.argv[9];
          const fullContentShellSha = process.argv[10];
          const fullContentFrameworkSha = process.argv[11];
          const readJson = (name) => JSON.parse(fs.readFileSync(path.join(outDir, name), 'utf8'));
          const fullDmgName = path.basename(dmgPath);
          const releaseManifest = {
            schema: 'opl_public_release_manifest.v1',
            package_kind: 'opl_full_first_install_macos_arm64',
            owner_authority: 'one-person-lab-app',
            version,
            release_version: version,
            primary_install_asset: fullDmgName,
            carrier_context: {
              publication_model: 'same_tag_mutable_standard_addon',
              target_standard_release: {
                repository: 'gaofeng21cn/one-person-lab-app',
                release_id: targetStandardReleaseId,
                tag: targetStandardReleaseTag,
                target_commitish: targetStandardTargetCommitish,
                immutable: false,
                full_asset_append_allowed: true,
                standard_asset_overwrite_or_delete_allowed: false,
              },
              release_executor: {
                app_sha: releaseExecutorAppSha,
                notarizer_path: 'scripts/notarize-macos-dmg.ts',
              },
              full_content_sources: {
                role: 'observational_build_provenance_only',
                may_gate_install_or_runtime: false,
                app_sha: fullContentAppSha,
                shell_sha: fullContentShellSha,
                framework_sha: fullContentFrameworkSha,
              },
              differences: {
                executor_app_differs_from_full_content_app: releaseExecutorAppSha !== fullContentAppSha,
                full_content_app_differs_from_target_standard: fullContentAppSha !== targetStandardTargetCommitish,
              },
            },
            assets: [
              {
                name: fullDmgName,
                role: 'full_first_install_carrier',
                size_bytes: fs.statSync(dmgPath).size,
                sha256: `sha256:${crypto.createHash('sha256').update(fs.readFileSync(dmgPath)).digest('hex')}`,
              },
            ],
            manifest: readJson('full-package-manifest.json'),
            evidence: {
              runtime_cache_events: readJson('runtime-cache-events.json'),
              runtime_currentness_probe: readJson('full-runtime-currentness-probe.json'),
              runtime_native_trust: readJson('full-runtime-native-trust.json'),
              app_bundle_trim_report: readJson('full-app-bundle-trim-report.json'),
              package_boundary_audit: readJson('full-package-boundary-audit.json'),
              gatekeeper_launch_policy: fs.existsSync(path.join(outDir, 'full-gatekeeper-launch-policy.json')) ? readJson('full-gatekeeper-launch-policy.json') : null,
              apple_notarization_receipt: fs.existsSync(path.join(outDir, 'full-apple-notarization-receipt.json')) ? readJson('full-apple-notarization-receipt.json') : null,
              local_authorization_policy: fs.existsSync(path.join(outDir, 'full-local-authorization-policy.json')) ? readJson('full-local-authorization-policy.json') : null,
              readme_text: fs.readFileSync(path.join(outDir, 'README-Full-First-Install.txt'), 'utf8'),
            },
            transition_legacy_assets: [
              'full-package-manifest.json',
              'runtime-cache-events.json',
              'full-runtime-currentness-probe.json',
              'full-runtime-native-trust.json',
              'full-app-bundle-trim-report.json',
              'full-package-boundary-audit.json',
            ],
          };
          fs.writeFileSync(path.join(outDir, 'opl-release-manifest.json'), `${JSON.stringify(releaseManifest, null, 2)}\n`);
          NODE
          hdiutil verify "$dmg_path"
          (
            cd "$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"
            node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const existing = fs.readFileSync('SHA256SUMS.txt', 'utf8').trim().split(/\r?\n/).filter(Boolean).map((line) => line.trim().split(/\s+/).at(-1));
          const required = ['opl-release-manifest.json', 'full-runtime-currentness-probe.json', 'full-runtime-native-trust.json'];
          if (fs.existsSync('full-gatekeeper-launch-policy.json')) required.push('full-gatekeeper-launch-policy.json');
          if (fs.existsSync('full-apple-notarization-receipt.json')) required.push('full-apple-notarization-receipt.json');
          if (fs.existsSync('full-local-authorization-policy.json')) required.push('full-local-authorization-policy.json');
          const names = [...new Set([...existing, ...required])].filter((name) => name && fs.existsSync(name)).sort();
          const lines = names.map((name) => `${crypto.createHash('sha256').update(fs.readFileSync(name)).digest('hex')}  ${name}`);
          fs.writeFileSync('SHA256SUMS.next', `${lines.join('\n')}\n`);
          NODE
            mv SHA256SUMS.next SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
          echo "OPL_FULL_VERIFY_READY_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Summarize Full package size
        if: ${{ !inputs.cache_only && inputs.operation != 'append_full' }}
        working-directory: one-person-lab-app
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release/One-Person-Lab-Full-${OPL_RELEASE_VERSION}-mac-arm64.dmg"
          dmg_size_bytes="$(stat -f%z "$dmg_path")"
          npm --silent run release:full:size -- \
            --full-dmg-size-bytes "$dmg_size_bytes" \
            --json > dist/opl-full-release/full-package-size-summary.json
          npm --silent run release:full:size -- \
            --full-dmg-size-bytes "$dmg_size_bytes" \
            --markdown > dist/opl-full-release/full-package-size-summary.md
          cat dist/opl-full-release/full-package-size-summary.md >> "$GITHUB_STEP_SUMMARY"
          node - dist/opl-full-release/full-package-size-summary.json <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const compressed = summary.budget?.compressed_full_dmg || {};
          console.log('');
          console.log('## Full Size Release Coupling');
          console.log('');
          console.log(`- Full DMG review status: ${compressed.status || 'unknown'}`);
          console.log(`- Full DMG release-blocking by size alone: ${compressed.release_blocking === true}`);
          console.log('- Stable release clean evidence remains coupled to remote verification and VM smoke gates; Full size review alone is diagnostic unless a hard limit or offline first-install payload regression fails.');
          NODE

      - name: Summarize Full caches and timings
        if: ${{ !inputs.cache_only }}
        shell: bash
        env:
          OPL_FULL_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit || 'unknown' }}
          OPL_FULL_BUN_CACHE_HIT: ${{ steps.bun-cache.outputs.cache-hit || 'false' }}
          OPL_FULL_UV_CACHE_HIT: ${{ steps.uv-cache.outputs.cache-hit || 'false' }}
          OPL_FULL_GO_CACHE_HIT: ${{ steps.go-cache.outputs.cache-hit || 'unknown' }}
          OPL_FULL_RUNTIME_CACHE_HIT: ${{ inputs.force_rebuild_runtime_cache && 'forced-rebuild' || format('toolchain:{0};domain-runtime:{1};opl-runtime:{2};skills:{3}', steps.restore-runtime-cache-toolchain.outputs.cache-hit || 'false', steps.restore-runtime-cache-domain.outputs.cache-hit || 'false', steps.restore-runtime-cache-opl.outputs.cache-hit || 'false', steps.restore-runtime-cache-skills.outputs.cache-hit || 'false') }}
        run: |
          set -euo pipefail
          telemetry_dir="$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"
          telemetry_path="$telemetry_dir/full-workflow-telemetry.json"
          mkdir -p "$telemetry_dir"
          duration() {
            local start="$1"
            local end="$2"
            if [ -z "$start" ] || [ -z "$end" ]; then
              echo "n/a"
            else
              echo "$((end - start))s"
            fi
          }
          duration_json() {
            local start="$1"
            local end="$2"
            if [ -z "$start" ] || [ -z "$end" ]; then
              echo "null"
            else
              echo "$((end - start))"
            fi
          }
          node - "$telemetry_path" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const outputPath = process.argv[2];
          const env = process.env;
          const telemetryDir = path.dirname(outputPath);
          const readJson = (name) => {
            const filePath = path.join(telemetryDir, name);
            if (!fs.existsSync(filePath)) return null;
            return JSON.parse(fs.readFileSync(filePath, 'utf8'));
          };
          const fullBuildTiming = readJson('full-package-build-timing.json');
          const fullManifest = readJson('full-package-manifest.json');
          const intValue = (value) => {
            const parsed = Number(value || '');
            return Number.isFinite(parsed) ? parsed : null;
          };
          const duration = (start, end) => {
            const left = intValue(start);
            const right = intValue(end);
            return left === null || right === null ? null : right - left;
          };
          const payload = {
            schema: 'opl_full_workflow_telemetry.v1',
            version: env.OPL_RELEASE_VERSION || null,
            run_id: env.GITHUB_RUN_ID || null,
            run_attempt: env.GITHUB_RUN_ATTEMPT || null,
            payload_refs: fullManifest?.resolved_refs ?? fullBuildTiming?.resolved_refs ?? null,
            resolved_refs: fullManifest?.resolved_refs ?? fullBuildTiming?.resolved_refs ?? null,
            cache: {
              npm_dependencies: '${{ steps.node-cache.outputs.cache-hit || 'unknown' }}',
              bun_install: '${{ steps.bun-cache.outputs.cache-hit || 'false' }}',
              uv_artifacts: '${{ steps.uv-cache.outputs.cache-hit || 'false' }}',
              go_modules_build: '${{ steps.go-cache.outputs.cache-hit || 'unknown' }}',
              electron_artifacts: '${{ steps.electron-cache.outputs.cache-hit || 'false' }}',
              shell_vite_output: '${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }}',
              full_runtime_layers: env.OPL_FULL_RUNTIME_CACHE_HIT || 'unknown',
              full_runtime_cache_key: '${{ steps.runtime-cache-keys.outputs.cache_key }}',
              full_runtime_cache_digest: '${{ steps.runtime-cache-keys.outputs.cache_digest }}',
              full_runtime_layer_events: readJson('runtime-cache-events.json')?.events ?? null,
              full_runtime_layer_keys: readJson('runtime-cache-events.json')?.keys ?? null,
              full_runtime_layer_key_inputs: readJson('runtime-cache-events.json')?.key_inputs ?? null,
            },
            dmg_format: fullBuildTiming?.dmg_format ?? null,
            dmg_compression_level: fullBuildTiming?.dmg_compression_level ?? null,
            duration_seconds: {
              toolchain_install: duration(env.OPL_FULL_WORKFLOW_STARTED_AT, env.OPL_FULL_TOOLCHAIN_READY_AT),
              framework_npm_ci: duration(env.OPL_FULL_TOOLCHAIN_READY_AT, env.OPL_FULL_FRAMEWORK_DEPS_READY_AT),
              framework_build: duration(env.OPL_FULL_FRAMEWORK_DEPS_READY_AT, env.OPL_FULL_FRAMEWORK_BUILD_READY_AT),
              shell_dependencies: duration(env.OPL_FULL_FRAMEWORK_BUILD_READY_AT, env.OPL_FULL_SHELL_DEPS_READY_AT),
              shell_node_dependencies: duration(env.OPL_FULL_FRAMEWORK_BUILD_READY_AT, env.OPL_FULL_SHELL_NODE_DEPS_READY_AT),
              shell_electron_native_rebuild: duration(env.OPL_FULL_SHELL_NODE_DEPS_READY_AT, env.OPL_FULL_SHELL_DEPS_READY_AT),
              domain_dependencies: duration(env.OPL_FULL_SHELL_DEPS_READY_AT, env.OPL_FULL_DOMAIN_DEPS_READY_AT),
              full_package_build: fullBuildTiming?.duration_seconds?.full_package_build
                ?? duration(env.OPL_FULL_DOMAIN_DEPS_READY_AT, env.OPL_FULL_PACKAGE_READY_AT),
              full_package_build_breakdown: fullBuildTiming?.duration_seconds?.full_package_build_breakdown ?? null,
              checksum_signing_verify: duration(env.OPL_FULL_PACKAGE_READY_AT, env.OPL_FULL_VERIFY_READY_AT),
            },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo
            echo "## Full Runtime Cache and Timing"
            echo
            echo "| Surface | Cache hit |"
            echo "| --- | --- |"
            echo "| npm dependencies | ${{ steps.node-cache.outputs.cache-hit || 'unknown' }} |"
            echo "| Bun install cache | ${{ steps.bun-cache.outputs.cache-hit || 'false' }} |"
            echo "| uv artifacts | ${{ steps.uv-cache.outputs.cache-hit || 'false' }} |"
            echo "| Go modules/build | ${{ steps.go-cache.outputs.cache-hit || 'unknown' }} |"
            echo "| Electron artifacts | ${{ steps.electron-cache.outputs.cache-hit || 'false' }} |"
            echo "| Shell Vite output | ${{ steps.restore-shell-vite-output.outputs.cache-hit || 'false' }} |"
            echo "| Full runtime layers | $OPL_FULL_RUNTIME_CACHE_HIT |"
            echo
            echo "## Full Payload Resolved Refs"
            echo
            if [ -f "$telemetry_dir/full-package-manifest.json" ]; then
              node -e 'const fs = require("node:fs"); const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log("| Payload | Requested ref | Resolved commit |"); console.log("| --- | --- | --- |"); for (const ref of Object.values(manifest.resolved_refs || {})) console.log(`| ${ref.label || ref.repository} | ${ref.requested_ref || ""} | ${ref.resolved_commit || ""} |`);' "$telemetry_dir/full-package-manifest.json"
            else
              echo "| Payload | Requested ref | Resolved commit |"
              echo "| --- | --- | --- |"
              echo "| unavailable | unavailable | missing full-package-manifest.json |"
            fi
            echo
            echo "| Full runtime layer | Status |"
            echo "| --- | --- |"
            if [ -f "$telemetry_dir/runtime-cache-events.json" ]; then
              node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const event of report.events || []) console.log(`| ${event.layer_id} | ${event.status} |`);' "$telemetry_dir/runtime-cache-events.json"
            else
              echo "| unavailable | missing runtime-cache-events.json |"
            fi
            echo
            echo "| Step | Duration |"
            echo "| --- | --- |"
            echo "| Toolchain install | $(duration "${OPL_FULL_WORKFLOW_STARTED_AT:-}" "${OPL_FULL_TOOLCHAIN_READY_AT:-}") |"
            echo "| Framework npm ci | $(duration "${OPL_FULL_TOOLCHAIN_READY_AT:-}" "${OPL_FULL_FRAMEWORK_DEPS_READY_AT:-}") |"
            echo "| Framework build | $(duration "${OPL_FULL_FRAMEWORK_DEPS_READY_AT:-}" "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}") |"
            echo "| Shell dependencies | $(duration "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}" "${OPL_FULL_SHELL_DEPS_READY_AT:-}") |"
            echo "| Shell Node/Bun install | $(duration "${OPL_FULL_FRAMEWORK_BUILD_READY_AT:-}" "${OPL_FULL_SHELL_NODE_DEPS_READY_AT:-}") |"
            echo "| Shell Electron native rebuild | $(duration "${OPL_FULL_SHELL_NODE_DEPS_READY_AT:-}" "${OPL_FULL_SHELL_DEPS_READY_AT:-}") |"
            echo "| Domain dependencies | $(duration "${OPL_FULL_SHELL_DEPS_READY_AT:-}" "${OPL_FULL_DOMAIN_DEPS_READY_AT:-}") |"
            echo "| Full package build | $(duration "${OPL_FULL_DOMAIN_DEPS_READY_AT:-}" "${OPL_FULL_PACKAGE_READY_AT:-}") |"
            echo "| Full checksum/signing verify | $(duration "${OPL_FULL_PACKAGE_READY_AT:-}" "${OPL_FULL_VERIFY_READY_AT:-}") |"
            echo
            echo "## Full Package Build Breakdown"
            echo
            if [ -f "$telemetry_dir/full-package-build-timing.json" ]; then
              node -e 'const fs = require("node:fs"); const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log("| Segment | Seconds |"); console.log("| --- | ---: |"); for (const [key, value] of Object.entries(report.duration_seconds?.full_package_build_breakdown || {})) console.log(`| ${key} | ${value} |`);' "$telemetry_dir/full-package-build-timing.json"
            else
