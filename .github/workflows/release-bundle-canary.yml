name: OPL Release Bundle Canary

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-release-validation-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-checkpoint-roundtrip:
    name: Real Framework checkpoint and deadline semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout current Framework main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: framework
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Install Framework validation dependencies
        working-directory: framework
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove checkpoint roundtrip, no rebuild, and expired deadline rejection
        working-directory: framework
        run: |
          node --experimental-strip-types --test \
            --test-name-pattern='portable checkpoint switches executors|elapsed absolute deadline blocks' \
            tests/src/cli/cases/release-bundle.test.ts

  standard:
    uses: ./.github/workflows/_release-bundle.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      operation: standard
      channel: canary
      app_ref: canary
      shell_ref: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      version: canary
      include_full: false

  resume-standard:
    uses: ./.github/workflows/_release-standard-publish.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      operation: resume_standard
      source_run_id: '424242'
      source_artifact: opl-release-canary-checkpoint-424242
      source_format: checkpoint_v1
      framework_executor_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      operation_started_at: '2099-01-01T00:00:00.000Z'
      operation_deadline_at: '2099-01-01T00:30:00.000Z'

  append-full:
    uses: ./.github/workflows/_release-full-addon.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      operation: append_full
      source_run_id: '424242'
      source_artifact: opl-release-canary-checkpoint-424242
      source_format: checkpoint_v1
      framework_executor_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      operation_started_at: '2099-01-01T00:00:00.000Z'
      operation_deadline_at: '2099-01-01T00:50:00.000Z'

  nested-standard-build:
    uses: ./.github/workflows/_build-reusable.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      matrix: '{"include":[]}'
      ref: canary
      shell_ref: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      opl_release_version: canary
      opl_updater_version: canary
      release_bundle_digest: sha256:canary
      release_cohort_ref: sha256:canary
      operation: standard

  nested-standard-qualification:
    uses: ./.github/workflows/opl-first-run-vm.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      release_bundle_digest: sha256:canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      operation: standard

  nested-webui-carrier:
    uses: ./.github/workflows/_release-webui-carrier.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      mode: canary
      app_ref: canary
      shell_ref: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      opl_version: canary
      release_bundle_digest: sha256:canary
      release_cohort_ref: sha256:canary
      source_artifact_run_id: '424242'
      standard_checkpoint_artifact_name: canary
      standard_identity_sha256: sha256:canary

  nested-webui-stable:
    uses: ./.github/workflows/release-webui-stable.yml
    permissions:
      contents: read
      actions: read
      packages: write
    with:
      mode: canary
      stable_authority_run_id: '424242'
      carrier_artifact_name: canary

  nested-native-webui:
    uses: ./.github/workflows/_release-native-webui-carrier.yml
    permissions:
      contents: read
      actions: read
    with:
      target_platform: linux
      target_architecture: x86_64
      mode: canary
      stable_authority_run_id: '424242'
      app_ref: canary
      shell_ref: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      opl_version: canary
      release_bundle_digest: sha256:canary

  nested-updater-qualification:
    uses: ./.github/workflows/opl-updater-upgrade-vm.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      candidate_artifact_name: canary
      candidate_artifact_run_id: '424242'
      baseline_dmg_url: https://example.invalid/canary.dmg
      baseline_dmg_sha256: canary
      baseline_display_version: canary
      baseline_updater_version: canary
      candidate_display_version: canary
      candidate_updater_version: canary
      release_bundle_digest: sha256:canary
      app_ref: canary
      shell_ref: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      operation: standard

  nested-full-build:
    uses: ./.github/workflows/full-first-install-release.yml
    permissions:
      contents: read
      actions: read
    with:
      mode: canary
      opl_version: canary
      opl_updater_version: canary
      framework_ref: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
      shell_ref: canary
      release_bundle_digest: sha256:canary
      release_cohort_ref: sha256:canary
      operation: append_full

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Verify Bundle cutover without public mutation
        run: node --experimental-strip-types --test tests/release/release-bundle-workflow-cutover.test.ts
