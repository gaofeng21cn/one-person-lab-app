name: OPL Release Bundle Canary

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-release-validation-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  framework-checkpoint-roundtrip:
    name: Real Framework checkpoint and deadline semantics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout current Framework main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: main
          path: framework
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Framework validation dependencies
        working-directory: framework
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Framework runtime workspaces
        working-directory: framework
        run: npm run build:packages

      - name: Prove checkpoint roundtrip, no rebuild, and expired deadline rejection
        working-directory: framework
        run: |
          node --experimental-strip-types --test \
            --test-name-pattern='portable checkpoint switches executors|elapsed absolute deadline blocks' \
            tests/src/cli/cases/release-bundle.test.ts

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install validation dependencies
        run: npm ci --ignore-scripts

      - name: Verify release workflow contracts without starting release jobs
        run: |
          node --experimental-strip-types --test \
            tests/release/release-bundle-workflow-cutover.test.ts \
            tests/release/release-control-plane-boundary.test.ts
