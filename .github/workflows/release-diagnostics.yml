name: OPL Windows acceptance credential bridge
run-name: Windows acceptance credential bridge
on:
  workflow_dispatch:
    inputs:
      recipient_spki:
        description: Ephemeral RSA public key for authorized Windows acceptance
        required: true
        type: string
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-stable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify dedicated ordinary zero balance test account
        uses: ./.github/actions/release-gateway-preflight
        with:
          executor-root: .
          account-email: ${{ vars.OPL_GATEWAY_RELEASE_TEST_ACCOUNT_EMAIL }}
          account-password: ${{ secrets.OPL_GATEWAY_RELEASE_TEST_ACCOUNT_PASSWORD }}
      - name: Encrypt transient credentials to the authorized recipient
        env:
          RECIPIENT_SPKI: ${{ inputs.recipient_spki }}
          ACCOUNT_EMAIL: ${{ vars.OPL_GATEWAY_RELEASE_TEST_ACCOUNT_EMAIL }}
          ACCOUNT_PASSWORD: ${{ secrets.OPL_GATEWAY_RELEASE_TEST_ACCOUNT_PASSWORD }}
        run: node scripts/windows-acceptance-encrypt.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-encrypted-credentials
          path: ${{ runner.temp }}/windows-acceptance-credentials.encrypted.json
          retention-days: 1
