name: OPL Release Diagnostics
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Release diagnostics: {0}', inputs.diagnostic)
    || format('Desktop release diagnostics for {0}', inputs.opl_version) }}

on:
  workflow_call:
    inputs:
      opl_version:
        description: OPL version to diagnose, for example 26.6.21
        required: true
        type: string
      release_run_id:
        description: GitHub Actions desktop release run id to inspect
        required: false
        default: ''
        type: string
      run_vm_diagnostic:
        description: Run the first-run VM harness against an existing release, URL, or workflow artifact without rebuilding or publishing release assets
        required: false
        default: false
        type: boolean
      build_standard_artifact:
        description: Build a temporary standard DMG artifact from shell_ref for VM diagnostics only; does not publish release assets
        required: false
        default: false
        type: boolean
      release_tag:
        description: GitHub release tag to diagnose. Empty means v<opl_version>.
        required: false
        default: ''
        type: string
      release_dmg_url:
        description: Direct DMG URL to diagnose. Overrides release_tag when set.
        required: false
        default: ''
        type: string
      release_artifact_name:
        description: Existing GitHub Actions artifact containing the DMG to diagnose.
        required: false
        default: ''
        type: string
      release_artifact_run_id:
        description: GitHub Actions run id that owns release_artifact_name. Defaults to release_run_id when empty.
        required: false
        default: ''
        type: string
      shell_ref:
        description: opl-aion-shell ref containing the first-run smoke scripts
        required: false
        default: main
        type: string
      framework_ref:
        description: Exact 40-character one-person-lab Framework SHA injected into Standard VM diagnostics
        required: false
        default: ''
        type: string
      package_profile:
        description: Install profile to diagnose
        required: false
        default: standard
        type: string
      tart_source_vm:
        description: Tart clean snapshot/base VM. Empty means repository variable OPL_FIRST_RUN_TART_SOURCE.
        required: false
        default: ''
        type: string
      keep_vm:
        description: Leave temporary Tart VM for debugging
        required: false
        default: false
        type: boolean
      guide_screenshots:
        description: Capture user-guide screenshots in the VM smoke artifacts
        required: false
        default: false
        type: boolean
      run_timeout_ms:
        description: Outer Tart run timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string
      smoke_timeout_ms:
        description: Guest smoke timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string
      diagnostic_scope:
        description: Diagnostic scope for the first-run VM harness. Use bootstrap_only to capture App launch/bootstrap blockers without Codex asset preseed or secondary route checks.
        required: false
        default: bootstrap_only
        type: string
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Select one independent diagnostic lane.
        required: true
        default: desktop
        type: choice
        options:
          - desktop
          - apple_credentials
          - timestamp_authority
      opl_version:
        description: OPL version to diagnose, for example 26.6.21
        required: false
        default: ''
        type: string
      release_run_id:
        description: GitHub Actions desktop release run id to inspect
        required: false
        default: ''
        type: string
      run_vm_diagnostic:
        description: Run the first-run VM harness against an existing release, URL, or workflow artifact without rebuilding or publishing release assets
        required: false
        default: false
        type: boolean
      build_standard_artifact:
        description: Build a temporary standard DMG artifact from shell_ref for VM diagnostics only; does not publish release assets
        required: false
        default: false
        type: boolean
      release_tag:
        description: GitHub release tag to diagnose. Empty means v<opl_version>.
        required: false
        default: ''
        type: string
      release_dmg_url:
        description: Direct DMG URL to diagnose. Overrides release_tag when set.
        required: false
        default: ''
        type: string
      release_artifact_name:
        description: Existing GitHub Actions artifact containing the DMG to diagnose.
        required: false
        default: ''
        type: string
      release_artifact_run_id:
        description: GitHub Actions run id that owns release_artifact_name. Defaults to release_run_id when empty.
        required: false
        default: ''
        type: string
      shell_ref:
        description: opl-aion-shell ref containing the first-run smoke scripts
        required: false
        default: main
        type: string
      framework_ref:
        description: Exact 40-character one-person-lab Framework SHA injected into Standard VM diagnostics
        required: false
        default: ''
        type: string
      package_profile:
        description: Install profile to diagnose
        required: false
        default: standard
        type: choice
        options:
          - standard
          - full
          - homebrew-standard
      tart_source_vm:
        description: Tart clean snapshot/base VM. Empty means repository variable OPL_FIRST_RUN_TART_SOURCE.
        required: false
        default: ''
        type: string
      keep_vm:
        description: Leave temporary Tart VM for debugging
        required: false
        default: false
        type: boolean
      guide_screenshots:
        description: Capture user-guide screenshots in the VM smoke artifacts
        required: false
        default: false
        type: boolean
      run_timeout_ms:
        description: Outer Tart run timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string
      smoke_timeout_ms:
        description: Guest smoke timeout passed to opl-first-run-tart-smoke.mjs
        required: false
        default: '900000'
        type: string
      diagnostic_scope:
        description: Diagnostic scope for the first-run VM harness. Use bootstrap_only to capture App launch/bootstrap blockers without Codex asset preseed or secondary route checks.
        required: false
        default: bootstrap_only
        type: choice
        options:
          - bootstrap_only
          - release_gate
      large_dmg_canary:
        description: "Apple credentials only: sign a synthetic Full-sized ULMO DMG without notarization submission."
        required: false
        default: false
        type: boolean
      notary_submission_id:
        description: "Apple credentials only: exact existing Apple submission UUID to reconcile read-only."
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnostic-inputs:
    if: ${{ github.event_name == 'workflow_call' || inputs.diagnostic == 'desktop' }}
    name: Validate diagnostic workflow inputs
    runs-on: ubuntu-latest

    steps:
      - name: Validate diagnostic input combinations
        shell: bash
        env:
          OPL_VERSION: ${{ inputs.opl_version }}
          RUN_VM_DIAGNOSTIC: ${{ inputs.run_vm_diagnostic }}
          PACKAGE_PROFILE: ${{ inputs.package_profile }}
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        run: |
          set -euo pipefail
          test -n "$OPL_VERSION" || { echo "::error::desktop diagnostics require opl_version."; exit 1; }
          if [ "${{ inputs.build_standard_artifact }}" = "true" ]; then
            if [ "${{ inputs.package_profile }}" != "standard" ]; then
              echo "::error::build_standard_artifact only supports package_profile=standard."
              exit 1
            fi
            if [ -n "${{ inputs.release_dmg_url }}" ] || [ -n "${{ inputs.release_artifact_name }}" ] || [ -n "${{ inputs.release_artifact_run_id }}" ]; then
              echo "::error::build_standard_artifact must not be combined with release_dmg_url, release_artifact_name, or release_artifact_run_id. The diagnostic VM must consume the same-run temporary standard DMG artifact."
              exit 1
            fi
          fi
          if [ "$RUN_VM_DIAGNOSTIC" = "true" ] && [ "$PACKAGE_PROFILE" = "standard" ]; then
            if ! [[ "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Standard VM diagnostics require framework_ref to be an exact 40-character Framework SHA."
              exit 1
            fi
          fi

  release-diagnostics:
    name: Build release diagnostic harness outputs
    runs-on: ubuntu-latest
    needs: diagnostic-inputs
    if: ${{ (github.event_name == 'workflow_call' || inputs.diagnostic == 'desktop') && inputs.release_run_id != '' }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build GitHub Actions timing diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          OPL_RELEASE_REPO: ${{ github.repository }}
        run: |
          npm run release:actions-timing -- \
            --repo "$OPL_RELEASE_REPO" \
            --run-id "$OPL_RELEASE_RUN_ID" \
            --output release-diagnostics/release-actions-timing.json \
            --markdown release-diagnostics/release-actions-timing.md
          cat release-diagnostics/release-actions-timing.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build release closeout diagnostics and completion manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          OPL_RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/closeout-release-run.ts \
            --version "$OPL_RELEASE_VERSION" \
            --run-id "$OPL_RELEASE_RUN_ID" \
            --repo "$OPL_RELEASE_REPO" \
            --out-dir release-diagnostics \
            --completion-manifest release-diagnostics/release-closeout-completion.json \
            --artifact-profile diagnostics
          cat release-diagnostics/release-closeout.md >> "$GITHUB_STEP_SUMMARY"

      - name: Verify complete release diagnostics generation
        shell: bash
        env:
          OPL_RELEASE_VERSION: ${{ inputs.opl_version }}
          OPL_RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          OPL_RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const manifestPath = 'release-diagnostics/release-closeout-completion.json';
          const expectedOutputs = new Map([
            ['closeout_summary', 'release-diagnostics/release-closeout.json'],
            ['closeout_markdown', 'release-diagnostics/release-closeout.md'],
            ['release_monitor', 'release-diagnostics/release-monitor.json'],
            ['release_notification', 'release-diagnostics/release-notification.json'],
          ]);
          const requiredAuxiliaryOutputs = [
            'release-diagnostics/release-actions-timing.json',
            'release-diagnostics/release-actions-timing.md',
          ];

          function fail(message) {
            console.error(`::error::${message}`);
            process.exit(1);
          }

          function readRequiredFile(filePath) {
            let stat;
            try {
              stat = fs.lstatSync(filePath);
            } catch {
              fail(`Required release diagnostics output is missing: ${filePath}`);
            }
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size === 0) {
              fail(`Required release diagnostics output is not a non-empty regular file: ${filePath}`);
            }
            return fs.readFileSync(filePath);
          }

          const manifestBytes = readRequiredFile(manifestPath);
          let manifest;
          try {
            manifest = JSON.parse(manifestBytes.toString('utf8'));
          } catch {
            fail(`Release diagnostics completion manifest is not valid JSON: ${manifestPath}`);
          }
          if (
            manifest.schema !== 'opl_release_closeout_completion_manifest.v1'
            || manifest.status !== 'complete'
            || manifest.authority !== 'diagnostics_only'
            || manifest.mutation_authorized !== false
            || manifest.required_output_count !== expectedOutputs.size
            || manifest.completed_output_count !== expectedOutputs.size
            || !Array.isArray(manifest.outputs)
            || manifest.outputs.length !== expectedOutputs.size
          ) {
            fail('Release diagnostics completion manifest does not declare one complete diagnostics-only four-output generation.');
          }
          const generationId = manifest.generation?.id;
          if (typeof generationId !== 'string' || generationId.length === 0) {
            fail('Release diagnostics completion manifest is missing its generation id.');
          }

          const observedRoles = new Set();
          for (const descriptor of manifest.outputs) {
            const expectedPath = expectedOutputs.get(descriptor?.role);
            if (!expectedPath || observedRoles.has(descriptor.role)) {
              fail(`Release diagnostics completion manifest contains an unknown or duplicate role: ${descriptor?.role ?? '<missing>'}`);
            }
            observedRoles.add(descriptor.role);
            if (descriptor.path !== expectedPath) {
              fail(`Release diagnostics completion manifest path mismatch for ${descriptor.role}.`);
            }
            const bytes = readRequiredFile(expectedPath);
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            if (descriptor.size_bytes !== bytes.byteLength || descriptor.sha256 !== digest) {
              fail(`Release diagnostics output does not match the completion manifest: ${expectedPath}`);
            }
          }
          if (observedRoles.size !== expectedOutputs.size) {
            fail('Release diagnostics completion manifest does not cover all four required outputs.');
          }

          const summaryPath = expectedOutputs.get('closeout_summary');
          const summary = JSON.parse(readRequiredFile(summaryPath).toString('utf8'));
          if (
            summary.version !== process.env.OPL_RELEASE_VERSION
            || summary.release_repo !== process.env.OPL_RELEASE_REPO
            || String(summary.run?.id) !== process.env.OPL_RELEASE_RUN_ID
          ) {
            fail('Release diagnostics completion generation is not bound to this workflow version, repository, and run id.');
          }

          for (const filePath of [
            summaryPath,
            expectedOutputs.get('release_monitor'),
            expectedOutputs.get('release_notification'),
          ]) {
            const payload = JSON.parse(readRequiredFile(filePath).toString('utf8'));
            if (payload.output_generation?.id !== generationId) {
              fail(`Release diagnostics output generation mismatch: ${filePath}`);
            }
          }
          const markdown = readRequiredFile(expectedOutputs.get('closeout_markdown')).toString('utf8');
          if (!markdown.includes(generationId)) {
            fail('Release diagnostics markdown does not carry the completion generation id.');
          }
          for (const filePath of requiredAuxiliaryOutputs) readRequiredFile(filePath);
          try {
            JSON.parse(readRequiredFile(requiredAuxiliaryOutputs[0]).toString('utf8'));
          } catch {
            fail(`Release actions timing output is not valid JSON: ${requiredAuxiliaryOutputs[0]}`);
          }
          console.log(`Verified complete release diagnostics generation ${generationId}.`);
          NODE

      - name: Upload release diagnostics
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics-${{ inputs.opl_version }}
          path: |
            release-diagnostics/release-actions-timing.json
            release-diagnostics/release-actions-timing.md
            release-diagnostics/release-closeout.json
            release-diagnostics/release-closeout.md
            release-diagnostics/release-monitor.json
            release-diagnostics/release-notification.json
            release-diagnostics/release-closeout-completion.json
          if-no-files-found: error

  standard-dmg-diagnostic-artifact:
    name: Build temporary standard DMG diagnostic artifact
    needs: diagnostic-inputs
    if: ${{ (github.event_name == 'workflow_call' || inputs.diagnostic == 'desktop') && inputs.build_standard_artifact }}
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: >-
        {"include":[
          {"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}
        ]}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      skip_code_quality: true
      upload_installers_only: true
      opl_release_version: ${{ inputs.opl_version }}
      require_macos_gatekeeper: false
    secrets: inherit

  vm-harness-diagnostics-standard-artifact:
    name: Run first-run VM diagnostic harness for temporary standard artifact
    needs:
      - diagnostic-inputs
      - standard-dmg-diagnostic-artifact
    if: ${{ !cancelled() && (github.event_name == 'workflow_call' || inputs.diagnostic == 'desktop') && inputs.run_vm_diagnostic && inputs.build_standard_artifact && needs.diagnostic-inputs.result == 'success' && needs.standard-dmg-diagnostic-artifact.result == 'success' }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', inputs.opl_version) }}
      release_dmg_url: ''
      release_artifact_name: macos-build-arm64-dmg
      release_artifact_run_id: ${{ github.run_id }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      package_profile: ${{ inputs.package_profile }}
      tart_source_vm: ${{ inputs.tart_source_vm }}
      keep_vm: ${{ inputs.keep_vm }}
      guide_screenshots: ${{ inputs.guide_screenshots }}
      run_timeout_ms: ${{ inputs.run_timeout_ms }}
      smoke_timeout_ms: ${{ inputs.smoke_timeout_ms }}
      diagnostic_scope: ${{ inputs.diagnostic_scope }}
    secrets: inherit

  vm-harness-diagnostics-release-asset:
    name: Run first-run VM diagnostic harness for release asset
    needs:
      - diagnostic-inputs
    if: ${{ !cancelled() && (github.event_name == 'workflow_call' || inputs.diagnostic == 'desktop') && inputs.run_vm_diagnostic && !inputs.build_standard_artifact && needs.diagnostic-inputs.result == 'success' }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_tag: ${{ inputs.release_tag != '' && inputs.release_tag || format('v{0}', inputs.opl_version) }}
      release_dmg_url: ${{ inputs.release_dmg_url }}
      release_artifact_name: ${{ inputs.release_artifact_name }}
      release_artifact_run_id: ${{ inputs.release_artifact_run_id != '' && inputs.release_artifact_run_id || inputs.release_run_id }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      package_profile: ${{ inputs.package_profile }}
      tart_source_vm: ${{ inputs.tart_source_vm }}
      keep_vm: ${{ inputs.keep_vm }}
      guide_screenshots: ${{ inputs.guide_screenshots }}
      run_timeout_ms: ${{ inputs.run_timeout_ms }}
      smoke_timeout_ms: ${{ inputs.smoke_timeout_ms }}
      diagnostic_scope: ${{ inputs.diagnostic_scope }}
    secrets: inherit

  apple-credentials:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'apple_credentials' }}
    name: Diagnose protected Apple credential readiness
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release-stable
    concurrency:
      group: opl-release-apple-credentials-preflight
      cancel-in-progress: false
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Import Developer ID identity and authenticate notarization
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
          NOTARY_SUBMISSION_ID: ${{ inputs.notary_submission_id }}
          OPL_MACOS_RUNNER_LABEL: macos-latest
        run: |
          args=(--output "$RUNNER_TEMP/apple-release-credentials-preflight.json")
          if [ '${{ inputs.large_dmg_canary }}' = true ]; then args+=(--large-dmg-canary); fi
          if [ -n "$NOTARY_SUBMISSION_ID" ]; then args+=(--notary-submission-id "$NOTARY_SUBMISSION_ID"); fi
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts "${args[@]}"
      - name: Upload sanitized Apple credential preflight receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-apple-release-credentials-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize diagnostic-only result
        run: |
          notary_submission_id="$(jq -r '.notarization.submission_reconcile.submission_id // "not requested"' "$RUNNER_TEMP/apple-release-credentials-preflight.json")"
          notary_status="$(jq -r '.notarization.submission_reconcile.apple_status // "not requested"' "$RUNNER_TEMP/apple-release-credentials-preflight.json")"
          {
            echo '## Apple credential diagnostic passed'
            echo
            echo '- Stable admission authority: false'
            echo '- Standard dispatch performed: false'
            echo '- Notarization submission performed: false'
            echo "- Existing notarization submission: $notary_submission_id"
            echo "- Existing notarization status: $notary_status"
            echo '- Large DMG canary requested: ${{ inputs.large_dmg_canary }}'
            echo '- Continue through release-stable.yml for publication.'
          } >> "$GITHUB_STEP_SUMMARY"

  timestamp-authority:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'timestamp_authority' }}
    name: Diagnose hosted Apple timestamp authority path
    runs-on: macos-latest
    timeout-minutes: 10
    concurrency:
      group: opl-release-timestamp-authority-diagnostic
      cancel-in-progress: false
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Probe and verify Apple RFC3161 timestamp authority
        id: tsa
        continue-on-error: true
        run: >-
          node --experimental-strip-types scripts/diagnose-apple-timestamp-authority.ts
          --output "$RUNNER_TEMP/apple-timestamp-authority-diagnostic.json"
      - name: Upload typed timestamp authority diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-apple-timestamp-authority-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-timestamp-authority-diagnostic.json
          if-no-files-found: error
          retention-days: 30
      - name: Summarize and enforce diagnostic result
        if: ${{ always() }}
        env:
          OPL_TSA_STEP_OUTCOME: ${{ steps.tsa.outcome }}
          OPL_TSA_RECEIPT: ${{ runner.temp }}/apple-timestamp-authority-diagnostic.json
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync(process.env.OPL_TSA_RECEIPT, 'utf8'));
          const lines = [
            '## Apple timestamp authority diagnostic', '',
            `- Status: ${receipt.status}`,
            `- Endpoint: ${receipt.endpoint}`,
            `- HTTP: ${receipt.response?.http_status ?? 'not reached'}`,
            `- Duration: ${receipt.response?.duration_ms ?? 'unknown'} ms`,
            `- Query/response binding: ${receipt.verification?.query_response_binding}`,
            `- Signer chain to system root: ${receipt.verification?.signer_chain_to_system_root}`,
            `- Production credentials used: ${receipt.production_credentials_used}`,
            `- Release mutation authorized: ${receipt.mutation_authorized}`,
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          if (process.env.OPL_TSA_STEP_OUTCOME !== 'success' || receipt.status !== 'passed') {
            console.error(`Apple timestamp authority diagnostic failed: ${receipt.failure?.code ?? 'unknown'}`);
            process.exit(1);
          }
          NODE
