name: OPL Standard Bundle Build

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary
        required: false
        default: execute
        type: string
      operation:
        description: standard for the initial build operation
        required: false
        default: standard
        type: string
      channel:
        description: stable or preview for execute mode; canary for validation-only mode
        required: true
        type: string
      publication_channel:
        description: App publication route; must match channel in execute mode
        required: false
        default: ''
        type: string
      latest_override_requested:
        description: Explicit protected Latest override request; Preview defaults false
        required: false
        default: false
        type: boolean
      version:
        description: Exact Stable display version; canary uses a synthetic value
        required: false
        default: ''
        type: string
      include_full:
        description: Legacy request compatibility; new App Standard requests keep this false
        required: false
        default: false
        type: boolean
      package_compatibility_abi:
        description: Typed Package ABI compatibility consumed by App Standard
        required: false
        default: opl_packages.v1
        type: string
      package_compatibility_version_range:
        description: Typed Package version range consumed by App Standard
        required: false
        default: '>=0.1.0 <1.0.0'
        type: string
      app_ref:
        description: Exact canonical App ref
        required: true
        type: string
      shell_ref:
        description: Exact Shell main SHA for Stable
        required: false
        default: ''
        type: string
      framework_ref:
        description: Exact Framework main SHA for Stable
        required: false
        default: ''
        type: string
      operation_started_at:
        description: Stable operation start
        required: false
        default: ''
        type: string
      operation_deadline_at:
        description: Stable operation mutation deadline
        required: false
        default: ''
        type: string
      stable_operation_control_artifact:
        description: Exact protected Stable operation-control artifact for a future Stable operation
        required: false
        default: ''
        type: string
      stable_operation_control_digest:
        description: Exact authority digest for the protected Stable operation-control artifact
        required: false
        default: ''
        type: string
    outputs:
      source_run_id:
        description: Run containing the exported Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.source_run_id }}
      source_artifact:
        description: Exported Standard checkpoint artifact
        value: ${{ jobs.checkpoint-standard.outputs.source_artifact }}
      checkpoint_transport_executor:
        description: Executor that transported the Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.checkpoint_transport_executor }}
      transport_run_id:
        description: Run that transported the Standard checkpoint
        value: ${{ jobs.checkpoint-standard.outputs.transport_run_id }}
      completed_stage:
        description: Framework checkpoint export stage, passed through without App projection
        value: ${{ jobs.checkpoint-standard.outputs.completed_stage }}
      standard_identity_sha256:
        description: Unique signed Standard artifact identity digest
        value: ${{ jobs.checkpoint-standard.outputs.standard_identity_sha256 }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPL_FRAMEWORK_CANARY_MINIMUM_ABI_REF: ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc
  OPL_RELEASE_BUNDLE_ARTIFACT: opl-release-bundle-${{ github.run_id }}
  OPL_STANDARD_CHECKPOINT_ARTIFACT: opl-release-standard-checkpoint-${{ github.run_id }}

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prove reusable Standard build topology starts
        run: |
          test '${{ inputs.operation }}' = standard
          test '${{ inputs.channel }}' = canary
          test -z '${{ inputs.publication_channel }}'
          test '${{ inputs.latest_override_requested }}' = false
          test '${{ inputs.app_ref }}' = canary
          test '${{ inputs.framework_ref }}' = "$OPL_FRAMEWORK_CANARY_MINIMUM_ABI_REF"
          test '${{ inputs.package_compatibility_abi }}' = opl_packages.v1
          test '${{ inputs.package_compatibility_version_range }}' = '>=0.1.0 <1.0.0'

  admission:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact App control verifier
        if: ${{ inputs.channel == 'stable' }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          path: app-source

      - name: Download protected Stable operation control
        if: ${{ inputs.channel == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.stable_operation_control_artifact }}
          path: stable-operation-control

      - name: Admit one-shot Bundle build operation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-failure-evidence
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          if [ '${{ inputs.operation }}' != standard ]; then
            status=failed
            reason=unsupported_execute_route
          fi
          publication_channel='${{ inputs.publication_channel || inputs.channel }}'
          bundle_channel='${{ inputs.channel }}'
          case "$publication_channel:$bundle_channel" in
            stable:stable|preview:preview) ;;
            *) status=failed; reason=unsupported_publication_route ;;
          esac
          if [ "$publication_channel" = stable ] && [ '${{ inputs.latest_override_requested }}' = true ]; then
            status=failed
            reason=stable_does_not_use_preview_override
          fi
          if [ "$publication_channel" = stable ]; then
            [[ '${{ inputs.stable_operation_control_artifact }}' =~ ^opl-stable-operation-control-[1-9][0-9]*$ ]] || {
              status=failed
              reason=missing_protected_operation_control
            }
            [[ '${{ inputs.stable_operation_control_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || {
              status=failed
              reason=missing_protected_operation_control_digest
            }
          fi
          if [ "$publication_channel" != stable ] && [ '${{ inputs.include_full }}' = true ]; then
            status=failed
            reason=non_stable_full_request
          fi
          node <<'NODE' || { status=failed; reason=deadline_invalid; }
          const started = Date.parse('${{ inputs.operation_started_at }}');
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          jq -n --arg status "$status" --arg reason "$reason" \
            --arg operation '${{ inputs.operation }}' --arg run_id "$GITHUB_RUN_ID" \
            '{schema:"opl_release_operation_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,run_id:$run_id,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > release-failure-evidence/operation-admission.json
          test "$status" = passed

      - name: Consume one protected Stable operation control before cold work
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          controls=()
          while IFS= read -r control; do controls+=("$control"); done < <(
            find stable-operation-control -type f -name stable-operation-control.json -print | LC_ALL=C sort
          )
          test "${#controls[@]}" -eq 1
          control="${controls[0]}"
          test -f "$control" && test ! -L "$control"
          test "$(jq -er .authority_digest "$control")" = '${{ inputs.stable_operation_control_digest }}'
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts verify \
            --control "$control" --app-root app-source \
            --source-gate stable-operation-control/source-gate.json \
            --pre-nonce-guard stable-operation-control/pre-nonce-guard.json \
            --expected-run-id "$GITHUB_RUN_ID" --expected-actor "$GITHUB_ACTOR" \
            --expected-app-sha '${{ inputs.app_ref }}' \
            --expected-shell-sha '${{ inputs.shell_ref }}' \
            --expected-framework-sha '${{ inputs.framework_ref }}'
          nonce="$(jq -er .nonce "$control")"
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts consume \
            --control "$control" --operation-id "$(jq -er .operation_id "$control")" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --nonce "$nonce" \
            --output stable-operation-control/stable-operation-consumption.json
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts verify \
            --control "$control" --input stable-operation-control/stable-operation-consumption.json

      - name: Upload consumed Stable operation control
        if: ${{ always() && inputs.channel == 'stable' && hashFiles('stable-operation-control/stable-operation-consumption.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-operation-consumption-${{ github.run_id }}
          path: stable-operation-control
          if-no-files-found: error
          retention-days: 30

      - name: Upload Bundle admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-bundle-admission-${{ github.run_id }}
          path: release-failure-evidence
          if-no-files-found: error
          retention-days: 30

  freeze:
    if: ${{ inputs.mode == 'execute' && needs.admission.result == 'success' }}
    needs: [admission]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      updater_version: ${{ steps.identity.outputs.updater_version }}
      tag: ${{ steps.identity.outputs.tag }}
      app_sha: ${{ steps.identity.outputs.app_sha }}
      shell_sha: ${{ steps.identity.outputs.shell_sha }}
      framework_sha: ${{ steps.identity.outputs.framework_sha }}
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
      operation_id: ${{ steps.bundle.outputs.operation_id }}
      operation_started_at: ${{ steps.bundle.outputs.operation_started_at }}
      operation_deadline_at: ${{ steps.bundle.outputs.operation_deadline_at }}
    steps:
      - name: Checkout canonical App source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          fetch-depth: 0

      - name: Download and verify consumed Stable operation control
        if: ${{ inputs.channel == 'stable' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opl-stable-operation-consumption-${{ github.run_id }}
          path: stable-operation-control

      - name: Require one matching consumed Stable operation control
        if: ${{ inputs.channel == 'stable' }}
        shell: bash
        run: |
          set -euo pipefail
          control=stable-operation-control/stable-operation-control.json
          consumption=stable-operation-control/stable-operation-consumption.json
          test -f "$control" && test ! -L "$control"
          test -f "$consumption" && test ! -L "$consumption"
          test "$(jq -er .authority_digest "$control")" = '${{ inputs.stable_operation_control_digest }}'
          node --experimental-strip-types scripts/stable-operation-control.ts verify \
            --control "$control" --input "$consumption" \
            --app-root . --source-gate stable-operation-control/source-gate.json \
            --pre-nonce-guard stable-operation-control/pre-nonce-guard.json \
            --expected-run-id "$GITHUB_RUN_ID" --expected-actor "$GITHUB_ACTOR" \
            --expected-app-sha '${{ inputs.app_ref }}' \
            --expected-shell-sha '${{ inputs.shell_ref }}' \
            --expected-framework-sha '${{ inputs.framework_ref }}'

      - name: Checkout Shell source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: shells/aionui

      - name: Checkout Framework source and executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref || 'main' }}
          path: framework-source

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install cold-gate dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix framework-source ci --ignore-scripts

      - name: Freeze source, version, and compatibility identity
        id: identity
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLICATION_CHANNEL: ${{ inputs.publication_channel || inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_APP_REF: ${{ inputs.app_ref }}
          REQUESTED_SHELL_REF: ${{ inputs.shell_ref }}
          REQUESTED_FRAMEWORK_REF: ${{ inputs.framework_ref }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || { echo "::error::Bundle builds cannot be rerun."; exit 1; }
          test "$PUBLICATION_CHANNEL" = "$CHANNEL" || {
            echo "::error::Publication route must match the Framework Bundle channel."
            exit 1
          }
          case "$CHANNEL" in
            stable|preview) ;;
            *) echo "::error::Unsupported execute channel: $CHANNEL"; exit 1 ;;
          esac
          app_sha="$(git rev-parse HEAD)"
          shell_sha="$(git -C shells/aionui rev-parse HEAD)"
          framework_sha="$(git -C framework-source rev-parse HEAD)"
          [ "$app_sha" = "$REQUESTED_APP_REF" ] || {
            echo "::error::App checkout differs from the admitted snapshot."
            exit 1
          }
          [ "$shell_sha" = "$REQUESTED_SHELL_REF" ] || {
            echo "::error::Shell checkout differs from the admitted snapshot."
            exit 1
          }
          [ "$framework_sha" = "$REQUESTED_FRAMEWORK_REF" ] || {
            echo "::error::Framework checkout differs from the admitted snapshot."
            exit 1
          }
          version="$REQUESTED_VERSION"
          test -n "$version"
          published_releases_json="$RUNNER_TEMP/opl-published-releases-$GITHUB_RUN_ID.json"
          published_tags_txt="$RUNNER_TEMP/opl-published-tags-$GITHUB_RUN_ID.txt"
          previous_latest_json="$RUNNER_TEMP/opl-previous-latest-$GITHUB_RUN_ID.json"
          previous_latest_manifest_json="$RUNNER_TEMP/opl-previous-latest-component-manifest-$GITHUB_RUN_ID.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$published_releases_json"
          git ls-remote --tags origin 'refs/tags/v*' > "$published_tags_txt"
          if [ "$CHANNEL" = stable ]; then
            published_webui_tags_txt="$RUNNER_TEMP/opl-published-webui-tags-$GITHUB_RUN_ID.txt"
            stable_version_order_json="$RUNNER_TEMP/opl-stable-version-order-$GITHUB_RUN_ID.json"
            webui_base_version="${version%-r*}"
            registry_token="$(
              curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
                "https://ghcr.io/token?scope=repository:gaofeng21cn/one-person-lab-webui:pull" \
                | jq -er .token
            )"
            : > "$published_webui_tags_txt"
            for revision in {0..9}; do
              candidate="$webui_base_version"
              if [ "$revision" != 0 ]; then candidate="$webui_base_version-r$revision"; fi
              status="$(
                curl --silent --show-error --connect-timeout 10 --max-time 30 \
                  --output /dev/null --write-out '%{http_code}' \
                  --header "Authorization: Bearer $registry_token" \
                  --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                  "https://ghcr.io/v2/gaofeng21cn/one-person-lab-webui/manifests/$candidate"
              )"
              case "$status" in
                200) printf 'v%s\n' "$candidate" >> "$published_webui_tags_txt" ;;
                404) ;;
                *) echo "::error::Unable to resolve public WebUI version tag $candidate (HTTP $status)."; exit 1 ;;
              esac
            done
            PUBLISHED_RELEASES_JSON="$published_releases_json" PUBLISHED_TAGS_TXT="$published_tags_txt" \
              PUBLISHED_WEBUI_TAGS_TXT="$published_webui_tags_txt" \
              BASE_VERSION="${version%-r*}" VERSION="$version" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolveStableReleaseVersion } from './scripts/release-version.ts';
          const pages = JSON.parse(fs.readFileSync(process.env.PUBLISHED_RELEASES_JSON, 'utf8'));
          const refs = Array.isArray(pages) ? pages.flat().map((release) => release.tag_name).filter(Boolean) : [];
          refs.push(...fs.readFileSync(process.env.PUBLISHED_TAGS_TXT, 'utf8').split(/\r?\n/).filter(Boolean));
          refs.push(...fs.readFileSync(process.env.PUBLISHED_WEBUI_TAGS_TXT, 'utf8').split(/\r?\n/).filter(Boolean));
          const resolved = resolveStableReleaseVersion(process.env.BASE_VERSION, refs);
          if (resolved.version !== process.env.VERSION) {
            throw new Error(`Stable must use next immutable same-day revision ${resolved.version}; got ${process.env.VERSION}.`);
          }
          NODE
            node --experimental-strip-types scripts/stable-release-version-order.ts \
              --target "$version" --published-releases-json "$published_releases_json" > "$stable_version_order_json"
          else
            PUBLISHED_RELEASES_JSON="$published_releases_json" PUBLISHED_TAGS_TXT="$published_tags_txt" \
              BASE_VERSION="${version%-preview.*}" VERSION="$version" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { resolvePreviewReleaseVersion } from './scripts/release-version.ts';
          const pages = JSON.parse(fs.readFileSync(process.env.PUBLISHED_RELEASES_JSON, 'utf8'));
          const refs = Array.isArray(pages) ? pages.flat().map((release) => release.tag_name).filter(Boolean) : [];
          refs.push(...fs.readFileSync(process.env.PUBLISHED_TAGS_TXT, 'utf8').split(/\r?\n/).filter(Boolean));
          const resolved = resolvePreviewReleaseVersion(process.env.BASE_VERSION, refs);
          if (resolved.version !== process.env.VERSION) {
            throw new Error(`Preview must use next immutable same-day revision ${resolved.version}; got ${process.env.VERSION}.`);
          }
          NODE
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists; resume only its exact failed checkpoint."
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 && {
            echo "::error::Release tag v$version already exists."
            exit 1
          }
          version_json="$(node --experimental-strip-types scripts/release-version.ts --channel "$CHANNEL" --version "$version" --json)"
          updater_version="$(jq -er .updater_version <<<"$version_json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$previous_latest_json"
          previous_latest_tag="$(jq -er .tag_name "$previous_latest_json")"
          previous_display="${previous_latest_tag#v}"
          previous_target="$(jq -er .target_commitish "$previous_latest_json")"
          export GITHUB_REPOSITORY
          previous_target="$(
            node --experimental-strip-types scripts/resolve-github-target-commit.ts \
              --target "$previous_target" \
              --release-tag "$previous_latest_tag"
          )"
          previous_manifest_url="$(jq -er '.assets[] | select(.name == "opl-app-component-manifest.json") | .url' "$previous_latest_json")"
          gh api --header 'Accept: application/octet-stream' "$previous_manifest_url" > "$previous_latest_manifest_json"
          previous_identity_json="$RUNNER_TEMP/opl-previous-latest-component-identity-$GITHUB_RUN_ID.json"
          node --experimental-strip-types scripts/read-opl-app-component-manifest-identity.ts \
            --manifest "$previous_latest_manifest_json" \
            --expected-tag "$previous_latest_tag" \
            --release-prerelease "$(jq -er .prerelease "$previous_latest_json")" \
            --expected-source-commit "$previous_target" \
            > "$previous_identity_json"
          test "$(jq -er .display_version "$previous_identity_json")" = "$previous_display"
          previous_updater="$(jq -er .updater_version "$previous_identity_json")"
          TARGET="$updater_version" CURRENT="$previous_updater" node --experimental-strip-types --input-type=module <<'NODE'
          import { compareUpdaterMachineVersions } from './scripts/release-version.ts';
          if (compareUpdaterMachineVersions(process.env.TARGET, process.env.CURRENT) <= 0) {
            throw new Error(`Candidate updater version ${process.env.TARGET} is not newer than Latest ${process.env.CURRENT}.`);
          }
          NODE
          {
            echo "version=$version"
            echo "updater_version=$updater_version"
            echo "tag=v$version"
            echo "app_sha=$app_sha"
            echo "shell_sha=$shell_sha"
            echo "framework_sha=$framework_sha"
            echo "previous_latest_tag=$previous_latest_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Bundle contracts before paid work
        run: |
          npm run typecheck
          npm run validate:release-boundary
          node --experimental-strip-types --test tests/release/release-bundle-workflow-cutover.test.ts
          node --experimental-strip-types --test framework-source/tests/src/cli/cases/release-bundle.test.ts
          npm --prefix framework-source run typecheck

      - name: Prepare and validate online AI notes
        env:
          GH_TOKEN: ${{ github.token }}
          OPL_RELEASE_NOTES_MODE: ai
          OPL_RELEASE_NOTES_PROVIDER: openai_compatible
          OPL_RELEASE_NOTES_CODEX_BASE_URL: https://gflabtoken.cn/v1
          OPL_RELEASE_NOTES_CODEX_API_KEY: ${{ secrets.OPL_RELEASE_NOTES_CODEX_API_KEY }}
          OPL_RELEASE_NOTES_MODEL: gpt-5.6-luna
          OPL_RELEASE_NOTES_OPENAI_COMPATIBLE_MODELS: gpt-5.6-luna,gpt-5.4
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPL_RELEASE_NOTES_CODEX_API_KEY" || { echo "::error::Online AI release-note credential is missing."; exit 1; }
          notes_root="$RUNNER_TEMP/opl-release-prepared-notes-$GITHUB_RUN_ID"
          mkdir -p "$notes_root"
          notes_intent_args=()
          set --
          if (( ${#notes_intent_args[@]} )); then
            set -- "${notes_intent_args[@]}"
          fi
          npm run release:notes -- \
            --version '${{ steps.identity.outputs.version }}' \
            --channel '${{ inputs.publication_channel || inputs.channel }}' \
            --repo "$GITHUB_REPOSITORY" \
            --shell-root shells/aionui \
            --previous-tag '${{ steps.identity.outputs.previous_latest_tag }}' \
            --current-tag '${{ steps.identity.outputs.tag }}' \
            --current-app-ref '${{ steps.identity.outputs.app_sha }}' \
            --current-shell-ref '${{ steps.identity.outputs.shell_sha }}' \
            "$@" \
            --evidence-output "$notes_root/notes-evidence.json" \
            --output "$notes_root/notes-template.md"
          if [ '${{ inputs.publication_channel || inputs.channel }}' = preview ]; then
            npm run release:notes:prepare -- \
              --evidence "$notes_root/notes-evidence.json" \
              --output "$notes_root/notes-ai.md" \
              --receipt-output notes-prepare-receipt.json
            if ! NOTES_PATH="$notes_root/notes-ai.md" EVIDENCE_PATH="$notes_root/notes-evidence.json" \
              OUTPUT_PATH="$notes_root/notes-finalized.md" \
              node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { finalizePreviewReleaseNotesDocument } from './scripts/release-notes.ts';
          import { validateAiReleaseNotes } from './scripts/release-notes-ai-writer-parts/validation.ts';
          const evidence = JSON.parse(fs.readFileSync(process.env.EVIDENCE_PATH, 'utf8'));
          const prepared = fs.readFileSync(process.env.NOTES_PATH, 'utf8');
          const finalized = finalizePreviewReleaseNotesDocument(prepared, evidence);
          validateAiReleaseNotes(finalized, evidence);
          fs.writeFileSync(process.env.OUTPUT_PATH, finalized);
          NODE
            then
              node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const receipt = JSON.parse(fs.readFileSync('notes-prepare-receipt.json', 'utf8'));
          receipt.written_at = new Date().toISOString();
          receipt.status = 'failed';
          receipt.notes_sha256 = null;
          receipt.failure = {
            taxonomy: 'quality',
            type: 'preview_notes_finalization_failed',
            transport_attempts: null,
            transport_retry_exhausted: false,
            message: 'Preview deterministic finalization failed after online AI preparation.',
          };
          fs.writeFileSync('notes-prepare-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
              exit 1
            fi
            npm run release:notes:prepare -- \
              --evidence "$notes_root/notes-evidence.json" \
              --input "$notes_root/notes-finalized.md" \
              --output "$notes_root/notes.md" \
              --receipt-output notes-prepare-receipt.json
          else
            npm run release:notes:prepare -- \
              --evidence "$notes_root/notes-evidence.json" \
              --output "$notes_root/notes.md" \
              --receipt-output notes-prepare-receipt.json
          fi

      - name: Upload notes preparation receipt
        if: ${{ always() && hashFiles('notes-prepare-receipt.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-notes-prepare-${{ github.run_id }}
          path: notes-prepare-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Freeze canonical Framework Bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes_root="$RUNNER_TEMP/opl-release-prepared-notes-$GITHUB_RUN_ID"
          rm -f notes-prepare-receipt.json
          node --experimental-strip-types scripts/release-operation-deadline.ts check \
            --operation '${{ inputs.operation }}' \
            --started-at '${{ inputs.operation_started_at }}' \
            --deadline-at '${{ inputs.operation_deadline_at }}'
          node --experimental-strip-types scripts/framework-release-adapter.ts freeze-request \
            --channel '${{ inputs.channel }}' \
            --publication-channel '${{ inputs.publication_channel || inputs.channel }}' \
            --version '${{ steps.identity.outputs.version }}' \
            --updater-version '${{ steps.identity.outputs.updater_version }}' \
            --app-root . \
            --shell-root shells/aionui \
            --framework-root framework-source \
            --notes "$notes_root/notes.md" \
            --notes-evidence "$notes_root/notes-evidence.json" \
            --include-full-package '${{ inputs.include_full }}' \
            --package-compatibility-abi '${{ inputs.package_compatibility_abi }}' \
            --package-compatibility-version-range '${{ inputs.package_compatibility_version_range }}' \
            --output freeze-request.json
          cp "$notes_root/notes.md" notes.md
          cp "$notes_root/notes-evidence.json" notes-evidence.json
          framework-source/bin/opl release freeze \
            --request freeze-request.json \
            --source-root framework-source \
            --store "$RUNNER_TEMP/release-bundle-store" \
            --json > freeze-result.json
          bundle_digest="$(jq -er .release_bundle_freeze.bundle_digest freeze-result.json)"
          test "$bundle_digest" != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49
          bundle_path="$(jq -er .release_bundle_freeze.bundle_path freeze-result.json)"
          cp "$bundle_path" release-bundle.json
          operation_id="gha-${GITHUB_RUN_ID}-standard"
          operation_started_at='${{ inputs.operation_started_at }}'
          operation_deadline_at='${{ inputs.operation_deadline_at }}'
          framework-source/bin/opl release operation admit \
            --bundle "$bundle_digest" --operation standard \
            --operation-id "$operation_id" \
            --operation-started-at "$operation_started_at" \
            --operation-deadline-at "$operation_deadline_at" \
            --store "$RUNNER_TEMP/release-bundle-store" \
            --json > operation-admit-result.json
          test "$(jq -r .release_bundle_operation_admit.status operation-admit-result.json)" = complete
          {
            echo "bundle_digest=$bundle_digest"
            echo "operation_id=$operation_id"
            echo "operation_started_at=$operation_started_at"
            echo "operation_deadline_at=$operation_deadline_at"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable Bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.OPL_RELEASE_BUNDLE_ARTIFACT }}
          path: |
            release-bundle.json
            freeze-request.json
            freeze-result.json
            operation-admit-result.json
            notes.md
            notes-evidence.json
          if-no-files-found: error
          retention-days: 30

  standard-build:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-reusable.yml
    with:
      mode: execute
      matrix: >-
        {"include":[{"platform":"macos-arm64","os":"macos-latest","command":"node scripts/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}]}
      ref: ${{ needs.freeze.outputs.app_sha }}
      shell_ref: ${{ needs.freeze.outputs.shell_sha }}
      framework_ref: ${{ needs.freeze.outputs.framework_sha }}
      opl_release_version: ${{ needs.freeze.outputs.version }}
      opl_updater_version: ${{ needs.freeze.outputs.updater_version }}
      release_bundle_digest: ${{ needs.freeze.outputs.bundle_digest }}
      release_cohort_ref: ${{ needs.freeze.outputs.bundle_digest }}
      require_macos_gatekeeper: true
      operation: ${{ inputs.mode == 'execute' && inputs.operation || '' }}
      operation_started_at: ${{ inputs.mode == 'execute' && needs.freeze.outputs.operation_started_at || '' }}
      operation_deadline_at: ${{ inputs.mode == 'execute' && needs.freeze.outputs.operation_deadline_at || '' }}
    secrets: inherit

  seal-standard-identity:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze, standard-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      standard_artifact_name: ${{ steps.seal.outputs.standard_artifact_name }}
      standard_identity_sha256: ${{ steps.seal.outputs.standard_identity_sha256 }}
    steps:
      - name: Checkout exact App identity binder
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.freeze.outputs.app_sha }}
          path: app-source

      - name: Download the one signed Standard build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: macos-build-arm64
          path: standard-assets

      - name: Stage the exact App installer bootstrap
        shell: bash
        run: |
          set -euo pipefail
          source_installer=app-source/install.sh
          release_installer=standard-assets/opl-app-installer.sh
          test -f "$source_installer" && test ! -L "$source_installer"
          cp "$source_installer" "$release_installer"
          chmod 0755 "$release_installer"
          test -f "$release_installer" && test ! -L "$release_installer"
          test -x "$release_installer"
          cmp "$source_installer" "$release_installer"

      - name: Seal one immutable Standard artifact identity
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --experimental-strip-types app-source/scripts/bind-standard-release-track.ts \
            --assets-dir standard-assets \
            --version '${{ needs.freeze.outputs.version }}' \
            --updater-version '${{ needs.freeze.outputs.updater_version }}' \
            --app-sha '${{ needs.freeze.outputs.app_sha }}' \
            --shell-sha '${{ needs.freeze.outputs.shell_sha }}' \
            --framework-sha '${{ needs.freeze.outputs.framework_sha }}' \
            --bundle-digest '${{ needs.freeze.outputs.bundle_digest }}' \
            --channel '${{ inputs.channel }}' \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --latest-override-requested '${{ inputs.latest_override_requested }}' \
            --component-manifest-script app-source/scripts/write-opl-app-component-manifest.ts \
            --component-manifest-output standard-assets/opl-app-component-manifest.json \
            --identity-receipt-output standard-identity-receipt.json
          mkdir -p bound-standard
          mv standard-assets bound-standard/assets
          mv standard-identity-receipt.json bound-standard/standard-identity-receipt.json
          identity_digest="sha256:$(shasum -a 256 bound-standard/standard-identity-receipt.json | awk '{print $1}')"
          [[ "$identity_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "standard_artifact_name=opl-release-standard-bound-${GITHUB_RUN_ID}"
            echo "standard_identity_sha256=$identity_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Upload one bound Standard artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-standard-bound-${{ github.run_id }}
          path: bound-standard
          if-no-files-found: error
          retention-days: 30

  checkpoint-standard:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [freeze, seal-standard-identity]
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.provenance.outputs.source_run_id }}
      source_artifact: ${{ steps.provenance.outputs.source_artifact }}
      checkpoint_transport_executor: ${{ steps.provenance.outputs.checkpoint_transport_executor }}
      transport_run_id: ${{ steps.provenance.outputs.transport_run_id }}
      completed_stage: ${{ steps.provenance.outputs.completed_stage }}
      standard_identity_sha256: ${{ steps.provenance.outputs.standard_identity_sha256 }}
    steps:
      - name: Recheck one-shot deadline before Standard checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [ '${{ inputs.mode }}' = execute ]; then
            node <<'NODE'
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          fi

      - name: Checkout App product adapter
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.freeze.outputs.app_sha }}
          path: app-source

      - name: Checkout Framework checkpoint authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.freeze.outputs.framework_sha }}
          path: framework-source

      - name: Download Bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ env.OPL_RELEASE_BUNDLE_ARTIFACT }}
          path: bundle

      - name: Download sealed Standard artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.seal-standard-identity.outputs.standard_artifact_name }}
          path: bound-standard

      - name: Setup Framework runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: framework-source/package-lock.json

      - name: Install Framework runtime dependencies
        run: npm --prefix framework-source ci --ignore-scripts

      - name: Bind Desktop bytes and export one portable checkpoint
        env:
          BUNDLE_DIGEST: ${{ needs.freeze.outputs.bundle_digest }}
        shell: bash
        run: |
          set -euo pipefail
          identity_receipt=bound-standard/standard-identity-receipt.json
          test -s "$identity_receipt" && test ! -L "$identity_receipt"
          observed_identity_sha256="sha256:$(shasum -a 256 "$identity_receipt" | awk '{print $1}')"
          expected_identity_sha256='${{ needs.seal-standard-identity.outputs.standard_identity_sha256 }}'
          test "$observed_identity_sha256" = "$expected_identity_sha256" || {
            echo "::error::Standard identity digest mismatch: expected $expected_identity_sha256, got $observed_identity_sha256."
            exit 1
          }
          jq -e \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg bundle "$BUNDLE_DIGEST" \
            --arg app '${{ needs.freeze.outputs.app_sha }}' \
            --arg shell '${{ needs.freeze.outputs.shell_sha }}' \
            --arg framework '${{ needs.freeze.outputs.framework_sha }}' \
            '
              .schema == "opl_standard_release_identity_receipt.v2"
              and .status == "passed"
              and .source.run_id == $run_id
              and .source.run_attempt == 1
              and .release.bundle_digest == $bundle
              and .cohort == {
                app_sha: $app,
                shell_sha: $shell,
                framework_sha: $framework
              }
            ' "$identity_receipt" >/dev/null
          test -d bound-standard/assets && test ! -L bound-standard/assets
          mv bound-standard/assets standard-assets
          cp "$identity_receipt" standard-identity-receipt.json
          cmp "$identity_receipt" standard-identity-receipt.json
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
            --operation build --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-standard-build" \
            --release-operation standard --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --remote-target "github-actions:${GITHUB_REPOSITORY}/runs/${GITHUB_RUN_ID}/standard-build" \
            --bundle bundle/release-bundle.json --track standard --outcome complete \
            --assets-dir standard-assets --output standard-build-receipt.json
          framework-source/bin/opl release freeze \
            --request bundle/freeze-request.json --source-root framework-source \
            --store "$RUNNER_TEMP/store" --json > /dev/null
          framework-source/bin/opl release operation admit \
            --bundle "$BUNDLE_DIGEST" --operation standard \
            --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --operation-started-at '${{ needs.freeze.outputs.operation_started_at }}' \
            --operation-deadline-at '${{ needs.freeze.outputs.operation_deadline_at }}' \
            --store "$RUNNER_TEMP/store" --json > operation-admit-result.json
          framework-source/bin/opl release build \
            --bundle "$BUNDLE_DIGEST" --executor-receipt standard-build-receipt.json \
            --operation standard --operation-id '${{ needs.freeze.outputs.operation_id }}' \
            --operation-started-at '${{ needs.freeze.outputs.operation_started_at }}' \
            --operation-deadline-at '${{ needs.freeze.outputs.operation_deadline_at }}' \
            --store "$RUNNER_TEMP/store" --json > standard-build-result.json
          framework-source/bin/opl release checkpoint export \
            --bundle "$BUNDLE_DIGEST" --output standard-checkpoint \
            --store "$RUNNER_TEMP/store" --json > checkpoint-export.json
          if jq -e '.tracks.webui' bundle/release-bundle.json >/dev/null; then
            expected_checkpoint_stage=stable_built
          else
            expected_checkpoint_stage=standard_built
          fi
          actual_checkpoint_stage="$(jq -er .release_bundle_checkpoint_export.checkpoint_stage checkpoint-export.json)"
          if [ "$actual_checkpoint_stage" != "$expected_checkpoint_stage" ]; then
            echo "::error::Framework checkpoint stage mismatch: expected $expected_checkpoint_stage, got $actual_checkpoint_stage."
            exit 1
          fi

      - name: Expose Framework checkpoint result and transport provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          completed_stage="$(jq -er .release_bundle_checkpoint_export.checkpoint_stage checkpoint-export.json)"
          {
            echo "source_run_id=$GITHUB_RUN_ID"
            echo "source_artifact=opl-release-standard-checkpoint-${GITHUB_RUN_ID}"
            echo "checkpoint_transport_executor=github_actions"
            echo "transport_run_id=$GITHUB_RUN_ID"
            echo "completed_stage=$completed_stage"
            standard_identity_sha256="sha256:$(shasum -a 256 standard-identity-receipt.json | awk '{print $1}')"
            test "$standard_identity_sha256" = '${{ needs.seal-standard-identity.outputs.standard_identity_sha256 }}' || {
              echo "::error::Standard identity digest mismatch after checkpoint export."
              exit 1
            }
            echo "standard_identity_sha256=$standard_identity_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload portable Standard checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.OPL_STANDARD_CHECKPOINT_ARTIFACT }}
          path: |
            standard-checkpoint
            standard-build-receipt.json
            standard-identity-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Standard identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-standard-identity-${{ github.run_id }}
          path: |
            standard-identity-receipt.json
            operation-admit-result.json
            standard-build-result.json
            checkpoint-export.json
          if-no-files-found: error
          retention-days: 30

  prepare-native-webui:
    if: ${{ inputs.mode == 'execute' && (inputs.publication_channel || inputs.channel) == 'stable' }}
    needs: [freeze]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_release-native-webui-carrier.yml
    with:
      mode: prepare
      stable_authority_run_id: ${{ github.run_id }}
      app_ref: ${{ needs.freeze.outputs.app_sha }}
      shell_ref: ${{ needs.freeze.outputs.shell_sha }}
      framework_ref: ${{ needs.freeze.outputs.framework_sha }}
      opl_version: ${{ needs.freeze.outputs.version }}
      release_bundle_digest: ${{ needs.freeze.outputs.bundle_digest }}

  publish-standard:
    if: ${{ inputs.mode == 'execute' }}
    needs: [freeze, checkpoint-standard]
    uses: ./.github/workflows/_release-standard-publish.yml
    with:
      mode: execute
      operation: standard
      publication_channel: ${{ inputs.publication_channel || inputs.channel }}
      latest_override_requested: ${{ inputs.latest_override_requested }}
      source_run_id: ${{ github.run_id }}
      source_artifact: opl-release-standard-checkpoint-${{ github.run_id }}
      source_format: checkpoint_v1
      standard_identity_sha256: ${{ needs.checkpoint-standard.outputs.standard_identity_sha256 }}
      framework_executor_ref: ${{ needs.freeze.outputs.framework_sha }}
      operation_started_at: ${{ needs.freeze.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.freeze.outputs.operation_deadline_at }}
    secrets: inherit

  publish-native-webui:
    if: ${{ always() && inputs.mode == 'execute' && (inputs.publication_channel || inputs.channel) == 'stable' && needs.publish-standard.result == 'success' && needs.prepare-native-webui.result == 'success' && needs.prepare-native-webui.outputs.prepare_status == 'qualified' }}
    needs: [freeze, checkpoint-standard, prepare-native-webui, publish-standard]
    uses: ./.github/workflows/_release-native-webui-carrier.yml
    with:
      mode: publish
      stable_authority_run_id: ${{ github.run_id }}
      app_ref: ${{ needs.freeze.outputs.app_sha }}
      shell_ref: ${{ needs.freeze.outputs.shell_sha }}
      framework_ref: ${{ needs.freeze.outputs.framework_sha }}
      opl_version: ${{ needs.freeze.outputs.version }}
      release_bundle_digest: ${{ needs.freeze.outputs.bundle_digest }}
      source_run_id: ${{ needs.checkpoint-standard.outputs.source_run_id }}
      source_artifact: ${{ needs.checkpoint-standard.outputs.source_artifact }}
      standard_identity_sha256: ${{ needs.checkpoint-standard.outputs.standard_identity_sha256 }}
      qualified_artifact_name: ${{ needs.prepare-native-webui.outputs.qualified_artifact_name }}
    secrets: inherit
