name: OPL Homebrew Full Follower
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_missing_homebrew_full_follower_v1'
    && inputs.failed_follower_run_id == 'none'
    && inputs.failed_recovery_run_id == 'none'
    && inputs.failed_recovery_v2_run_id == 'none'
    && format('Homebrew Full follower missing-trigger recovery for Stable run {0}', inputs.source_run_id)
    || github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_failed_homebrew_full_follower_v3'
    && inputs.failed_recovery_run_id == 'none'
    && inputs.failed_recovery_v2_run_id == 'none'
    && format('Homebrew Full follower recovery v1 for Stable run {0} failed follower {1}', inputs.source_run_id, inputs.failed_follower_run_id)
    || github.event_name == 'workflow_dispatch'
    && format('Homebrew Full follower recovery v3 for Stable run {0} failed follower {1} failed recovery v1 {2} failed recovery v2 {3}', inputs.source_run_id, inputs.failed_follower_run_id, inputs.failed_recovery_run_id, inputs.failed_recovery_v2_run_id)
    || format('Homebrew Full follower for Stable run {0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful append_full Stable authority run
        required: true
        type: string
      failed_follower_run_id:
        description: Exact failed first-attempt follower run, or none for missing-trigger recovery
        required: true
        type: string
      failed_recovery_run_id:
        description: Exact consumed recovery v1 run for legacy v3 recovery; otherwise use none
        required: true
        type: string
      failed_recovery_v2_run_id:
        description: Exact consumed recovery v2 run for legacy v3 recovery; otherwise use none
        required: true
        type: string
      recovery_confirmation:
        description: Confirm one-shot recovery of a missing trigger or exact failed runs
        required: true
        type: choice
        options:
          - recover_exact_missing_homebrew_full_follower_v1
          - recover_exact_failed_homebrew_full_follower_v3

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-homebrew-full-follower-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve-handoff:
    if: >-
      ${{ (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && startsWith(github.event.workflow_run.display_title, 'OPL Stable append_full '))
        || (github.event_name == 'workflow_dispatch'
        && (inputs.recovery_confirmation == 'recover_exact_missing_homebrew_full_follower_v1'
          || inputs.recovery_confirmation == 'recover_exact_failed_homebrew_full_follower_v3')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.handoff.outputs.eligible }}
      handoff_base64: ${{ steps.handoff.outputs.handoff_base64 }}
      handoff_sha256: ${{ steps.handoff.outputs.handoff_sha256 }}
      authority_run_id: ${{ steps.authority.outputs.authority_run_id }}
    steps:
      - name: Admit one successful append_full authority run
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          FAILED_FOLLOWER_RUN_ID: ${{ inputs.failed_follower_run_id || '' }}
          FAILED_RECOVERY_RUN_ID: ${{ inputs.failed_recovery_run_id || '' }}
          FAILED_RECOVERY_V2_RUN_ID: ${{ inputs.failed_recovery_v2_run_id || '' }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation || '' }}
          TRIGGER_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$AUTHORITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$TRIGGER_EVENT" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_missing_homebrew_full_follower_v1 ]; then
              test "$FAILED_FOLLOWER_RUN_ID:$FAILED_RECOVERY_RUN_ID:$FAILED_RECOVERY_V2_RUN_ID" = none:none:none
              recovery_title="Homebrew Full follower missing-trigger recovery for Stable run ${AUTHORITY_RUN_ID}"
            else
              test "$RECOVERY_CONFIRMATION" = recover_exact_failed_homebrew_full_follower_v3
              [[ "$FAILED_FOLLOWER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              if [ "$FAILED_RECOVERY_RUN_ID:$FAILED_RECOVERY_V2_RUN_ID" = none:none ]; then
                recovery_title="Homebrew Full follower recovery v1 for Stable run ${AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID}"
              else
                [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V2_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                test "$FAILED_RECOVERY_RUN_ID" != "$FAILED_FOLLOWER_RUN_ID"
                test "$FAILED_RECOVERY_V2_RUN_ID" != "$FAILED_FOLLOWER_RUN_ID"
                test "$FAILED_RECOVERY_V2_RUN_ID" != "$FAILED_RECOVERY_RUN_ID"
                recovery_title="Homebrew Full follower recovery v3 for Stable run ${AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID}"
              fi
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovery-run.json
            jq -e --arg run "$GITHUB_RUN_ID" --arg title "$recovery_title" --arg sha "$GITHUB_SHA" '
              (.id | tostring) == $run
              and .repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .path == ".github/workflows/release-homebrew-full-follower.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .head_sha == $sha
              and .display_title == $title
              and .run_attempt == 1
            ' recovery-run.json >/dev/null
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_missing_homebrew_full_follower_v1 ]; then
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/workflows/release-homebrew-full-follower.yml/runs?event=workflow_run&per_page=100" \
                > follower-runs.json
              jq -e --arg source "$AUTHORITY_RUN_ID" '
                [.[]?.workflow_runs[]?
                  | select(.display_title == ("Homebrew Full follower for Stable run " + $source))]
                | length == 0
              ' follower-runs.json >/dev/null
            else
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID" > failed-follower-run.json
              jq -e --arg run "$FAILED_FOLLOWER_RUN_ID" --arg source "$AUTHORITY_RUN_ID" '
                (.id | tostring) == $run
                and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                and .path == ".github/workflows/release-homebrew-full-follower.yml"
                and .event == "workflow_run"
                and .head_branch == "main"
                and .display_title == ("Homebrew Full follower for Stable run " + $source)
                and .run_attempt == 1
                and .status == "completed"
                and .conclusion == "failure"
              ' failed-follower-run.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID/jobs?per_page=100" > failed-follower-jobs.json
              if [ "$FAILED_RECOVERY_RUN_ID:$FAILED_RECOVERY_V2_RUN_ID" = none:none ]; then
                jq -e '
                  .total_count == 5
                  and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / prepare-candidate" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / startup-canary" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / publish-cask" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / readback" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Decode and validate same-tag Full handoff" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Upload observational candidate and binding" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Upload typed observational binding" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Publish one digest-bound Full Cask commit")] | length == 0)
                ' failed-follower-jobs.json >/dev/null
                failed_job_id="$(jq -er '[.jobs[] | select(.name == "publish-homebrew-full / prepare-candidate")] | select(length == 1) | .[0].id' failed-follower-jobs.json)"
                gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_job_id/logs" > failed-follower.log
                stale_full_standard_cohort_assertion=".release.target_standard.target_commitish == .build_provenance.app_sha"
                grep -F "$stale_full_standard_cohort_assertion" failed-follower.log >/dev/null
                gh api --paginate --slurp \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID/artifacts?per_page=100" \
                  > failed-follower-artifacts.json
                jq -e '[.[]?.artifacts[]?] | length == 0' failed-follower-artifacts.json >/dev/null
              else
                jq -e '
                  .total_count == 2
                  and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Admit one successful append_full authority run" and .conclusion == "success")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Download exact Full publication handoff" and .conclusion == "success")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Bind same-tag Homebrew Full handoff" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Publish one hosted-qualified Full Cask commit")] | length == 0)
                ' failed-follower-jobs.json >/dev/null

                failed_recovery_title="Homebrew Full follower recovery for Stable run ${AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID}"
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID" > failed-recovery-run.json
                jq -e --arg run "$FAILED_RECOVERY_RUN_ID" --arg title "$failed_recovery_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-homebrew-full-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-run.json >/dev/null
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID/jobs?per_page=100" > failed-recovery-jobs.json
                jq -e '
                  .total_count == 5
                  and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / prepare-candidate" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / startup-canary" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / publish-cask" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / readback" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Decode and validate same-tag Full handoff" and .conclusion == "success")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Restore exact qualified Full checkpoint" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Publish one hosted-qualified Full Cask commit")] | length == 0)
                  and ([.jobs[].steps[]? | select(.name == "Publish one observer-bound Full Cask commit")] | length == 0)
                ' failed-recovery-jobs.json >/dev/null

                failed_recovery_v2_title="Homebrew Full follower recovery v2 for Stable run ${AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery ${FAILED_RECOVERY_RUN_ID}"
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V2_RUN_ID" > failed-recovery-v2-run.json
                jq -e --arg run "$FAILED_RECOVERY_V2_RUN_ID" --arg title "$failed_recovery_v2_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-homebrew-full-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-v2-run.json >/dev/null
                gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V2_RUN_ID/jobs?per_page=100" > failed-recovery-v2-jobs.json
                jq -e '
                  .total_count == 5
                  and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / prepare-candidate" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / startup-canary" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / publish-cask" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[] | select(.name == "publish-homebrew-full / readback" and .conclusion == "skipped")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Decode and validate same-tag Full handoff" and .conclusion == "failure")] | length == 1)
                  and ([.jobs[].steps[]? | select(.name == "Publish one digest-bound Full Cask commit")] | length == 0)
                ' failed-recovery-v2-jobs.json >/dev/null
                failed_recovery_v2_job_id="$(jq -er '[.jobs[] | select(.name == "publish-homebrew-full / prepare-candidate")] | select(length == 1) | .[0].id' failed-recovery-v2-jobs.json)"
                gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_recovery_v2_job_id/logs" > failed-recovery-v2.log
                grep -F 'append_full deadline must be exactly 120 minutes after operation start.' failed-recovery-v2.log >/dev/null
              fi
            fi
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-homebrew-full-follower.yml/runs?event=workflow_dispatch&per_page=100" \
              > recovery-runs.json
            jq -e --arg run "$GITHUB_RUN_ID" --arg title "$recovery_title" '
              [.[]?.workflow_runs[]? | select(.display_title == $title)] as $matches
              | ($matches | length) == 1
              and (($matches[0].id | tostring) == $run)
              and $matches[0].run_attempt == 1
            ' recovery-runs.json >/dev/null
          else
            test "$TRIGGER_EVENT" = workflow_run
            test -z "$FAILED_FOLLOWER_RUN_ID$FAILED_RECOVERY_RUN_ID$FAILED_RECOVERY_V2_RUN_ID$RECOVERY_CONFIRMATION"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUTHORITY_RUN_ID" > authority-run.json
          jq -e --arg run "$AUTHORITY_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and (.display_title | test("^OPL Stable append_full source:[1-9][0-9]* run:[1-9][0-9]*$"))
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' authority-run.json >/dev/null
          artifact="opl-release-full-published-${AUTHORITY_RUN_ID}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$AUTHORITY_RUN_ID/artifacts?per_page=100" > artifacts.json
          count="$(jq -r --arg name "$artifact" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length' artifacts.json)"
          if [ "$count" = 0 ]; then
            echo "artifact_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$count" = 1
          {
            echo "artifact_found=true"
            echo "artifact=$artifact"
            echo "authority_run_id=$AUTHORITY_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact Full publication handoff
        if: ${{ steps.authority.outputs.artifact_found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.authority.outputs.artifact }}
          run-id: ${{ steps.authority.outputs.authority_run_id }}
          github-token: ${{ github.token }}
          path: full-publication

      - name: Bind same-tag Homebrew Full handoff
        id: handoff
        if: ${{ always() && steps.authority.outcome == 'success' }}
        env:
          AUTHORITY_RUN_ID: ${{ steps.authority.outputs.authority_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.authority.outputs.artifact_found }}' != true ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          handoffs=()
          while IFS= read -r handoff; do handoffs+=("$handoff"); done < <(
            find full-publication -type f -name homebrew-full-handoff.json -print | LC_ALL=C sort
          )
          test "${#handoffs[@]}" -eq 1
          handoff="${handoffs[0]}"
          head_sha="$(jq -er .head_sha authority-run.json)"
          head_branch="$(jq -er .head_branch authority-run.json)"
          jq -e --arg run "$AUTHORITY_RUN_ID" --arg head "$head_sha" '
            def opl_fromdateiso8601:
              if type == "string"
                and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([.][0-9]+)?Z$")
              then sub("[.][0-9]+Z$"; "Z") | fromdateiso8601
              else error("expected UTC ISO-8601 timestamp with optional fractional seconds")
              end;
            .schema == "opl_homebrew_full_follower_handoff.v1"
            and .status == "ready"
            and .operation == "append_full"
            and .authority == {repository:"gaofeng21cn/one-person-lab-app",workflow:".github/workflows/release-stable.yml",run_id:$run,run_attempt:1,executor_head_sha:$head}
            and (.operation_control.operation_id | test("^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"))
            and ((.operation_control.operation_started_at | opl_fromdateiso8601) > 0)
            and ((.operation_control.operation_deadline_at | opl_fromdateiso8601) > (.operation_control.operation_started_at | opl_fromdateiso8601))
            and (.source.run_id | test("^[1-9][0-9]*$"))
            and (.source.checkpoint_artifact | test("^[A-Za-z0-9][A-Za-z0-9._-]+$"))
            and .source.checkpoint_transport_executor == "github_actions"
            and (.source.transport_run_id | test("^[1-9][0-9]*$"))
            and .source.completed_stage == "full_qualified"
            and (.source.qualification_receipt_sha256 | test("^sha256:[0-9a-f]{64}$"))
            and (.release.version | test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
            and (.release.standard_tag | test("^v[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
            and (.release.target_standard.release_id | type == "number")
            and (.release.target_standard.tag | test("^v[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
            and (.release.target_standard.target_commitish | test("^[0-9a-f]{40}$"))
            and .release.standard_tag == .release.target_standard.tag
            and .release.target_standard.immutable == false
            and .release.target_standard.full_asset_append_allowed == true
            and .release.target_standard.standard_asset_overwrite_or_delete_allowed == false
            and .release.standard_attestation.name == "opl-release-attestation.json"
            and (.release.standard_attestation.sha256 | test("^sha256:[0-9a-f]{64}$"))
            and .build_provenance.admission_role == "observational_only"
            and .build_provenance.may_gate_install_or_runtime == false
            and (.build_provenance.bundle_digest | test("^sha256:[0-9a-f]{64}$"))
            and (.build_provenance.app_sha | test("^[0-9a-f]{40}$"))
            and (.build_provenance.shell_sha | test("^[0-9a-f]{40}$"))
            and (.build_provenance.framework_sha | test("^[0-9a-f]{40}$"))
            and (.artifact.sha256 | test("^sha256:[0-9a-f]{64}$"))
            and (.manifest.sha256 | test("^sha256:[0-9a-f]{64}$"))
            and .github_full_publication.status == "complete"
            and .homebrew_modified == false
            and .latest_modified == false
          ' "$handoff" >/dev/null
          test "$head_branch" = main
          standard_tag="$(jq -er .release.standard_tag "$handoff")"
          test "$standard_tag" = "$(jq -er .release.target_standard.tag "$handoff")"
          handoff_sha="sha256:$(shasum -a 256 "$handoff" | awk '{print $1}')"
          handoff_base64="$(base64 < "$handoff" | tr -d '\n')"
          {
            echo "eligible=true"
            echo "handoff_sha256=$handoff_sha"
            echo "handoff_base64=$handoff_base64"
          } >> "$GITHUB_OUTPUT"

  publish-homebrew-full:
    if: ${{ needs.resolve-handoff.outputs.eligible == 'true' }}
    needs: [resolve-handoff]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_release-homebrew-full-publish.yml
    with:
      mode: execute
      authority_run_id: ${{ needs.resolve-handoff.outputs.authority_run_id }}
      handoff_base64: ${{ needs.resolve-handoff.outputs.handoff_base64 }}
      handoff_sha256: ${{ needs.resolve-handoff.outputs.handoff_sha256 }}
    secrets: inherit
