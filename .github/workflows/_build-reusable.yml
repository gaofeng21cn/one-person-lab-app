name: Build Pipeline (Reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup.
        type: string
        default: execute
      matrix:
        description: 'Build matrix JSON emitted by an audited source resolver or another trusted reusable caller'
        type: string
        required: true
      release_validation_profile:
        description: 'Audited App release validation ownership profile'
        type: string
        default: aggregate
      ref:
        description: 'Git ref to checkout (leave empty to use the triggering commit)'
        type: string
        default: ''
      shell_ref:
        description: 'opl-aion-shell ref to checkout for the active shell. Empty means main.'
        type: string
        default: main
      framework_ref:
        description: 'Immutable OPL Framework ref bound into release artifact cohort evidence.'
        type: string
        default: ''
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        type: boolean
        default: false
      append_commit_hash:
        description: 'Append short commit hash to artifact names'
        type: boolean
        default: false
      upload_installers_only:
        description: 'Only upload primary installers (dmg/exe/msi/deb), skip zip/yml/blockmap'
        type: boolean
        default: false
      require_windows_updater_assets:
        description: 'Require exact Windows x64 latest.yml and EXE blockmap assets for Stable optional publication'
        type: boolean
        default: false
      require_windows_authenticode:
        description: 'Fail Windows x64 Stable optional builds unless the exact EXE has a valid timestamped Authenticode signature'
        type: boolean
        default: false
      opl_release_version:
        description: 'Display release version used by tags, asset names, and renderer copy'
        type: string
        default: ''
      opl_updater_version:
        description: 'Monotonic machine SemVer used by app.getVersion, CFBundle, and updater metadata'
        type: string
        default: ''
      require_macos_gatekeeper:
        description: 'Fail macOS release builds unless the packaged app passes codesign and Gatekeeper assessment'
        type: boolean
        default: false
      release_bundle_digest:
        description: Exact immutable Framework Bundle digest for the live release path.
        type: string
        default: ''
      release_cohort_ref:
        description: Stable release cohort sha256 identity; empty for non-release builds.
        type: string
        default: ''
      operation:
        description: Release operation inherited from the outer Bundle controller.
        type: string
        default: ''
      operation_started_at:
        description: Immutable outer operation start timestamp.
        type: string
        default: ''
      operation_deadline_at:
        description: Immutable outer operation deadline; never recomputed here.
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  AIONUI_HUB_TAG: 'dist-ebc6a2b'

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove reusable build validation-only topology starts
        run: |
          test '${{ inputs.release_bundle_digest }}' = sha256:canary
          test '${{ inputs.operation }}' = standard
          test '${{ inputs.framework_ref }}' = ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc

  resolve-active-shell-ref:
    name: Resolve immutable active Shell ref
    if: ${{ inputs.mode != 'canary' }}
    runs-on: ubuntu-latest
    outputs:
      shell_sha: ${{ steps.resolve.outputs.shell_sha }}
    steps:
      - name: Checkout requested active shell ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref || 'main' }}
          path: shells/aionui
          fetch-depth: 1

      - name: Export immutable active Shell SHA
        id: resolve
        shell: bash
        working-directory: shells/aionui
        run: |
          set -euo pipefail
          shell_sha="$(git rev-parse HEAD)"
          [[ "$shell_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "shell_sha=$shell_sha" >> "$GITHUB_OUTPUT"

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    if: ${{ inputs.mode != 'canary' && !inputs.skip_code_quality }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: false

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint -color -shellcheck= -pyflakes=

  lint-format:
    name: Lint and format
    runs-on: ubuntu-latest
    needs: [resolve-active-shell-ref]
    if: ${{ inputs.mode != 'canary' && !inputs.skip_code_quality }}
    defaults:
      run:
        working-directory: shells/aionui

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup active shell dependencies
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    needs: [resolve-active-shell-ref]
    if: ${{ inputs.mode != 'canary' && !inputs.skip_code_quality }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install App root typecheck dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type check (App root)
        run: npm run typecheck

      - name: Setup active shell dependencies
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}

      - name: TypeScript type check (AionUI shell)
        working-directory: shells/aionui
        run: bunx tsc --noEmit

  release-boundary:
    name: App release-boundary tests
    runs-on: ubuntu-latest
    needs: [resolve-active-shell-ref]
    if: ${{ inputs.mode != 'canary' && !inputs.skip_code_quality }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup active shell
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}
          install-dependencies: 'true'

      - name: Install App root validation dependencies
        run: npm ci --ignore-scripts

      - name: Run audited release-boundary profile
        env:
          OPL_RELEASE_VALIDATION_PROFILE: ${{ inputs.release_validation_profile }}
          OPL_RELEASE_SKIP_MODEL_POLICY_CHECK: 'true'
        run: scripts/verify.sh release-boundary

  active-shell-tests:
    name: Active shell tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [resolve-active-shell-ref]
    if: ${{ inputs.mode != 'canary' && !inputs.skip_code_quality }}

    strategy:
      fail-fast: false
      matrix:
        project:
          - node
          - dom

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup active shell dependencies
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}
          fetch-depth: '0'

      - name: Run active shell test project
        working-directory: .
        run: node --experimental-strip-types scripts/run-active-shell-tests.ts --project ${{ matrix.project }} --chunk-size 8 --max-workers 2

  prepare-windows-linux-runtime:
    name: Prepare Windows Linux runtime
    runs-on: ubuntu-latest
    needs: [resolve-active-shell-ref]
    if: ${{ inputs.mode != 'canary' && contains(inputs.matrix, 'windows') }}

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout active shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}
          path: shells/aionui

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Bind Windows Framework manifest for prepared runtime
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node --experimental-strip-types scripts/bind-windows-framework-manifest.ts \
            --manifest shells/aionui/resources/opl-linux/product.json \
            --framework-ref "${{ inputs.framework_ref }}"

      - name: Prepare target-executed Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('node:path');
          const {
            prepareAioncore,
          } = require('./shells/aionui/packages/shared-scripts/src/prepare-aioncore.js');
          const {
            resolveAioncoreVersion,
          } = require('./shells/aionui/scripts/resolveAioncoreVersion.js');

          const projectRoot = path.resolve('shells/aionui');
          prepareAioncore({
            projectRoot,
            platform: 'linux',
            arch: 'x64',
            version: resolveAioncoreVersion(projectRoot),
            materializeInternalSymlinksForWindows: true,
          });
          NODE

      - name: Upload target-executed Linux runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-windows-linux-runtime-${{ github.run_id }}
          path: shells/aionui/resources/bundled-aioncore/linux-x64
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  macos-signing-preflight:
    name: macOS release signing preflight
    runs-on: macos-latest
    timeout-minutes: 10
    if: ${{ inputs.mode != 'canary' }}
    environment: ${{ inputs.require_macos_gatekeeper && 'release-stable' || null }}

    steps:
      - name: Record local authorization mode
        if: ${{ !inputs.require_macos_gatekeeper }}
        shell: bash
        run: |
          echo "Gatekeeper-required signing is disabled for this caller."
          echo "This preflight job succeeds intentionally so reusable workflow callers can continue when the build job produces the local authorization evidence."

      - name: Checkout exact credential preflight source
        if: ${{ inputs.require_macos_gatekeeper }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js for credential preflight
        if: ${{ inputs.require_macos_gatekeeper }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Import Developer ID identity and authenticate notarization
        if: ${{ inputs.require_macos_gatekeeper }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts \
            --output "$RUNNER_TEMP/apple-release-credentials-preflight.json"

      - name: Upload sanitized Apple credential preflight receipt
        if: ${{ inputs.require_macos_gatekeeper }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-apple-release-credentials-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/apple-release-credentials-preflight.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    environment: ${{ inputs.require_macos_gatekeeper && startsWith(matrix.platform, 'macos') && 'release-stable' || null }}
    needs:
      - workflow-lint
      - lint-format
      - typecheck
      - release-boundary
      - active-shell-tests
      - prepare-windows-linux-runtime
      - macos-signing-preflight
      - resolve-active-shell-ref
    if: ${{ always() && inputs.mode != 'canary' && needs['resolve-active-shell-ref'].result == 'success' && (needs['prepare-windows-linux-runtime'].result == 'success' || needs['prepare-windows-linux-runtime'].result == 'skipped') && (needs['macos-signing-preflight'].result == 'success' || needs['macos-signing-preflight'].result == 'skipped') && (inputs.skip_code_quality || (needs['workflow-lint'].result == 'success' && needs['lint-format'].result == 'success' && needs.typecheck.result == 'success' && needs['release-boundary'].result == 'success' && needs['active-shell-tests'].result == 'success')) }}
    defaults:
      run:
        working-directory: shells/aionui

    outputs:
      commit-short: ${{ steps.commit.outputs.short }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Admit one-shot release-bound build
        if: ${{ inputs.operation != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p release-admission
          touch release-admission/stdout.txt release-admission/stderr.txt
          exec > >(tee -a release-admission/stdout.txt) 2> >(tee -a release-admission/stderr.txt >&2)
          printf '%s\0' '${{ inputs.operation }}' '${{ inputs.operation_started_at }}' '${{ inputs.operation_deadline_at }}' \
            '${{ inputs.release_bundle_digest }}' '${{ inputs.ref }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}' \
            | shasum -a 256 | awk '{print "sha256:"$1}' > release-admission/input-digest.txt
          input_digest="$(cat release-admission/input-digest.txt)"
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          node <<'NODE' || { status=failed; reason=deadline_elapsed; }
          const started = Date.parse('${{ inputs.operation_started_at }}');
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          if [ "$status" = passed ] && [ '${{ inputs.operation }}' != standard ]; then status=failed; reason=operation_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]; then status=failed; reason=bundle_digest_invalid; fi
          if [ "$status" = passed ] && [ '${{ inputs.release_bundle_digest }}' = sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 ]; then status=failed; reason=bundle_permanently_rejected; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=app_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=shell_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=framework_sha_invalid; fi
          jq -n --arg status "$status" --arg reason "$reason" --arg operation '${{ inputs.operation }}' --arg input_digest "$input_digest" \
            '{schema:"opl_release_nested_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,input_digest:$input_digest,evidence:{stdout:"stdout.txt",stderr:"stderr.txt"},run_id:env.GITHUB_RUN_ID,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > release-admission/build-admission.json
          test "$status" = passed

      - name: Upload release-bound build admission
        if: ${{ always() && inputs.operation != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-build-admission-${{ matrix.platform }}-${{ github.run_id }}
          path: release-admission
          if-no-files-found: error
          retention-days: 30

      - name: Validate immutable release-bound build refs
        if: ${{ inputs.operation != '' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::release_bundle_digest must be exact."; exit 1; }
          test '${{ inputs.release_bundle_digest }}' != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 || { echo "::error::release_bundle_digest is permanently rejected."; exit 1; }
          test '${{ inputs.release_cohort_ref }}' = '${{ inputs.release_bundle_digest }}' || { echo "::error::release_cohort_ref must equal the Bundle digest."; exit 1; }
          [[ '${{ inputs.ref }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release-bound ref must be the exact frozen App SHA."; exit 1; }
          [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release-bound shell_ref must be the exact frozen Shell SHA."; exit 1; }
          [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release-bound framework_ref must be the exact frozen Framework SHA."; exit 1; }

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Checkout active shell
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.resolve-active-shell-ref.outputs.shell_sha }}
          path: shells/aionui

      - name: Download target-executed Linux runtime
        if: startsWith(matrix.platform, 'windows')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-windows-linux-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/opl-windows-linux-runtime

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT
          echo "Commit: $SHORT"

      - name: Resolve OPL release version
        id: opl-release-version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.opl_release_version }}
          INPUT_UPDATER_VERSION: ${{ inputs.opl_updater_version }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SESSION_ID: ${{ inputs.release_bundle_digest }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION}"
          if [ -z "$version" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            version="$(date -u +'%y.%-m.%-d')"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid OPL release version: $version"
            exit 1
          fi
          updater_version="$INPUT_UPDATER_VERSION"
          if [ -n "$RELEASE_SESSION_ID" ] && [ -z "$updater_version" ]; then
            echo "::error::Release-bound builds require the frozen opl_updater_version."
            exit 1
          fi
          if [ -z "$updater_version" ]; then
            updater_version="$version"
          fi
          if ! [[ "$updater_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid OPL updater version: $updater_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OPL_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPL_UPDATER_VERSION=$updater_version" >> "$GITHUB_ENV"
          echo "OPL display release version: $version"
          echo "OPL updater machine version: $updater_version"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Restore Electron/Electron-Builder caches before any build-related install
      - name: Restore Electron artifacts cache
        id: electron-cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Restore Bun install cache
        id: bun-cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-${{ runner.arch }}-
            bun-install-${{ runner.os }}-

      - name: Cache status
        run: |
          echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"
          echo "bun-cache-hit=${{ steps.bun-cache.outputs.cache-hit }}"

      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --cwd shells/aionui --frozen-lockfile

      - name: Install App release tooling dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Prepare standard App payload
        working-directory: ${{ github.workspace }}
        env:
          OPL_STANDARD_PAYLOAD_FRAMEWORK_REF: ${{ inputs.framework_ref }}
          OPL_STANDARD_PAYLOAD_RELEASE_BOUND: ${{ inputs.operation != '' && 'true' || 'false' }}
        run: node --experimental-strip-types scripts/prepare-standard-release-payload.ts

      - name: Bind Windows Framework manifest
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node --experimental-strip-types scripts/bind-windows-framework-manifest.ts \
            --manifest shells/aionui/resources/opl-linux/product.json \
            --framework-ref "${{ inputs.framework_ref }}"

      - name: Validate synced App product profile consumer
        working-directory: shells/aionui
        run: bunx vitest run tests/unit/common-config/oplProductProfile.test.ts

      - name: Setup Windows native dependencies (Windows only)
        if: startsWith(matrix.platform, 'windows')
        run: bun install --global node-gyp

      - name: Install MSVC ARM64 toolchain (Windows ARM64 only)
        if: matrix.platform == 'windows-arm64'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: pwsh
          command: |
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: Setup Windows build environment (Windows only)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          Write-Host "Setting Windows SDK version for ConPty support"
          "WindowsTargetPlatformVersion=10.0.19041.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup MSBuild (Windows only)
        if: startsWith(matrix.platform, 'windows')
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        if: "!startsWith(matrix.platform, 'windows')"
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Print build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Native Build Architecture: ${{ matrix.native_arch || matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ inputs.ref || '(default)' }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      # macOS code signing certificate installation
      - name: Setup macOS code signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing code signing certificate..."

            # Create certificate file
            echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12

            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security default-keychain -d user -s build.keychain
            security list-keychains -d user -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

            # Import certificate
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

            # Clean up certificate file
            rm certificate.p12

            echo "Certificate imported successfully"
          else
            echo "No certificate provided - building unsigned application"
            echo "To enable code signing, add BUILD_CERTIFICATE_BASE64 and P12_PASSWORD secrets"
          fi

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Rebuild native modules for Electron (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = "${{ matrix.native_arch || matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()
          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"

          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          $bunPath = (Get-Command bun -CommandType Application).Source
          $prebuild = Start-Process -FilePath $bunPath -ArgumentList @(
            'x',
            '--yes',
            'prebuild-install',
            '--runtime=electron',
            "--target=$electronVer",
            '--platform=win32',
            "--arch=$arch",
            '--force'
          ) -NoNewWindow -Wait -PassThru
          $prebuildFailed = $prebuild.ExitCode -ne 0
          if ($prebuildFailed) {
            Write-Warning "No matching better-sqlite3 prebuild was available; falling back to electron-rebuild."
          }
          $needsElectronRebuild = $prebuildFailed -or -not (Test-Path $sqliteNode)
          if ($needsElectronRebuild) {
            Remove-Item $sqliteNode -Force -ErrorAction SilentlyContinue
            bunx --yes @electron/rebuild@4.2.0 -f -w better-sqlite3
            if ($LASTEXITCODE -ne 0) {
              Write-Error "electron-rebuild failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
          }
          if (-not (Test-Path $sqliteNode)) {
            Write-Error "better-sqlite3 native module not found at: $sqliteNode"
            exit 1
          }
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_target_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Build with electron-builder (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          if ($env:OPL_REQUIRE_WINDOWS_UPDATER_ASSETS -eq 'true') {
            if ('${{ matrix.platform }}' -ne 'windows-x64') {
              throw 'Windows updater assets are supported only for windows-x64.'
            }
            $Command += ' --config.nsis.differentialPackage=true'
          }
          iex $Command
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          OPL_REQUIRE_WINDOWS_UPDATER_ASSETS: ${{ inputs.require_windows_updater_assets }}
          AIONUI_PREPARED_AIONCORE_RUNTIME_DIR: ${{ runner.temp }}/opl-windows-linux-runtime
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_target_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Validate exact Windows updater asset set
        if: matrix.platform == 'windows-x64' && inputs.require_windows_updater_assets
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/validate-windows-updater-assets.ts \
            --artifact-dir shells/aionui/out \
            --release-version "$OPL_RELEASE_VERSION" \
            --updater-version "$OPL_UPDATER_VERSION" \
            --output shells/aionui/out/opl-windows-updater-assets.json

      - name: Verify timestamped Windows Authenticode signature
        if: matrix.platform == 'windows-x64' && inputs.require_windows_authenticode
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.require_windows_updater_assets }}' -ne 'true') {
            throw 'Windows Authenticode verification requires the exact updater asset gate.'
          }
          $installerName = "One-Person-Lab-$env:OPL_RELEASE_VERSION-win-x64.exe"
          $installers = @(Get-ChildItem -LiteralPath 'shells/aionui/out' -Filter $installerName -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer named $installerName."
          }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Stable optional Windows installer must have a valid Authenticode signature; observed $($signature.Status)."
          }
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'Stable optional Windows installer must have a trusted timestamp countersignature.'
          }
          $sha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $receipt = [ordered]@{
            schema = 'opl_windows_authenticode_receipt.v1'
            status = 'passed'
            platform = 'windows-x64'
            installer = [ordered]@{
              name = $installer.Name
              size_bytes = $installer.Length
              sha256 = "sha256:$sha256"
            }
            signature = [ordered]@{
              status = [string]$signature.Status
              signature_type = [string]$signature.SignatureType
              signer_subject = $signature.SignerCertificate.Subject
              signer_thumbprint = $signature.SignerCertificate.Thumbprint.ToLowerInvariant()
              signer_not_before = $signature.SignerCertificate.NotBefore.ToUniversalTime().ToString('o')
              signer_not_after = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
              timestamp_verified = $true
              timestamper_subject = $signature.TimeStamperCertificate.Subject
              timestamper_thumbprint = $signature.TimeStamperCertificate.Thumbprint.ToLowerInvariant()
            }
            verification_tool = 'Get-AuthenticodeSignature'
          }
          $json = ($receipt | ConvertTo-Json -Depth 6) + "`n"
          $output = Join-Path $installer.DirectoryName 'opl-windows-authenticode-receipt.json'
          [System.IO.File]::WriteAllText($output, $json, [System.Text.UTF8Encoding]::new($false))

      - name: Bind packaged Windows Framework manifest
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          node --experimental-strip-types scripts/bind-windows-framework-manifest.ts \
            --manifest shells/aionui/out/win-unpacked/resources/opl-linux/product.json \
            --framework-ref "${{ inputs.framework_ref }}"

      # Clean up any stale disk images before DMG creation (macOS only)
      # 清理可能残留的磁盘镜像，避免 hdiutil "Device not configured" 错误
      - name: Clean up stale disk images (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Cleaning up any stale disk images..."
          # Detach any mounted disk images
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "Detaching $disk..."
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          # Clean up any temporary DMG files
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "Cleanup complete"

      - name: Recalculate immutable operation budget before release build
        id: release_build_budget
        if: ${{ inputs.operation != '' && startsWith(matrix.platform, 'macos') }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-operation-deadline.ts check \
            --operation '${{ inputs.operation }}' \
            --started-at '${{ inputs.operation_started_at }}' \
            --deadline-at '${{ inputs.operation_deadline_at }}'
          timeout_ms="$(DEADLINE='${{ inputs.operation_deadline_at }}' node --input-type=module -e '
            const deadlineMs = Date.parse(process.env.DEADLINE || "");
            const evidenceReserveMs = 5 * 60_000;
            const remainingMs = deadlineMs - Date.now() - evidenceReserveMs;
            if (!Number.isFinite(deadlineMs) || remainingMs < 1_000) process.exit(78);
            process.stdout.write(String(remainingMs));
          ')" || {
            echo "::error::operation_deadline_elapsed: Standard build cannot start without five minutes reserved for durable evidence."
            exit 78
          }
          echo "timeout_ms=$timeout_ms" >> "$GITHUB_OUTPUT"

      # macOS: Build with notarization. Release callers can require Gatekeeper.
      # macOS: 构建并公证；发布调用方可要求 Gatekeeper 通过。
      - name: Build with electron-builder (macOS)
        if: startsWith(matrix.platform, 'macos')
        id: macos-build
        shell: bash
        run: |
          set +e  # Handle errors manually

          # The release-bound build process is killed from the same immutable
          # operation clock. Non-release callers retain the ordinary command.
          if [ -n '${{ inputs.operation }}' ]; then
            RELEASE_BUILD_TIMEOUT_MS='${{ steps.release_build_budget.outputs.timeout_ms }}' \
              RELEASE_BUILD_COMMAND="$RELEASE_BUILD_COMMAND" \
              node --input-type=module <<'NODE' 2>&1 | tee "${RUNNER_TEMP}/build.log"
          import { spawn } from 'node:child_process';
          const timeoutMs = Number(process.env.RELEASE_BUILD_TIMEOUT_MS);
          const command = process.env.RELEASE_BUILD_COMMAND || '';
          if (!Number.isFinite(timeoutMs) || timeoutMs < 1_000 || !command) process.exit(78);
          let deadlineElapsed = false;
          const child = spawn('/bin/bash', ['-lc', command], {
            detached: true,
            env: process.env,
            stdio: 'inherit',
          });
          const killGroup = (signal) => {
            try { process.kill(-child.pid, signal); } catch {}
          };
          const timer = setTimeout(() => {
            deadlineElapsed = true;
            killGroup('SIGTERM');
            setTimeout(() => killGroup('SIGKILL'), 10_000).unref();
          }, timeoutMs);
          child.once('error', (error) => {
            clearTimeout(timer);
            console.error(error);
            process.exit(1);
          });
          child.once('exit', (code, signal) => {
            clearTimeout(timer);
            if (deadlineElapsed) {
              console.error('operation_deadline_elapsed: electron-builder exhausted its immutable operation budget.');
              process.exit(78);
            }
            if (signal) process.exit(1);
            process.exit(code ?? 1);
          });
          NODE
          else
            /bin/bash -lc "$RELEASE_BUILD_COMMAND" 2>&1 | tee "${RUNNER_TEMP}/build.log"
          fi
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT_CODE" -eq 78 ]; then
            echo "::error::operation_deadline_elapsed: release build output is not admissible."
            exit 78
          fi

          # Check if DMG was created (most important artifact)
          DMG_EXISTS=false
          if ls out/*.dmg 1>/dev/null 2>&1; then
            DMG_EXISTS=true
            echo "✅ DMG created successfully"
          fi

          # If build succeeded completely
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build completed successfully"
            echo "notarization_status=success" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build failed - check if it's just notarization failure
          if [ "$DMG_EXISTS" = true ]; then
            # DMG exists but build failed - likely notarization issue
            if grep -qiE "notariz|staple" "${RUNNER_TEMP}/build.log"; then
              echo "notarization_status=failed" >> $GITHUB_OUTPUT
              if [ "${OPL_REQUIRE_MACOS_GATEKEEPER:-false}" = "true" ]; then
                echo "::error title=Notarization Failed::Release macOS assets must pass notarization and Gatekeeper before upload."
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "## Notarization Failure" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "Release macOS assets require notarization and Gatekeeper acceptance before upload." >> $GITHUB_STEP_SUMMARY
                exit $BUILD_EXIT_CODE
              fi
              echo "::warning title=Notarization Failed::DMG was created, but notarization failed. This non-release caller did not require Gatekeeper."
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "## Notarization Warning" >> $GITHUB_STEP_SUMMARY
              echo "DMG was created, but notarization failed. This caller did not require Gatekeeper." >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
          fi

          # DMG doesn't exist or other fatal error - fail CI
          echo "❌ Build failed - DMG was not created"
          echo "notarization_status=build_failed" >> $GITHUB_OUTPUT
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          RELEASE_BUILD_COMMAND: ${{ matrix.command }}
          npm_config_arch: ${{ matrix.native_arch || matrix.arch }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.native_arch || matrix.arch }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPL_REQUIRE_MACOS_GATEKEEPER: ${{ inputs.require_macos_gatekeeper }}

      - name: Verify signed macOS App before distributable finalization
        if: startsWith(matrix.platform, 'macos') && inputs.require_macos_gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          app_paths=()
          while IFS= read -r candidate; do app_paths+=("$candidate"); done < <(
            find out -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          if [ "${#app_paths[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaged One Person Lab.app bundle under shells/aionui/out; found ${#app_paths[@]}."
            exit 1
          fi
          app_path="${app_paths[0]}"
          test -d "$app_path" && test ! -L "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Write macOS Stable local authorization policy
        if: startsWith(matrix.platform, 'macos') && !inputs.require_macos_gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          app_paths=()
          while IFS= read -r candidate; do app_paths+=("$candidate"); done < <(
            find out -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          if [ "${#app_paths[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one packaged One Person Lab.app bundle under shells/aionui/out; found ${#app_paths[@]}."
            exit 1
          fi
          app_path="${app_paths[0]}"
          test -d "$app_path" && test ! -L "$app_path"
          node --experimental-strip-types ../../scripts/local-authorization-policy.ts \
            --package-kind app_standard \
            --app-path "$app_path" \
            --output out/standard-local-authorization-policy.json

      - name: Ensure macOS standard updater ZIP distributable
        if: startsWith(matrix.platform, 'macos') && !inputs.upload_installers_only
        shell: bash
        run: |
          set -euo pipefail
          target_arch="${{ matrix.native_arch || matrix.arch }}"
          expected_zip="One-Person-Lab-${OPL_RELEASE_VERSION}-mac-${target_arch}.zip"
          expected_zip_blockmap="${expected_zip}.blockmap"

          if [ -f "out/${expected_zip}" ] && [ -f "out/${expected_zip_blockmap}" ]; then
            echo "Standard updater ZIP already present: out/${expected_zip}"
            exit 0
          fi

          app_paths=()
          while IFS= read -r candidate; do app_paths+=("$candidate"); done < <(
            find out -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          if [ "${#app_paths[@]}" -ne 1 ]; then
            echo "::error::Cannot build the Standard updater ZIP without exactly one packaged One Person Lab.app bundle; found ${#app_paths[@]}."
            exit 1
          fi
          app_path="${app_paths[0]}"
          test -d "$app_path" && test ! -L "$app_path"

          echo "::warning title=Missing standard updater ZIP::${expected_zip} was not produced by the primary macOS build; rebuilding macOS dmg+zip updater targets from ${app_path}."
          bunx electron-builder \
            --config packages/desktop/electron-builder.yml \
            --mac dmg zip \
            "--${target_arch}" \
            --prepackaged "$app_path" \
            --publish=never \
            --config.extraMetadata.version="$OPL_UPDATER_VERSION"

          if [ ! -f "out/${expected_zip}" ]; then
            echo "::error::Missing standard updater ZIP after prepackaged rebuild: out/${expected_zip}"
            exit 1
          fi
          if [ ! -f "out/${expected_zip_blockmap}" ]; then
            echo "::error::Missing standard updater ZIP blockmap after prepackaged rebuild: out/${expected_zip_blockmap}"
            exit 1
          fi
          for metadata in out/latest-mac.yml "out/latest-${target_arch}-mac.yml"; do
            if [ -f "$metadata" ] && ! grep -q "$expected_zip" "$metadata"; then
              echo "::error::${metadata} does not reference ${expected_zip}"
              exit 1
            fi
          done
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_target_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          CI: true

      - name: Finalize Standard Developer ID signing and notarization
        if: startsWith(matrix.platform, 'macos') && inputs.require_macos_gatekeeper
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          OPL_RUNTIME_CODESIGN_IDENTITY: ${{ secrets.IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          set -euo pipefail
          target_arch="${{ matrix.native_arch || matrix.arch }}"
          dmg_path="shells/aionui/out/One-Person-Lab-${OPL_RELEASE_VERSION}-mac-${target_arch}.dmg"
          test -f "$dmg_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -d user -s build.keychain
          security list-keychains -d user -s build.keychain
          security find-identity -v -p codesigning build.keychain | grep -F "$OPL_RUNTIME_CODESIGN_IDENTITY" >/dev/null || {
            echo "::error::Configured Developer ID identity is not available in build.keychain."
            exit 1
          }
          node --experimental-strip-types scripts/notarize-macos-dmg.ts \
            --dmg "$dmg_path" \
            --output shells/aionui/out/standard-apple-notarization-receipt.json
          node --experimental-strip-types scripts/update-electron-updater-metadata.ts \
            --artifact "$dmg_path" \
            --metadata-dir shells/aionui/out

      - name: Verify Standard final distribution trust
        if: startsWith(matrix.platform, 'macos') && inputs.require_macos_gatekeeper
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          target_arch="${{ matrix.native_arch || matrix.arch }}"
          dmg_path="shells/aionui/out/One-Person-Lab-${OPL_RELEASE_VERSION}-mac-${target_arch}.dmg"
          receipt="shells/aionui/out/standard-apple-notarization-receipt.json"
          test -f "$dmg_path" && test -f "$receipt"
          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          jq -e --arg team_id "$EXPECTED_TEAM_ID" '
            .schema == "opl_apple_notarized_dmg_receipt.v1"
            and .status == "passed"
            and .team_identifier == $team_id
            and .app_signature.hardened_runtime == true
            and .mounted_app_signature.hardened_runtime == true
            and .notarization.status == "Accepted"
            and .stapler_validate_status == "passed"
            and .dmg_spctl_status == "passed"
            and .app_spctl_status == "passed"
          ' "$receipt" >/dev/null
          node - "$receipt" <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const receiptPath = process.argv[2];
          const receipt = JSON.parse(fs.readFileSync(receiptPath, 'utf8'));
          fs.writeFileSync('shells/aionui/out/standard-gatekeeper-launch-policy.json', `${JSON.stringify({
            schema: 'opl_gatekeeper_launch_policy.v1',
            package_kind: 'app_standard',
            distribution_mode: 'developer_id_notarized',
            team_identifier: receipt.team_identifier,
            codesign_status: 'passed',
            spctl_status: 'passed',
            dmg_codesign_status: 'passed',
            dmg_spctl_status: 'passed',
            stapler_validate_status: 'passed',
            notarization_status: receipt.notarization.status,
            notarization_receipt_sha256: crypto.createHash('sha256').update(fs.readFileSync(receiptPath)).digest('hex'),
            local_authorization_required: false,
            quarantine_removal_required: false,
          }, null, 2)}\n`);
          NODE

      - name: Build with electron-builder (Linux)
        if: startsWith(matrix.platform, 'linux')
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 60
          command: cd shells/aionui && ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.native_arch || matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.native_arch || matrix.arch }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify packaged bundled bun assets
        working-directory: ${{ github.workspace }}
        run: bun run validate:opl-package

      - name: Save Electron artifacts cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}

      - name: Save Bun install cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}

      # macOS 钥匙串清理
      - name: Clean up keychain (macOS only)
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain
            echo "Temporary keychain deleted"
          fi

      # macOS 构建失败通知
      # macOS build failure notification
      - name: Notify on macOS build failure
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS Build Failed::Build failed. Check the logs for details."
          echo ""
          echo "❌ macOS Build Failed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Common causes:"
          echo "  • hdiutil/DMG creation failure (Device not configured)"
          echo "  • Code signing issues"
          echo "  • Notarization timeout"
          echo "  • Out of memory (OOM)"
          echo ""
          echo "Check the build logs above for the specific error."
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      - name: Clean up non-installer artifacts
        if: inputs.upload_installers_only && success()
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          if [ '${{ matrix.platform }}' = windows-x64 ] && [ '${{ inputs.require_windows_updater_assets }}' = true ]; then
            rm -f out/*.zip out/builder-debug.yml 2>/dev/null || true
            find out -maxdepth 1 -type f -name '*.yml' ! -name 'latest.yml' -delete
            find out -maxdepth 1 -type f -name '*.blockmap' ! -name "One-Person-Lab-${OPL_RELEASE_VERSION}-win-x64.exe.blockmap" -delete
          else
            rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          fi
          echo "Remaining artifacts:"
          ls -lh out/ || true

      - name: Write build artifact cohort manifest
        if: success() && startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          OPL_BUILD_VERSION: ${{ steps.opl-release-version.outputs.version }}
        run: |
          set -euo pipefail
          dmg_paths=()
          while IFS= read -r candidate; do dmg_paths+=("$candidate"); done < <(
            find out -maxdepth 1 -type f -name '*.dmg' -print | LC_ALL=C sort
          )
          packaged_trees=()
          while IFS= read -r candidate; do packaged_trees+=("$candidate"); done < <(
            find out -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          if [ "${#dmg_paths[@]}" -ne 1 ] || [ "${#packaged_trees[@]}" -ne 1 ]; then
            echo "::error::Build cohort requires exactly one DMG and one packaged App tree; found ${#dmg_paths[@]} and ${#packaged_trees[@]}."
            exit 1
          fi
          dmg_path="${dmg_paths[0]}"
          packaged_tree="${packaged_trees[0]}"
          test -f "$dmg_path" && test ! -L "$dmg_path"
          test -d "$packaged_tree" && test ! -L "$packaged_tree"
          artifact_name="${{ inputs.append_commit_hash && format('{0}-{1}-dmg', matrix.artifact-name, steps.commit.outputs.short) || format('{0}-dmg', matrix.artifact-name) }}"
          node --experimental-strip-types ../../scripts/write-build-artifact-cohort.ts \
            --output out/opl-build-cohort.json \
            --artifact "$dmg_path" \
            --artifact-name "$(basename "$dmg_path")" \
            --packaged-tree "$packaged_tree" \
            --app-profile ../../contracts/app-product-profile.json \
            --gui-contract ../../contracts/app-gui-product-contract.json \
            --smoke-harness scripts/opl-first-run-vm-smoke.mjs \
            --compiled-expectations ../../contracts/app-first-run-compiled-expectations.json \
            --qualification-input-manifest ../../contracts/app-release-qualification-input-manifest.json \
            --app-sha "$(git -C ../.. rev-parse HEAD)" \
            --shell-sha "$(git rev-parse HEAD)" \
            --framework-sha "${{ inputs.framework_ref }}" \
            --version "$OPL_BUILD_VERSION" \
            --kind standard \
            --actions-run-id "$GITHUB_RUN_ID" \
            --actions-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --actions-artifact-name "$artifact_name" \
            --stable-session-id "${{ inputs.release_bundle_digest }}" \
            --release-cohort-ref "${{ inputs.release_cohort_ref }}"

      - name: Upload build artifact cohort manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && startsWith(matrix.platform, 'macos')
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}-dmg-cohort', matrix.artifact-name, steps.commit.outputs.short) || format('{0}-dmg-cohort', matrix.artifact-name) }}
          path: shells/aionui/out/opl-build-cohort.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) || matrix.artifact-name }}
          path: |
            shells/aionui/out/*.exe
            shells/aionui/out/*.msi
            shells/aionui/out/*.dmg
            shells/aionui/out/*.deb
            shells/aionui/out/*.zip
            shells/aionui/out/*.blockmap
            shells/aionui/out/*.yml
            shells/aionui/out/opl-windows-updater-assets.json
            shells/aionui/out/opl-windows-authenticode-receipt.json
            shells/aionui/out/standard-local-authorization-policy.json
            shells/aionui/out/standard-gatekeeper-launch-policy.json
            shells/aionui/out/standard-apple-notarization-receipt.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS DMG-only artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() && startsWith(matrix.platform, 'macos')
        with:
          name: ${{ inputs.append_commit_hash && format('{0}-{1}-dmg', matrix.artifact-name, steps.commit.outputs.short) || format('{0}-dmg', matrix.artifact-name) }}
          path: |
            shells/aionui/out/*.dmg
            shells/aionui/out/opl-build-cohort.json
          if-no-files-found: error
          retention-days: 7

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint-format, typecheck, release-boundary, active-shell-tests, build]
    if: ${{ always() && inputs.mode != 'canary' }}

    steps:
      - name: Write build summary
        env:
          MATRIX: ${{ inputs.matrix }}
        run: |
          PLATFORMS=$(echo "$MATRIX" | jq -r '[.include[].platform] | join(", ")')

          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Ref | \`${{ inputs.ref || '(default)' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ needs.build.outputs.commit-short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | $PLATFORMS |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint / format | ${{ needs['lint-format'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release boundary | ${{ needs['release-boundary'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Active shell tests | ${{ needs['active-shell-tests'].result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
