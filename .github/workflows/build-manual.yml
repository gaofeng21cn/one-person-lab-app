name: '🔨 Manual Build'

permissions:
  contents: read
  actions: read

on:
  workflow_call:
    inputs:
      invocation_mode:
        description: Audited reusable route; only stable_app_build is accepted.
        required: true
        type: string
      platform_policy:
        description: Audited contract policy ID.
        required: true
        type: string
      platform_ids:
        description: Canonical authority-bound JSON array of additional Desktop Stable platform IDs.
        required: true
        type: string
      app_ref:
        description: Exact App SHA from the completed Standard cohort.
        required: true
        type: string
      shell_ref:
        description: Exact Shell SHA from the completed Standard cohort.
        required: true
        type: string
      framework_ref:
        description: Exact Framework SHA from the completed Standard cohort.
        required: true
        type: string
      skip_code_quality:
        description: Skip code quality checks in the nested reusable build pipeline.
        required: false
        type: boolean
        default: false
      opl_release_version:
        description: Exact completed Standard display version.
        required: true
        type: string
      opl_updater_version:
        description: Exact completed Standard machine updater SemVer.
        required: true
        type: string
      source_run_id:
        description: Exact completed Standard source run.
        required: true
        type: string
      source_bundle_digest:
        description: Exact completed Standard Bundle digest for the Stable App release build.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - macos-universal
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      opl_release_version:
        description: 'Release version stamped into package metadata. Empty uses workflow default.'
        required: false
        type: string
        default: ''
      shell_ref:
        description: 'Exact active Shell ref. Use a 40-character SHA for release-bound validation.'
        required: false
        type: string
        default: 'main'
      framework_ref:
        description: 'Exact OPL Framework 40-character SHA bound into Windows package evidence.'
        required: false
        type: string
        default: ''
      app_ref:
        description: 'Exact App source SHA for an existing replacement candidate; empty uses this workflow commit.'
        required: false
        type: string
        default: ''
      verification_app_ref:
        description: 'Exact App verification-only commit for an existing replacement candidate; empty uses this workflow commit.'
        required: false
        type: string
        default: ''
      replacement_include_platforms:
        description: Also build Linux x64 and Windows x64 replacements for the same candidate.
        required: false
        type: boolean
        default: false
      replacement_smoke_harness_ref:
        description: Exact verification-only Shell commit for an unchanged signed Full replacement.
        required: false
        type: string
        default: ''
      replacement_full_only:
        description: Recover Full only; reuse the supplied Standard candidate run without requalifying it.
        required: false
        type: boolean
        default: false
      replacement_include_full:
        description: Build and qualify Full for the same exact replacement cohort; never publishes.
        required: false
        type: boolean
        default: false
      replacement_candidate_run_id:
        description: 'Qualify an existing signed replacement candidate without rebuilding; requires replacement_tag and exact app_ref.'
        required: false
        type: string
        default: ''
      replacement_full_candidate_run_id:
        description: Qualify an existing signed Full replacement and its frozen cohort without rebuilding.
        required: false
        type: string
        default: ''
      replacement_tag:
        description: 'Build a signed macOS arm64 replacement candidate for an existing mutable Stable tag; never publishes. The machine version advances independently.'
        required: false
        type: string
        default: ''
      macos_x64_signed_development_validation:
        description: 'Development validation only: sign/notarize one macOS x64 build from the exact triggering App SHA; never publishes.'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      platform_count: ${{ steps.set-matrix.outputs.platform_count }}
      platform_ids: ${{ steps.set-matrix.outputs.platform_ids }}
      artifact_names: ${{ steps.set-matrix.outputs.artifact_names }}
      artifact_pattern: ${{ steps.set-matrix.outputs.artifact_pattern }}
      app_ref: ${{ steps.set-matrix.outputs.app_ref }}
      validation_profile: ${{ steps.set-matrix.outputs.validation_profile }}
      candidate_version: ${{ steps.replacement.outputs.version }}
      candidate_updater_version: ${{ steps.replacement.outputs.updater_version }}
      full_mas_ref: ${{ steps.replacement.outputs.full_mas_ref }}
      full_mas_scholar_skills_ref: ${{ steps.replacement.outputs.full_mas_scholar_skills_ref }}
      signed_replacement: ${{ steps.replacement.outputs.signed }}
      macos_x64_signed_development_validation: ${{ steps.set-matrix.outputs.macos_x64_signed_development_validation }}

    steps:
      - name: Checkout requested App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_ref || github.sha }}

      - name: Checkout protected release control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          sparse-checkout: |
            contracts/app-release-channel.json
            scripts/resolve-release-platform-matrix.ts
            scripts/resolve-full-replacement-candidate.ts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Resolve same-tag signed replacement candidate
        id: replacement
        if: ${{ inputs.replacement_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACEMENT_TAG: ${{ inputs.replacement_tag }}
          CANDIDATE_PLATFORM: ${{ inputs.platform }}
          CANDIDATE_SHELL: ${{ inputs.shell_ref }}
          CANDIDATE_FRAMEWORK: ${{ inputs.framework_ref }}
          CANDIDATE_RUN: ${{ inputs.replacement_candidate_run_id }}
          CANDIDATE_APP: ${{ inputs.app_ref }}
          CANDIDATE_FULL_RUN: ${{ inputs.replacement_full_candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$CANDIDATE_PLATFORM" = macos-arm64
          [[ "$REPLACEMENT_TAG" =~ ^v[0-9]{2}\.[0-9]{1,2}\.[0-9]{1,2}(-r[0-9]+)?$ ]]
          [[ "$CANDIDATE_SHELL" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_FRAMEWORK" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$CANDIDATE_RUN" ]; then
            [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
            [[ "$CANDIDATE_APP" =~ ^[0-9a-f]{40}$ ]]
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REPLACEMENT_TAG" > replacement-release.json
          jq -e '.draft == false and .prerelease == false and .immutable != true' replacement-release.json >/dev/null
          mkdir replacement-feed
          gh release download "$REPLACEMENT_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest-mac.yml --dir replacement-feed
          if [ -n "$CANDIDATE_RUN" ]; then
            gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --name "opl-first-run-vm-standard-$CANDIDATE_RUN" --dir qualified-candidate
          fi
          if [ -n "$CANDIDATE_FULL_RUN" ]; then
            [[ "$CANDIDATE_FULL_RUN" =~ ^[1-9][0-9]*$ ]]
            test -n "$CANDIDATE_RUN"
            test '${{ inputs.replacement_full_only }}' = true
            test '${{ inputs.replacement_include_full }}' = true
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_FULL_RUN" > full-candidate-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_FULL_RUN/jobs?per_page=100" > full-candidate-jobs.json
            full_name="opl-full-first-install-dmg-${REPLACEMENT_TAG#v}-mac-arm64"
            gh run download "$CANDIDATE_FULL_RUN" --repo "$GITHUB_REPOSITORY" --name "$full_name-cohort" --dir full-candidate-cohort
            gh run download "$CANDIDATE_FULL_RUN" --repo "$GITHUB_REPOSITORY" --name "opl-full-diagnostics-${REPLACEMENT_TAG#v}" --dir full-candidate-diagnostics
            node --experimental-strip-types .release-control/scripts/resolve-full-replacement-candidate.ts \
              --run full-candidate-run.json --jobs full-candidate-jobs.json \
              --cohort full-candidate-cohort/opl-build-cohort.json \
              --diagnostics full-candidate-diagnostics --github-output "$GITHUB_OUTPUT"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const feed = fs.readFileSync('replacement-feed/latest-mac.yml', 'utf8');
          const current = /^version: *["']?(\d+)\.(\d+)\.(\d+)["']? *$/m.exec(feed);
          if (!current) throw new Error('Stable machine version is missing or invalid');
          const qualifiedFile = 'qualified-candidate/tart-smoke-summary.json';
          const qualified = fs.existsSync(qualifiedFile) ? JSON.parse(fs.readFileSync(qualifiedFile, 'utf8')) : null;
          if (qualified && (qualified.schema !== 'opl_studio_stable_clean_vm.v1' || qualified.status !== 'passed')) {
            throw new Error('Replacement recovery requires the passed Standard candidate receipt');
          }
          const frozen = qualified?.artifact?.expected_version;
          if (qualified && !/^\d+\.\d+\.\d+$/.test(frozen ?? '')) throw new Error('Qualified candidate machine version is missing');
          const next = qualified ? Number(frozen.split('.')[2]) : Number(current[3]) + 1;
          if (qualified && (!frozen.startsWith(`${current[1]}.${current[2]}.`)
            || Math.floor(next / 100) !== Math.floor(Number(current[3]) / 100))) {
            throw new Error('Qualified candidate machine version belongs to another release');
          }
          if (!Number.isSafeInteger(next)) throw new Error('Machine version overflow');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `version=${process.env.REPLACEMENT_TAG.slice(1)}\nupdater_version=${current[1]}.${current[2]}.${next}\nsigned=true\n`);
          NODE

      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          macos_x64_signed_development_validation=false
          if [ -n '${{ inputs.invocation_mode }}' ]; then
            test '${{ inputs.invocation_mode }}' = stable_app_build
            test '${{ inputs.platform_policy }}' = stable_desktop_additional
            [[ '${{ inputs.app_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.source_run_id }}' =~ ^[1-9][0-9]*$ ]]
            [[ '${{ inputs.opl_updater_version }}' =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ '${{ inputs.source_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
            jq -e '
              . == ["linux-x64"]
              or . == ["windows-x64"]
              or . == ["linux-x64", "windows-x64"]
            ' <<< '${{ inputs.platform_ids }}' >/dev/null || {
              echo '::error::Stable App release accepts only canonical Linux x64 and Windows x64 Desktop subsets.'
              exit 1
            }
            node --experimental-strip-types .release-control/scripts/resolve-release-platform-matrix.ts \
              --policy stable_desktop_additional \
              --platforms-json '${{ inputs.platform_ids }}' \
              --github-output "$GITHUB_OUTPUT"
            {
              echo 'artifact_pattern=stable-desktop-*'
              echo 'validation_profile=stable'
            } >> "$GITHUB_OUTPUT"
          else
            test '${{ inputs.invocation_mode }}' = ''
            case '${{ inputs.macos_x64_signed_development_validation }}' in
              true)
                test '${{ inputs.platform }}' = macos-x64 || {
                  echo '::error::macos_x64_signed_development_validation accepts only macos-x64.'
                  exit 1
                }
                [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]] || {
                  echo '::error::Signed macOS x64 development validation requires a 40-character Shell SHA.'
                  exit 1
                }
                [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]] || {
                  echo '::error::Signed macOS x64 development validation requires a 40-character Framework SHA.'
                  exit 1
                }
                macos_x64_signed_development_validation=true
                ;;
              false|'') ;;
              *)
                echo '::error::macos_x64_signed_development_validation must be a boolean.'
                exit 1
                ;;
            esac
            if [ '${{ inputs.replacement_tag }}' != '' ] && [ '${{ inputs.replacement_include_platforms }}' = true ]; then
              node --experimental-strip-types .release-control/scripts/resolve-release-platform-matrix.ts \
                --policy manual_all --platforms-json '["macos-arm64","linux-x64","windows-x64"]' \
                --github-output "$GITHUB_OUTPUT"
            else
            node --experimental-strip-types .release-control/scripts/resolve-release-platform-matrix.ts \
              --policy manual_all \
              --platform '${{ inputs.platform }}' \
              --github-output "$GITHUB_OUTPUT"
            fi
            {
              echo 'artifact_pattern=*'
              echo 'validation_profile=${{ inputs.replacement_tag != '' && 'stable' || 'aggregate' }}'
            } >> "$GITHUB_OUTPUT"
          fi
          app_ref="$(git rev-parse HEAD)"
          [[ "$app_ref" =~ ^[0-9a-f]{40}$ ]]
          if [ "$macos_x64_signed_development_validation" = true ]; then
            test "$app_ref" = "$GITHUB_SHA" || {
              echo '::error::Signed macOS x64 development validation checkout is not the triggering github.sha.'
              exit 1
            }
          fi
          echo "app_ref=$app_ref" >> "$GITHUB_OUTPUT"
          echo "macos_x64_signed_development_validation=$macos_x64_signed_development_validation" >> "$GITHUB_OUTPUT"
          rm -rf .release-control

  build-pipeline:
    if: ${{ needs.prepare-matrix.outputs.platform_count != '0' && inputs.replacement_candidate_run_id == '' }}
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      release_validation_profile: ${{ needs.prepare-matrix.outputs.validation_profile }}
      ref: ${{ needs.prepare-matrix.outputs.app_ref }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      append_commit_hash: ${{ inputs.replacement_tag == '' }}
      upload_installers_only: ${{ inputs.replacement_tag == '' }}
      opl_release_version: ${{ needs.prepare-matrix.outputs.candidate_version || inputs.opl_release_version }}
      opl_updater_version: ${{ needs.prepare-matrix.outputs.candidate_updater_version || inputs.opl_updater_version || inputs.opl_release_version }}
      require_windows_updater_assets: ${{ (inputs.invocation_mode == 'stable_app_build' || inputs.replacement_tag != '') && contains(needs.prepare-matrix.outputs.platform_ids, 'windows-x64') }}
      require_windows_authenticode: false
      require_macos_gatekeeper: ${{ needs.prepare-matrix.outputs.signed_replacement == 'true' || needs.prepare-matrix.outputs.macos_x64_signed_development_validation == 'true' }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      cache_role: ${{ inputs.invocation_mode == 'stable_app_build' && 'stable_desktop_additional' || '' }}
      release_bundle_digest: ${{ inputs.invocation_mode == 'stable_app_build' && inputs.source_bundle_digest || '' }}
      release_cohort_ref: ${{ inputs.invocation_mode == 'stable_app_build' && inputs.source_bundle_digest || '' }}
    secrets: inherit


  qualify-replacement:
    name: Qualify the signed same-tag replacement
    needs: [prepare-matrix, build-pipeline]
    if: ${{ always() && inputs.replacement_tag != '' && !inputs.replacement_full_only && needs.prepare-matrix.result == 'success' && (needs.build-pipeline.result == 'success' || inputs.replacement_candidate_run_id != '') }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_artifact_name: macos-build-arm64-dmg
      release_artifact_run_id: ${{ inputs.replacement_candidate_run_id || github.run_id }}
      artifact_app_ref: ${{ needs.prepare-matrix.outputs.app_ref }}
      verification_app_ref: ${{ inputs.verification_app_ref || needs.prepare-matrix.outputs.app_ref }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      package_profile: standard
      diagnostic_scope: release_gate
      require_macos_gatekeeper: true
      expected_updater_version: ${{ needs.prepare-matrix.outputs.candidate_updater_version }}
    secrets: inherit

  build-full-replacement:
    name: Build the same-tag Full replacement
    needs: prepare-matrix
    if: ${{ inputs.replacement_tag != '' && inputs.replacement_include_full && inputs.replacement_full_candidate_run_id == '' }}
    uses: ./.github/workflows/full-first-install-release.yml
    with:
      opl_version: ${{ needs.prepare-matrix.outputs.candidate_version }}
      opl_updater_version: ${{ needs.prepare-matrix.outputs.candidate_updater_version }}
      shell_ref: ${{ inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      artifact_app_sha: ${{ needs.prepare-matrix.outputs.app_ref }}
      upload_full_package_artifact: true
      candidate_only: true
      same_tag_replacement: true
    secrets: inherit

  qualify-full-replacement:
    name: Qualify the signed same-tag Full replacement
    needs: [prepare-matrix, build-full-replacement]
    if: ${{ always() && inputs.replacement_tag != '' && inputs.replacement_include_full && needs.prepare-matrix.result == 'success' && (needs.build-full-replacement.result == 'success' || inputs.replacement_full_candidate_run_id != '') }}
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_artifact_name: opl-full-first-install-dmg-${{ needs.prepare-matrix.outputs.candidate_version }}-mac-arm64
      release_artifact_run_id: ${{ inputs.replacement_full_candidate_run_id || github.run_id }}
      artifact_app_ref: ${{ needs.prepare-matrix.outputs.app_ref }}
      verification_app_ref: ${{ inputs.verification_app_ref || needs.prepare-matrix.outputs.app_ref }}
      shell_ref: ${{ inputs.shell_ref }}
      smoke_harness_ref: ${{ inputs.replacement_smoke_harness_ref || inputs.shell_ref }}
      framework_ref: ${{ inputs.framework_ref }}
      framework_executor_ref: ${{ inputs.framework_ref }}
      package_profile: full
      codex_qualification_cohort_artifact_name: opl-full-first-install-dmg-${{ needs.prepare-matrix.outputs.candidate_version }}-mac-arm64-cohort
      mas_ref: ${{ needs.prepare-matrix.outputs.full_mas_ref || needs.build-full-replacement.outputs.mas_ref }}
      mas_scholar_skills_ref: ${{ needs.prepare-matrix.outputs.full_mas_scholar_skills_ref || needs.build-full-replacement.outputs.mas_scholar_skills_ref }}
      diagnostic_scope: release_gate
      require_macos_gatekeeper: true
      expected_updater_version: ${{ needs.prepare-matrix.outputs.candidate_updater_version }}
    secrets: inherit
