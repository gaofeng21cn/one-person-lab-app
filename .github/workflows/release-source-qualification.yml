name: OPL Stable Source Preflight
run-name: Source preflight ${{ github.sha }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      operation_scope:
        description: Stable same-operation source preflight or standalone diagnostic
        required: false
        default: stable_operation_source_preflight
        type: string
      app_ref:
        description: Exact protected App cohort SHA; empty only for a standalone diagnostic dispatch
        required: false
        default: ''
        type: string
      shell_ref:
        description: Exact protected Shell cohort SHA; empty only for a standalone diagnostic dispatch
        required: false
        default: ''
        type: string
      framework_ref:
        description: Exact protected Framework cohort SHA; empty only for a standalone diagnostic dispatch
        required: false
        default: ''
        type: string
    outputs:
      receipt_digest:
        description: Immutable source preflight receipt digest
        value: ${{ jobs.qualify.outputs.receipt_digest }}
      app_ref:
        description: Preflight App SHA
        value: ${{ jobs.qualify.outputs.app_ref }}
      shell_ref:
        description: Preflight Shell SHA
        value: ${{ jobs.qualify.outputs.shell_ref }}
      framework_ref:
        description: Preflight Framework SHA
        value: ${{ jobs.qualify.outputs.framework_ref }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-stable-source-preflight
  cancel-in-progress: false

jobs:
  resolve-cohort:
    name: Resolve exact public source cohort
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      app_sha: ${{ steps.cohort.outputs.app_sha }}
      app_tree: ${{ steps.cohort.outputs.app_tree }}
      shell_sha: ${{ steps.cohort.outputs.shell_sha }}
      framework_sha: ${{ steps.cohort.outputs.framework_sha }}
    steps:
      - name: Admit one main-only first attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|workflow_call) ;;
            *) echo "::error::Stable source qualification requires workflow_dispatch or the protected Stable caller."; exit 1 ;;
          esac
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_call ]; then
            for ref in '${{ inputs.app_ref }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}'; do
              [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::The protected Stable caller must bind each frozen cohort ref to one exact SHA."
                exit 1
              }
            done
          fi

      - name: Checkout exact App main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref || github.sha }}
          path: app
          fetch-depth: 0

      - name: Resolve exact public Shell and Framework main refs
        id: cohort
        shell: bash
        run: |
          set -euo pipefail
          resolve_main_wire() {
            local repository="$1"
            local remote="https://github.com/${repository}.git"
            local output=""
            local status=0
            local attempt=0
            local sha=""
            for attempt in 1 2 3; do
              set +e
              output="$(git ls-remote --exit-code --heads "$remote" refs/heads/main 2>&1)"
              status=$?
              set -e
              if [ "$status" -eq 0 ]; then
                sha="$(awk '$2 == "refs/heads/main" { print $1 }' <<<"$output")"
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::Git wire returned an invalid or ambiguous main identity for $repository."
                  return 1
                }
                printf '%s\n' "$sha"
                return 0
              fi
              if [ "$status" -eq 2 ]; then
                echo "::error::Git wire main ref is missing for $repository."
                return 2
              fi
            done
            echo "::error::Git wire transport remained unavailable for $repository after 3 bounded read-only attempts: $output"
            return "$status"
          }
          app_sha="$(git -C app rev-parse HEAD)"
          app_tree="$(git -C app rev-parse 'HEAD^{tree}')"
          shell_sha='${{ inputs.shell_ref }}'
          framework_sha='${{ inputs.framework_ref }}'
          if [ -z "$shell_sha" ]; then shell_sha="$(resolve_main_wire gaofeng21cn/opl-aion-shell)"; fi
          if [ -z "$framework_sha" ]; then framework_sha="$(resolve_main_wire gaofeng21cn/one-person-lab)"; fi
          for identity in "$app_sha" "$app_tree" "$shell_sha" "$framework_sha"; do
            [[ "$identity" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$app_sha" = '${{ inputs.app_ref || github.sha }}'
          {
            echo "app_sha=$app_sha"
            echo "app_tree=$app_tree"
            echo "shell_sha=$shell_sha"
            echo "framework_sha=$framework_sha"
          } >> "$GITHUB_OUTPUT"

  source-contract-build-preflight:
    name: GitHub-hosted source, contract, and build preflight
    needs: [resolve-cohort]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: >-
        {"include":[
          {"platform":"linux-x64-source-preflight","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"source-preflight-linux-x64","arch":"x64"}
        ]}
      ref: ${{ needs.resolve-cohort.outputs.app_sha }}
      shell_ref: ${{ needs.resolve-cohort.outputs.shell_sha }}
      framework_ref: ${{ needs.resolve-cohort.outputs.framework_sha }}
      skip_code_quality: false
      append_commit_hash: false
      upload_installers_only: true
      require_macos_gatekeeper: false

  qualify:
    name: Seal GitHub-hosted source preflight
    needs: [resolve-cohort, source-contract-build-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      receipt_digest: ${{ steps.receipt.outputs.receipt_digest }}
      app_ref: ${{ needs.resolve-cohort.outputs.app_sha }}
      shell_ref: ${{ needs.resolve-cohort.outputs.shell_sha }}
      framework_ref: ${{ needs.resolve-cohort.outputs.framework_sha }}
    env:
      OPERATION_SCOPE: ${{ inputs.operation_scope || 'standalone_diagnostic' }}
    steps:
      - name: Checkout exact App cohort
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.resolve-cohort.outputs.app_sha }}
          path: app

      - name: Checkout exact Shell cohort
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ needs.resolve-cohort.outputs.shell_sha }}
          path: shell

      - name: Checkout exact Framework cohort
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.resolve-cohort.outputs.framework_sha }}
          path: framework

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Seal source, contract, build, and cohort evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/opl-source-preflight-$GITHUB_RUN_ID"
          mkdir -p "$evidence_root"
          shell_tree="$(git -C shell rev-parse 'HEAD^{tree}')"
          framework_tree="$(git -C framework rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg app '${{ needs.resolve-cohort.outputs.app_sha }}' \
            --arg app_tree '${{ needs.resolve-cohort.outputs.app_tree }}' \
            --arg shell '${{ needs.resolve-cohort.outputs.shell_sha }}' \
            --arg shell_tree "$shell_tree" \
            --arg framework '${{ needs.resolve-cohort.outputs.framework_sha }}' \
            --arg framework_tree "$framework_tree" \
            '{
              schema: "opl_source_preflight_cohort.v1",
              cohort: {
                app: {sha: $app, tree: $app_tree},
                shell: {sha: $shell, tree: $shell_tree},
                framework: {sha: $framework, tree: $framework_tree}
              }
            }' > "$evidence_root/source-preflight-cohort.json"
          jq -n '{
            schema: "opl_source_contract_build_preflight.v1",
            status: "passed",
            execution: "github_hosted",
            reusable_workflow: ".github/workflows/_build-reusable.yml",
            checks: {source: "passed", contract: "passed", build: "passed"},
            build_invocation_count: 1,
            formal_candidate_build_count: 0,
            self_hosted_invocation_count: 0,
            tart_vm_invocation_count: 0
          }' > "$evidence_root/source-contract-build-preflight.json"
          {
            echo "evidence_root=$evidence_root"
            echo "shell_tree=$shell_tree"
            echo "framework_tree=$framework_tree"
          } >> "$GITHUB_OUTPUT"

      - name: Seal immutable source preflight receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="${{ steps.evidence.outputs.evidence_root }}"
          node --experimental-strip-types app/scripts/source-qualification-receipt.ts create \
            --output "$evidence_root/source-qualification-receipt.json" \
            --completed-at "$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')" \
            --operation-scope "$OPERATION_SCOPE" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow .github/workflows/release-source-qualification.yml \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --head-sha "$GITHUB_SHA" \
            --runner-label ubuntu-latest \
            --app-sha '${{ needs.resolve-cohort.outputs.app_sha }}' \
            --app-tree '${{ needs.resolve-cohort.outputs.app_tree }}' \
            --shell-sha '${{ needs.resolve-cohort.outputs.shell_sha }}' \
            --shell-tree '${{ steps.evidence.outputs.shell_tree }}' \
            --framework-sha '${{ needs.resolve-cohort.outputs.framework_sha }}' \
            --framework-tree '${{ steps.evidence.outputs.framework_tree }}' \
            --preflight-manifest "$evidence_root/source-contract-build-preflight.json" \
            --cohort-manifest "$evidence_root/source-preflight-cohort.json" \
            --workflow-path .github/workflows/release-source-qualification.yml \
            --workflow-path contracts/app-source-qualification-receipt.schema.json \
            --workflow-path scripts/source-qualification-receipt.ts \
            --workflow-path scripts/validate-source-qualification-receipt.ts \
            --app-root app
          digest="$(jq -er .receipt_digest "$evidence_root/source-qualification-receipt.json")"
          node --experimental-strip-types app/scripts/validate-source-qualification-receipt.ts \
            --receipt "$evidence_root/source-qualification-receipt.json" \
            --expected-digest "$digest" --expected-run-id "$GITHUB_RUN_ID" --expected-head-sha "$GITHUB_SHA"
          echo "receipt_digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Upload immutable source preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-source-qualification-${{ github.run_id }}
          path: |
            ${{ steps.evidence.outputs.evidence_root }}/source-qualification-receipt.json
            ${{ steps.evidence.outputs.evidence_root }}/source-contract-build-preflight.json
            ${{ steps.evidence.outputs.evidence_root }}/source-preflight-cohort.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize non-authoritative source preflight
        shell: bash
        run: |
          {
            echo '## Source preflight passed'
            echo
            echo "- App: ${{ needs.resolve-cohort.outputs.app_sha }}"
            echo "- Shell: ${{ needs.resolve-cohort.outputs.shell_sha }}"
            echo "- Framework: ${{ needs.resolve-cohort.outputs.framework_sha }}"
            echo "- Receipt: ${{ steps.receipt.outputs.receipt_digest }}"
            echo "- Operation scope: $OPERATION_SCOPE"
            echo '- Execution: GitHub-hosted'
            echo '- Diagnostic build count: 1'
            echo '- Formal candidate build count: 0'
            echo '- Self-hosted invocation count: 0'
            echo '- Tart VM invocation count: 0'
            echo '- Release authority: false'
            echo '- Public mutation: false'
          } >> "$GITHUB_STEP_SUMMARY"
