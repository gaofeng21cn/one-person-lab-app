name: Promote WebUI Stable

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup
        required: false
        default: execute
        type: string
      authority_mode:
        description: production_follower, development_validation, or independent_preview
        required: false
        default: production_follower
        type: string
      stable_authority_run_id:
        description: Exact successful Stable run that activated Desktop Latest.
        required: false
        default: ''
        type: string
      carrier_follower_run_id:
        description: Exact run that published the immutable WebUI carrier; defaults to this caller run.
        required: false
        default: ''
        type: string
      carrier_executor_ref:
        description: Exact App SHA that executed the carrier publication; defaults to this caller SHA.
        required: false
        default: ''
        type: string
      carrier_artifact_name:
        description: Exact carrier artifact produced by the follower run.
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ inputs.mode == 'execute' && 'opl-webui-stable-promotion-global' || format('opl-webui-stable-canary-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove WebUI Stable follower starts without promotion
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.mode }}' = canary
          if [ '${{ inputs.authority_mode }}' = independent_preview ]; then
            test '${{ inputs.stable_authority_run_id }}' = ''
          else
            test '${{ inputs.stable_authority_run_id }}' = 424242
          fi
          test '${{ inputs.carrier_artifact_name }}' = canary

  admission:
    if: ${{ inputs.mode == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      admission_artifact: ${{ steps.admission.outputs.admission_artifact }}
      authority_mode: ${{ steps.authority.outputs.authority_mode }}
    steps:
      - name: Checkout canonical App promotion authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Reject noncanonical or partial promotion runs
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_MODE: ${{ inputs.authority_mode }}
          STABLE_AUTHORITY_RUN_ID: ${{ inputs.stable_authority_run_id }}
          TRIGGERED_BY_STABLE_RUN_ID: ${{ inputs.authority_mode == 'production_follower' && github.event.workflow_run.id || inputs.stable_authority_run_id }}
          CARRIER_FOLLOWER_RUN_ID: ${{ inputs.carrier_follower_run_id || github.run_id }}
          CARRIER_EXECUTOR_REF: ${{ inputs.carrier_executor_ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          case "$AUTHORITY_MODE" in
            production_follower|development_validation|independent_preview) ;;
            *) echo "::error::Unsupported WebUI promotion authority mode: $AUTHORITY_MODE"; exit 1 ;;
          esac
          [[ "$CARRIER_FOLLOWER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CARRIER_EXECUTOR_REF" =~ ^[0-9a-f]{40}$ ]]
          canonical_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$canonical_sha" = "$GITHUB_SHA"
          mkdir -p evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CARRIER_FOLLOWER_RUN_ID" \
            > evidence/carrier-follower-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CARRIER_FOLLOWER_RUN_ID/jobs?filter=latest&per_page=100" \
            > evidence/carrier-follower-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > evidence/promotion-executor-run.json

          if [ "$AUTHORITY_MODE" != independent_preview ]; then
            [[ "$STABLE_AUTHORITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$STABLE_AUTHORITY_RUN_ID" = "$TRIGGERED_BY_STABLE_RUN_ID"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID" \
              > evidence/stable-authority-run.json
            jq -e --arg run "$STABLE_AUTHORITY_RUN_ID" --arg authority_mode "$AUTHORITY_MODE" '
              (.id | tostring) == $run
              and .repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .path == ".github/workflows/release-stable.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .run_attempt == 1
              and .status == "completed"
              and (
                ($authority_mode == "production_follower" and .conclusion == "success")
                or ($authority_mode == "development_validation" and (.conclusion == "success" or .conclusion == "failure"))
              )
              and (.head_sha | test("^[0-9a-f]{40}$"))
            ' evidence/stable-authority-run.json >/dev/null
          else
            test -z "$STABLE_AUTHORITY_RUN_ID"
            test -z "$TRIGGERED_BY_STABLE_RUN_ID"
          fi

          jq -e --arg run "$CARRIER_FOLLOWER_RUN_ID" --arg head "$CARRIER_EXECUTOR_REF" --arg authority_mode "$AUTHORITY_MODE" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == (
              if $authority_mode == "production_follower"
              then ".github/workflows/release-webui-follower.yml"
              else ".github/workflows/release-webui-development.yml"
              end
            )
            and .event == (if $authority_mode == "production_follower" then "workflow_run" else "workflow_dispatch" end)
            and .head_branch == "main"
            and .run_attempt == 1
            and (.head_sha == $head)
            and (
              ($authority_mode == "independent_preview" and .status == "completed" and .conclusion == "success")
              or ($authority_mode != "independent_preview" and (.status == "in_progress" or .status == "completed"))
            )
          ' evidence/carrier-follower-run.json >/dev/null
          jq -e --arg run "$CARRIER_FOLLOWER_RUN_ID" --arg head "$CARRIER_EXECUTOR_REF" '
            [
              .jobs[]
              | select(
                  .name == "webui-carrier / publish-immutable-carrier"
                  and (.run_id | tostring) == $run
                  and .status == "completed"
                  and .conclusion == "success"
                  and .run_attempt == 1
                  and .head_sha == $head
                )
            ]
            | select(length == 1)
            | .[0]
          ' evidence/carrier-follower-jobs.json > evidence/carrier-follower-job.json
          jq -e \
            --arg run "$GITHUB_RUN_ID" \
            --arg head "$GITHUB_SHA" \
            --arg authority_mode "$AUTHORITY_MODE" \
            --arg carrier_run "$CARRIER_FOLLOWER_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == (
              if $authority_mode == "production_follower"
              then ".github/workflows/release-webui-follower.yml"
              elif $authority_mode == "independent_preview"
              then ".github/workflows/release-webui-development-promote.yml"
              elif $carrier_run == $run
              then ".github/workflows/release-webui-development.yml"
              else ".github/workflows/release-webui-development-promote.yml"
              end
            )
            and .event == (if $authority_mode == "production_follower" then "workflow_run" else "workflow_dispatch" end)
            and .head_branch == "main"
            and .run_attempt == 1
            and (.status == "in_progress" or .status == "completed")
            and .head_sha == $head
          ' evidence/promotion-executor-run.json >/dev/null
          if [ "$AUTHORITY_MODE" = production_follower ]; then
            test "$CARRIER_FOLLOWER_RUN_ID" = "$GITHUB_RUN_ID"
            test "$CARRIER_EXECUTOR_REF" = "$GITHUB_SHA"
          fi
          {
            echo "authority_mode=$AUTHORITY_MODE"
            echo "carrier_follower_run_id=$CARRIER_FOLLOWER_RUN_ID"
            echo "carrier_executor_ref=$CARRIER_EXECUTOR_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact App WebUI carrier artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.carrier_artifact_name }}
          run-id: ${{ inputs.carrier_follower_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: intake/app-carrier

      - name: Materialize exactly one carrier receipt from the exact follower run
        env:
          CARRIER_FOLLOWER_RUN_ID: ${{ inputs.carrier_follower_run_id || github.run_id }}
          CARRIER_ARTIFACT_NAME: ${{ inputs.carrier_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          unique_regular_file() {
            local root="$1" name="$2" output="$3"
            local matches=()
            while IFS= read -r match; do matches+=("$match"); done < <(
              find "$root" -type f -name "$name" -print | LC_ALL=C sort
            )
            test "${#matches[@]}" -eq 1 || {
              echo "::error::$root must contain exactly one $name; found ${#matches[@]}."
              exit 1
            }
            test ! -L "${matches[0]}"
            cp "${matches[0]}" "$output"
            cmp "${matches[0]}" "$output"
            printf '%s\n' "${matches[0]}"
          }
          unique_regular_file intake/app-carrier carrier-receipt.json \
            evidence/carrier-receipt.json >/dev/null
          version="$(jq -er '.release.version | select(test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*|-preview\\.r[1-9][0-9]*|-nightly(\\.r[1-9][0-9]*)?)?$"))' \
            evidence/carrier-receipt.json)"
          carrier_artifact="$CARRIER_ARTIFACT_NAME"
          test "$carrier_artifact" = "webui-carrier-${version}-${CARRIER_FOLLOWER_RUN_ID}-1"
          jq -n \
            --arg authority_mode '${{ inputs.authority_mode }}' \
            --arg stable_authority_run_id '${{ inputs.stable_authority_run_id }}' \
            --arg carrier_follower_run_id "$CARRIER_FOLLOWER_RUN_ID" \
            --arg app_carrier_artifact "$carrier_artifact" \
            '{
              schema:"opl_app_webui_stable_artifact_intake.v4",
              authority_mode:$authority_mode,
              stable_authority_run_id:(if $authority_mode == "independent_preview" then null else $stable_authority_run_id end),
              carrier_follower_run_id:$carrier_follower_run_id,
              app_carrier_artifact:$app_carrier_artifact
            }' > evidence/artifact-intake.json

      - name: Materialize and verify independent source authority
        if: ${{ inputs.authority_mode == 'independent_preview' }}
        shell: bash
        run: |
          set -euo pipefail
          matches=()
          while IFS= read -r match; do matches+=("$match"); done < <(
            find intake/app-carrier -type f -name source-authority.json -print | LC_ALL=C sort
          )
          test "${#matches[@]}" -eq 1
          test ! -L "${matches[0]}"
          cp "${matches[0]}" evidence/source-authority.json
          cmp "${matches[0]}" evidence/source-authority.json
          node --experimental-strip-types scripts/webui-source-authority.ts \
            validate --input evidence/source-authority.json \
            > evidence/source-authority-verification.json

      - name: Setup ORAS for anonymous descriptor admission
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Read immutable, version, Stable, and Latest authority
        shell: bash
        run: |
          set -euo pipefail
          observe_descriptor() {
            local ref="$1" output="$2"
            local repository="${ref%@*}" descriptor='' error='' status=unknown observed=null
            if [ "$repository" = "$ref" ]; then repository="${ref%:*}"; fi
            if descriptor="$(oras manifest fetch --descriptor "$ref" 2>"${output}.stderr")"; then
              observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
              if [ "$observed" != null ]; then status=present; fi
            else
              error="$(tr '\n' ' ' < "${output}.stderr")"
              if grep -Eqi 'manifest unknown|name unknown|not found|404' <<<"$error"; then
                status=absent
                if [[ "$ref" == *:stable || "$ref" == *:latest ]]; then
                  tag="${ref##*:}"
                  if ! oras repo tags "$repository" > "${output}.tags" 2>"${output}.tags.stderr"; then
                    status=unknown
                  elif grep -Fx "$tag" "${output}.tags" >/dev/null; then
                    status=unknown
                  fi
                fi
              fi
            fi
            jq -n --arg ref "$ref" --arg status "$status" --argjson digest "$(
              if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
            )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' > "$output"
          }
          image_ref="$(jq -er '.carrier.ref | select(test("^ghcr.io/gaofeng21cn/one-person-lab-webui@sha256:[0-9a-f]{64}$"))' \
            evidence/carrier-receipt.json)"
          version="$(jq -er .release.version evidence/carrier-receipt.json)"
          observe_descriptor "$image_ref" evidence/immutable-readback.json
          version_ref="ghcr.io/gaofeng21cn/one-person-lab-webui:${version}"
          observe_descriptor "$version_ref" evidence/version-readback.json
          test "$(jq -er .status evidence/version-readback.json)" = present
          oras manifest fetch --output evidence/version-manifest.json "$version_ref"
          version_manifest_digest="sha256:$(shasum -a 256 evidence/version-manifest.json | awk '{print $1}')"
          test "$version_manifest_digest" = "$(jq -er .digest evidence/version-readback.json)"
          child_digest="$(jq -er '
            select(
              .mediaType == "application/vnd.oci.image.index.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
            )
            | .manifests
            | select(length == 1)
            | .[0]
            | select(.platform.os == "linux" and .platform.architecture == "amd64")
            | .digest
            | select(test("^sha256:[0-9a-f]{64}$"))
          ' evidence/version-manifest.json)"
          test "$child_digest" = "$(jq -er .carrier.digest evidence/carrier-receipt.json)"
          jq --arg child_digest "$child_digest" \
            --arg media_type "$(jq -er .mediaType evidence/version-manifest.json)" \
            '. + {
              child_digest:$child_digest,
              manifest_count:1,
              media_type:$media_type
            }' evidence/version-readback.json > evidence/version-readback.tmp
          mv evidence/version-readback.tmp evidence/version-readback.json
          observe_descriptor ghcr.io/gaofeng21cn/one-person-lab-webui:stable \
            evidence/stable-prestate.json
          observe_descriptor ghcr.io/gaofeng21cn/one-person-lab-webui:latest \
            evidence/latest-prestate.json

      - name: Seal one immutable WebUI Stable admission
        id: admission
        env:
          STABLE_AUTHORITY_RUN_ID: ${{ inputs.stable_authority_run_id }}
          AUTHORITY_MODE: ${{ inputs.authority_mode }}
          TRIGGERED_BY_STABLE_RUN_ID: ${{ inputs.authority_mode == 'production_follower' && github.event.workflow_run.id || inputs.stable_authority_run_id }}
          CARRIER_FOLLOWER_RUN_ID: ${{ inputs.carrier_follower_run_id || github.run_id }}
          CARRIER_EXECUTOR_REF: ${{ inputs.carrier_executor_ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          admission_args=(
            admit
            --authority-mode "$AUTHORITY_MODE"
            --carrier-follower-run evidence/carrier-follower-run.json
            --carrier-follower-run-id "$CARRIER_FOLLOWER_RUN_ID"
            --carrier-follower-job evidence/carrier-follower-job.json
            --carrier-executor-app-sha "$CARRIER_EXECUTOR_REF"
            --promotion-executor-run evidence/promotion-executor-run.json
            --promotion-executor-run-id "$GITHUB_RUN_ID"
            --promotion-app-sha "$GITHUB_SHA"
            --carrier-receipt evidence/carrier-receipt.json
            --immutable-readback evidence/immutable-readback.json
            --version-readback evidence/version-readback.json
            --stable-prestate evidence/stable-prestate.json
            --latest-prestate evidence/latest-prestate.json
            --output evidence/admission.json
          )
          if [ "$AUTHORITY_MODE" = independent_preview ]; then
            admission_args+=(--source-authority evidence/source-authority.json)
          else
            admission_args+=(
              --stable-authority-run evidence/stable-authority-run.json
              --stable-authority-run-id "$STABLE_AUTHORITY_RUN_ID"
              --triggered-by-stable-run-id "$TRIGGERED_BY_STABLE_RUN_ID"
            )
          fi
          node --experimental-strip-types scripts/webui-stable-promotion.ts \
            "${admission_args[@]}" > evidence/admission-summary.json
          admission_artifact="opl-webui-stable-admission-${GITHUB_RUN_ID}"
          echo "admission_artifact=$admission_artifact" >> "$GITHUB_OUTPUT"

      - name: Upload immutable WebUI Stable admission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.admission.outputs.admission_artifact }}
          path: evidence
          if-no-files-found: error
          retention-days: 90

  promote-webui-stable:
    if: ${{ inputs.mode == 'execute' }}
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.admission.outputs.authority_mode == 'independent_preview' && 'release-preview-publication' || 'release-stable' }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Checkout exact admitted App authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Reject partial rerun before GHCR mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main

      - name: Download exact same-run admission
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.admission.outputs.admission_artifact }}
          path: evidence

      - name: Setup ORAS for one bounded CAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Re-read Stable and Latest prestate and derive CAS decision
        id: decision
        shell: bash
        run: |
          set -euo pipefail
          admission_files=()
          while IFS= read -r file; do admission_files+=("$file"); done < <(
            find evidence -type f -name admission.json -print | LC_ALL=C sort
          )
          test "${#admission_files[@]}" -eq 1
          admission="${admission_files[0]}"
          stable_ref="$(jq -er .target.stable_ref "$admission")"
          latest_ref="$(jq -er .target.latest_ref "$admission")"
          repository="${stable_ref%:*}"
          observe_tag() {
            local ref="$1" tag="$2" output="$3" status=unknown observed=null
            if descriptor="$(oras manifest fetch --descriptor "$ref" 2> "${output}.stderr")"; then
              observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
              if [ "$observed" != null ]; then status=present; fi
            elif grep -Eqi 'manifest unknown|name unknown|not found|404' "${output}.stderr"; then
              if oras repo tags "$repository" > "${output}.tags" 2> "${output}.tags.stderr" \
                && ! grep -Fx "$tag" "${output}.tags" >/dev/null; then
                status=absent
              fi
            fi
            jq -n --arg ref "$ref" --arg status "$status" --argjson digest "$(
              if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
            )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' \
              > "${output}.json"
          }
          observe_tag "$stable_ref" stable current-stable
          observe_tag "$latest_ref" latest current-latest
          node --experimental-strip-types scripts/webui-stable-promotion.ts decide \
            --admission "$admission" \
            --current-stable current-stable.json \
            --current-latest current-latest.json \
            --output decision.json \
            > decision-summary.json
          echo "decision=$(jq -er .decision decision.json)" >> "$GITHUB_OUTPUT"

      - name: Execute at most one admitted WebUI tag mutation and reconcile read-only
        env:
          GHCR_TOKEN: ${{ github.token }}
          CAS_DECISION: ${{ steps.decision.outputs.decision }}
        shell: bash
        run: |
          set -euo pipefail
          admission="$(find evidence -type f -name admission.json -print)"
          stable_ref="$(jq -er .target.stable_ref "$admission")"
          latest_ref="$(jq -er .target.latest_ref "$admission")"
          repository="$(jq -er .target.repository "$admission")"
          target_digest="$(jq -er .target.digest "$admission")"
          target_ref="${repository}@${target_digest}"
          authority_mode="$(jq -er .authority_mode "$admission")"
          promotion_tags=()
          while IFS= read -r tag; do promotion_tags+=("$tag"); done < <(
            jq -er '.target.promotion_tags[]' "$admission"
          )
          if [ "$authority_mode" = production_follower ]; then
            test "${promotion_tags[*]}" = "stable latest"
            stable_terminal_status=present
            stable_terminal_digest="$target_digest"
          else
            test "$authority_mode" = development_validation \
              || test "$authority_mode" = independent_preview
            test "${promotion_tags[*]}" = latest
            stable_terminal_status="$(jq -er .expected_prestate.stable.status "$admission")"
            stable_terminal_digest="$(jq -r .expected_prestate.stable.digest "$admission")"
          fi
          mkdir -p terminal/readbacks/stable terminal/readbacks/latest
          jq -n '{
            schema:"opl_app_webui_stable_mutation_attempt.v1",
            status:"not_attempted",
            attempt_count:0,
            attempt_id:null,
            exit_code:null,
            stdout_sha256:null,
            stderr_sha256:null
          }' > terminal/mutation.json
          login_performed=false
          logout_before_readback=true
          if [ "$CAS_DECISION" = write_once ]; then
            if printf '%s' "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; then
              login_performed=true
              set +e
              oras tag "$target_ref" "${promotion_tags[@]}" > terminal/tag.stdout 2> terminal/tag.stderr
              tag_status=$?
              set -e
              mutation_status=accepted
              if [ "$tag_status" -ne 0 ]; then mutation_status=unknown; fi
              jq -n --arg status "$mutation_status" --arg attempt_id "gha-${GITHUB_RUN_ID}-webui-${authority_mode}-tag" \
                --argjson exit_code "$tag_status" \
                --arg stdout_sha256 "sha256:$(shasum -a 256 terminal/tag.stdout | awk '{print $1}')" \
                --arg stderr_sha256 "sha256:$(shasum -a 256 terminal/tag.stderr | awk '{print $1}')" \
                '{
                  schema:"opl_app_webui_stable_mutation_attempt.v1",
                  status:$status,
                  attempt_count:1,
                  attempt_id:$attempt_id,
                  exit_code:$exit_code,
                  stdout_sha256:$stdout_sha256,
                  stderr_sha256:$stderr_sha256
                }' > terminal/mutation.json
            else
              jq -n '{
                schema:"opl_app_webui_stable_mutation_attempt.v1",
                status:"not_attempted",
                attempt_count:0,
                attempt_id:null,
                exit_code:null,
                stdout_sha256:null,
                stderr_sha256:null,
                failure:"registry_login_failed"
              }' > terminal/mutation.json
            fi
          fi
          if [ "$login_performed" = true ]; then
            if ! oras logout ghcr.io; then logout_before_readback=false; fi
          fi
          observe_tag() {
            local ref="$1" tag="$2" output="$3" status=unknown observed=null
            if descriptor="$(oras manifest fetch --descriptor "$ref" 2>"${output}.stderr")"; then
              observed="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor")" || observed=null
              if [ "$observed" != null ]; then status=present; fi
            elif grep -Eqi 'manifest unknown|name unknown|not found|404' "${output}.stderr"; then
              if oras repo tags "$repository" > "${output}.tags" 2>"${output}.tags.stderr" \
                && ! grep -Fx "$tag" "${output}.tags" >/dev/null; then
                status=absent
              fi
            fi
            jq -n --arg ref "$ref" --arg status "$status" --argjson digest "$(
              if [ "$observed" = null ]; then printf null; else jq -Rn --arg value "$observed" '$value'; fi
            )" '{schema:"opl_app_webui_descriptor_readback.v1",ref:$ref,status:$status,digest:$digest}' > "$output"
          }
          if [ "$(jq -r .attempt_count terminal/mutation.json)" -eq 1 ]; then
            for attempt in 1 2 3; do
              stable_readback="terminal/readbacks/stable/${attempt}.json"
              latest_readback="terminal/readbacks/latest/${attempt}.json"
              observe_tag "$stable_ref" stable "$stable_readback"
              observe_tag "$latest_ref" latest "$latest_readback"
              if [ "$(jq -er .status "$stable_readback")" = "$stable_terminal_status" ] \
                && [ "$(jq -r .digest "$stable_readback")" = "$stable_terminal_digest" ] \
                && [ "$(jq -er .status "$latest_readback")" = present ] \
                && [ "$(jq -r .digest "$latest_readback")" = "$target_digest" ]; then
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep 2; fi
            done
            last_readback="$(find terminal/readbacks/stable -type f -name '*.json' -print | LC_ALL=C sort | tail -n 1)"
            last_latest_readback="$(find terminal/readbacks/latest -type f -name '*.json' -print | LC_ALL=C sort | tail -n 1)"
            jq --argjson logout "$logout_before_readback" \
              '. + {logout_before_readback:$logout}' "$last_readback" > terminal/anonymous-readback.json
            jq --argjson logout "$logout_before_readback" \
              '. + {logout_before_readback:$logout}' "$last_latest_readback" \
              > terminal/latest-anonymous-readback.json
          else
            observe_tag "$stable_ref" stable terminal/anonymous-readback.json
            observe_tag "$latest_ref" latest terminal/latest-anonymous-readback.json
            jq '. + {logout_before_readback:true}' terminal/anonymous-readback.json \
              > terminal/anonymous-readback.tmp
            mv terminal/anonymous-readback.tmp terminal/anonymous-readback.json
            jq '. + {logout_before_readback:true}' terminal/latest-anonymous-readback.json \
              > terminal/latest-anonymous-readback.tmp
            mv terminal/latest-anonymous-readback.tmp terminal/latest-anonymous-readback.json
          fi
          jq -s '{
            schema:"opl_app_webui_stable_reconcile_readbacks.v1",
            observations:.
          }' terminal/readbacks/stable/*.json > terminal/readbacks.json 2>/dev/null || \
            jq -n '{schema:"opl_app_webui_stable_reconcile_readbacks.v1",observations:[]}' \
              > terminal/readbacks.json
          jq -s '{
            schema:"opl_app_webui_stable_reconcile_readbacks.v1",
            observations:.
          }' terminal/readbacks/latest/*.json > terminal/latest-readbacks.json 2>/dev/null || \
            jq -n '{schema:"opl_app_webui_stable_reconcile_readbacks.v1",observations:[]}' \
              > terminal/latest-readbacks.json

      - name: Read back the complete public OCI graph anonymously
        shell: bash
        run: |
          set -euo pipefail
          admission="$(find evidence -type f -name admission.json -print)"
          repository="$(jq -er .target.repository "$admission")"
          version_ref="$(jq -er .target.version_ref "$admission")"
          stable_ref="$(jq -er .target.stable_ref "$admission")"
          latest_ref="$(jq -er .target.latest_ref "$admission")"
          target_digest="$(jq -er .target.digest "$admission")"
          child_digest="$(jq -er .target.child_digest "$admission")"
          authority_mode="$(jq -er .authority_mode "$admission")"
          mkdir -p terminal/public-oci/blobs
          read_manifest() {
            local ref="$1" name="$2" expected_digest="$3"
            oras manifest fetch --descriptor "$ref" > "terminal/public-oci/${name}-descriptor.json"
            oras manifest fetch --output "terminal/public-oci/${name}.json" "$ref"
            local actual_digest actual_size
            actual_digest="sha256:$(sha256sum "terminal/public-oci/${name}.json" | awk '{print $1}')"
            actual_size="$(wc -c < "terminal/public-oci/${name}.json" | tr -d ' ')"
            test "$actual_digest" = "$expected_digest"
            jq -e --arg digest "$actual_digest" --argjson size "$actual_size" '
              .digest == $digest and .size == $size
            ' "terminal/public-oci/${name}-descriptor.json" >/dev/null
          }
          read_manifest "$version_ref" version-index "$target_digest"
          read_manifest "$latest_ref" latest-index "$target_digest"
          cmp -s terminal/public-oci/version-index.json terminal/public-oci/latest-index.json
          stable_matches_target=false
          stable_unchanged=false
          stable_status="$(jq -er .status terminal/anonymous-readback.json)"
          stable_digest="$(jq -r .digest terminal/anonymous-readback.json)"
          if [ "$authority_mode" = production_follower ]; then
            read_manifest "$stable_ref" stable-index "$target_digest"
            cmp -s terminal/public-oci/version-index.json terminal/public-oci/stable-index.json
            stable_matches_target=true
          else
            test "$authority_mode" = development_validation \
              || test "$authority_mode" = independent_preview
            expected_stable_status="$(jq -er .expected_prestate.stable.status "$admission")"
            expected_stable_digest="$(jq -r .expected_prestate.stable.digest "$admission")"
            test "$stable_status" = "$expected_stable_status"
            test "$stable_digest" = "$expected_stable_digest"
            stable_unchanged=true
            if [ "$stable_status" = present ]; then
              read_manifest "$stable_ref" stable-index "$stable_digest"
            else
              test "$stable_status" = absent
            fi
          fi
          jq -e --arg child "$child_digest" '
            select(
              .mediaType == "application/vnd.oci.image.index.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json"
            )
            | .manifests
            | select(length == 1)
            | .[0]
            | select(
              .digest == $child
              and .size > 0
              and .platform.os == "linux"
              and .platform.architecture == "amd64"
            )
          ' terminal/public-oci/version-index.json > terminal/public-oci/child-index-descriptor.json
          child_size="$(jq -er .size terminal/public-oci/child-index-descriptor.json)"
          read_manifest "${repository}@${child_digest}" child-manifest "$child_digest"
          test "$(wc -c < terminal/public-oci/child-manifest.json | tr -d ' ')" = "$child_size"
          jq -e '
            select(
              .mediaType == "application/vnd.oci.image.manifest.v1+json"
              or .mediaType == "application/vnd.docker.distribution.manifest.v2+json"
            )
            | .config
            | select(.digest | test("^sha256:[0-9a-f]{64}$"))
            | select(.size > 0)
          ' terminal/public-oci/child-manifest.json > terminal/public-oci/config-descriptor.json
          jq -e '
            .layers
            | select(length > 0)
            | all(
              (.digest | test("^sha256:[0-9a-f]{64}$"))
              and .size > 0
              and (.mediaType | type == "string")
            )
          ' terminal/public-oci/child-manifest.json >/dev/null
          jq -c '.layers' terminal/public-oci/child-manifest.json \
            > terminal/public-oci/layer-descriptors.json
          verify_blob_descriptor() {
            local descriptor="$1" name="$2"
            local digest size
            digest="$(jq -er .digest <<<"$descriptor")"
            size="$(jq -er .size <<<"$descriptor")"
            oras blob fetch --descriptor "${repository}@${digest}" \
              > "terminal/public-oci/blobs/${name}.json"
            jq -e --arg digest "$digest" --argjson size "$size" '
              .digest == $digest and .size == $size
            ' "terminal/public-oci/blobs/${name}.json" >/dev/null
          }
          verify_blob_descriptor "$(cat terminal/public-oci/config-descriptor.json)" config
          layer_count="$(jq -er length terminal/public-oci/layer-descriptors.json)"
          for index in $(seq 0 $((layer_count - 1))); do
            verify_blob_descriptor \
              "$(jq -c ".[$index]" terminal/public-oci/layer-descriptors.json)" \
              "layer-${index}"
          done
          jq -n \
            --arg version_ref "$version_ref" \
            --arg stable_ref "$stable_ref" \
            --arg latest_ref "$latest_ref" \
            --arg authority_mode "$authority_mode" \
            --arg digest "$target_digest" \
            --arg stable_status "$stable_status" \
            --argjson stable_digest "$(if [ "$stable_digest" = null ]; then printf null; else jq -Rn --arg value "$stable_digest" '$value'; fi)" \
            --arg child_digest "$child_digest" \
            --argjson stable_matches_target "$stable_matches_target" \
            --argjson stable_unchanged "$stable_unchanged" \
            --argjson index_size "$(wc -c < terminal/public-oci/version-index.json | tr -d ' ')" \
            --argjson child_size "$child_size" \
            --argjson layer_count "$layer_count" \
            '{
              schema:"opl_app_webui_public_oci_readback.v1",
              status:"passed",
              anonymous:true,
              authority_mode:$authority_mode,
              version_ref:$version_ref,
              stable_ref:$stable_ref,
              latest_ref:$latest_ref,
              manifest_list:{digest:$digest,size_bytes:$index_size,version_and_latest_identical_bytes:true},
              stable:{status:$stable_status,digest:$stable_digest,matches_target:$stable_matches_target,unchanged:$stable_unchanged},
              child:{digest:$child_digest,size_bytes:$child_size,platform:"linux/amd64"},
              config_descriptor_verified:true,
              layer_descriptors_verified:true,
              layer_count:$layer_count
            }' > terminal/public-oci-readback.json

      - name: Write terminal WebUI Stable receipt
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          admission="$(find evidence -type f -name admission.json -print)"
          node --experimental-strip-types scripts/webui-stable-promotion.ts receipt \
            --admission "$admission" --decision decision.json \
            --mutation terminal/mutation.json --readbacks terminal/readbacks.json \
            --latest-readbacks terminal/latest-readbacks.json \
            --anonymous-readback terminal/anonymous-readback.json \
            --latest-anonymous-readback terminal/latest-anonymous-readback.json \
            --output terminal/webui-stable-promotion-receipt.json \
            > terminal/receipt-summary.json

      - name: Upload terminal WebUI Stable evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-webui-stable-promotion-${{ github.run_id }}
          path: |
            current-stable.json
            current-latest.json
            decision.json
            decision-summary.json
            terminal
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce conclusive WebUI Stable terminal state
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -er .status terminal/webui-stable-promotion-receipt.json)"
          test "$(jq -er .status terminal/public-oci-readback.json)" = passed
          test "$(jq -er .anonymous terminal/public-oci-readback.json)" = true
          case "$status" in
            complete|idempotent|reconciled_complete) ;;
            *)
              echo "::error::WebUI Stable promotion ended $status; no second tag, rerun, redispatch, or cancel is authorized."
              exit 1
              ;;
          esac
