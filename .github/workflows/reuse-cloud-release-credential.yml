name: Reuse existing OPL release credential for Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  seal:
    if: ${{ github.repository == 'gaofeng21cn/one-person-lab-app' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.actor == github.triggering_actor }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-stable
    steps:
      - name: Prepare the sealed-box implementation before loading credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/opl-credential-seal-venv"
          "$RUNNER_TEMP/opl-credential-seal-venv/bin/pip" install --disable-pip-version-check PyNaCl==1.6.0

      - name: Verify read access and seal only to the fixed Cloud recipients
        shell: bash
        env:
          OPL_EXISTING_RELEASE_CREDENTIAL: ${{ secrets.OPL_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/opl-credential-seal-venv/bin/python" - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from nacl.encoding import Base64Encoder
          from nacl.public import PublicKey, SealedBox

          credential = os.environ['OPL_EXISTING_RELEASE_CREDENTIAL']
          if not credential:
              raise RuntimeError('existing_release_credential_missing')
          for path in ('actions/workflows/cloud-business-qualification.yml/runs?per_page=1', 'commits/main'):
              request = Request('https://api.github.com/repos/gaofeng21cn/opl-instance-medopl/' + path,
                  headers={'Authorization': 'Bearer ' + credential, 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError('instance_evidence_read_refused')
          directory = Path(os.environ['RUNNER_TEMP']) / 'opl-cloud-credential-envelope'
          directory.mkdir(mode=0o700)
          recipients = {
              'cloud-release': 'ucmYTvAJbvkKXlzUHQHsk8qKVwYHrTCNlFgjNeDsoCc=',
              'cloud-business-qualification': 'J4sq4x5VsVl3SjOr/fL0KvzXdxhjwJHj0x8aLY660Q8=',
          }
          for environment, public_key in recipients.items():
              ciphertext = SealedBox(PublicKey(public_key, Base64Encoder)).encrypt(credential.encode())
              envelope = {
                  'repository': 'gaofeng21cn/one-person-lab-cloud', 'environment': environment,
                  'secret': 'OPL_GITHUB_RELEASE_ADMIN_TOKEN', 'key_id': '3380204578043523366',
                  'encrypted_value': base64.b64encode(ciphertext).decode(),
                  'source': {'repository': os.environ['GITHUB_REPOSITORY'], 'environment': 'release-stable',
                             'secret': 'OPL_GITHUB_RELEASE_ADMIN_TOKEN', 'sha': os.environ['GITHUB_SHA'],
                             'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']},
                  'checks': {'instanceActionsRead': True, 'instanceContentsRead': True},
              }
              (directory / (environment + '.json')).write_text(json.dumps(envelope) + '\n')
          print('Existing release credential verified; two fixed-recipient sealed envelopes prepared.')
          PY

      - name: Retain only encrypted transport envelopes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.2
        with:
          name: opl-cloud-credential-envelope
          path: ${{ runner.temp }}/opl-cloud-credential-envelope/*.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove run-owned transport files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/opl-cloud-credential-envelope" "$RUNNER_TEMP/opl-credential-seal-venv"
