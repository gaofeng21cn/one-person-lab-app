name: OPL Studio Candidate Carriers

on:
  workflow_dispatch:
    inputs:
      studio_ref:
        description: Exact OPL Studio ref to qualify as candidate-only evidence.
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: opl-studio-candidate-carriers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-studio:
    name: Resolve immutable Studio source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out Studio source
        uses: actions/checkout@v4
        with:
          repository: gaofeng21cn/opl-studio
          ref: ${{ inputs.studio_ref }}
          path: studio
          persist-credentials: false

      - name: Record exact source SHA
        id: source
        shell: bash
        run: echo "sha=$(git -C studio rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  desktop-headless:
    name: Electron and standalone Headless candidate evidence
    needs: resolve-studio
    runs-on: macos-15
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@v4
        with:
          repository: gaofeng21cn/opl-studio
          ref: ${{ needs.resolve-studio.outputs.source_sha }}
          path: studio
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Validate Electron and Headless source
        working-directory: studio
        run: |
          npm run typecheck
          npm run test:desktop
          npm run test:headless
          npm run smoke:webui

      - name: Build and validate Electron candidate package
        working-directory: studio
        run: |
          npm run package:desktop
          npm run validate:package

      - name: Stage candidate artifacts without release authority
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find studio/out -type d -name 'One Person Lab Preview.app' -prune | head -1)"
          test -n "$app_path"
          relative_app_path="${app_path#studio/}"
          mkdir -p candidate-artifacts/desktop-headless
          printf '%s\n' "$relative_app_path" > candidate-artifacts/desktop-headless/electron-app-path.txt
          tar -C studio -czf candidate-artifacts/desktop-headless/electron-app.tgz "$relative_app_path"
          test -s studio/dist/webui/index.html
          tar -C studio -czf candidate-artifacts/desktop-headless/standalone-headless-webui.tgz dist/webui

      - name: Upload local Electron and Headless evidence
        uses: actions/upload-artifact@v4
        with:
          name: opl-studio-desktop-headless-candidate-${{ needs.resolve-studio.outputs.source_sha }}
          path: candidate-artifacts/desktop-headless
          if-no-files-found: error
          retention-days: 14

  docker-webui:
    name: OCI candidate evidence
    needs: resolve-studio
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact Studio source
        uses: actions/checkout@v4
        with:
          repository: gaofeng21cn/opl-studio
          ref: ${{ needs.resolve-studio.outputs.source_sha }}
          path: studio
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci

      - name: Validate OCI manager and local Docker carrier
        working-directory: studio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          node --test tests/oci/*.test.mjs
          npm run smoke:docker | tee out/docker-local-smoke.json

      - name: Upload local OCI evidence
        uses: actions/upload-artifact@v4
        with:
          name: opl-studio-oci-candidate-${{ needs.resolve-studio.outputs.source_sha }}
          path: studio/out/docker-local-smoke.json
          if-no-files-found: error
          retention-days: 14

  validate-manifest:
    name: Validate three-entry candidate manifest
    needs: [resolve-studio, desktop-headless, docker-webui]
    runs-on: macos-15
    steps:
      - name: Check out App contract authority
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out exact Studio source
        uses: actions/checkout@v4
        with:
          repository: gaofeng21cn/opl-studio
          ref: ${{ needs.resolve-studio.outputs.source_sha }}
          path: shells/opl-studio
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download Electron and Headless evidence
        uses: actions/download-artifact@v4
        with:
          name: opl-studio-desktop-headless-candidate-${{ needs.resolve-studio.outputs.source_sha }}
          path: candidate-artifacts/desktop-headless

      - name: Download OCI evidence
        uses: actions/download-artifact@v4
        with:
          name: opl-studio-oci-candidate-${{ needs.resolve-studio.outputs.source_sha }}
          path: candidate-artifacts/oci

      - name: Restore candidate evidence beneath the Studio checkout
        shell: bash
        run: |
          set -euo pipefail
          tar -C shells/opl-studio -xzf candidate-artifacts/desktop-headless/electron-app.tgz
          mkdir -p shells/opl-studio/out
          cp candidate-artifacts/desktop-headless/standalone-headless-webui.tgz shells/opl-studio/out/standalone-headless-webui.tgz
          cp candidate-artifacts/oci/docker-local-smoke.json shells/opl-studio/out/docker-local-smoke.json

      - name: Write candidate-only carrier evidence manifest
        env:
          STUDIO_SHA: ${{ needs.resolve-studio.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ELECTRON_APP_PATH="$(cat candidate-artifacts/desktop-headless/electron-app-path.txt)"
          export ELECTRON_APP_PATH
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const registry = JSON.parse(fs.readFileSync('contracts/app-shell-candidates.json', 'utf8'));
          const candidate = registry.candidates.find((entry) => entry.id === 'opl-studio');
          const contract = candidate.carrier_evidence_contract;
          const artifactPaths = {
            electron_desktop: process.env.ELECTRON_APP_PATH,
            standalone_headless_webui: 'out/standalone-headless-webui.tgz',
            docker_webui: 'out/docker-local-smoke.json',
          };
          const carriers = Object.fromEntries(contract.required_entries.map((carrierId) => {
            const expected = contract.entries[carrierId];
            return [carrierId, {
              carrier_id: carrierId,
              source_implementation: { status: 'implemented', refs: expected.source_refs },
              package_build: {
                status: 'passed_local_candidate_build',
                artifact_kind: expected.package_artifact_kind,
                artifact_path: artifactPaths[carrierId],
              },
              local_qualification: {
                status: 'passed_local_candidate_qualification',
                commands: expected.qualification_commands,
              },
              user_service_manager_source: expected.user_service_manager_source,
              distribution_wiring: {
                status: expected.distribution_wiring_status,
                current_aionui_release_evidence_reused: false,
              },
              update_adapter_source: expected.update_adapter_source,
              update_wiring: { status: expected.update_wiring_status },
              release: expected.release,
              ...(carrierId === 'docker_webui' ? {
                multi_arch_qualification: expected.multi_arch_qualification,
                signature_verification: expected.signature_verification,
              } : {}),
            }];
          }));
          const manifest = {
            schema: contract.schema,
            candidate_id: 'opl-studio',
            source_commit: process.env.STUDIO_SHA,
            candidate_only: true,
            release_authority: false,
            product_profile_owner: contract.product_profile_owner,
            default_release_shell_unchanged: true,
            active_shell_adopted: false,
            runtime_authority_transfer: false,
            domain_truth_owned: false,
            shared_renderer: contract.shared_renderer,
            shared_host_core: contract.shared_host_core,
            bridge_abi: contract.bridge_abi,
            carriers,
          };
          fs.writeFileSync(
            'shells/opl-studio/out/opl-studio-carrier-evidence-manifest.json',
            `${JSON.stringify(manifest, null, 2)}\n`,
          );
          NODE

      - name: Validate candidate contract and carrier evidence
        run: |
          npm run validate:candidate:studio
          node --experimental-strip-types --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateOPLStudioCarrierEvidenceManifestFile } from './scripts/validate-shell-candidates/candidate-evidence.ts';

          const registry = JSON.parse(fs.readFileSync('contracts/app-shell-candidates.json', 'utf8'));
          const candidate = registry.candidates.find((entry) => entry.id === 'opl-studio');
          validateOPLStudioCarrierEvidenceManifestFile(candidate);
          NODE

      - name: Upload candidate-only manifest
        uses: actions/upload-artifact@v4
        with:
          name: opl-studio-carrier-evidence-${{ needs.resolve-studio.outputs.source_sha }}
          path: shells/opl-studio/out/opl-studio-carrier-evidence-manifest.json
          if-no-files-found: error
          retention-days: 14
