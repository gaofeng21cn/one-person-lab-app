name: OPL Stable Full Add-on Follower
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Full add-on reconcile for Stable run {0}', inputs.source_run_id)
    || format('Full add-on follower for Stable run {0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful Standard publication run to reconcile
        required: true
        type: string
      reconcile_confirmation:
        description: Reconcile the Full add-on owner for this Standard publication
        required: true
        type: choice
        options:
          - reconcile_full_addon

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-stable-full-addon-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile-full-addon:
    if: >-
      ${{ (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && (startsWith(github.event.workflow_run.display_title, 'OPL Stable standard ')
          || startsWith(github.event.workflow_run.display_title, 'OPL Stable resume_standard ')))
        || (github.event_name == 'workflow_dispatch'
          && inputs.reconcile_confirmation == 'reconcile_full_addon') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout current canonical Full executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Bind successful Standard publication handoff
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          RECONCILE_CONFIRMATION: ${{ inputs.reconcile_confirmation || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$RECONCILE_CONFIRMATION" = reconcile_full_addon
          else
            test "$GITHUB_EVENT_NAME" = workflow_run
            test -z "$RECONCILE_CONFIRMATION"
          fi

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg run "$SOURCE_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' source-run.json >/dev/null
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-operation-admission-$SOURCE_RUN_ID" --dir source-admission
          mapfile -t admissions < <(find source-admission -type f -name release-operation-admission.json -print | LC_ALL=C sort)
          test "${#admissions[@]}" = 1
          operation="$(jq -er '.operation | strings' "${admissions[0]}")"
          case "$operation" in
            standard) artifact="opl-release-standard-checkpoint-$SOURCE_RUN_ID" ;;
            resume_standard) artifact="opl-release-standard-operation-checkpoint-$SOURCE_RUN_ID" ;;
            *) echo "::error::Full follower requires a successful Standard publication, got $operation."; exit 1 ;;
          esac
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" --dir standard-checkpoint
          mapfile -t checkpoints < <(find standard-checkpoint -type f -name checkpoint.json -print | LC_ALL=C sort)
          mapfile -t bundles < <(find standard-checkpoint -type f -name bundle.json -print | LC_ALL=C sort)
          mapfile -t controls < <(find standard-checkpoint -type f -name stable-operation-control.json -print | LC_ALL=C sort)
          test "${#checkpoints[@]}" = 1
          test "${#bundles[@]}" = 1
          test "${#controls[@]}" = 1
          checkpoint="${checkpoints[0]}"
          bundle="${bundles[0]}"
          control="${controls[0]}"
          case "$(jq -er .checkpoint_stage "$checkpoint")" in standard_built|standard_qualified) ;; *) exit 1 ;; esac
          jq -e '
            .release.channel == "stable"
            and .release.prerelease == false
            and (.release.tag == ("v" + .release.version))
            and (.sources.app.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.shell.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.framework.source_commit | test("^[0-9a-f]{40}$"))
          ' "$bundle" >/dev/null
          app="$(jq -er .sources.app.source_commit "$bundle")"
          shell="$(jq -er .sources.shell.source_commit "$bundle")"
          framework="$(jq -er .sources.framework.source_commit "$bundle")"
          tag="$(jq -er .release.tag "$bundle")"
          test "$(jq -er .cohort.app_sha "$control")" = "$app"
          test "$(jq -er .cohort.shell_sha "$control")" = "$shell"
          test "$(jq -er .cohort.framework_sha "$control")" = "$framework"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > standard-release.json
          jq -e --arg tag "$tag" --arg target "$app" '
            .tag_name == $tag and .target_commitish == $target
            and .draft == false and .prerelease == false and .immutable == false
          ' standard-release.json >/dev/null
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_artifact=$artifact"
            echo "app_ref=$app"
            echo "shell_ref=$shell"
            echo "framework_ref=$framework"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile target state and dispatch at most once
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.source_artifact }}
          APP_REF: ${{ steps.source.outputs.app_ref }}
          SHELL_REF: ${{ steps.source.outputs.shell_ref }}
          FRAMEWORK_REF: ${{ steps.source.outputs.framework_ref }}
        shell: bash
        run: |
          set -euo pipefail
          title_regex="^OPL Stable append_full source:${SOURCE_RUN_ID} run:[1-9][0-9]*$"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
            > owner-runs.json
          matches="$(jq -c --arg title "$title_regex" '[.[]?.workflow_runs[]? | select(.display_title | test($title))]' owner-runs.json)"
          active="$(jq -c '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")]' <<<"$matches")"
          active_count="$(jq -r length <<<"$active")"
          test "$active_count" -le 1 || { echo '::error::Multiple active Full owners exist for one Standard handoff.'; exit 1; }

          published_run=''
          while IFS= read -r run_id; do
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > candidate-artifacts.json
            if [ "$(jq -r --arg name "opl-release-full-published-${run_id}" '[.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length' candidate-artifacts.json)" = 1 ]; then
              published_run="$run_id"
              break
            fi
          done < <(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | sort_by(.id) | reverse | .[].id' <<<"$matches")
          if [ -n "$published_run" ]; then
            {
              echo "state=published"
              echo "owner_run_id=$published_run"
              echo "mutation_invocation_count=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$active_count" = 1 ]; then
            {
              echo "state=owner_identified"
              echo "owner_run_id=$(jq -r '.[0].id' <<<"$active")"
              echo "mutation_invocation_count=0"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          executor_sha="$(git rev-parse HEAD)"
          [[ "$executor_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > current-main.json
          test "$(jq -er .commit.sha current-main.json)" = "$executor_sha"
          prior_ids="$(jq -c '[.[].id]' <<<"$matches")"
          jq -n --arg ref main --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "$SOURCE_ARTIFACT" --arg app_ref "$APP_REF" \
            --arg shell_ref "$SHELL_REF" --arg framework_ref "$FRAMEWORK_REF" \
            '{ref:$ref,inputs:{operation:"append_full",source_run_id:$source_run_id,source_artifact:$source_artifact,app_ref:$app_ref,shell_ref:$shell_ref,framework_ref:$framework_ref}}' \
            > dispatch.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/dispatches" --input dispatch.json

          owner_run_id=''
          for _ in $(seq 1 60); do
            if gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-stable.yml/runs?event=workflow_dispatch&branch=main&per_page=100" \
              > after-runs.json; then
              successors="$(jq -c --arg title "$title_regex" --arg head "$executor_sha" --argjson prior "$prior_ids" '
                [.[]?.workflow_runs[]?
                  | select(.display_title | test($title))
                  | select(.head_sha == $head)
                  | select((.id as $id | $prior | index($id)) | not)]
              ' after-runs.json)"
              count="$(jq -r length <<<"$successors")"
              test "$count" -le 1 || { echo '::error::Full dispatch produced ambiguous successor runs.'; exit 1; }
              if [ "$count" = 1 ]; then
                owner_run_id="$(jq -r '.[0].id' <<<"$successors")"
                break
              fi
            fi
            sleep 10
          done
          [[ "$owner_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Full dispatch outcome is unknown; reconcile target state read-only before another invocation.'
            exit 1
          }
          {
            echo "state=owner_identified"
            echo "owner_run_id=$owner_run_id"
            echo "mutation_invocation_count=1"
          } >> "$GITHUB_OUTPUT"

      - name: Write thin Full follower handoff
        env:
          STATE: ${{ steps.owner.outputs.state }}
          OWNER_RUN_ID: ${{ steps.owner.outputs.owner_run_id }}
          MUTATION_COUNT: ${{ steps.owner.outputs.mutation_invocation_count }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.source_artifact }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg state "$STATE" --arg owner "$OWNER_RUN_ID" \
            --arg source "$SOURCE_RUN_ID" --arg artifact "$SOURCE_ARTIFACT" --arg tag "$RELEASE_TAG" \
            --argjson mutations "$MUTATION_COUNT" '
              {schema:"opl_app_full_addon_follower.v1",status:$state,source_run_id:$source,source_artifact:$artifact,release_tag:$tag,owner_run_id:$owner,mutation_invocation_count:$mutations,waits_for_owner_completion:false,remaining:(if $state == "published" then [] else ["full_addon"] end)}
            ' > full-addon-follower.json

      - name: Upload Full follower handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-full-addon-follower-${{ steps.source.outputs.source_run_id }}
          path: full-addon-follower.json
          if-no-files-found: error
          retention-days: 30
