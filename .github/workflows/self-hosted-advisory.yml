name: OPL Self-Hosted Advisory
run-name: Self-hosted advisory for ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows:
      - OPL Non-Release Validation
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional successful main OPL Non-Release Validation run ID to re-admit.
        required: false
        default: ''
        type: string
      mac_runner_labels_json:
        description: JSON array of labels for the trusted Tart-capable macOS advisory pool.
        required: false
        default: '["self-hosted","macOS","ARM64","opl-cert-mac-tart"]'
        type: string
      mac_gui_runner_labels_json:
        description: JSON array of labels for the trusted logged-in macOS GUI advisory pool.
        required: false
        default: '["self-hosted","macOS","ARM64","opl-gui-vm"]'
        type: string
      mac_vmware_runner_labels_json:
        description: JSON array of labels for the trusted Intel macOS VMware advisory pool.
        required: false
        default: '["self-hosted","macOS","X64","opl-vmware-intel-host"]'
        type: string
      windows_runner_labels_json:
        description: JSON array of labels for the trusted Windows/WSL2 advisory pool.
        required: false
        default: '["self-hosted","Windows","X64","opl-cert-windows-wsl"]'
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-self-hosted-advisory-${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.ref }}
  cancel-in-progress: true

jobs:
  admit:
    name: Admit advisory runner pools
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_run_id: ${{ steps.admission.outputs.source_run_id }}
      source_sha: ${{ steps.admission.outputs.source_sha }}
      mac_status: ${{ steps.admission.outputs.mac_status }}
      mac_reason_code: ${{ steps.admission.outputs.mac_reason_code }}
      mac_labels_json: ${{ steps.admission.outputs.mac_labels_json }}
      mac_gui_status: ${{ steps.admission.outputs.mac_gui_status }}
      mac_gui_reason_code: ${{ steps.admission.outputs.mac_gui_reason_code }}
      mac_gui_labels_json: ${{ steps.admission.outputs.mac_gui_labels_json }}
      mac_vmware_status: ${{ steps.admission.outputs.mac_vmware_status }}
      mac_vmware_reason_code: ${{ steps.admission.outputs.mac_vmware_reason_code }}
      mac_vmware_labels_json: ${{ steps.admission.outputs.mac_vmware_labels_json }}
      windows_status: ${{ steps.admission.outputs.windows_status }}
      windows_reason_code: ${{ steps.admission.outputs.windows_reason_code }}
      windows_labels_json: ${{ steps.admission.outputs.windows_labels_json }}
    steps:
      - name: Inspect runner inventory without creating a queue
        id: admission
        env:
          GH_TOKEN: ${{ secrets.OPL_RUNNER_INVENTORY_TOKEN }}
          RUNNER_INVENTORY_TOKEN: ${{ secrets.OPL_RUNNER_INVENTORY_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ID_INPUT: ${{ inputs.source_run_id }}
          MAC_LABELS_INPUT: ${{ inputs.mac_runner_labels_json || vars.OPL_ADVISORY_MAC_RUNNER_LABELS }}
          MAC_GUI_LABELS_INPUT: ${{ inputs.mac_gui_runner_labels_json || vars.OPL_ADVISORY_MAC_GUI_RUNNER_LABELS }}
          MAC_VMWARE_LABELS_INPUT: ${{ inputs.mac_vmware_runner_labels_json || vars.OPL_ADVISORY_MAC_VMWARE_RUNNER_LABELS }}
          WINDOWS_LABELS_INPUT: ${{ inputs.windows_runner_labels_json || vars.OPL_ADVISORY_WINDOWS_RUNNER_LABELS }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');

          const output = process.env.GITHUB_OUTPUT;
          let sourceSha = process.env.EVENT_NAME === 'workflow_run'
            ? process.env.WORKFLOW_RUN_SHA
            : process.env.GITHUB_SHA;
          const inventoryToken = (process.env.RUNNER_INVENTORY_TOKEN || '').trim();
          const targets = [
            ['mac', process.env.MAC_LABELS_INPUT || '["self-hosted","macOS","ARM64","opl-cert-mac-tart"]'],
            ['mac_gui', process.env.MAC_GUI_LABELS_INPUT || '["self-hosted","macOS","ARM64","opl-gui-vm"]'],
            ['mac_vmware', process.env.MAC_VMWARE_LABELS_INPUT || '["self-hosted","macOS","X64","opl-vmware-intel-host"]'],
            ['windows', process.env.WINDOWS_LABELS_INPUT || '["self-hosted","Windows","X64","opl-cert-windows-wsl"]'],
          ];
          const allowedLabels = {
            mac: [['self-hosted', 'macOS', 'ARM64', 'opl-cert-mac-tart']],
            mac_gui: [['self-hosted', 'macOS', 'ARM64', 'opl-gui-vm']],
            mac_vmware: [['self-hosted', 'macOS', 'X64', 'opl-vmware-intel-host']],
            windows: [['self-hosted', 'Windows', 'X64', 'opl-cert-windows-wsl']],
          };
          const result = {
            schema: 'opl_app_self_hosted_advisory_admission.v3',
            source_run_id: process.env.WORKFLOW_RUN_ID || null,
            source_sha: sourceSha,
            inventory_source: 'github_actions_api',
            retry_policy: {
              mode: process.env.EVENT_NAME === 'schedule' ? 'scheduled_re_admission' : 'event_or_manual_admission',
              dedupe_key: 'source_sha+target',
              retry_eligible_when: 'prior_target_job_absent_or_skipped',
            },
            targets: {},
          };

          if (!inventoryToken) {
            for (const [target, rawLabels] of targets) {
              let labels = [];
              try {
                labels = parseLabels(rawLabels) || [];
              } catch {
                labels = [];
              }
              unavailable(target, labels, 'not_authorized', 'The dedicated runner inventory token is not configured.');
            }
            finishNotRun();
            process.exit(0);
          }

          if (process.env.EVENT_NAME === 'workflow_run') {
            const sourceRunId = process.env.WORKFLOW_RUN_ID || '';
            const sourceApi = spawnSync('gh', [
              'api',
              `repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${sourceRunId}`,
            ], {
              encoding: 'utf8',
              env: { ...process.env, GH_TOKEN: inventoryToken },
            });
            let sourceValid = false;
            try {
              const sourceRun = JSON.parse(sourceApi.stdout || '{}');
              sourceValid = sourceApi.status === 0
                && sourceRun.repository?.full_name === 'gaofeng21cn/one-person-lab-app'
                && sourceRun.head_repository?.full_name === 'gaofeng21cn/one-person-lab-app'
                && sourceRun.path === '.github/workflows/non-release-validation.yml'
                && sourceRun.event === 'push'
                && sourceRun.head_branch === 'main'
                && sourceRun.run_attempt === 1
                && sourceRun.status === 'completed'
                && sourceRun.conclusion === 'success'
                && /^[0-9a-f]{40}$/.test(sourceRun.head_sha || '');
            } catch {
              sourceValid = false;
            }
            if (!sourceValid) {
              result.source_sha = '';
              for (const [target, rawLabels] of targets) {
                let labels = [];
                try {
                  labels = parseLabels(rawLabels) || [];
                } catch {
                  labels = [];
                }
                unavailable(target, labels, 'operator_deferred', 'Hosted validation source was not one successful main push.');
              }
              fs.writeFileSync('self-hosted-advisory-admission.json', `${JSON.stringify(result, null, 2)}\n`);
              const setOutput = (name, value) => {
                fs.appendFileSync(output, `${name}=${typeof value === 'string' ? value : JSON.stringify(value)}\n`);
              };
              setOutput('source_sha', '');
              setOutput('source_run_id', '');
              for (const [target] of targets) {
                const admission = result.targets[target];
                setOutput(`${target}_status`, admission.status);
                setOutput(`${target}_reason_code`, admission.reason_code || '');
                setOutput(`${target}_labels_json`, JSON.stringify(admission.required_labels));
              }
              process.exit(0);
            }
            result.source_run_id = sourceRunId;
          }

          if (process.env.EVENT_NAME !== 'workflow_run') {
            const sourceRunsApi = spawnSync('gh', [
              'api',
              '--paginate',
              '--slurp',
              'repos/' + process.env.GITHUB_REPOSITORY + '/actions/workflows/non-release-validation.yml/runs?branch=main&event=push&status=success&per_page=100',
            ], {
              encoding: 'utf8',
              env: { ...process.env, GH_TOKEN: inventoryToken },
            });
            let sourceRun = null;
            try {
              const pages = JSON.parse(sourceRunsApi.stdout || '[]');
              const runs = Array.isArray(pages)
                ? pages.flatMap((page) => Array.isArray(page?.workflow_runs) ? page.workflow_runs : [])
                : [];
              const requestedId = (process.env.SOURCE_RUN_ID_INPUT || '').trim();
              if (requestedId) {
                sourceRun = runs.find((run) => String(run.id) === requestedId) || null;
              } else if (process.env.EVENT_NAME === 'workflow_dispatch') {
                sourceRun = runs.find((run) => run.head_sha === process.env.GITHUB_SHA) || null;
              } else {
                // Keep the scheduled run name and its selected immutable source SHA identical.
                sourceRun = runs.find((run) => run.head_sha === process.env.GITHUB_SHA) || null;
              }
            } catch {
              sourceRun = null;
            }
            const sourceValid = sourceRunsApi.status === 0
              && sourceRun?.repository?.full_name === 'gaofeng21cn/one-person-lab-app'
              && sourceRun.head_repository?.full_name === 'gaofeng21cn/one-person-lab-app'
              && sourceRun.path === '.github/workflows/non-release-validation.yml'
              && sourceRun.event === 'push'
              && sourceRun.head_branch === 'main'
              && sourceRun.run_attempt === 1
              && sourceRun.status === 'completed'
              && sourceRun.conclusion === 'success'
              && /^[0-9a-f]{40}$/.test(sourceRun.head_sha || '');
            if (!sourceValid) {
              result.source_run_id = null;
              result.source_sha = '';
              sourceSha = '';
              for (const [target, rawLabels] of targets) {
                let labels = [];
                try {
                  labels = parseLabels(rawLabels) || [];
                } catch {
                  labels = [];
                }
                unavailable(target, labels, 'operator_deferred', 'No successful trusted main OPL Non-Release Validation source was available for re-admission.');
              }
              finishNotRun();
              process.exit(0);
            }
            result.source_run_id = String(sourceRun.id);
            result.source_sha = sourceRun.head_sha;
            sourceSha = sourceRun.head_sha;
          }

          function parseLabels(raw) {
            if (!raw.trim()) return null;
            const labels = JSON.parse(raw);
            if (!Array.isArray(labels) || labels.length === 0 ||
                labels.some((label) => typeof label !== 'string' || label.length === 0)) {
              throw new Error('runner labels must be a non-empty JSON array of strings');
            }
            return labels;
          }

          function unavailable(target, labels, reasonCode, detail) {
            result.targets[target] = {
              schema: 'opl_app_self_hosted_advisory_target_admission.v1',
              status: 'not_run',
              reason_code: reasonCode,
              job_started: false,
              release_blocking: false,
              required_labels: labels || [],
              eligible_runners: [],
              detail: detail || null,
            };
          }

          function finishNotRun() {
            fs.writeFileSync('self-hosted-advisory-admission.json', JSON.stringify(result, null, 2) + '\n');
            fs.appendFileSync(output, 'source_run_id=' + (result.source_run_id || '') + '\n');
            fs.appendFileSync(output, 'source_sha=' + (result.source_sha || '') + '\n');
            for (const [target] of targets) {
              const admission = result.targets[target];
              fs.appendFileSync(output, target + '_status=' + admission.status + '\n');
              fs.appendFileSync(output, target + '_reason_code=' + (admission.reason_code || '') + '\n');
              fs.appendFileSync(output, target + '_labels_json=' + JSON.stringify(admission.required_labels) + '\n');
            }
          }

          const priorTargetStates = new Map();
          let dedupeError = '';
          if (process.env.EVENT_NAME === 'schedule') {
            const historyApi = spawnSync('gh', [
              'api',
              '--paginate',
              '--slurp',
              'repos/' + process.env.GITHUB_REPOSITORY + '/actions/workflows/self-hosted-advisory.yml/runs?per_page=100',
            ], {
              encoding: 'utf8',
              env: { ...process.env, GH_TOKEN: inventoryToken },
            });
            try {
              if (historyApi.status !== 0) throw new Error((historyApi.stderr || historyApi.stdout || 'advisory history is unreadable').trim());
              const pages = JSON.parse(historyApi.stdout || '[]');
              if (!Array.isArray(pages)) throw new Error('advisory history returned malformed JSON');
              const priorRuns = pages
                .flatMap((page) => Array.isArray(page?.workflow_runs) ? page.workflow_runs : [])
                .filter((run) => run.display_title === 'Self-hosted advisory for ' + sourceSha)
                .filter((run) => String(run.id) !== String(process.env.GITHUB_RUN_ID || ''))
                .sort((left, right) => Number(right.id) - Number(left.id));
              const jobNames = {
                mac: 'macOS platform advisory',
                mac_gui: 'macOS GUI platform advisory',
                mac_vmware: 'macOS VMware platform advisory',
                windows: 'Windows WSL2 platform advisory',
              };
              for (const priorRun of priorRuns) {
                const jobsApi = spawnSync('gh', [
                  'api',
                  'repos/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + priorRun.id + '/jobs?per_page=100',
                ], {
                  encoding: 'utf8',
                  env: { ...process.env, GH_TOKEN: inventoryToken },
                });
                if (jobsApi.status !== 0) throw new Error((jobsApi.stderr || jobsApi.stdout || 'advisory job history is unreadable').trim());
                const jobs = JSON.parse(jobsApi.stdout || '{}').jobs;
                if (!Array.isArray(jobs)) throw new Error('advisory job history returned malformed JSON');
                for (const [target, jobName] of Object.entries(jobNames)) {
                  if (priorTargetStates.has(target)) continue;
                  const job = jobs.find((entry) => entry?.name === jobName);
                  if (!job || job.conclusion === 'skipped') continue;
                  priorTargetStates.set(target, {
                    reason_code: job.status === 'completed' ? 'already_recorded' : 'already_in_progress',
                    detail: job.status === 'completed'
                      ? 'An earlier advisory run already finished this source target with ' + job.conclusion + '.'
                      : 'An earlier advisory run is still ' + job.status + '.',
                  });
                }
              }
            } catch (error) {
              dedupeError = error instanceof Error ? error.message : String(error);
            }
          }

          let runnerInventory = null;
          let runnerInventoryError = '';
          function readRunnerInventory() {
            if (runnerInventory || runnerInventoryError) return runnerInventory;
            const api = spawnSync('gh', [
              'api',
              '--paginate',
              `repos/${process.env.GITHUB_REPOSITORY}/actions/runners?per_page=100`,
            ], {
              encoding: 'utf8',
              env: { ...process.env, GH_TOKEN: inventoryToken },
            });
            if (api.status !== 0) {
              runnerInventoryError = (api.stderr || api.stdout || 'runner inventory read failed').trim();
              return null;
            }
            try {
              runnerInventory = api.stdout
                .split(/\n(?=\{)/)
                .filter(Boolean)
                .flatMap((page) => (JSON.parse(page).runners || []));
            } catch (error) {
              runnerInventoryError = error instanceof Error ? error.message : String(error);
            }
            return runnerInventory;
          }

          for (const [target, rawLabels] of targets) {
            let labels;
            try {
              labels = parseLabels(rawLabels);
            } catch (error) {
              unavailable(target, [], 'operator_deferred', error instanceof Error ? error.message : String(error));
              continue;
            }
            if (!labels) {
              unavailable(target, [], 'not_authorized', 'No advisory runner label contract is configured.');
              continue;
            }
            if (dedupeError) {
              unavailable(target, labels, 'operator_deferred', 'Cannot prove scheduled retry de-duplication: ' + dedupeError);
              continue;
            }
            const priorTarget = priorTargetStates.get(target);
            if (priorTarget) {
              unavailable(target, labels, priorTarget.reason_code, priorTarget.detail);
              continue;
            }
            if (!allowedLabels[target].some((expected) =>
              expected.length === labels.length && expected.every((label) => labels.includes(label)))) {
              unavailable(target, labels, 'not_authorized', 'Requested labels are outside the declared advisory pool.');
              continue;
            }
            if (!inventoryToken) {
              unavailable(target, labels, 'not_authorized', 'No token can read repository runner inventory.');
              continue;
            }
            const runners = readRunnerInventory();
            if (!runners) {
              unavailable(target, labels, 'not_authorized', runnerInventoryError);
              continue;
            }
            const eligible = runners.filter((runner) => {
              const runnerLabels = new Set((runner.labels || []).map((label) =>
                typeof label === 'string' ? label : label.name,
              ));
              return runner.status === 'online' &&
                runner.busy === false &&
                labels.every((label) => runnerLabels.has(label));
            }).map((runner) => ({
              id: runner.id ?? null,
              name: runner.name ?? '',
              os: runner.os ?? '',
              status: runner.status ?? '',
              busy: Boolean(runner.busy),
              labels: (runner.labels || []).map((label) =>
                typeof label === 'string' ? label : label.name,
              ).filter(Boolean),
            }));
            result.targets[target] = {
              schema: 'opl_app_self_hosted_advisory_target_admission.v1',
              status: 'not_run',
              reason_code: 'operator_deferred',
              job_started: false,
              release_blocking: false,
              required_labels: labels,
              eligible_runners: eligible,
              detail: eligible.length > 0
                ? 'GitHub runner preguard passed, but authenticated Fleet capability and lease readback is not available in this workflow.'
                : 'No online idle runner matched the exact labels.',
            };
          }

          fs.writeFileSync('self-hosted-advisory-admission.json', `${JSON.stringify(result, null, 2)}\n`);
          const setOutput = (name, value) => {
            process.stdout.write(`${name}=${typeof value === 'string' ? value : JSON.stringify(value)}\n`);
            fs.appendFileSync(output, `${name}=${typeof value === 'string' ? value : JSON.stringify(value)}\n`);
          };
          setOutput('source_run_id', result.source_run_id || '');
          setOutput('source_sha', sourceSha);
          for (const [target, labels] of targets) {
            const admission = result.targets[target];
            setOutput(`${target}_status`, admission.status);
            setOutput(`${target}_reason_code`, admission.reason_code || '');
            setOutput(`${target}_labels_json`, JSON.stringify(admission.required_labels));
          }
          NODE

      - name: Upload advisory admission receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-self-hosted-advisory-admission-${{ github.run_id }}
          path: self-hosted-advisory-admission.json
          if-no-files-found: error
          retention-days: 30

  mac-advisory:
    name: macOS platform advisory
    needs: admit
    if: ${{ needs.admit.outputs.mac_status == 'ready' }}
    runs-on: ${{ fromJSON(needs.admit.outputs.mac_labels_json) }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup active shell implementation
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: main
          install-dependencies: 'false'

      - name: Install App root validation dependencies
        run: npm ci --ignore-scripts

      - name: Run admitted source and clean Tart guest smoke
        id: platform-smoke
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          TART_SOURCE: ${{ vars.OPL_FIRST_RUN_TART_SOURCE || 'opl-first-run-no-clt-clean-base-26-5-18' }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm run test:smoke 2>&1 | tee macos-source-smoke.log
          vm_name="opl-advisory-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tart_pid=''
          cleanup() {
            if [ -n "$tart_pid" ] && kill -0 "$tart_pid" 2>/dev/null; then
              kill "$tart_pid" 2>/dev/null || true
              wait "$tart_pid" 2>/dev/null || true
            fi
            tart stop "$vm_name" >/dev/null 2>&1 || true
            tart delete "$vm_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          tart --version | tee macos-tart-version.log
          tart clone "$TART_SOURCE" "$vm_name" 2>&1 | tee macos-tart-clone.log
          tart run --no-graphics "$vm_name" > macos-tart-run.log 2>&1 &
          tart_pid=$!
          guest_ip=''
          for _ in $(seq 1 60); do
            guest_ip="$(tart ip "$vm_name" 2>/dev/null | awk 'NF { print $1; exit }' || true)"
            if [ -n "$guest_ip" ]; then
              break
            fi
            sleep 2
          done
          test -n "$guest_ip"
          printf '%s\n' "$guest_ip" > macos-tart-guest-ip.txt

      - name: Write macOS advisory receipt
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          SMOKE_OUTCOME: ${{ steps.platform-smoke.outcome }}
          TART_SOURCE: ${{ vars.OPL_FIRST_RUN_TART_SOURCE || 'opl-first-run-no-clt-clean-base-26-5-18' }}
        run: |
          set -euo pipefail
          status=failed
          reason_code=macos_tart_platform_smoke_failed
          if [ "$SMOKE_OUTCOME" = success ]; then
            status=passed
            reason_code=''
          fi
          jq -n \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg status "$status" \
            --arg reason "$reason_code" \
            --arg tart_source "$TART_SOURCE" \
            '{schema:"opl_app_self_hosted_advisory_receipt.v2",target:"macos-tart",source_run_id:$source_run_id,source_sha:$source_sha,status:$status,reason_code:(if $reason == "" then null else $reason end),checks:["admitted_source_smoke","clean_tart_guest_boot"],tart_source:$tart_source,release_blocking:false}' \
            > macos-self-hosted-advisory.json

      - name: Upload macOS advisory receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-self-hosted-advisory-macos-${{ github.run_id }}
          path: |
            macos-self-hosted-advisory.json
            macos-source-smoke.log
            macos-tart-version.log
            macos-tart-clone.log
            macos-tart-run.log
            macos-tart-guest-ip.txt
          if-no-files-found: error
          retention-days: 30

  mac-gui-advisory:
    name: macOS GUI platform advisory
    needs: admit
    if: ${{ needs.admit.outputs.mac_gui_status == 'ready' }}
    runs-on: ${{ fromJSON(needs.admit.outputs.mac_gui_labels_json) }}
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup active shell implementation
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: main
          install-dependencies: 'false'

      - name: Install App root validation dependencies
        run: npm ci --ignore-scripts

      - name: Run admitted macOS GUI and Gatekeeper smoke
        id: platform-smoke
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(id -u)" != 0
          test "$(stat -f '%Su' /dev/console)" = "$(id -un)"
          npm run test:smoke 2>&1 | tee macos-gui-source-smoke.log
          spctl --status 2>&1 | tee macos-gatekeeper-status.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Write macOS GUI advisory receipt
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          SMOKE_OUTCOME: ${{ steps.platform-smoke.outcome }}
        run: |
          set -euo pipefail
          status=failed
          reason_code=macos_gui_platform_smoke_failed
          if [ "$SMOKE_OUTCOME" = success ]; then
            status=passed
            reason_code=''
          fi
          jq -n \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg status "$status" \
            --arg reason "$reason_code" \
            '{schema:"opl_app_self_hosted_advisory_receipt.v2",target:"macos-gui",source_run_id:$source_run_id,source_sha:$source_sha,status:$status,reason_code:(if $reason == "" then null else $reason end),checks:["admitted_source_smoke","logged_in_console_session","gatekeeper_enabled"],release_blocking:false}' \
            > macos-gui-self-hosted-advisory.json

      - name: Upload macOS GUI advisory receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-self-hosted-advisory-macos-gui-${{ github.run_id }}
          path: |
            macos-gui-self-hosted-advisory.json
            macos-gui-source-smoke.log
            macos-gatekeeper-status.log
          if-no-files-found: error
          retention-days: 30

