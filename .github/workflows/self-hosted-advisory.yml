            status=passed
            reason_code=''
          fi
          jq -n \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_sha "$SOURCE_SHA" \
            --arg status "$status" \
            --arg reason "$reason_code" \
            '{schema:"opl_app_self_hosted_advisory_receipt.v2",target:"macos-vmware-intel",source_run_id:$source_run_id,source_sha:$source_sha,status:$status,reason_code:(if $reason == "" then null else $reason end),checks:["admitted_source_smoke","intel_host_architecture","vmware_inventory"],release_blocking:false}' \
            > macos-vmware-self-hosted-advisory.json

      - name: Upload macOS VMware advisory receipt
