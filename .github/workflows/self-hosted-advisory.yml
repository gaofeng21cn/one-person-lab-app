            macos-vmware-source-smoke.log
            macos-vmware-inventory.log
          if-no-files-found: error
          retention-days: 30

  windows-advisory:
    name: Windows WSL2 platform advisory
    needs: admit
    if: ${{ needs.admit.outputs.windows_status == 'ready' }}
    runs-on: ${{ fromJSON(needs.admit.outputs.windows_labels_json) }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout admitted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admit.outputs.source_sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install App root validation dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Run admitted Windows installer and WSL2 Docker smoke
        id: platform-smoke
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          PWSH: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        run: |
          $ErrorActionPreference = "Stop"
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) {
            throw "checked out source does not match admitted source SHA"
          }
          node --experimental-strip-types --test --test-timeout=120000 tests/release/docker-webui-windows-installer.test.ts *>&1 |
            Tee-Object -FilePath windows-installer-behavior.log
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer behavior validation failed with exit code $LASTEXITCODE"
          }
          wsl.exe --status *>&1 | Tee-Object -FilePath windows-wsl-status.log
          if ($LASTEXITCODE -ne 0) {
            throw "WSL2 status probe failed with exit code $LASTEXITCODE"
          }
          docker version --format '{{json .}}' *>&1 | Tee-Object -FilePath windows-docker-version.log
          if ($LASTEXITCODE -ne 0) {
            throw "Docker engine handshake failed with exit code $LASTEXITCODE"
          }

      - name: Write Windows advisory receipt
        if: ${{ always() }}
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          SOURCE_SHA: ${{ needs.admit.outputs.source_sha }}
          SMOKE_OUTCOME: ${{ steps.platform-smoke.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          $status = "failed"
          $reasonCode = "windows_platform_smoke_failed"
          if ($env:SMOKE_OUTCOME -eq "success") {
            $status = "passed"
            $reasonCode = $null
          }
          @{
            schema = "opl_app_self_hosted_advisory_receipt.v2"
            target = "windows-wsl2"
            source_run_id = $env:SOURCE_RUN_ID
            source_sha = $env:SOURCE_SHA
            status = $status
            reason_code = $reasonCode
            checks = @("windows_installer_behavior", "wsl2_status", "docker_engine_handshake")
            release_blocking = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 windows-wsl2-self-hosted-advisory.json

      - name: Upload Windows advisory receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-self-hosted-advisory-windows-${{ github.run_id }}
          path: |
            windows-wsl2-self-hosted-advisory.json
            windows-installer-behavior.log
            windows-wsl-status.log
            windows-docker-version.log
          if-no-files-found: error
          retention-days: 30
