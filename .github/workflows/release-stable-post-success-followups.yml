name: OPL Stable Follow-ups
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'repair_additive'
    && format('Stable additive repair for source run {0}', inputs.source_run_id)
    || github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile_desktop_platform'
    && format('Desktop {0} reconcile for Stable run {1}', inputs.desktop_platform, inputs.source_run_id)
    || github.event_name == 'workflow_dispatch'
    && format('Stable follow-up {0} for source run {1}', inputs.operation, inputs.source_run_id)
    || format('Stable follow-ups for Stable run {0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed
  workflow_dispatch:
    inputs:
      operation:
        description: Run one exact independent Stable follower or protected same-tag repair.
        required: true
        type: choice
        options:
          - reconcile_full_addon
          - reconcile_homebrew_standard
          - reconcile_homebrew_full
          - reconcile_desktop_platform
          - repair_additive
      source_run_id:
        description: Exact completed Stable source run.
        required: true
        type: string
      smoke_harness_ref:
        description: Optional exact Shell verification SHA for unchanged Full checkpoint bytes.
        required: false
        default: ''
        type: string
      desktop_platform:
        description: Exact independently reconciled Desktop platform.
        required: false
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - windows-x64
      repair_source_commit:
        description: Exact canonical App main commit containing the installer repair.
        required: false
        default: ''
        type: string
      expected_old_asset_id:
        description: Current opl-install.sh GitHub asset ID for compare-and-swap.
        required: false
        default: ''
        type: string
      expected_old_asset_digest:
        description: Current opl-install.sh sha256 digest for compare-and-swap.
        required: false
        default: ''
        type: string
      operator_confirmation:
        description: Type REPAIR ADDITIVE INSTALLER for the protected replacement.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_run_id: ${{ steps.route.outputs.source_run_id }}
      source_operation: ${{ steps.route.outputs.source_operation }}
      observe: ${{ steps.route.outputs.observe }}
      full_addon: ${{ steps.route.outputs.full_addon }}
      homebrew_standard: ${{ steps.route.outputs.homebrew_standard }}
      homebrew_full: ${{ steps.route.outputs.homebrew_full }}
      desktop_platforms: ${{ steps.route.outputs.desktop_platforms }}
      repair_additive: ${{ steps.route.outputs.repair_additive }}
    steps:
      - name: Checkout canonical follow-up router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Route one completed Stable run or explicit reconciliation
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          OPERATION: ${{ inputs.operation || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > stable-source-run.json
            node --experimental-strip-types scripts/stable-followup-router.ts               --event workflow_run --run stable-source-run.json               --output stable-followup-route.json --github-output "$GITHUB_OUTPUT"
          else
            test "$GITHUB_REF" = refs/heads/main
            node --experimental-strip-types scripts/stable-followup-router.ts               --event workflow_dispatch --source-run-id "$SOURCE_RUN_ID" --operation "$OPERATION"               --output stable-followup-route.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Upload typed Stable follow-up route
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-stable-followup-route-${{ steps.route.outputs.source_run_id }}
          path: stable-followup-route.json
          if-no-files-found: error
          retention-days: 30

  observe:
    if: ${{ needs.route.outputs.observe == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout canonical observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/release-followups/observe
        with:
          source_run_id: ${{ needs.route.outputs.source_run_id }}

  reconcile-full-addon:
    if: ${{ needs.route.outputs.full_addon == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: opl-stable-full-addon-${{ needs.route.outputs.source_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    outputs:
      owner_run_id: ${{ steps.full.outputs.owner_run_id }}
      state: ${{ steps.full.outputs.state }}
    steps:
      - name: Checkout canonical Full follower
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/release-followups/full-addon
        id: full
        with:
          source_run_id: ${{ needs.route.outputs.source_run_id }}
          smoke_harness_ref: ${{ inputs.smoke_harness_ref || '' }}
          github_token: ${{ github.token }}

  publish-standard-cask:
    if: ${{ needs.route.outputs.homebrew_standard == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-stable
    concurrency:
      group: opl-homebrew-standard-${{ needs.route.outputs.source_run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout canonical Homebrew Standard follower
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/release-followups/homebrew-standard
        with:
          source_run_id: ${{ needs.route.outputs.source_run_id }}
          github_token: ${{ github.token }}
          homebrew_tap_token: ${{ secrets.OPL_HOMEBREW_TAP_TOKEN }}

  resolve-homebrew-full:
    if: ${{ needs.route.outputs.homebrew_full == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      handoff_base64: ${{ steps.handoff.outputs.handoff_base64 }}
      handoff_sha256: ${{ steps.handoff.outputs.handoff_sha256 }}
      authority_run_id: ${{ steps.handoff.outputs.authority_run_id }}
    steps:
      - name: Checkout canonical Homebrew Full follower
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/release-followups/homebrew-full-handoff
        id: handoff
        with:
          source_run_id: ${{ needs.route.outputs.source_run_id }}
          github_token: ${{ github.token }}

  publish-homebrew-full:
    needs: [resolve-homebrew-full]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_release-homebrew-full-publish.yml
    with:
      authority_run_id: ${{ needs.resolve-homebrew-full.outputs.authority_run_id }}
      handoff_base64: ${{ needs.resolve-homebrew-full.outputs.handoff_base64 }}
      handoff_sha256: ${{ needs.resolve-homebrew-full.outputs.handoff_sha256 }}
    secrets: inherit

  admit:
    if: ${{ needs.route.outputs.desktop_platforms == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_run_id: ${{ steps.source.outputs.source_run_id }}
      operation_kind: ${{ steps.source.outputs.operation_kind }}
      applicable: ${{ steps.source.outputs.applicable }}
      source_artifact: ${{ steps.source.outputs.source_artifact }}
      app_ref: ${{ steps.bind.outputs.app_ref }}
      shell_ref: ${{ steps.bind.outputs.shell_ref }}
      framework_ref: ${{ steps.bind.outputs.framework_ref }}
      version: ${{ steps.bind.outputs.version }}
      updater_version: ${{ steps.bind.outputs.updater_version }}
      source_bundle_digest: ${{ steps.bind.outputs.source_bundle_digest }}
      desktop_platforms: ${{ steps.bind.outputs.desktop_platforms }}
      release_id: ${{ steps.bind.outputs.release_id }}
      release_tag: ${{ steps.bind.outputs.release_tag }}
    steps:
      - name: Validate successful Stable source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.route.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_platform || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            case "$REQUESTED_PLATFORM" in linux-x64|windows-x64) ;; *) exit 1 ;; esac
          else
            [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            test -z "$REQUESTED_PLATFORM"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg run "$SOURCE_RUN_ID" --arg head "$SOURCE_HEAD_SHA" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and ($head == "" or .head_sha == $head)
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' source-run.json >/dev/null
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-operation-admission-$SOURCE_RUN_ID" --dir operation-admission
          mapfile -t admissions < <(find operation-admission -type f -name release-operation-admission.json -print | LC_ALL=C sort)
          test "${#admissions[@]}" = 1
          operation_kind="$(jq -er '.operation | strings' "${admissions[0]}")"
          case "$operation_kind" in
            standard) artifact="opl-release-standard-checkpoint-$SOURCE_RUN_ID"; applicable=true ;;
            resume_standard) artifact="opl-release-standard-operation-checkpoint-$SOURCE_RUN_ID"; applicable=true ;;
            *) echo "::error::Unsupported structured Stable source operation: $operation_kind"; exit 1 ;;
          esac
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_head_sha=$SOURCE_HEAD_SHA"
            echo "source_artifact=$artifact"
            echo "operation_kind=$operation_kind"
            echo "applicable=$applicable"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact Standard checkpoint
        if: ${{ steps.source.outputs.applicable == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.source_artifact }}
          run-id: ${{ steps.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: standard-checkpoint

      - name: Bind one mutable Stable Release Set
        id: bind
        if: ${{ steps.source.outputs.applicable == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ steps.source.outputs.source_artifact }}
          REQUESTED_PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_platform || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t checkpoints < <(find standard-checkpoint -type f -name checkpoint.json -print | LC_ALL=C sort)
          mapfile -t bundles < <(find standard-checkpoint -type f -name bundle.json -print | LC_ALL=C sort)
          mapfile -t controls < <(find standard-checkpoint -type f -name stable-operation-control.json -print | LC_ALL=C sort)
          test "${#checkpoints[@]}" = 1
          test "${#bundles[@]}" = 1
          test "${#controls[@]}" = 1
          checkpoint="${checkpoints[0]}"
          bundle="${bundles[0]}"
          control="${controls[0]}"
          case "$(jq -er .checkpoint_stage "$checkpoint")" in standard_built|standard_qualified) ;; *) exit 1 ;; esac
          jq -e '
            .release.channel == "stable"
            and .release.prerelease == false
            and (.release.version | test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(?:-r[1-9][0-9]*)?$"))
            and (.release.tag == ("v" + .release.version))
            and (.sources.app.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.shell.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.framework.source_commit | test("^[0-9a-f]{40}$"))
          ' "$bundle" >/dev/null
          version="$(jq -er .release.version "$bundle")"
          updater="$(jq -er .release.updater_version "$bundle")"
          tag="$(jq -er .release.tag "$bundle")"
          app="$(jq -er .sources.app.source_commit "$bundle")"
          shell="$(jq -er .sources.shell.source_commit "$bundle")"
          framework="$(jq -er .sources.framework.source_commit "$bundle")"
          bundle_digest="$(jq -er .bundle_digest "$bundle")"
          platforms="$(jq -cer .desktop_additional_platforms "$control")"
          test "$platforms" = '["linux-x64","windows-x64"]'
          if [ -n "$REQUESTED_PLATFORM" ]; then
            jq -e --arg platform "$REQUESTED_PLATFORM" 'index($platform) != null' <<<"$platforms" >/dev/null
            platforms="$(jq -cn --arg platform "$REQUESTED_PLATFORM" '[$platform]')"
          fi
          test "$(jq -er .cohort.app_sha "$control")" = "$app"
          test "$(jq -er .cohort.shell_sha "$control")" = "$shell"
          test "$(jq -er .cohort.framework_sha "$control")" = "$framework"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > stable-release.json
          jq -e --arg tag "$tag" --arg target "$app" '
            .tag_name == $tag and .target_commitish == $target
            and .draft == false and .prerelease == false and .immutable == false
            and ([.assets[].name] | length == (unique | length))
          ' stable-release.json >/dev/null
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_artifact=$SOURCE_ARTIFACT"
            echo "operation_kind=${{ steps.source.outputs.operation_kind }}"
            echo "applicable=true"
            echo "app_ref=$app"
            echo "shell_ref=$shell"
            echo "framework_ref=$framework"
            echo "version=$version"
            echo "updater_version=$updater"
            echo "source_bundle_digest=$bundle_digest"
            echo "desktop_platforms=$platforms"
            echo "release_id=$(jq -er .id stable-release.json)"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

  reconcile-desktop-platforms:
    if: ${{ needs.admit.outputs.applicable == 'true' }}
    needs: [admit]
    strategy:
      fail-fast: false
      matrix:
        platform_id: ${{ fromJSON(needs.admit.outputs.desktop_platforms) }}
    concurrency:
      group: opl-stable-desktop-${{ needs.admit.outputs.source_run_id }}-${{ matrix.platform_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_release-desktop-platform-addon.yml
    with:
      platform_id: ${{ matrix.platform_id }}
      app_ref: ${{ needs.admit.outputs.app_ref }}
      shell_ref: ${{ needs.admit.outputs.shell_ref }}
      framework_ref: ${{ needs.admit.outputs.framework_ref }}
      version: ${{ needs.admit.outputs.version }}
      updater_version: ${{ needs.admit.outputs.updater_version }}
      source_run_id: ${{ needs.admit.outputs.source_run_id }}
      source_bundle_digest: ${{ needs.admit.outputs.source_bundle_digest }}
      release_id: ${{ needs.admit.outputs.release_id }}
      release_tag: ${{ needs.admit.outputs.release_tag }}
    secrets: inherit

  receipt:
    if: ${{ always() && needs.admit.result == 'success' }}
    needs: [admit, reconcile-desktop-platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Write thin Desktop follower receipt
        env:
          SOURCE_RUN_ID: ${{ needs.admit.outputs.source_run_id }}
          OPERATION_KIND: ${{ needs.admit.outputs.operation_kind }}
          RELEASE_TAG: ${{ needs.admit.outputs.release_tag }}
          PLATFORMS: ${{ needs.admit.outputs.desktop_platforms }}
          RECONCILE_RESULT: ${{ needs.reconcile-desktop-platforms.result }}
        shell: bash
        run: |
          jq -n --arg source "$SOURCE_RUN_ID" --arg operation "$OPERATION_KIND" \
            --arg tag "$RELEASE_TAG" --argjson platforms "$PLATFORMS" --arg result "$RECONCILE_RESULT" \
            '{schema:"opl_app_stable_desktop_followup.v1",source_run_id:$source,operation_kind:$operation,release_tag:$tag,platforms:$platforms,platform_reconcile:$result,required_for_standard_or_latest:false,remaining:(if $result == "success" then [] else $platforms end)}' \
            > stable-release-set-followup.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-stable-release-set-followup-${{ needs.admit.outputs.source_run_id }}
          path: stable-release-set-followup.json
          if-no-files-found: error
          retention-days: 30

  repair-admit:
    if: ${{ needs.route.outputs.repair_additive == 'true' }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.bind.outputs.source_run_id }}
      release_id: ${{ steps.bind.outputs.release_id }}
      release_tag: ${{ steps.bind.outputs.release_tag }}
      version: ${{ steps.bind.outputs.version }}
      app_ref: ${{ steps.bind.outputs.app_ref }}
      shell_ref: ${{ steps.bind.outputs.shell_ref }}
      framework_ref: ${{ steps.bind.outputs.framework_ref }}
      expected_body_digest: ${{ steps.bind.outputs.expected_body_digest }}
      expected_old_asset_id: ${{ steps.bind.outputs.expected_old_asset_id }}
      expected_old_asset_size: ${{ steps.bind.outputs.expected_old_asset_size }}
      expected_old_asset_digest: ${{ steps.bind.outputs.expected_old_asset_digest }}
      frozen_assets: ${{ steps.bind.outputs.frozen_assets }}
      repair_source_commit: ${{ steps.bind.outputs.repair_source_commit }}
      public_receipt_name: ${{ steps.bind.outputs.public_receipt_name }}
    steps:
      - name: Checkout exact canonical repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.repair_source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind original Stable publication and additive repair CAS
        id: bind
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPAIR_SOURCE_COMMIT: ${{ inputs.repair_source_commit }}
          EXPECTED_OLD_ASSET_ID: ${{ inputs.expected_old_asset_id }}
          EXPECTED_OLD_ASSET_DIGEST: ${{ inputs.expected_old_asset_digest }}
          OPERATOR_CONFIRMATION: ${{ inputs.operator_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/main
          test "$OPERATOR_CONFIRMATION" = 'REPAIR ADDITIVE INSTALLER'
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPAIR_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_OLD_ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_OLD_ASSET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$REPAIR_SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > main-branch.json
          test "$(jq -er .commit.sha main-branch.json)" = "$REPAIR_SOURCE_COMMIT"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e --arg run "$SOURCE_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
          ' source-run.json >/dev/null
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-bundle-$SOURCE_RUN_ID" --dir source-bundle
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "opl-release-standard-remote-verify-$SOURCE_RUN_ID" --dir original-publication
          mapfile -t bundles < <(find source-bundle -type f -name release-bundle.json -print)
          mapfile -t terminals < <(find original-publication -type f -name mutable-standard-terminal.json -print)
          test "${#bundles[@]}" = 1
          test "${#terminals[@]}" = 1
          bundle="${bundles[0]}"
          terminal="${terminals[0]}"
          jq -e '
            .release.channel == "stable"
            and .release.prerelease == false
            and (.release.tag == ("v" + .release.version))
            and (.sources.app.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.shell.source_commit | test("^[0-9a-f]{40}$"))
            and (.sources.framework.source_commit | test("^[0-9a-f]{40}$"))
          ' "$bundle" >/dev/null
          tag="$(jq -er .release.tag "$bundle")"
          version="$(jq -er .release.version "$bundle")"
          app="$(jq -er .sources.app.source_commit "$bundle")"
          shell="$(jq -er .sources.shell.source_commit "$bundle")"
          framework="$(jq -er .sources.framework.source_commit "$bundle")"
          jq -e --arg tag "$tag" --arg target "$app" '
            .surface_kind == "opl_app_github_release_inspection.v1"
            and .repository == "gaofeng21cn/one-person-lab-app"
            and .tag == $tag
            and .release.exists == true
            and .release.draft == false
            and .release.prerelease == false
            and .release.immutable == false
            and .release.target_commitish == $target
            and ([.assets[].name] | length == (unique | length))
          ' "$terminal" >/dev/null
          frozen_assets="$(jq -ce --arg version "$version" '
            [.assets[] | select(
              .name == "latest-arm64-mac.yml"
              or .name == "latest-mac.yml"
              or .name == ("One-Person-Lab-" + $version + "-mac-arm64.dmg")
              or .name == ("One-Person-Lab-" + $version + "-mac-arm64.zip")
              or .name == ("One-Person-Lab-" + $version + "-mac-arm64.zip.blockmap")
            ) | {name, size:.size_bytes, digest:.sha256}] | select(length == 5)
          ' "$terminal")"
          expected_body_digest="sha256:$(jq -er .release.body_sha256 "$terminal")"
          public_receipt_name="opl-additive-repair-${REPAIR_SOURCE_COMMIT:0:12}.json"

          release_id="$(jq -er .release.id "$terminal")"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > live-release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > live-tag.json
          live_installer="$(jq -ce --arg id "$EXPECTED_OLD_ASSET_ID" --arg digest "$EXPECTED_OLD_ASSET_DIGEST" '
            [.assets[] | select(
              (.id | tostring) == $id
              and .name == "opl-install.sh"
              and .digest == $digest
              and (.size | type == "number" and . > 0)
            )] | select(length == 1) | .[0]
          ' live-release.json)"
          expected_old_size="$(jq -er .size <<<"$live_installer")"
          jq -e --arg tag "$tag" --arg target "$app" '
            .ref == ("refs/tags/" + $tag) and .object.type == "commit" and .object.sha == $target
          ' live-tag.json >/dev/null
          jq -e --argjson id "$release_id" --arg tag "$tag" --arg target "$app" \
            --argjson frozen "$frozen_assets" \
            --arg installer_id "$EXPECTED_OLD_ASSET_ID" --arg installer_digest "$EXPECTED_OLD_ASSET_DIGEST" \
            --arg public_receipt "$public_receipt_name" \
            --argjson installer_size "$expected_old_size" '
            . as $release
            | .id == $id and .tag_name == $tag and .target_commitish == $target
            and .draft == false and .prerelease == false and .immutable == false
            and ([.assets[].name] | length == (unique | length))
            and all($frozen[]; . as $asset | any($release.assets[]; .name == $asset.name and .size == $asset.size and .digest == $asset.digest))
            and ([.assets[] | select((.id | tostring) == $installer_id and .name == "opl-install.sh" and .size == $installer_size and .digest == $installer_digest)] | length == 1)
            and ([.assets[] | select(.name == $public_receipt)] | length == 0)
          ' live-release.json >/dev/null
          live_body_digest="sha256:$(jq -jr .body live-release.json | sha256sum | awk '{print $1}')"
          test "$live_body_digest" = "$expected_body_digest"
          {
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "release_id=$release_id"
            echo "release_tag=$tag"
            echo "version=$version"
            echo "app_ref=$app"
            echo "shell_ref=$shell"
            echo "framework_ref=$framework"
            echo "expected_body_digest=$expected_body_digest"
            echo "expected_old_asset_id=$EXPECTED_OLD_ASSET_ID"
            echo "expected_old_asset_size=$expected_old_size"
            echo "expected_old_asset_digest=$EXPECTED_OLD_ASSET_DIGEST"
            echo "frozen_assets=$frozen_assets"
            echo "repair_source_commit=$REPAIR_SOURCE_COMMIT"
            echo "public_receipt_name=$public_receipt_name"
          } >> "$GITHUB_OUTPUT"

  repair-additive:
    if: ${{ needs.repair-admit.result == 'success' }}
    needs: [repair-admit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-stable
    concurrency:
      group: opl-release-bundle-global
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact canonical repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.repair-admit.outputs.repair_source_commit }}
          fetch-depth: 1
          persist-credentials: false
      - name: Generate exact same-cohort repaired universal installer
        env:
          VERSION: ${{ needs.repair-admit.outputs.version }}
          APP_REF: ${{ needs.repair-admit.outputs.app_ref }}
          SHELL_REF: ${{ needs.repair-admit.outputs.shell_ref }}
          FRAMEWORK_REF: ${{ needs.repair-admit.outputs.framework_ref }}
          FROZEN_ASSETS: ${{ needs.repair-admit.outputs.frozen_assets }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir repair-assets
          node --experimental-strip-types scripts/generate-frozen-universal-installer.ts \
            --source install.sh --output repair-assets/opl-install.sh --version "$VERSION" \
            --app-sha "$APP_REF" --shell-sha "$SHELL_REF" --framework-sha "$FRAMEWORK_REF" \
            --repository "$GITHUB_REPOSITORY"
          jq -e 'select(length == 5 and ([.[].name] | length == (unique | length)))' <<<"$FROZEN_ASSETS" \
            > frozen-assets.json
      - name: Plan additive repair before public mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          node --experimental-strip-types scripts/append-stable-desktop-assets.ts
          --repository "$GITHUB_REPOSITORY"
          --release-id "${{ needs.repair-admit.outputs.release_id }}"
          --tag "${{ needs.repair-admit.outputs.release_tag }}"
          --target "${{ needs.repair-admit.outputs.app_ref }}"
          --asset-dir repair-assets
          --output additive-repair-plan.json
          --repair-additive
          --expected-old-asset-id "${{ needs.repair-admit.outputs.expected_old_asset_id }}"
          --expected-old-asset-size "${{ needs.repair-admit.outputs.expected_old_asset_size }}"
          --expected-old-asset-digest "${{ needs.repair-admit.outputs.expected_old_asset_digest }}"
          --expected-body-digest "${{ needs.repair-admit.outputs.expected_body_digest }}"
          --frozen-assets frozen-assets.json
          --repair-source "${{ needs.repair-admit.outputs.repair_source_commit }}"
          --source-run-id "${{ needs.repair-admit.outputs.source_run_id }}"
          --public-receipt-name "${{ needs.repair-admit.outputs.public_receipt_name }}"
      - name: Upload pre-mutation additive repair plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-stable-additive-repair-plan-${{ needs.repair-admit.outputs.source_run_id }}
          path: additive-repair-plan.json
          if-no-files-found: error
          retention-days: 30
      - name: Replace only opl-install.sh and publish additive repair receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          node --experimental-strip-types scripts/append-stable-desktop-assets.ts
          --repository "$GITHUB_REPOSITORY"
          --release-id "${{ needs.repair-admit.outputs.release_id }}"
          --tag "${{ needs.repair-admit.outputs.release_tag }}"
          --target "${{ needs.repair-admit.outputs.app_ref }}"
          --asset-dir repair-assets
          --output "${{ needs.repair-admit.outputs.public_receipt_name }}"
          --repair-additive
          --expected-old-asset-id "${{ needs.repair-admit.outputs.expected_old_asset_id }}"
          --expected-old-asset-size "${{ needs.repair-admit.outputs.expected_old_asset_size }}"
          --expected-old-asset-digest "${{ needs.repair-admit.outputs.expected_old_asset_digest }}"
          --expected-body-digest "${{ needs.repair-admit.outputs.expected_body_digest }}"
          --frozen-assets frozen-assets.json
          --repair-source "${{ needs.repair-admit.outputs.repair_source_commit }}"
          --source-run-id "${{ needs.repair-admit.outputs.source_run_id }}"
          --public-receipt-name "${{ needs.repair-admit.outputs.public_receipt_name }}"
          --apply
      - name: Upload additive repair receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-stable-additive-repair-${{ needs.repair-admit.outputs.source_run_id }}
          path: ${{ needs.repair-admit.outputs.public_receipt_name }}
          if-no-files-found: error
          retention-days: 30
