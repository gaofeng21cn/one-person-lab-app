name: OPL Updater Upgrade VM

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup.
        required: false
        default: execute
        type: string
      candidate_artifact_name:
        description: Same-run artifact containing the bound Standard asset set.
        required: true
        type: string
      candidate_artifact_run_id:
        description: Run that owns candidate_artifact_name.
        required: true
        type: string
      baseline_dmg_url:
        description: Exact public DMG URL for the installed predecessor.
        required: true
        type: string
      baseline_dmg_sha256:
        description: Exact SHA-256 of the installed predecessor DMG.
        required: true
        type: string
      baseline_display_version:
        description: Display/tag version of the installed predecessor.
        required: true
        type: string
      baseline_updater_version:
        description: Machine version exposed by the installed predecessor.
        required: true
        type: string
      candidate_display_version:
        description: Display/tag/asset version for the candidate.
        required: true
        type: string
      candidate_updater_version:
        description: Machine version carried by the candidate App and updater feed.
        required: true
        type: string
      release_bundle_digest:
        description: Exact immutable Framework Release Bundle digest.
        required: true
        type: string
      standard_identity_sha256:
        description: Exact digest of the sealed Standard identity receipt.
        required: false
        default: ''
        type: string
      app_ref:
        description: Exact App source SHA in the Bundle.
        required: true
        type: string
      shell_ref:
        description: Exact Shell source SHA and updater harness.
        required: true
        type: string
      framework_ref:
        description: Exact Framework source SHA in the Bundle.
        required: true
        type: string
      operation:
        description: Release operation inherited from the Bundle controller.
        required: false
        default: standard
        type: string
      operation_started_at:
        description: Immutable outer operation start timestamp.
        required: false
        default: ''
        type: string
      operation_deadline_at:
        description: Immutable outer operation deadline; never recomputed here.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: opl-updater-upgrade-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove updater validation-only topology starts
        run: |
          test '${{ inputs.release_bundle_digest }}' = sha256:canary
          test '${{ inputs.operation }}' = standard
          test '${{ inputs.framework_ref }}' = ad09977d7cdfc6cb3d1c04f7f1e6fd9358a7a2fc

  upgrade:
    name: Upgrade installed predecessor with exact candidate ZIP
    runs-on: [self-hosted, macOS, ARM64, opl-cert-mac-tart]
    if: ${{ inputs.mode != 'canary' }}
    timeout-minutes: 30
    env:
      OPL_FIRST_RUN_TART_SOURCE: ${{ vars.OPL_FIRST_RUN_TART_SOURCE }}
      OPL_FIRST_RUN_GUEST_USER: ${{ vars.OPL_FIRST_RUN_GUEST_USER }}
      OPL_FIRST_RUN_GUEST_SSH_KEY: ${{ vars.OPL_FIRST_RUN_GUEST_SSH_KEY }}
    steps:
      - name: Reject replay and invalid frozen identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-evidence
          touch updater-evidence/stdout.txt updater-evidence/stderr.txt
          exec > >(tee -a updater-evidence/stdout.txt) 2> >(tee -a updater-evidence/stderr.txt >&2)
          printf '%s\0' '${{ inputs.operation }}' '${{ inputs.operation_started_at }}' '${{ inputs.operation_deadline_at }}' \
            '${{ inputs.release_bundle_digest }}' '${{ inputs.app_ref }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}' \
            | shasum -a 256 | awk '{print "sha256:"$1}' > updater-evidence/input-digest.txt
          input_digest="$(cat updater-evidence/input-digest.txt)"
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          node <<'NODE' || { status=failed; reason=deadline_elapsed; }
          const started = Date.parse('${{ inputs.operation_started_at }}');
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          case '${{ inputs.operation }}' in standard|resume_standard) ;; *) status=failed; reason=operation_invalid ;; esac
          if [ "$status" = passed ] && ! [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]; then status=failed; reason=bundle_digest_invalid; fi
          if [ "$status" = passed ] && [ '${{ inputs.release_bundle_digest }}' = sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 ]; then status=failed; reason=bundle_permanently_rejected; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.app_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=app_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.shell_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=shell_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.framework_ref }}' =~ ^[0-9a-f]{40}$ ]]; then status=failed; reason=framework_sha_invalid; fi
          if [ "$status" = passed ] && ! [[ '${{ inputs.standard_identity_sha256 }}' =~ ^sha256:[0-9a-f]{64}$ ]]; then status=failed; reason=standard_identity_invalid; fi
          jq -n --arg status "$status" --arg reason "$reason" --arg operation '${{ inputs.operation }}' --arg input_digest "$input_digest" \
            '{schema:"opl_release_nested_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,input_digest:$input_digest,evidence:{stdout:"stdout.txt",stderr:"stderr.txt"},run_id:env.GITHUB_RUN_ID,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > updater-evidence/operation-admission.json
          test "$status" = passed
          [[ '${{ inputs.baseline_dmg_sha256 }}' =~ ^[0-9a-f]{64}$ ]] || { echo "::error::baseline_dmg_sha256 must be exact."; exit 1; }
          [[ '${{ inputs.release_bundle_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::release_bundle_digest must be exact."; exit 1; }
          [[ '${{ inputs.standard_identity_sha256 }}' =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::standard_identity_sha256 must be exact."; exit 1; }
          test '${{ inputs.release_bundle_digest }}' != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49 || { echo "::error::release_bundle_digest is permanently rejected."; exit 1; }
          for sha in '${{ inputs.app_ref }}' '${{ inputs.shell_ref }}' '${{ inputs.framework_ref }}'; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Bundle source ref must be an exact SHA."; exit 1; }
          done

      - name: Checkout frozen Shell updater harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref }}
          path: shell-source

      - name: Setup host Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Checkout frozen App metadata parser
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          path: app-source

      - name: Download exact bound Standard asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.candidate_artifact_name }}
          run-id: ${{ inputs.candidate_artifact_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Download and fingerprint the installed predecessor
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p updater-inputs updater-evidence
          old_dmg="updater-inputs/One-Person-Lab-${{ inputs.baseline_updater_version }}-mac-arm64.dmg"
          download_timeout_seconds="$(DEADLINE='${{ inputs.operation_deadline_at }}' node --input-type=module -e '
            const deadlineMs = Date.parse(process.env.DEADLINE || "");
            const reserveMs = 8 * 60_000;
            const boundedMs = Math.min(10 * 60_000, deadlineMs - Date.now() - reserveMs);
            if (!Number.isFinite(deadlineMs) || boundedMs < 1_000) process.exit(78);
            process.stdout.write(String(Math.max(1, Math.floor(boundedMs / 1000))));
          ')" || { echo "::error::operation_deadline_elapsed: predecessor download cannot preserve qualification evidence time."; exit 78; }
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time "$download_timeout_seconds" \
            '${{ inputs.baseline_dmg_url }}' --output "$old_dmg"
          observed="$(shasum -a 256 "$old_dmg" | awk '{print $1}')"
          test "$observed" = '${{ inputs.baseline_dmg_sha256 }}' || {
            echo "::error::Installed predecessor DMG digest mismatch: $observed"
            exit 1
          }
          find candidate -type f -name latest-arm64-mac.yml -print > updater-inputs/metadata-paths.txt
          [ "$(wc -l < updater-inputs/metadata-paths.txt | tr -d ' ')" -eq 1 ] || { echo "::error::Bound Standard artifact must contain exactly one updater metadata file."; exit 1; }
          metadata="$(sed -n '1p' updater-inputs/metadata-paths.txt)"
          feed_dir="$(dirname "$metadata")"
          zip="$feed_dir/One-Person-Lab-${{ inputs.candidate_display_version }}-mac-arm64.zip"
          blockmap="$zip.blockmap"
          test -s "$zip" && test -s "$blockmap" || { echo "::error::Bound Standard artifact has no exact candidate ZIP feed."; exit 1; }
          find candidate -type f -path '*/tracks/standard/assets.json' -print > updater-inputs/standard-asset-manifest-paths.txt
          [ "$(wc -l < updater-inputs/standard-asset-manifest-paths.txt | tr -d ' ')" -eq 1 ] || { echo "::error::Bound checkpoint must contain exactly one tracks/standard/assets.json."; exit 1; }
          standard_assets_manifest="$(sed -n '1p' updater-inputs/standard-asset-manifest-paths.txt)"
          identity_receipts=()
          while IFS= read -r receipt; do identity_receipts+=("$receipt"); done < <(
            find candidate -type f -name standard-identity-receipt.json -print | LC_ALL=C sort
          )
          test "${#identity_receipts[@]}" -eq 1 || {
            echo "::error::Bound checkpoint must contain exactly one Standard identity receipt."
            exit 1
          }
          identity_receipt="${identity_receipts[0]}"
          test -s "$identity_receipt" && test ! -L "$identity_receipt"
          observed_identity_sha256="sha256:$(shasum -a 256 "$identity_receipt" | awk '{print $1}')"
          expected_identity_sha256='${{ inputs.standard_identity_sha256 }}'
          test "$observed_identity_sha256" = "$expected_identity_sha256" || {
            echo "::error::Standard identity digest mismatch: expected $expected_identity_sha256, got $observed_identity_sha256."
            exit 1
          }
          jq -e \
            --arg bundle '${{ inputs.release_bundle_digest }}' \
            --arg app '${{ inputs.app_ref }}' \
            --arg shell '${{ inputs.shell_ref }}' \
            --arg framework '${{ inputs.framework_ref }}' \
            '
              .schema == "opl_standard_release_identity_receipt.v2"
              and .status == "passed"
              and .source.run_attempt == 1
              and .release.bundle_digest == $bundle
              and .cohort == {
                app_sha: $app,
                shell_sha: $shell,
                framework_sha: $framework
              }
            ' "$identity_receipt" >/dev/null
          test "$(jq -er .surface_kind "$standard_assets_manifest")" = opl_release_bundle_staged_assets.v1
          test "$(jq -er .track "$standard_assets_manifest")" = standard
          expected_zip="$(dirname "$standard_assets_manifest")/assets/$(basename "$zip")"
          test "$zip" = "$expected_zip" || { echo "::error::Candidate ZIP is not the checkpoint-declared Standard asset path."; exit 1; }
          checkpoint_zip_entry="$(jq -cer --arg name "$(basename "$zip")" '.assets | map(select(.name == $name)) | if length == 1 then .[0] else error("candidate ZIP entry must be unique") end' "$standard_assets_manifest")"
          checkpoint_zip_sha256="$(jq -er '.sha256 | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$checkpoint_zip_entry")"
          checkpoint_zip_size="$(jq -er '.size_bytes | select(type == "number" and . > 0 and floor == .)' <<<"$checkpoint_zip_entry")"
          identity_zip_sha256="$(jq -er '.updater_zip.sha256 | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' "$identity_receipt")"
          test "$identity_zip_sha256" = "$checkpoint_zip_sha256" || {
            echo "::error::Standard identity updater ZIP digest differs from the checkpoint asset manifest."
            exit 1
          }
          echo "old_dmg=$old_dmg" >> "$GITHUB_OUTPUT"
          echo "feed_dir=$feed_dir" >> "$GITHUB_OUTPUT"
          {
            echo "baseline_dmg_sha256=$observed"
            candidate_zip_sha256="$(shasum -a 256 "$zip" | awk '{print $1}')"
            candidate_zip_size="$(wc -c < "$zip" | tr -d ' ')"
            test "sha256:$candidate_zip_sha256" = "$checkpoint_zip_sha256" || { echo "::error::Candidate ZIP SHA-256 does not match tracks/standard/assets.json."; exit 1; }
            test "$candidate_zip_size" = "$checkpoint_zip_size" || { echo "::error::Candidate ZIP size does not match tracks/standard/assets.json."; exit 1; }
            metadata_json="$(ruby -ryaml -rjson -e '
              doc = YAML.safe_load(File.read(ARGV[0]), permitted_classes: [Time], aliases: true) || {}
              name = ARGV[1]
              entry = Array(doc["files"]).find { |candidate| File.basename(candidate["url"].to_s) == name }
              abort("missing updater metadata file entry") unless entry
              puts JSON.generate({"sha512" => entry["sha512"], "size" => entry["size"], "url" => entry["url"]})
            ' "$metadata" "$(basename "$zip")")"
            declared_sha512="$(jq -er .sha512 <<<"$metadata_json")"
            declared_size="$(jq -er .size <<<"$metadata_json")"
            actual_sha512="$(openssl dgst -sha512 -binary "$zip" | base64 | awk '{printf "%s", $0}')"
            test "$declared_sha512" = "$actual_sha512" || { echo "::error::Updater metadata SHA-512 does not match candidate ZIP."; exit 1; }
            test "$declared_size" = "$candidate_zip_size" || { echo "::error::Updater metadata size does not match candidate ZIP."; exit 1; }
            echo "candidate_zip_sha256=$candidate_zip_sha256"
            echo "candidate_zip_size=$candidate_zip_size"
            echo "checkpoint_declared_zip_sha256=$checkpoint_zip_sha256"
            echo "checkpoint_declared_zip_size=$checkpoint_zip_size"
            echo "checkpoint_assets_manifest_sha256=$(shasum -a 256 "$standard_assets_manifest" | awk '{print $1}')"
            echo "candidate_zip_sha512=$actual_sha512"
            echo "metadata_declared_size=$declared_size"
            echo "metadata_declared_sha512=$declared_sha512"
            echo "candidate_blockmap_sha256=$(shasum -a 256 "$blockmap" | awk '{print $1}')"
            echo "candidate_metadata_sha256=$(shasum -a 256 "$metadata" | awk '{print $1}')"
          } > updater-evidence/input-digests.txt
          jq -n \
            --arg zip_sha256 "$candidate_zip_sha256" --arg zip_sha512 "$actual_sha512" \
            --argjson zip_size "$candidate_zip_size" --arg metadata_sha256 "$(shasum -a 256 "$metadata" | awk '{print $1}')" \
            '{schema:"opl_updater_candidate_zip_identity.v1",sha256:$zip_sha256,sha512:$zip_sha512,size_bytes:$zip_size,metadata_sha256:("sha256:"+$metadata_sha256)}' \
            > updater-evidence/candidate-zip-identity.json

      - name: Recalculate immutable operation budget before updater qualification
        id: updater_budget
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types app-source/scripts/release-operation-deadline.ts check \
            --operation '${{ inputs.operation }}' \
            --started-at '${{ inputs.operation_started_at }}' \
            --deadline-at '${{ inputs.operation_deadline_at }}'
          timeout_ms="$(DEADLINE='${{ inputs.operation_deadline_at }}' node --input-type=module -e '
            const deadlineMs = Date.parse(process.env.DEADLINE || "");
            const evidenceReserveMs = 5 * 60_000;
            const remainingMs = deadlineMs - Date.now() - evidenceReserveMs;
            if (!Number.isFinite(deadlineMs) || remainingMs < 1_000) process.exit(78);
            process.stdout.write(String(Math.min(1_500_000, remainingMs)));
          ')" || {
            echo "::error::operation_deadline_elapsed: updater qualification cannot start without five minutes reserved for durable evidence."
            exit 78
          }
          echo "timeout_ms=$timeout_ms" >> "$GITHUB_OUTPUT"

      - name: Write typed terminal receipt before updater harness
        shell: bash
        run: |
          set -euo pipefail
          input_digest="$(cat updater-evidence/input-digest.txt)"
          candidate_identity_sha256="$(shasum -a 256 updater-evidence/candidate-zip-identity.json | awk '{print "sha256:"$1}')"
          jq -n \
            --arg input_digest "$input_digest" \
            --arg bundle_digest '${{ inputs.release_bundle_digest }}' \
            --arg operation '${{ inputs.operation }}' \
            --arg operation_started_at '${{ inputs.operation_started_at }}' \
            --arg operation_deadline_at '${{ inputs.operation_deadline_at }}' \
            --arg candidate_identity_sha256 "$candidate_identity_sha256" \
            --argjson harness_timeout_ms '${{ steps.updater_budget.outputs.timeout_ms }}' \
            '{schema:"opl_updater_harness_terminal_receipt.v1",status:"ready",mutation_authority:false,input_digest:$input_digest,bundle_digest:$bundle_digest,operation:$operation,operation_started_at:$operation_started_at,operation_deadline_at:$operation_deadline_at,candidate_identity_sha256:$candidate_identity_sha256,harness_timeout_ms:$harness_timeout_ms,next_action:"run_exact_frozen_updater_harness"}' \
            > updater-evidence/pre-harness-terminal-receipt.json

      - name: Run real predecessor-to-candidate updater qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r .status updater-evidence/pre-harness-terminal-receipt.json)" = ready
          source_vm="${OPL_FIRST_RUN_TART_SOURCE:-}"
          test -n "$source_vm" || { echo "::error::OPL_FIRST_RUN_TART_SOURCE is not configured."; exit 1; }
          guest_user="${OPL_FIRST_RUN_GUEST_USER:-runner}"
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          args=(
            --source-vm "$source_vm"
            --old-dmg '${{ steps.inputs.outputs.old_dmg }}'
            --feed-dir '${{ steps.inputs.outputs.feed_dir }}'
            --expected-current-display-version '${{ inputs.baseline_display_version }}'
            --expected-current-version '${{ inputs.baseline_updater_version }}'
            --expected-display-version '${{ inputs.candidate_display_version }}'
            --expected-updater-version '${{ inputs.candidate_updater_version }}'
            --guest-node-root "$node_root"
            --guest-user "$guest_user"
            --artifacts updater-evidence
            --timeout-ms '${{ steps.updater_budget.outputs.timeout_ms }}'
            --bundle-digest '${{ inputs.release_bundle_digest }}'
            --app-sha '${{ inputs.app_ref }}'
            --shell-sha '${{ inputs.shell_ref }}'
            --framework-sha '${{ inputs.framework_ref }}'
          )
          if [ -n "${OPL_FIRST_RUN_GUEST_SSH_KEY:-}" ]; then
            args+=(--ssh-key "$OPL_FIRST_RUN_GUEST_SSH_KEY")
          fi
          node shell-source/scripts/release/opl-updater-tart-smoke.mjs "${args[@]}"

      - name: Verify Latest activation receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=updater-evidence/updater-upgrade-qualification-receipt.json
          identity=updater-evidence/candidate-zip-identity.json
          test "$(jq -r '.status' "$receipt")" = passed
          test "$(jq -r '.latest_activation_allowed' "$receipt")" = true
          test "$(jq -r '.bundle_digest' "$receipt")" = '${{ inputs.release_bundle_digest }}'
          test "$(jq -r '.cohort.app_sha' "$receipt")" = '${{ inputs.app_ref }}'
          test "$(jq -r '.cohort.shell_sha' "$receipt")" = '${{ inputs.shell_ref }}'
          test "$(jq -r '.cohort.framework_sha' "$receipt")" = '${{ inputs.framework_ref }}'
          test "$(jq -r '.baseline.display_version' "$receipt")" = '${{ inputs.baseline_display_version }}'
          test "$(jq -r '.baseline.updater_version' "$receipt")" = '${{ inputs.baseline_updater_version }}'
          test "$(jq -r '.baseline.dmg.sha256' "$receipt")" = '${{ inputs.baseline_dmg_sha256 }}'
          test "$(jq -r '.candidate.display_version' "$receipt")" = '${{ inputs.candidate_display_version }}'
          test "$(jq -r '.candidate.updater_version' "$receipt")" = '${{ inputs.candidate_updater_version }}'
          test "$(jq -r '.qualification.same_candidate_zip_downloaded' "$receipt")" = true
          test "$(jq -r '.qualification.install_and_restart_completed' "$receipt")" = true
          test "$(jq -r '.qualification.installed_app_version' "$receipt")" = '${{ inputs.candidate_updater_version }}'
          test "$(jq -r '.qualification.second_check_no_update' "$receipt")" = true
          test "$(jq -r '.qualification.allow_downgrade' "$receipt")" = false
          test "$(jq -r '.schema' "$identity")" = opl_updater_candidate_zip_identity.v1
          zip_sha="$(jq -er '.sha256 | select(test("^[0-9a-f]{64}$"))' "$identity")"
          zip_size="$(jq -er '.size_bytes | select(type == "number" and . > 0 and floor == .)' "$identity")"
          test "$(jq -r '.candidate.feed.zip.sha256' "$receipt")" = "$zip_sha"
          test "$(jq -r '.candidate.feed.zip.size_bytes' "$receipt")" = "$zip_size"
          [[ "$(cat updater-evidence/input-digest.txt)" =~ ^sha256:[0-9a-f]{64}$ ]]
          shasum -a 256 "$receipt" > updater-evidence/updater-upgrade-qualification-receipt.sha256

      - name: Upload exact updater qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-updater-upgrade-${{ inputs.baseline_display_version }}-${{ github.run_id }}
          path: updater-evidence
          if-no-files-found: warn
          retention-days: 30
