name: OPL Full Bundle Add-on

on:
  workflow_call:
    inputs:
      operation:
        description: append_full for the independent Full operation
        required: false
        default: append_full
        type: string
      source_run_id:
        description: Exact run containing the verified Standard checkpoint
        required: true
        type: string
      source_artifact:
        description: Exact verified Standard checkpoint artifact
        required: true
        type: string
      source_format:
        description: Must be checkpoint_v1
        required: false
        default: checkpoint_v1
        type: string
      full_content_app_ref:
        description: Exact App SHA whose bytes are packaged into the fresh Full asset
        required: true
        type: string
      full_content_shell_ref:
        description: Exact Shell SHA whose bytes are packaged into the fresh Full asset
        required: true
        type: string
      full_content_framework_ref:
        description: Exact Framework SHA whose bytes are packaged into the fresh Full asset
        required: true
        type: string
      framework_executor_ref:
        description: Exact Framework executor SHA used to verify and import the checkpoint; independent from the frozen Bundle source SHA
        required: true
        type: string
      prior_full_artifact_run_id:
        description: Exact failed append_full run containing reusable unchanged Full bytes
        required: false
        default: ''
        type: string
      smoke_harness_ref:
        description: Exact opl-aion-shell verification ref for unchanged Full checkpoint requalification; empty uses the frozen product Shell ref
        required: false
        default: ''
        type: string
      operation_started_at:
        description: Full append operation start
        required: false
        default: ''
        type: string
      operation_deadline_at:
        description: Full append mutation deadline
        required: false
        default: ''
        type: string
    outputs:
      checkpoint_transport_executor:
        description: Executor that transported the checkpoint into this run
        value: ${{ jobs.provenance.outputs.checkpoint_transport_executor }}
      transport_run_id:
        description: Run that transported the checkpoint into this run
        value: ${{ jobs.provenance.outputs.transport_run_id }}
      completed_stage:
        description: Highest completed Framework checkpoint stage
        value: ${{ jobs.provenance.outputs.completed_stage }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPL_FULL_CHECKPOINT_ARTIFACT: opl-release-full-checkpoint-${{ github.run_id }}

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout canonical App executor for admission dry-run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: app-source

      - name: Validate locked App dependencies and Full control-plane bindings
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
          npm ci --ignore-scripts --dry-run >/dev/null
          node - <<'NODE'
          const fs = require('node:fs');
          const contract = JSON.parse(fs.readFileSync('contracts/app-release-channel.json', 'utf8'));
          const policy = contract.full_first_install?.published_addon?.asset_policy;
          if (!policy || policy.additional_assets_allowed !== true) {
            throw new Error('Full append admission requires the additive asset policy.');
          }
          if (policy.same_name_different_digest !== 'reject_without_mutation'
            || policy.duplicate_name !== 'reject_without_mutation'
            || policy.standard_assets_modified !== false) {
            throw new Error('Full append asset integrity policy is incomplete.');
          }
          NODE
          grep -E -q 'working-directory: release-executor' .github/workflows/full-first-install-release.yml
          grep -E -q -- '--gui-root "\$GITHUB_WORKSPACE/one-person-lab-app/shells/aionui"' .github/workflows/full-first-install-release.yml
          grep -E -q -- '--out-dir "\$GITHUB_WORKSPACE/one-person-lab-app/dist/opl-full-release"' .github/workflows/full-first-install-release.yml

      - name: Admit one-shot Full append operation
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_FORMAT: ${{ inputs.source_format }}
          FULL_CONTENT_APP_REF: ${{ inputs.full_content_app_ref }}
          FULL_CONTENT_SHELL_REF: ${{ inputs.full_content_shell_ref }}
          FULL_CONTENT_FRAMEWORK_REF: ${{ inputs.full_content_framework_ref }}
          FRAMEWORK_EXECUTOR_REF: ${{ inputs.framework_executor_ref }}
          PRIOR_FULL_ARTIFACT_RUN_ID: ${{ inputs.prior_full_artifact_run_id }}
          SMOKE_HARNESS_REF: ${{ inputs.smoke_harness_ref }}
          OPERATION_STARTED_AT: ${{ inputs.operation_started_at }}
          OPERATION_DEADLINE_AT: ${{ inputs.operation_deadline_at }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FRAMEWORK_EXECUTOR_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Framework executor must be an exact lowercase SHA."
            exit 1
          }
          for ref in "$FULL_CONTENT_APP_REF" "$FULL_CONTENT_SHELL_REF" "$FULL_CONTENT_FRAMEWORK_REF"; do
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::Fresh Full content refs must be exact lowercase SHAs."
              exit 1
            }
          done
          test "$SOURCE_FORMAT" = checkpoint_v1
          if [ -n "$PRIOR_FULL_ARTIFACT_RUN_ID" ]; then
            test "$OPERATION" = append_full
            [[ "$PRIOR_FULL_ARTIFACT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            test "$PRIOR_FULL_ARTIFACT_RUN_ID" != "$GITHUB_RUN_ID"
            if [ -n "$SMOKE_HARNESS_REF" ]; then
              [[ "$SMOKE_HARNESS_REF" =~ ^[0-9a-f]{40}$ ]]
            fi
          elif [ -n "$SMOKE_HARNESS_REF" ]; then
            [[ "$SMOKE_HARNESS_REF" =~ ^[0-9a-f]{40}$ ]]
            case '${{ inputs.source_artifact }}' in
              "opl-release-full-checkpoint-${{ inputs.source_run_id }}"|"opl-release-append-full-operation-checkpoint-v2-${{ inputs.source_run_id }}") ;;
              *) echo "::error::smoke_harness_ref requires an exact reusable Full checkpoint."; exit 1 ;;
            esac
          fi
          mkdir -p release-failure-evidence
          status=passed
          reason=admitted
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then status=failed; reason=workflow_rerun; fi
          if [ -n "$OPERATION_STARTED_AT" ] || [ -n "$OPERATION_DEADLINE_AT" ]; then
            node <<'NODE' || { status=failed; reason=deadline_invalid; }
          const started = Date.parse(process.env.OPERATION_STARTED_AT);
          const deadline = Date.parse(process.env.OPERATION_DEADLINE_AT);
          if (!Number.isFinite(started) || !Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE
          fi
          jq -n --arg status "$status" --arg reason "$reason" --arg operation "$OPERATION" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema:"opl_release_operation_admission_receipt.v1",status:$status,reason:$reason,operation:$operation,run_id:$run_id,run_attempt:env.GITHUB_RUN_ATTEMPT}' \
            > release-failure-evidence/operation-admission.json
          test "$status" = passed
      - name: Upload Full admission evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-full-admission-${{ github.run_id }}
          path: release-failure-evidence
          if-no-files-found: error
          retention-days: 30

  restore-standard:
    if: ${{ needs.admission.result == 'success' }}
    needs: [admission]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      updater_version: ${{ steps.identity.outputs.updater_version }}
      tag: ${{ steps.identity.outputs.tag }}
      bundle_digest: ${{ steps.identity.outputs.bundle_digest }}
      app_ref: ${{ steps.identity.outputs.app_ref }}
      shell_ref: ${{ steps.identity.outputs.shell_ref }}
      framework_source_ref: ${{ steps.identity.outputs.framework_source_ref }}
      target_standard_release_id: ${{ steps.identity.outputs.target_standard_release_id }}
      target_standard_release_tag: ${{ steps.identity.outputs.target_standard_release_tag }}
      target_standard_declared_commitish: ${{ steps.identity.outputs.target_standard_declared_commitish }}
      target_standard_target_commitish: ${{ steps.identity.outputs.target_standard_target_commitish }}
      framework_executor_ref: ${{ steps.checkpoint.outputs.framework_executor_ref }}
      completed_stage: ${{ steps.identity.outputs.completed_stage }}
      checkpoint_transport_executor: ${{ steps.identity.outputs.checkpoint_transport_executor }}
      transport_run_id: ${{ steps.identity.outputs.transport_run_id }}
      source_run_id: ${{ steps.operation.outputs.source_run_id }}
      source_artifact: ${{ steps.operation.outputs.source_artifact }}
      operation_id: ${{ steps.operation.outputs.operation_id }}
      operation_started_at: ${{ steps.operation.outputs.operation_started_at }}
      operation_deadline_at: ${{ steps.operation.outputs.operation_deadline_at }}
    steps:
      - name: Recheck one-shot deadline before checkpoint transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          node <<'NODE'
          const deadline = Date.parse('${{ inputs.operation_deadline_at }}');
          if (!Number.isFinite(deadline) || Date.now() >= deadline) process.exit(1);
          NODE

      - name: Checkout canonical App executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', path: app-source }

      - name: Download checkpoint identity bootstrap
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.source_artifact }}
          path: checkpoint-identity-bootstrap
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve Bundle-bound Framework identity
        id: framework-binding
        shell: bash
        run: |
          set -euo pipefail
          checkpoints=()
          while IFS= read -r checkpoint; do
            checkpoints+=("$checkpoint")
          done < <(find checkpoint-identity-bootstrap -type f -name checkpoint.json -print)
          [ "${#checkpoints[@]}" -eq 1 ] || {
            echo "::error::Portable checkpoint artifact must contain exactly one checkpoint.json."
            exit 1
          }
          bundle="$(dirname "${checkpoints[0]}")/bundle.json"
          test -f "$bundle" || { echo "::error::Portable checkpoint contains no bundle.json."; exit 1; }
          framework_source_ref="$(jq -er '.sources.framework.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$bundle")"
          echo "framework_source_ref=$framework_source_ref" >> "$GITHUB_OUTPUT"

      - name: Restore verified Standard checkpoint
        id: checkpoint
        uses: ./app-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ inputs.framework_executor_ref }}
          source-run-id: ${{ inputs.source_run_id }}
          source-artifact: ${{ inputs.source_artifact }}
          github-token: ${{ github.token }}
          allow-reconcile-required: 'true'

      - name: Require a verified Standard checkpoint and fresh Full eligibility
        env:
          CHECKPOINT_IMPORT: ${{ steps.checkpoint.outputs.checkpoint_import_json }}
          BUNDLE_DIGEST: ${{ steps.checkpoint.outputs.bundle_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHECKPOINT_IMPORT"
          test "$(jq -r .rebuild_performed <<<"$CHECKPOINT_IMPORT")" = false
          test "$(jq -r .publish_state_imported <<<"$CHECKPOINT_IMPORT")" = false
          test "$BUNDLE_DIGEST" != sha256:91d5ea069757fca6bb9aa2280615dc952caeff55b6b4bc13e08e40df32378f49
          test '${{ steps.checkpoint.outputs.framework_source_ref }}' = '${{ steps.framework-binding.outputs.framework_source_ref }}'
          test '${{ steps.checkpoint.outputs.framework_executor_ref }}' = '${{ inputs.framework_executor_ref }}'

      - name: Reconcile imported outcome and admit same-tag Full control
        id: operation
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIGEST: ${{ steps.checkpoint.outputs.bundle_digest }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          store='${{ steps.checkpoint.outputs.store_dir }}'
          framework-executor/bin/opl release status \
            --bundle "$BUNDLE_DIGEST" --store "$store" --json > append-operation-status-before.json
          operation_id="$(jq -r '.release_bundle_status.operation_controls.append_full.operation_id // ""' append-operation-status-before.json)"
          operation_started_at="$(jq -r '.release_bundle_status.operation_controls.append_full.operation_started_at // ""' append-operation-status-before.json)"
          operation_deadline_at="$(jq -r '.release_bundle_status.operation_controls.append_full.operation_deadline_at // ""' append-operation-status-before.json)"
          if [ -z "$operation_id" ]; then
            operation_id="gha-${GITHUB_RUN_ID}-append-full"
            operation_started_at='${{ inputs.operation_started_at }}'
            operation_deadline_at='${{ inputs.operation_deadline_at }}'
          fi
          [[ "$operation_id" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]
          operation_args=(
            --operation append_full
            --operation-id "$operation_id"
            --operation-started-at "$operation_started_at"
            --operation-deadline-at "$operation_deadline_at"
          )
          marker_count="$(jq -er '.release_bundle_status.active_unknown_markers | length' append-operation-status-before.json)"
          if [ "$marker_count" -gt 0 ]; then
            test "$marker_count" -eq 1
            marker="$(jq -cer '.release_bundle_status.active_unknown_markers[0]' append-operation-status-before.json)"
            test "$(jq -r .operation_id <<<"$marker")" = "$operation_id"
            test "$(jq -r .operation_kind <<<"$marker")" = append_full
            test "$(jq -r .track <<<"$marker")" = full
            test "$(jq -r .stage_operation <<<"$marker")" = publish
            target="$(jq -er .remote_target <<<"$marker")"
            prior_attempt="$(jq -er .prior_mutation_attempt_id <<<"$marker")"
            publication_scope="$(jq -er .publication_scope <<<"$marker")"
            repo="$(jq -er .sources.app.repo "$bundle")"
            reconcile_attempt="gha-${GITHUB_RUN_ID}-full-resume-reconcile"
            outcome=unknown
            case "$target" in
              github-release:*)
                test "$publication_scope" = track_assets
                standard_tag="$(jq -er .release.tag "$bundle")"
                test "$target" = "github-release:${repo}@${standard_tag}"
                checkpoint='${{ steps.checkpoint.outputs.checkpoint_dir }}'
                full_assets="$checkpoint/tracks/full/assets.json"
                full_asset_dir="$checkpoint/tracks/full/assets"
                dmg_name="One-Person-Lab-Full-$(jq -er .release.version "$bundle")-mac-arm64.dmg"
                manifest_name=opl-release-manifest.json
                test -f "$full_assets"
                test -d "$full_asset_dir"
                jq -e --arg dmg "$dmg_name" --arg manifest "$manifest_name" '
                  (.assets | length) == 2
                  and ([.assets[].name] | sort) == ([$dmg, $manifest] | sort)
                  and all(.assets[];
                    (.size_bytes | type == "number" and . > 0)
                    and (.sha256 | type == "string" and test("^sha256:[0-9a-f]{64}$")))
                ' "$full_assets" >/dev/null
                while IFS=$'\t' read -r name expected_sha expected_size; do
                  source_path="$full_asset_dir/$name"
                  test -f "$source_path"
                  test ! -L "$source_path"
                  test "sha256:$(shasum -a 256 "$source_path" | awk '{print $1}')" = "$expected_sha"
                  test "$(wc -c < "$source_path" | tr -d ' ')" = "$expected_size"
                done < <(jq -r '.assets[] | [.name, .sha256, (.size_bytes | tostring)] | @tsv' "$full_assets")
                standard_attestation_dir="$RUNNER_TEMP/opl-full-resume-standard-attestation-${GITHUB_RUN_ID}"
                mkdir -p "$standard_attestation_dir"
                gh release download "$standard_tag" \
                  --repo "$repo" \
                  --pattern opl-release-attestation.json \
                  --dir "$standard_attestation_dir"
                standard_attestations=()
                while IFS= read -r item; do standard_attestations+=("$item"); done < <(
                  find "$standard_attestation_dir" -type f -name opl-release-attestation.json -print
                )
                test "${#standard_attestations[@]}" -eq 1
                standard_attestation="${standard_attestations[0]}"
                test -f "$standard_attestation"
                test ! -L "$standard_attestation"
                manifest_path="$full_asset_dir/$manifest_name"
                executor_app_sha="$(jq -er '.carrier_context.release_executor.app_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$manifest_path")"
                jq -n \
                  --slurpfile assets "$full_assets" \
                  --arg bundle "$BUNDLE_DIGEST" \
                  --arg asset_dir "$full_asset_dir" \
                  --arg operation_id "$operation_id" \
                  --arg operation_started_at "$operation_started_at" \
                  --arg operation_deadline_at "$operation_deadline_at" '
                  {
                    release_bundle_publish: {
                      bundle_digest: $bundle,
                      track: "full",
                      status: "reconcile_only",
                      receipt: {
                        release_operation: "append_full",
                        operation_control: {
                          operation_id: $operation_id,
                          operation_started_at: $operation_started_at,
                          operation_deadline_at: $operation_deadline_at
                        },
                        details: {
                          upload_actions: ($assets[0].assets | map({
                            action: "upload",
                            name: .name,
                            source_path: ($asset_dir + "/" + .name),
                            size_bytes: .size_bytes,
                            sha256: .sha256
                          }))
                        }
                      }
                    }
                  }
                ' > full-resume-reconcile-plan.json
                node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-apply \
                  --bundle "$bundle" --plan full-resume-reconcile-plan.json \
                  --operation append_full --track full --run-attempt "$GITHUB_RUN_ATTEMPT" \
                  --publication-channel stable \
                  --operation-id "$operation_id" --attempt-id "$reconcile_attempt" \
                  --operation-started-at "$operation_started_at" \
                  --operation-deadline-at "$operation_deadline_at" \
                  --standard-attestation "$standard_attestation" \
                  --executor-app-sha "$executor_app_sha" \
                  --mutation-mode execute \
                  --output full-resume-reconcile-inspection.json
                test "$(jq -r .status full-resume-reconcile-inspection.json)" = reconcile_only
                test "$(jq -r .mutation_attempted full-resume-reconcile-inspection.json)" = false
                classification="$(jq -er .reconciliation.classification full-resume-reconcile-inspection.json)"
                case "$classification" in
                  complete)
                    jq '.reconciliation.observation' full-resume-reconcile-inspection.json \
                      > full-resume-observation.json
                    outcome=complete
                    ;;
                  incomplete|conflict|unknown)
                    outcome=unknown
                    ;;
                  *)
                    echo "::error::Unsupported same-tag Full reconciliation classification: $classification"
                    exit 1
                    ;;
                esac
                ;;
              homebrew:*)
                test "$publication_scope" = external_target
                expected_cask_sha="${target##*/}"
                test "$target" = "homebrew:gaofeng21cn/homebrew-one-person-lab/Casks/one-person-lab-full.rb/${expected_cask_sha}"
                [[ "$expected_cask_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
                git init full-resume-tap >/dev/null
                git -C full-resume-tap remote add origin https://github.com/gaofeng21cn/homebrew-one-person-lab.git
                if remote_commit="$(timeout --foreground --signal=TERM --kill-after=5s 30s \
                  git -C full-resume-tap ls-remote origin refs/heads/main | awk '{print $1}')" \
                  && [[ "$remote_commit" =~ ^[0-9a-f]{40}$ ]] \
                  && timeout --foreground --signal=TERM --kill-after=5s 30s \
                    git -C full-resume-tap fetch --no-tags --depth=1 origin "$remote_commit" \
                  && test "$(git -C full-resume-tap rev-parse FETCH_HEAD)" = "$remote_commit" \
                  && git -C full-resume-tap show 'FETCH_HEAD:Casks/one-person-lab-full.rb' > full-resume-cask.rb; then
                  observed_cask_sha="$(shasum -a 256 full-resume-cask.rb | awk '{print "sha256:"$1}')"
                  jq -n --arg commit "$remote_commit" --arg sha "$observed_cask_sha" \
                    '{schema:"opl_homebrew_commit_bound_readback.v1",commit:$commit,cask_sha256:$sha}' \
                    > full-resume-observation.json
                  if [ "$observed_cask_sha" = "$expected_cask_sha" ]; then outcome=complete; fi
                fi
                ;;
              *)
                echo "::error::Unsupported append_full portable unknown target: $target"
                exit 1
                ;;
            esac
            receipt_args=(
              --operation remote_inspect
              --executor remote
              --attempt-id "$reconcile_attempt"
              --release-operation append_full
              --operation-id "$operation_id"
              --remote-target "$target"
              --prior-attempt-id "$prior_attempt"
              --publication-scope "$publication_scope"
              --bundle "$bundle"
              --track full
              --outcome "$outcome"
              --output full-resume-reconcile.receipt.json
            )
            if [ "$outcome" = complete ] && [ "$publication_scope" = track_assets ]; then
              receipt_args+=(--inspection full-resume-observation.json)
            fi
            node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
              "${receipt_args[@]}"
            framework-executor/bin/opl release reconcile \
              --bundle "$BUNDLE_DIGEST" --executor-receipt full-resume-reconcile.receipt.json \
              "${operation_args[@]}" --store "$store" --json > full-resume-reconcile-result.json
          fi
          framework-executor/bin/opl release status \
            --bundle "$BUNDLE_DIGEST" --store "$store" --json > append-operation-status-after-reconcile.json
          test "$(jq -r '.release_bundle_status.active_unknown_markers | length' append-operation-status-after-reconcile.json)" -eq 0 || {
            framework-executor/bin/opl release checkpoint export \
              --bundle "$BUNDLE_DIGEST" --output append-full-operation-checkpoint \
              --store "$store" --json > append-operation-checkpoint-export.json
            echo "::error::Exact Full read-only reconcile did not resolve the imported outcome; no mutation is authorized."
            exit 1
          }
          framework-executor/bin/opl release operation admit \
            --bundle "$BUNDLE_DIGEST" "${operation_args[@]}" \
            --store "$store" --json > append-operation-admit.json
          test "$(jq -r .release_bundle_operation_admit.operation_control.operation_id append-operation-admit.json)" = "$operation_id"
          framework-executor/bin/opl release checkpoint export \
            --bundle "$BUNDLE_DIGEST" --output append-full-operation-checkpoint \
            --store "$store" --json > append-operation-checkpoint-export.json
          standard_build_receipts=()
          while IFS= read -r receipt; do
            standard_build_receipts+=("$receipt")
          done < <(find checkpoint-identity-bootstrap -type f -name standard-build-receipt.json -print | LC_ALL=C sort)
          if [ "${#standard_build_receipts[@]}" -ne 1 ]; then
            echo "::error::Checkpoint must contain exactly one Standard build receipt; found ${#standard_build_receipts[@]}."
            exit 1
          fi
          original_standard_receipt="${standard_build_receipts[0]}"
          test -f "$original_standard_receipt" && test ! -L "$original_standard_receipt"
          cp "$original_standard_receipt" standard-build-receipt.json
          full_build_receipts=()
          while IFS= read -r receipt; do
            full_build_receipts+=("$receipt")
          done < <(find checkpoint-identity-bootstrap -type f -name full-build-receipt.json -print | LC_ALL=C sort)
          case "${#full_build_receipts[@]}" in
            0) ;;
            1)
              original_full_receipt="${full_build_receipts[0]}"
              test -f "$original_full_receipt" && test ! -L "$original_full_receipt"
              cp "$original_full_receipt" full-build-receipt.json
              ;;
            *)
              echo "::error::Checkpoint must contain at most one Full build receipt; found ${#full_build_receipts[@]}."
              exit 1
              ;;
          esac
          {
            echo "source_run_id=$GITHUB_RUN_ID"
            echo "source_artifact=opl-release-append-full-operation-checkpoint-v2-${GITHUB_RUN_ID}"
            echo "operation_id=$operation_id"
            echo "operation_started_at=$operation_started_at"
            echo "operation_deadline_at=$operation_deadline_at"
          } >> "$GITHUB_OUTPUT"

      - name: Bind checkpoint build provenance and exact Standard reference
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.source_format }}' = checkpoint_v1
          completed_stage='${{ steps.checkpoint.outputs.completed_stage }}'
          case "$completed_stage" in
            standard_built|standard_qualified|full_built|full_qualified) ;;
            *)
              echo "::error::Full append requires standard_built, standard_qualified, full_built, or full_qualified, got $completed_stage."
              exit 1
              ;;
          esac
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          test "$(jq -r .release.channel "$bundle")" = stable
          repository="$(jq -er '.sources.app.repo | select(type == "string" and test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' "$bundle")"
          tag="$(jq -er '.release.tag | select(type == "string" and test("^v[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))' "$bundle")"
          app_ref="$(jq -er '.sources.app.source_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' "$bundle")"
          gh api "repos/${repository}/releases/tags/${tag}" > target-standard-release.json
          gh api "repos/${repository}/git/ref/tags/${tag}" > target-standard-tag.json
          jq -e --arg tag "$tag" '
            .id > 0
            and .tag_name == $tag
            and .draft == false
            and .prerelease == false
            and .immutable == false
            and (.published_at | type == "string" and length > 0)
            and (.target_commitish | type == "string" and length > 0)
            and ([.assets[] | select(.name == "opl-release-attestation.json" and .size > 0 and (.digest | test("^sha256:[0-9a-f]{64}$")))] | length == 1)
            and ([.assets[].name] | index("stable-operation-publication-record.json") | not)
            and ([.assets[].name] | index("standard-gatekeeper-launch-policy.json") | not)
            and ([.assets[].name] | index("standard-apple-notarization-receipt.json") | not)
          ' target-standard-release.json >/dev/null
          jq -e --arg tag "$tag" --arg app "$app_ref" '
            .ref == ("refs/tags/" + $tag)
            and .object.type == "commit"
            and .object.sha == $app
          ' target-standard-tag.json >/dev/null
          identity_receipts=()
          while IFS= read -r receipt; do identity_receipts+=("$receipt"); done < <(
            find checkpoint-identity-bootstrap -type f -name standard-identity-receipt.json -print | LC_ALL=C sort
          )
          standard_run_id=''
          case "${#identity_receipts[@]}" in
            1)
              standard_run_id="$(jq -er '.source.run_id | strings | select(test("^[1-9][0-9]*$"))' "${identity_receipts[0]}")"
              ;;
            0)
              case "$completed_stage" in
                full_built|full_qualified) ;;
                *)
                  echo "::error::Standard checkpoint transport must contain exactly one Standard identity receipt."
                  exit 1
                  ;;
              esac
              standard_vm_receipts=()
              standard_vm_digests=()
              while IFS= read -r receipt; do standard_vm_receipts+=("$receipt"); done < <(
                find checkpoint-identity-bootstrap -type f -name standard-clean-vm-qualification-receipt.json -print | LC_ALL=C sort
              )
              while IFS= read -r digest; do standard_vm_digests+=("$digest"); done < <(
                find checkpoint-identity-bootstrap -type f -name standard-clean-vm-qualification-receipt.sha256 -print | LC_ALL=C sort
              )
              test "${#standard_vm_receipts[@]}" -eq 1
              test "${#standard_vm_digests[@]}" -eq 1
              standard_vm_receipt="${standard_vm_receipts[0]}"
              standard_vm_digest="${standard_vm_digests[0]}"
              test -s "$standard_vm_receipt" && test ! -L "$standard_vm_receipt"
              test -s "$standard_vm_digest" && test ! -L "$standard_vm_digest"
              expected_standard_vm_sha="$(tr -d '\r\n' < "$standard_vm_digest")"
              observed_standard_vm_sha="sha256:$(shasum -a 256 "$standard_vm_receipt" | awk '{print $1}')"
              [[ "$expected_standard_vm_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
              test "$observed_standard_vm_sha" = "$expected_standard_vm_sha"
              standard_run_id="$(jq -er '.qualification.run_id | strings | select(test("^[1-9][0-9]*$"))' "$standard_vm_receipt")"
              jq -e --arg run_id "$standard_run_id" '
                .schema == "opl_app_artifact_qualification_receipt.v1"
                and .status == "passed"
                and .package_profile == "standard"
                and .qualification.run_id == $run_id
                and .qualification.source_artifact_run_id == $run_id
                and .qualification.source_artifact_name == ("opl-release-standard-vm-bound-" + $run_id)
                and .qualification.result == "passed"
              ' "$standard_vm_receipt" >/dev/null
              ;;
            *)
              echo "::error::Checkpoint transport contains multiple Standard identity receipts."
              exit 1
              ;;
          esac
          {
            bundle_digest="$(jq -r .bundle_digest "$bundle")"
            echo "version=$(jq -r .release.version "$bundle")"
            echo "updater_version=$(jq -r .release.updater_version "$bundle")"
            echo "tag=$tag"
            echo "bundle_digest=$bundle_digest"
            echo "app_ref=$app_ref"
            echo "shell_ref=$(jq -r .sources.shell.source_commit "$bundle")"
            echo "framework_source_ref=$(jq -r .sources.framework.source_commit "$bundle")"
            echo "target_standard_release_id=$(jq -r .id target-standard-release.json)"
            echo "target_standard_release_tag=$tag"
            echo "target_standard_declared_commitish=$(jq -r .target_commitish target-standard-release.json)"
            echo "target_standard_target_commitish=$(jq -r .object.sha target-standard-tag.json)"
            echo "completed_stage=$completed_stage"
            echo "checkpoint_transport_executor=github_actions"
            echo "transport_run_id=$GITHUB_RUN_ID"
            echo "standard_run_id=$standard_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Recover historical Standard clean-VM checkpoint sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARD_RUN_ID: ${{ steps.identity.outputs.standard_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          receipts=()
          while IFS= read -r receipt; do receipts+=("$receipt"); done < <(
            find checkpoint-identity-bootstrap -type f -name standard-clean-vm-qualification-receipt.json -print | LC_ALL=C sort
          )
          case "${#receipts[@]}" in
            1) exit 0 ;;
            0) ;;
            *)
              echo "::error::Checkpoint transport contains multiple Standard clean-VM qualification receipts."
              exit 1
              ;;
          esac
          evidence_artifact="$(printf 'opl-%s-%s-%s-standard-%s' first run vm "$STANDARD_RUN_ID")"
          evidence_dir="$RUNNER_TEMP/opl-standard-clean-vm-sidecar-${STANDARD_RUN_ID}"
          gh run download "$STANDARD_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$evidence_artifact" --dir "$evidence_dir"
          fallback_receipts=()
          while IFS= read -r receipt; do fallback_receipts+=("$receipt"); done < <(
            find "$evidence_dir" -type f -name artifact-qualification-receipt.json -print | LC_ALL=C sort
          )
          fallback_digests=()
          while IFS= read -r digest; do fallback_digests+=("$digest"); done < <(
            find "$evidence_dir" -type f -name artifact-qualification-receipt.sha256 -print | LC_ALL=C sort
          )
          test "${#fallback_receipts[@]}" -eq 1
          test "${#fallback_digests[@]}" -eq 1
          declared_sha="$(awk 'NR == 1 { print $1 }' "${fallback_digests[0]}")"
          case "$declared_sha" in
            sha256:[0-9a-f][0-9a-f]*) canonical_sha="$declared_sha" ;;
            [0-9a-f][0-9a-f]*) canonical_sha="sha256:$declared_sha" ;;
            *) echo "::error::Historical Standard clean-VM qualification digest is invalid."; exit 1 ;;
          esac
          [[ "$canonical_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
          observed_sha="sha256:$(shasum -a 256 "${fallback_receipts[0]}" | awk '{print $1}')"
          test "$observed_sha" = "$canonical_sha"
          materialized_dir=checkpoint-identity-bootstrap/standard-clean-vm-sidecar
          mkdir -p "$materialized_dir"
          cp "${fallback_receipts[0]}" "$materialized_dir/standard-clean-vm-qualification-receipt.json"
          printf '%s\n' "$canonical_sha" > "$materialized_dir/standard-clean-vm-qualification-receipt.sha256"

      - name: Verify protected clean-VM checkpoint sidecars
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          STANDARD_RUN_ID: ${{ steps.identity.outputs.standard_run_id }}
        run: |
          set -euo pipefail
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          stage='${{ steps.checkpoint.outputs.completed_stage }}'
          bundle_digest="$(jq -er .bundle_digest "$bundle")"
          app_sha="$(jq -er .sources.app.source_commit "$bundle")"
          shell_sha="$(jq -er .sources.shell.source_commit "$bundle")"
          framework_sha="$(jq -er .sources.framework.source_commit "$bundle")"
          version="$(jq -er .release.version "$bundle")"
          standard_run_id="$STANDARD_RUN_ID"
          [[ "$standard_run_id" =~ ^[1-9][0-9]*$ ]]
          verify_sidecar() {
            local profile="$1"
            local receipt_name="$2"
            local digest_name="$3"
            local expected_run_id="$4"
            local expected_artifact="$5"
            local receipts=()
            local digests=()
            while IFS= read -r item; do receipts+=("$item"); done < <(
              find checkpoint-identity-bootstrap -type f -name "$receipt_name" -print | LC_ALL=C sort
            )
            while IFS= read -r item; do digests+=("$item"); done < <(
              find checkpoint-identity-bootstrap -type f -name "$digest_name" -print | LC_ALL=C sort
            )
            test "${#receipts[@]}" -eq 1
            test "${#digests[@]}" -eq 1
            local receipt="${receipts[0]}"
            local digest_file="${digests[0]}"
            test -s "$receipt" && test ! -L "$receipt"
            test -s "$digest_file" && test ! -L "$digest_file"
            local expected_sha
            local observed_sha
            expected_sha="$(tr -d '\r\n' < "$digest_file")"
            observed_sha="sha256:$(shasum -a 256 "$receipt" | awk '{print $1}')"
            [[ "$expected_sha" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$observed_sha" = "$expected_sha"
            jq -e \
              --arg profile "$profile" \
              --arg run_id "$expected_run_id" \
              --arg artifact "$expected_artifact" \
              --arg bundle "$bundle_digest" \
              --arg app "$app_sha" \
              --arg shell "$shell_sha" \
              --arg framework "$framework_sha" '
                .schema == "opl_app_artifact_qualification_receipt.v1"
                and .status == "passed"
                and .package_profile == $profile
                and .release_cohort_ref == $bundle
                and .qualification.run_id == $run_id
                and .qualification.source_artifact_run_id == $run_id
                and .qualification.source_artifact_name == $artifact
                and .qualification.result == "passed"
                and .cohort == {
                  app_sha: $app,
                  shell_sha: $shell,
                  framework_sha: $framework
                }
              ' "$receipt" >/dev/null
          }
          verify_sidecar \
            standard \
            standard-clean-vm-qualification-receipt.json \
            standard-clean-vm-qualification-receipt.sha256 \
            "$standard_run_id" \
            "opl-release-standard-vm-bound-${standard_run_id}"
          if [ "$stage" = full_qualified ]; then
            verify_sidecar \
              full \
              full-clean-vm-qualification-receipt.json \
              full-clean-vm-qualification-receipt.sha256 \
              "$SOURCE_RUN_ID" \
              "opl-full-first-install-dmg-${version}-mac-arm64"
          fi

      - name: Upload independent Full operation checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-append-full-operation-checkpoint-v2-${{ github.run_id }}
          path: |
            append-full-operation-checkpoint
            checkpoint-identity-bootstrap/**/standard-identity-receipt.json
            checkpoint-identity-bootstrap/**/standard-clean-vm-qualification-receipt.json
            checkpoint-identity-bootstrap/**/standard-clean-vm-qualification-receipt.sha256
            standard-build-receipt.json
            full-build-receipt.json
            append-operation-status-before.json
            append-operation-status-after-reconcile.json
            append-operation-admit.json
            append-operation-checkpoint-export.json
            full-resume-observation.json
            full-resume-reconcile.receipt.json
            full-resume-reconcile-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Admit executor-head Full publication target before build
        env:
          TARGET_STANDARD_COMMITISH: ${{ steps.identity.outputs.target_standard_target_commitish }}
        shell: bash
        run: |
          set -euo pipefail
          executor_sha="$(git -C app-source rev-parse HEAD)"
          test "$executor_sha" = "$GITHUB_SHA"
          test "$executor_sha" != "$TARGET_STANDARD_COMMITISH" || {
            echo "::notice::Full executor and target Standard currently share one App SHA; identities remain independently bound."
          }
          test "$(jq -r .full_first_install.published_addon.carrier_identity.new_release_or_tag_allowed app-source/contracts/app-release-channel.json)" = false
          test "$(jq -r .full_first_install.published_addon.target_standard_reference.target_immutable_required app-source/contracts/app-release-channel.json)" = false
          jq -n \
            --arg executor_sha "$executor_sha" \
            --arg standard_target "$TARGET_STANDARD_COMMITISH" \
            '{
              schema:"opl_app_full_publication_target_admission.v1",
              status:"passed",
              mutation_authorized:false,
              mutation_attempted:false,
              release_executor:{role:"full_manifest_provenance",app_sha:$executor_sha},
              target_standard_reference:{role:"same_release_append_and_asset_cas",target_commitish:$standard_target,immutable:false},
              new_release_or_tag_allowed:false,
              full_content_identity:{source:"opl-release-manifest.json",validated_after_build:true},
              higher_privilege_workflows_token_required:false
            }' > full-publication-target-admission.json

      - name: Upload pre-build Full publication target admission
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-full-publication-target-admission-${{ github.run_id }}
          path: full-publication-target-admission.json
          if-no-files-found: warn
          retention-days: 30

      - name: Persist typed checkpoint restore failure
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p checkpoint-restore-failure
          printf '%s\n' 'checkpoint restore did not complete; see immutable Actions step log' > checkpoint-restore-failure/stdout.txt
          printf '%s\n' 'restore, digest, ABI, stage, or Full build-provenance validation failed' > checkpoint-restore-failure/stderr.txt
          input_digest="$(printf '%s\0' '${{ inputs.source_run_id }}' '${{ inputs.source_artifact }}' '${{ inputs.framework_executor_ref }}' '${{ inputs.operation }}' '${{ inputs.operation_deadline_at }}' | shasum -a 256 | awk '{print $1}')"
          jq -n --arg digest "sha256:$input_digest" --arg run '${{ inputs.source_run_id }}' --arg artifact '${{ inputs.source_artifact }}' \
            '{schema:"opl_release_checkpoint_restore_failure_receipt.v1",status:"failed",input_digest:$digest,source:{run_id:$run,artifact:$artifact},retry_disposition:"correct_checkpoint_or_freeze_new_bundle"}' \
            > checkpoint-restore-failure/receipt.json

      - name: Upload checkpoint restore failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-full-restore-failure-${{ github.run_id }}
          path: checkpoint-restore-failure
          if-no-files-found: error
          retention-days: 30

  full-build:
    if: ${{ inputs.prior_full_artifact_run_id == '' && (needs.restore-standard.outputs.completed_stage == 'standard_built' || needs.restore-standard.outputs.completed_stage == 'standard_qualified') }}
    needs: [restore-standard]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/full-first-install-release.yml
    with:
      opl_version: ${{ needs.restore-standard.outputs.version }}
      opl_updater_version: ${{ needs.restore-standard.outputs.updater_version }}
      framework_ref: ${{ inputs.full_content_framework_ref }}
      shell_ref: ${{ inputs.full_content_shell_ref }}
      upload_full_package_artifact: true
      release_bundle_digest: ${{ needs.restore-standard.outputs.bundle_digest }}
      release_cohort_ref: ${{ needs.restore-standard.outputs.bundle_digest }}
      artifact_app_sha: ${{ inputs.full_content_app_ref }}
      target_standard_release_id: ${{ needs.restore-standard.outputs.target_standard_release_id }}
      target_standard_release_tag: ${{ needs.restore-standard.outputs.target_standard_release_tag }}
      target_standard_target_commitish: ${{ needs.restore-standard.outputs.target_standard_target_commitish }}
      operation: ${{ inputs.operation }}
      operation_started_at: ${{ needs.restore-standard.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.restore-standard.outputs.operation_deadline_at }}
    secrets: inherit

  materialize-full-build:
    if: ${{ needs.restore-standard.outputs.completed_stage == 'full_built' || inputs.prior_full_artifact_run_id != '' }}
    needs: [restore-standard]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      mas_ref: ${{ steps.full_source.outputs.mas_ref }}
      artifact_producer_run_id: ${{ steps.full_source.outputs.artifact_producer_run_id }}
    steps:
      - name: Checkout canonical App executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', path: app-source }

      - name: Restore existing Full build without rebuilding
        if: ${{ inputs.prior_full_artifact_run_id == '' }}
        id: checkpoint
        uses: ./app-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ needs.restore-standard.outputs.framework_executor_ref }}
          source-run-id: ${{ needs.restore-standard.outputs.source_run_id }}
          source-artifact: ${{ needs.restore-standard.outputs.source_artifact }}
          github-token: ${{ github.token }}

      - name: Materialize exact Full assets for qualification
        if: ${{ inputs.prior_full_artifact_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.checkpoint.outputs.completed_stage }}' = full_built
          source='${{ steps.checkpoint.outputs.checkpoint_dir }}/tracks/full/assets'
          mkdir -p full-output
          cp "$source/One-Person-Lab-Full-${{ needs.restore-standard.outputs.version }}-mac-arm64.dmg" full-output/
          cp "$source/opl-release-manifest.json" full-output/

      - name: Download reusable Full package from the exact failed run
        if: ${{ inputs.prior_full_artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-full-first-install-${{ needs.restore-standard.outputs.version }}-mac-arm64
          run-id: ${{ inputs.prior_full_artifact_run_id }}
          github-token: ${{ github.token }}
          path: full-output

      - name: Download reusable Full cohort identity
        if: ${{ inputs.prior_full_artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64-cohort
          run-id: ${{ inputs.prior_full_artifact_run_id }}
          github-token: ${{ github.token }}
          path: full-cohort

      - name: Download exact failed qualification receipt
        if: ${{ inputs.prior_full_artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-qualification-attempt-full-${{ inputs.prior_full_artifact_run_id }}
          run-id: ${{ inputs.prior_full_artifact_run_id }}
          github-token: ${{ github.token }}
          path: prior-qualification

      - name: Verify reusable Full bytes and failed-run identity
        if: ${{ inputs.prior_full_artifact_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.prior_full_artifact_run_id }}
          VERSION: ${{ needs.restore-standard.outputs.version }}
          BUNDLE_DIGEST: ${{ needs.restore-standard.outputs.bundle_digest }}
          APP_REF: ${{ inputs.full_content_app_ref }}
          SHELL_REF: ${{ inputs.full_content_shell_ref }}
          FRAMEWORK_REF: ${{ inputs.full_content_framework_ref }}
          SMOKE_HARNESS_REF: ${{ inputs.smoke_harness_ref }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN_ID")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRIOR_RUN_ID" '
              (.id | tostring) == $run_id
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .run_attempt == 1
              and .status == "completed"
              and (.conclusion == "failure" or .conclusion == "cancelled")
              and .path == ".github/workflows/release-stable.yml"
              and .repository.full_name == $repository
            ' <<<"$run_json" >/dev/null

          dmg="full-output/One-Person-Lab-Full-${VERSION}-mac-arm64.dmg"
          manifest=full-output/opl-release-manifest.json
          cohort=full-cohort/opl-build-cohort.json
          qualification=prior-qualification/qualification-attempt-receipt.json
          notarization=full-output/full-apple-notarization-receipt.json
          for file in "$dmg" "$manifest" "$cohort" "$qualification" "$notarization"; do
            test -f "$file" && test ! -L "$file"
          done
          dmg_sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          dmg_size="$(wc -c < "$dmg" | tr -d ' ')"
          cohort_sha="$(shasum -a 256 "$cohort" | awk '{print $1}')"
          artifact_producer_run_id="$(jq -er '.actions.run_id | select(type == "string" and test("^[1-9][0-9]*$"))' "$cohort")"

          jq -e \
            --arg version "$VERSION" \
            --arg bundle "$BUNDLE_DIGEST" \
            --arg app "$APP_REF" \
            --arg shell "$SHELL_REF" \
            --arg framework "$FRAMEWORK_REF" \
            --arg producer_run_id "$artifact_producer_run_id" \
            --arg artifact "opl-full-first-install-dmg-${VERSION}-mac-arm64" \
            --arg dmg_name "$(basename "$dmg")" \
            --arg dmg_sha "$dmg_sha" \
            --argjson dmg_size "$dmg_size" '
              .schema == "opl_app_build_artifact_cohort.v2"
              and .release.stable_session_id == $bundle
              and .release.release_cohort_ref == $bundle
              and .cohort == {app_sha:$app,shell_sha:$shell,framework_sha:$framework}
              and .build == {version:$version,kind:"full"}
              and .artifact == {name:$dmg_name,sha256:$dmg_sha,size_bytes:$dmg_size}
              and .actions.run_id == $producer_run_id
              and .actions.run_attempt == "1"
              and .actions.artifact_name == $artifact
            ' "$cohort" >/dev/null

          semantic_digest="$(jq -er .digests.compiled_expectation_semantic_sha256 "$cohort")"
          probe_digest="$(jq -er .digests.compiled_expectation_probe_sha256 "$cohort")"
          qualification_input_digest="$(jq -er .digests.qualification_input_manifest_sha256 "$cohort")"
          jq -e \
            --arg bundle "$BUNDLE_DIGEST" \
            --arg app "$APP_REF" \
            --arg shell "$SHELL_REF" \
            --arg run_id "$PRIOR_RUN_ID" \
            --arg producer_run_id "$artifact_producer_run_id" \
            --arg artifact "opl-full-first-install-dmg-${VERSION}-mac-arm64" \
            --arg dmg_sha "$dmg_sha" \
            --arg cohort_sha "$cohort_sha" \
            --arg semantic_digest "$semantic_digest" \
            --arg probe_digest "$probe_digest" \
            --arg qualification_input_digest "$qualification_input_digest" \
            --arg smoke_harness_ref "$SMOKE_HARNESS_REF" '
              .schema == "opl_app_qualification_attempt_receipt.v1"
              and .status == "failed"
              and (
                .retry.disposition == "same_artifact_retry_allowed"
                or ($smoke_harness_ref != "" and .retry.disposition == "new_cohort_required")
                or (
                  $smoke_harness_ref != ""
                  and .retry.disposition == "reconcile_only"
                  and .failure_taxonomy == "unknown"
                  and .failure == {type:"none",boundary:"passed",classification:"passed"}
                  and .outcomes.validate_inputs == "success"
                  and .outcomes.clean_vm == "failure"
                  and .errors == []
                  and (.evidence.strict_qualification_receipt_path | type == "string" and endswith("/artifact-qualification-receipt.json"))
                  and (.evidence.strict_qualification_receipt_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                  and (.evidence.smoke_summary_path | type == "string" and endswith("/tart-smoke-summary.json"))
                  and (.evidence.smoke_summary_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                  and (.evidence.critical_diagnostics_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                )
                or (
                  .retry.disposition == "reconcile_only"
                  and .failure_taxonomy == "infrastructure"
                  and .failure.type == "artifact_download_failed"
                  and .failure.boundary == "workflow_artifact_download"
                  and .failure.classification == "artifact_download_failed"
                  and .outcomes.validate_inputs == "success"
                  and .outcomes.clean_vm == "failure"
                  and .evidence.strict_qualification_receipt_path == null
                  and .evidence.smoke_summary_path == null
                  and (.evidence.critical_diagnostics_sha256 | type == "string" and test("^[0-9a-f]{64}$"))
                )
              )
              and .identity.stable_session_id == $bundle
              and .identity.release_cohort_ref == $bundle
              and .identity.artifact_kind == "full"
              and .identity.package_profile == "full"
              and .identity.qualification_run_id == $run_id
              and .identity.qualification_run_attempt == "1"
              and .identity.source_artifact_run_id == $producer_run_id
              and .identity.source_artifact_name == $artifact
              and .artifact.sha256 == $dmg_sha
              and .artifact.manifest_sha256 == $cohort_sha
              and .expectations.semantic_digest == $semantic_digest
              and .expectations.probe_digest == $probe_digest
              and .qualification_inputs.manifest_sha256 == $qualification_input_digest
              and (
                (
                  .evidence.scope_proof.classification == "same_as_artifact_cohort"
                  and .evidence.scope_proof.app_base_sha == $app
                  and .evidence.scope_proof.app_head_sha == $app
                  and .evidence.scope_proof.shell_base_sha == $shell
                  and .evidence.scope_proof.shell_head_sha == $shell
                )
                or (
                  $smoke_harness_ref != ""
                  and .evidence.scope_proof.classification == "harness_mechanics_only"
                  and .evidence.scope_proof.app_base_sha == $app
                  and .evidence.scope_proof.shell_base_sha == $shell
                  and (.evidence.scope_proof.app_head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (.evidence.scope_proof.shell_head_sha | type == "string" and test("^[0-9a-f]{40}$"))
                  and (
                    .evidence.scope_proof.app_head_sha != $app
                    or .evidence.scope_proof.shell_head_sha != $shell
                  )
                )
              )
              and .evidence.scope_proof.artifact_semantic_digest == $semantic_digest
              and .evidence.scope_proof.verification_semantic_digest == $semantic_digest
              and .evidence.scope_proof.artifact_probe_digest == $probe_digest
              and .evidence.scope_proof.verification_probe_digest == $probe_digest
              and .evidence.scope_proof.forbidden_app_paths == []
              and .evidence.scope_proof.forbidden_shell_paths == []
            ' "$qualification" >/dev/null

          jq -e \
            --arg dmg_name "$(basename "$dmg")" \
            --arg dmg_sha "$dmg_sha" \
            --argjson dmg_size "$dmg_size" '
              .schema == "opl_apple_notarized_dmg_receipt.v1"
              and .status == "passed"
              and .artifact == $dmg_name
              and .notarization.status == "Accepted"
              and .stapler_validate_status == "passed"
              and .dmg_spctl_status == "passed"
              and .app_spctl_status == "passed"
              and .final_stapled_dmg_sha256 == $dmg_sha
              and .final_stapled_dmg_size_bytes == $dmg_size
            ' "$notarization" >/dev/null

          jq -e \
            --arg version "$VERSION" \
            --arg dmg_name "$(basename "$dmg")" \
            --arg dmg_sha "sha256:$dmg_sha" \
            --argjson dmg_size "$dmg_size" '
              .schema == "opl_public_release_manifest.v1"
              and .package_kind == "opl_full_first_install_macos_arm64"
              and .version == $version
              and .release_version == $version
              and .primary_install_asset == $dmg_name
              and ([.assets[] | select(.name == $dmg_name and .sha256 == $dmg_sha and .size_bytes == $dmg_size)] | length == 1)
              and .evidence.apple_notarization_receipt.status == "passed"
              and .evidence.apple_notarization_receipt.notarization.status == "Accepted"
              and .evidence.apple_notarization_receipt.final_stapled_dmg_sha256 == ($dmg_sha | sub("^sha256:"; ""))
            ' "$manifest" >/dev/null

      - name: Resolve exact Full MAS source
        id: full_source
        shell: bash
        run: |
          set -euo pipefail
          mas_ref="$(jq -er '.manifest.resolved_refs.mas.resolved_commit | select(type == "string" and test("^[0-9a-f]{40}$"))' full-output/opl-release-manifest.json)"
          artifact_producer_run_id='${{ needs.restore-standard.outputs.source_run_id }}'
          if [ -f full-cohort/opl-build-cohort.json ]; then
            artifact_producer_run_id="$(jq -er '.actions.run_id | select(type == "string" and test("^[1-9][0-9]*$"))' full-cohort/opl-build-cohort.json)"
          fi
          {
            echo "mas_ref=$mas_ref"
            echo "artifact_producer_run_id=$artifact_producer_run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download original Full build cohort identity
        if: ${{ inputs.prior_full_artifact_run_id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64-cohort
          run-id: ${{ needs.restore-standard.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: full-cohort

      - name: Upload materialized Full package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-full-first-install-${{ needs.restore-standard.outputs.version }}-mac-arm64
          path: full-output
          if-no-files-found: error
          retention-days: 14

      - name: Upload materialized Full DMG-only artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64
          path: full-output/One-Person-Lab-Full-${{ needs.restore-standard.outputs.version }}-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload materialized Full cohort identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64-cohort
          path: full-cohort
          if-no-files-found: error
          retention-days: 30

  full-qualification:
    if: ${{ always() && (needs.restore-standard.outputs.completed_stage == 'standard_built' || needs.restore-standard.outputs.completed_stage == 'standard_qualified' || needs.restore-standard.outputs.completed_stage == 'full_built') && (needs.full-build.result == 'success' || needs.materialize-full-build.result == 'success') }}
    needs: [restore-standard, full-build, materialize-full-build]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact Full package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-full-first-install-${{ needs.restore-standard.outputs.version }}-mac-arm64
          path: full-output

      - name: Verify exact hosted Full core qualification
        env:
          VERSION: ${{ needs.restore-standard.outputs.version }}
          FULL_CONTENT_APP_REF: ${{ inputs.full_content_app_ref }}
          FULL_CONTENT_SHELL_REF: ${{ inputs.full_content_shell_ref }}
          FULL_CONTENT_FRAMEWORK_REF: ${{ inputs.full_content_framework_ref }}
        shell: bash
        run: |
          set -euo pipefail
          dmg_path="full-output/One-Person-Lab-Full-${VERSION}-mac-arm64.dmg"
          manifest_path=full-output/opl-release-manifest.json
          test -f "$dmg_path" && test ! -L "$dmg_path"
          test -f "$manifest_path" && test ! -L "$manifest_path"
          dmg_sha="sha256:$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          dmg_size="$(wc -c < "$dmg_path" | tr -d ' ')"
          jq -e \
            --arg name "$(basename "$dmg_path")" \
            --arg sha "$dmg_sha" \
            --argjson size "$dmg_size" \
            --arg app "$FULL_CONTENT_APP_REF" \
            --arg shell "$FULL_CONTENT_SHELL_REF" \
            --arg framework "$FULL_CONTENT_FRAMEWORK_REF" '
            .schema == "opl_public_release_manifest.v1"
            and .package_kind == "opl_full_first_install_macos_arm64"
            and .version == env.VERSION
            and .release_version == env.VERSION
            and .primary_install_asset == $name
            and ([.assets[] | select(.name == $name and .sha256 == $sha and .size_bytes == $size)] | length == 1)
            and .evidence.gatekeeper_launch_policy.schema == "opl_gatekeeper_launch_policy.v1"
            and .evidence.gatekeeper_launch_policy.codesign_status == "passed"
            and .evidence.gatekeeper_launch_policy.spctl_status == "passed"
            and .evidence.gatekeeper_launch_policy.stapler_validate_status == "passed"
            and .evidence.apple_notarization_receipt.schema == "opl_apple_notarized_dmg_receipt.v1"
            and .evidence.apple_notarization_receipt.status == "passed"
            and .evidence.apple_notarization_receipt.notarization.status == "Accepted"
            and .evidence.runtime_native_trust.status == "passed"
            and .carrier_context.full_content_sources == {
              role: "observational_build_provenance_only",
              may_gate_install_or_runtime: false,
              app_sha: $app,
              shell_sha: $shell,
              framework_sha: $framework
            }
          ' "$manifest_path" >/dev/null
          mount_point="$(mktemp -d)"
          mounted=false
          cleanup_mount() {
            if [ "$mounted" = true ]; then hdiutil detach "$mount_point" >/dev/null 2>&1 || true; fi
            rm -rf "$mount_point"
          }
          trap cleanup_mount EXIT
          hdiutil verify "$dmg_path"
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_point" >/dev/null
          mounted=true
          app_paths=()
          while IFS= read -r candidate; do app_paths+=("$candidate"); done < <(
            find "$mount_point" -maxdepth 2 -type d -name 'One Person Lab.app' -print | LC_ALL=C sort
          )
          test "${#app_paths[@]}" -eq 1
          app_path="${app_paths[0]}"
          test -d "$app_path" && test ! -L "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          node - "$VERSION" "$dmg_path" "$manifest_path" <<'NODE' > hosted-full-core-qualification.json
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const [version, dmgPath, manifestPath] = process.argv.slice(2);
          const sha256 = (value) => `sha256:${crypto.createHash('sha256').update(value).digest('hex')}`;
          const stat = fs.statSync(dmgPath);
          process.stdout.write(`${JSON.stringify({
            schema: 'opl_app_hosted_full_core_qualification.v1',
            status: 'passed',
            execution: {
              execution_class: 'github_hosted',
              runner: 'macos-latest',
              run_id: process.env.GITHUB_RUN_ID,
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            },
            release: { version },
            subject: {
              asset_name: require('node:path').basename(dmgPath),
              size_bytes: stat.size,
              sha256: sha256(fs.readFileSync(dmgPath)),
            },
            manifest: {
              asset_name: 'opl-release-manifest.json',
              sha256: sha256(fs.readFileSync(manifestPath)),
            },
            verification: {
              dmg_verified: true,
              read_only_mount: true,
              exact_single_app: true,
              codesign: true,
              stapler: true,
              gatekeeper: true,
              manifest_bound: true,
              full_runtime_native_trust: true,
            },
            evidence_ref: `opl-hosted-full-core-qualification-${process.env.GITHUB_RUN_ID}`,
          }, null, 2)}\n`);
          NODE

      - name: Upload hosted Full core qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-hosted-full-core-qualification-${{ github.run_id }}
          path: hosted-full-core-qualification.json
          if-no-files-found: error
          retention-days: 30

  full-clean-vm-qualification:
    if: ${{ always() && needs.full-qualification.result == 'success' }}
    needs: [restore-standard, full-build, materialize-full-build, full-qualification]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/opl-first-run-vm.yml
    with:
      release_artifact_name: opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64
      release_artifact_run_id: ${{ needs.materialize-full-build.outputs.artifact_producer_run_id || github.run_id }}
      release_bundle_digest: ${{ needs.restore-standard.outputs.bundle_digest }}
      release_cohort_ref: ${{ needs.restore-standard.outputs.bundle_digest }}
      artifact_app_ref: ${{ inputs.full_content_app_ref }}
      verification_app_ref: ${{ inputs.full_content_app_ref }}
      shell_ref: ${{ inputs.full_content_shell_ref }}
      smoke_harness_ref: ${{ inputs.smoke_harness_ref || inputs.full_content_shell_ref }}
      framework_ref: ${{ inputs.full_content_framework_ref }}
      framework_executor_ref: ${{ needs.restore-standard.outputs.framework_executor_ref }}
      mas_ref: ${{ needs.full-build.outputs.mas_ref || needs.materialize-full-build.outputs.mas_ref }}
      package_profile: full
      diagnostic_scope: release_gate
      require_macos_gatekeeper: true
      retry_artifact_upload_once: true
      operation: append_full
      operation_started_at: ${{ needs.restore-standard.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.restore-standard.outputs.operation_deadline_at }}
    secrets: inherit

  checkpoint-full:
    if: ${{ always() && needs.restore-standard.result == 'success' && needs.restore-standard.outputs.completed_stage != 'full_qualified' && (needs.restore-standard.outputs.completed_stage == 'full_built' || needs.full-build.result == 'success' || needs.materialize-full-build.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [restore-standard, full-build, materialize-full-build, full-qualification, full-clean-vm-qualification]
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.provenance.outputs.source_run_id }}
      source_artifact: ${{ steps.provenance.outputs.source_artifact }}
      completed_stage: ${{ steps.provenance.outputs.completed_stage }}
    steps:
      - name: Checkout canonical App executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', path: app-source }

      - name: Restore verified Standard checkpoint
        id: checkpoint
        uses: ./app-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ needs.restore-standard.outputs.framework_executor_ref }}
          source-run-id: ${{ needs.restore-standard.outputs.source_run_id }}
          source-artifact: ${{ needs.restore-standard.outputs.source_artifact }}
          github-token: ${{ github.token }}

      - name: Download Full package asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-full-first-install-${{ needs.restore-standard.outputs.version }}-mac-arm64
          path: full-output

      - name: Download exact hosted Full core qualification
        if: ${{ needs.full-qualification.result == 'success' && needs.full-clean-vm-qualification.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-hosted-full-core-qualification-${{ github.run_id }}
          path: hosted-core-qualification

      - name: Download protected Full clean-VM qualification
        if: ${{ needs.full-qualification.result == 'success' && needs.full-clean-vm-qualification.result == 'success' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.full-clean-vm-qualification.outputs.qualification_artifact_name }}
          path: full-clean-vm-evidence

      - name: Download exact unified Standard attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir standard-attestation
          gh release download '${{ needs.restore-standard.outputs.target_standard_release_tag }}' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern opl-release-attestation.json \
            --dir standard-attestation
          test -s standard-attestation/opl-release-attestation.json
          test ! -L standard-attestation/opl-release-attestation.json
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag '${{ needs.restore-standard.outputs.target_standard_release_tag }}' \
            --arg bundle '${{ needs.restore-standard.outputs.bundle_digest }}' '
              .schema == "opl_app_release_attestation.v1"
              and .status == "passed"
              and .release.repository == $repository
              and .release.tag == $tag
              and .release.bundle_digest == $bundle
              and .protection.github_native_immutable == false
              and .protection.retroactive_lock_claimed == false
            ' standard-attestation/opl-release-attestation.json >/dev/null

      - name: Bind Full bytes and export additive checkpoint
        env:
          BUNDLE_DIGEST: ${{ needs.restore-standard.outputs.bundle_digest }}
          QUALIFICATION_COMPLETE: ${{ needs.full-qualification.result == 'success' && needs.full-clean-vm-qualification.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir full-assets
          cp "full-output/One-Person-Lab-Full-${{ needs.restore-standard.outputs.version }}-mac-arm64.dmg" full-assets/
          cp full-output/opl-release-manifest.json full-assets/
          standard_attestation=standard-attestation/opl-release-attestation.json
          standard_attestation_sha="sha256:$(shasum -a 256 "$standard_attestation" | awk '{print $1}')"
          standard_attestation_size="$(wc -c < "$standard_attestation" | tr -d ' ')"
          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson release_id '${{ needs.restore-standard.outputs.target_standard_release_id }}' \
            --arg tag '${{ needs.restore-standard.outputs.target_standard_release_tag }}' \
            --arg target '${{ needs.restore-standard.outputs.target_standard_target_commitish }}' \
            --arg attestation_sha "$standard_attestation_sha" \
            --argjson attestation_size "$standard_attestation_size" \
            --arg app '${{ inputs.full_content_app_ref }}' \
            --arg shell '${{ inputs.full_content_shell_ref }}' \
            --arg framework '${{ inputs.full_content_framework_ref }}' '
              if (
                .carrier_context.publication_model == "same_tag_mutable_standard_addon"
                and .carrier_context.target_standard_release == {
                  repository: $repository,
                  release_id: $release_id,
                  tag: $tag,
                  target_commitish: $target,
                  immutable: false,
                  full_asset_append_allowed: true,
                  standard_asset_overwrite_or_delete_allowed: false
                }
                and .carrier_context.full_content_sources == {
                  role: "observational_build_provenance_only",
                  may_gate_install_or_runtime: false,
                  app_sha: $app,
                  shell_sha: $shell,
                  framework_sha: $framework
                }
              ) then .
              else error("Full build manifest does not bind the exact same-tag mutable Standard append target")
              end
              | .carrier_context.standard_attestation = {
                  name: "opl-release-attestation.json",
                  sha256: $attestation_sha,
                  size_bytes: $attestation_size
                }
              | .carrier_context.latest_modified = false
              | .carrier_context.updater_metadata_modified = false
              | .carrier_context.release_notes_modified = false
            ' full-assets/opl-release-manifest.json > full-assets/opl-release-manifest.same-tag.json
          mv full-assets/opl-release-manifest.same-tag.json full-assets/opl-release-manifest.json
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          store='${{ steps.checkpoint.outputs.store_dir }}'
          operation_id='${{ needs.restore-standard.outputs.operation_id }}'
          operation_args=(
            --operation append_full
            --operation-id "$operation_id"
            --operation-started-at '${{ needs.restore-standard.outputs.operation_started_at }}'
            --operation-deadline-at '${{ needs.restore-standard.outputs.operation_deadline_at }}'
          )
          framework-executor/bin/opl release operation admit \
            --bundle "$BUNDLE_DIGEST" "${operation_args[@]}" \
            --store "$store" --json > append-operation-admit.json
          stage='${{ needs.restore-standard.outputs.completed_stage }}'
          case "$stage" in
            standard_built|standard_qualified)
              full_build_run_id='${{ needs.materialize-full-build.outputs.artifact_producer_run_id || github.run_id }}'
              node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
                --operation build --executor remote --attempt-id "gha-${full_build_run_id}-full-build" \
                --release-operation append_full --operation-id "$operation_id" \
                --remote-target "github-actions:${GITHUB_REPOSITORY}/runs/${full_build_run_id}/full-build" \
                --bundle "$bundle" --track full --outcome complete \
                --assets-dir full-assets --output full-build-receipt.json
              framework-executor/bin/opl release build \
                --bundle "$BUNDLE_DIGEST" --executor-receipt full-build-receipt.json \
                "${operation_args[@]}" \
                --store "$store" --json > full-build-result.json
              ;;
            full_built)
              full_build_receipts=()
              while IFS= read -r receipt; do
                full_build_receipts+=("$receipt")
              done < <(find imported-checkpoint -type f -name full-build-receipt.json -print | LC_ALL=C sort)
              if [ "${#full_build_receipts[@]}" -ne 1 ]; then
                echo "::error::Imported checkpoint must contain exactly one Full build receipt; found ${#full_build_receipts[@]}."
                exit 1
              fi
              original_full_receipt="${full_build_receipts[0]}"
              test -f "$original_full_receipt" && test ! -L "$original_full_receipt"
              cp "$original_full_receipt" full-build-receipt.json
              ;;
            *) exit 1 ;;
          esac
          standard_build_receipts=()
          while IFS= read -r receipt; do
            standard_build_receipts+=("$receipt")
          done < <(find imported-checkpoint -type f -name standard-build-receipt.json -print | LC_ALL=C sort)
          if [ "${#standard_build_receipts[@]}" -ne 1 ]; then
            echo "::error::Imported checkpoint must contain exactly one Standard build receipt; found ${#standard_build_receipts[@]}."
            exit 1
          fi
          original_standard_receipt="${standard_build_receipts[0]}"
          test -f "$original_standard_receipt" && test ! -L "$original_standard_receipt"
          cp "$original_standard_receipt" standard-build-receipt.json
          standard_vm_receipts=()
          standard_vm_digests=()
          while IFS= read -r receipt; do standard_vm_receipts+=("$receipt"); done < <(
            find imported-checkpoint -type f -name standard-clean-vm-qualification-receipt.json -print | LC_ALL=C sort
          )
          while IFS= read -r digest; do standard_vm_digests+=("$digest"); done < <(
            find imported-checkpoint -type f -name standard-clean-vm-qualification-receipt.sha256 -print | LC_ALL=C sort
          )
          test "${#standard_vm_receipts[@]}" -eq 1
          test "${#standard_vm_digests[@]}" -eq 1
          cp "${standard_vm_receipts[0]}" standard-clean-vm-qualification-receipt.json
          cp "${standard_vm_digests[0]}" standard-clean-vm-qualification-receipt.sha256
          if [ "$QUALIFICATION_COMPLETE" = true ]; then
            full_vm_receipts=()
            while IFS= read -r receipt; do full_vm_receipts+=("$receipt"); done < <(
              find full-clean-vm-evidence -type f -name artifact-qualification-receipt.json -print | LC_ALL=C sort
            )
            test "${#full_vm_receipts[@]}" -eq 1 || {
              echo "::error::Full release requires exactly one clean-VM qualification receipt."
              exit 1
            }
            full_vm_receipt="${full_vm_receipts[0]}"
            test -s "$full_vm_receipt" && test ! -L "$full_vm_receipt"
            full_vm_sha="sha256:$(shasum -a 256 "$full_vm_receipt" | awk '{print $1}')"
            test "$full_vm_sha" = '${{ needs.full-clean-vm-qualification.outputs.qualification_receipt_sha256 }}' || {
              echo "::error::Full clean-VM qualification digest mismatch."
              exit 1
            }
            jq -e \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg source_artifact_run_id '${{ needs.materialize-full-build.outputs.artifact_producer_run_id || github.run_id }}' \
              --arg artifact 'opl-full-first-install-dmg-${{ needs.restore-standard.outputs.version }}-mac-arm64' \
              --arg bundle "$BUNDLE_DIGEST" \
              --arg app '${{ inputs.full_content_app_ref }}' \
              --arg shell '${{ inputs.full_content_shell_ref }}' \
              --arg framework '${{ inputs.full_content_framework_ref }}' '
                .schema == "opl_app_artifact_qualification_receipt.v1"
                and .status == "passed"
                and .package_profile == "full"
                and .release_cohort_ref == $bundle
                and .qualification.run_id == $run_id
                and .qualification.source_artifact_run_id == $source_artifact_run_id
                and .qualification.source_artifact_name == $artifact
                and .qualification.result == "passed"
                and .cohort == {
                  app_sha: $app,
                  shell_sha: $shell,
                  framework_sha: $framework
                }
              ' "$full_vm_receipt" >/dev/null
            cp "$full_vm_receipt" full-clean-vm-qualification-receipt.json
            printf '%s\n' "$full_vm_sha" > full-clean-vm-qualification-receipt.sha256
            hosted_receipt=hosted-core-qualification/hosted-full-core-qualification.json
            test -f "$hosted_receipt" && test ! -L "$hosted_receipt"
            node --experimental-strip-types app-source/scripts/framework-release-adapter.ts qualification-receipt \
              --bundle "$bundle" --track full --hosted-core-qualification "$hosted_receipt" \
              --output full-qualification.receipt.json
            framework-executor/bin/opl release verify \
              --bundle "$BUNDLE_DIGEST" --track full \
              --qualification-receipt full-qualification.receipt.json \
              "${operation_args[@]}" \
              --store "$store" --json > full-verify-result.json
          fi
          framework-executor/bin/opl release checkpoint export \
            --bundle "$BUNDLE_DIGEST" --output full-checkpoint \
            --store "$store" --json > full-checkpoint-export.json

      - name: Bind additive checkpoint transport identity
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          completed_stage="$(jq -er .release_bundle_checkpoint_export.checkpoint_stage full-checkpoint-export.json)"
          case "$completed_stage" in full_built|full_qualified) ;; *) exit 1 ;; esac
          {
            echo "source_run_id=$GITHUB_RUN_ID"
            echo "source_artifact=opl-release-full-checkpoint-${GITHUB_RUN_ID}"
            echo "completed_stage=$completed_stage"
          } >> "$GITHUB_OUTPUT"

      - name: Upload additive Full checkpoint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.OPL_FULL_CHECKPOINT_ARTIFACT }}
          path: |
            full-checkpoint
            standard-build-receipt.json
            full-build-receipt.json
            standard-clean-vm-qualification-receipt.json
            standard-clean-vm-qualification-receipt.sha256
            full-clean-vm-qualification-receipt.json
            full-clean-vm-qualification-receipt.sha256
          if-no-files-found: error
          retention-days: 30

  provenance:
    if: ${{ always() && needs.restore-standard.result == 'success' && (needs.restore-standard.outputs.completed_stage == 'full_qualified' || needs.checkpoint-full.result == 'success') }}
    needs: [restore-standard, checkpoint-full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_run_id: ${{ steps.identity.outputs.source_run_id }}
      source_artifact: ${{ steps.identity.outputs.source_artifact }}
      checkpoint_transport_executor: ${{ steps.identity.outputs.checkpoint_transport_executor }}
      transport_run_id: ${{ steps.identity.outputs.transport_run_id }}
      completed_stage: ${{ steps.identity.outputs.completed_stage }}
    steps:
      - name: Preserve checkpoint transport provenance
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          source_stage='${{ needs.restore-standard.outputs.completed_stage }}'
          source_run_id='${{ needs.restore-standard.outputs.source_run_id }}'
          source_artifact='${{ needs.restore-standard.outputs.source_artifact }}'
          checkpoint_transport_executor='${{ needs.restore-standard.outputs.checkpoint_transport_executor }}'
          transport_run_id='${{ needs.restore-standard.outputs.transport_run_id }}'
          if [ "$source_stage" = standard_built ] || [ "$source_stage" = standard_qualified ] || [ "$source_stage" = full_built ]; then
            source_run_id="$GITHUB_RUN_ID"
            source_artifact="opl-release-full-checkpoint-${GITHUB_RUN_ID}"
            checkpoint_transport_executor=github_actions
            transport_run_id="$GITHUB_RUN_ID"
            source_stage='${{ needs.checkpoint-full.outputs.completed_stage }}'
          fi
          case "$source_stage" in full_built|full_qualified) ;; *) exit 1 ;; esac
          {
            echo "source_run_id=$source_run_id"
            echo "source_artifact=$source_artifact"
            echo "checkpoint_transport_executor=$checkpoint_transport_executor"
            echo "transport_run_id=$transport_run_id"
            echo "completed_stage=$source_stage"
          } >> "$GITHUB_OUTPUT"

  publish-full:
    if: ${{ always() && needs.provenance.result == 'success' && needs.provenance.outputs.completed_stage == 'full_qualified' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-stable
    concurrency:
      group: opl-release-bundle-global
      cancel-in-progress: false
    needs: [restore-standard, checkpoint-full, provenance]
    steps:
      - name: Reject partial rerun before Full GitHub mutation
        shell: bash
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            mkdir -p release-failure-evidence
            printf '%s\0' github_full_publish '${{ needs.restore-standard.outputs.bundle_digest }}' '${{ needs.restore-standard.outputs.operation_deadline_at }}' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
              | shasum -a 256 | awk '{print "sha256:"$1}' > release-failure-evidence/input-digest.txt
            touch release-failure-evidence/stdout.txt
            jq -n --arg input_digest "$(cat release-failure-evidence/input-digest.txt)" \
              '{schema:"opl_release_mutation_failure_receipt.v1",status:"failed",failure_taxonomy:"workflow_rerun",mutation:"github_full_publish",input_digest:$input_digest,retry_disposition:"inspect_only_no_redispatch"}' \
              > release-failure-evidence/stderr.txt
            cat release-failure-evidence/stderr.txt >&2
            exit 1
          fi

      - name: Checkout canonical App executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: '${{ github.sha }}', path: app-source }

      - name: Restore additive Full checkpoint
        id: checkpoint
        uses: ./app-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ needs.restore-standard.outputs.framework_executor_ref }}
          source-run-id: ${{ needs.provenance.outputs.source_run_id }}
          source-artifact: ${{ needs.provenance.outputs.source_artifact }}
          github-token: ${{ github.token }}

      - name: Append exact Full bytes to the mutable Standard Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIGEST: ${{ needs.restore-standard.outputs.bundle_digest }}
          SOURCE_RUN_ID: ${{ needs.provenance.outputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ needs.provenance.outputs.source_artifact }}
          CHECKPOINT_TRANSPORT_EXECUTOR: ${{ needs.provenance.outputs.checkpoint_transport_executor }}
          TRANSPORT_RUN_ID: ${{ needs.provenance.outputs.transport_run_id }}
          OPERATION_ID: ${{ needs.restore-standard.outputs.operation_id }}
          OPERATION_STARTED_AT: ${{ needs.restore-standard.outputs.operation_started_at }}
          OPERATION_DEADLINE_AT: ${{ needs.restore-standard.outputs.operation_deadline_at }}
          BUNDLE_PATH: ${{ steps.checkpoint.outputs.bundle_path }}
          STORE_DIR: ${{ steps.checkpoint.outputs.store_dir }}
          CHECKPOINT_DIR: ${{ steps.checkpoint.outputs.checkpoint_dir }}
          RELEASE_VERSION: ${{ needs.restore-standard.outputs.version }}
          TARGET_STANDARD_RELEASE_ID: ${{ needs.restore-standard.outputs.target_standard_release_id }}
          TARGET_STANDARD_RELEASE_TAG: ${{ needs.restore-standard.outputs.target_standard_release_tag }}
          TARGET_STANDARD_DECLARED_COMMITISH: ${{ needs.restore-standard.outputs.target_standard_declared_commitish }}
          TARGET_STANDARD_TARGET_COMMITISH: ${{ needs.restore-standard.outputs.target_standard_target_commitish }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-failure-evidence
          exec > >(tee release-failure-evidence/stdout.txt) 2> >(tee release-failure-evidence/stderr.txt >&2)
          printf '%s\0' "$BUNDLE_DIGEST" "$SOURCE_RUN_ID" "$SOURCE_ARTIFACT" "$OPERATION_DEADLINE_AT" \
            | shasum -a 256 | awk '{print "sha256:"$1}' > release-failure-evidence/input-digest.txt
          node --experimental-strip-types app-source/scripts/release-operation-deadline.ts check \
            --operation append_full --started-at "$OPERATION_STARTED_AT" \
            --deadline-at "$OPERATION_DEADLINE_AT"
          bundle="$BUNDLE_PATH"
          store="$STORE_DIR"
          operation_id="$OPERATION_ID"
          operation_args=(
            --operation append_full
            --operation-id "$operation_id"
            --operation-started-at "$OPERATION_STARTED_AT"
            --operation-deadline-at "$OPERATION_DEADLINE_AT"
          )
          checkpoint="$CHECKPOINT_DIR"
          full_manifest="$checkpoint/tracks/full/assets/opl-release-manifest.json"
          test -f "$full_manifest" && test ! -L "$full_manifest"
          full_version="$(jq -er '
            select(
              .schema == "opl_public_release_manifest.v1"
              and .package_kind == "opl_full_first_install_macos_arm64"
              and .owner_authority == "one-person-lab-app"
              and .version == .release_version
            )
            | .release_version
            | select(type == "string" and test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
          ' "$full_manifest")"
          full_manifest_sha_hex="$(shasum -a 256 "$full_manifest" | awk '{print $1}')"
          full_manifest_sha="sha256:$full_manifest_sha_hex"
          full_manifest_executor_app_sha="$(jq -er '.carrier_context.release_executor.app_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$full_manifest")"
          standard_tag="$TARGET_STANDARD_RELEASE_TAG"
          remote_target="github-release:${GITHUB_REPOSITORY}@${standard_tag}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${TARGET_STANDARD_RELEASE_ID}" > target-standard-release-before-publish.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${standard_tag}" > target-standard-tag-before-publish.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > latest-before-full.json
          jq -e \
            --argjson release_id "$TARGET_STANDARD_RELEASE_ID" \
            --arg tag "$TARGET_STANDARD_RELEASE_TAG" \
            --arg declared_target "$TARGET_STANDARD_DECLARED_COMMITISH" '
            .id == $release_id
            and .tag_name == $tag
            and .target_commitish == $declared_target
            and .draft == false
            and .prerelease == false
            and .immutable == false
            and ([.assets[] | select(.name == "opl-release-attestation.json" and .size > 0 and (.digest | test("^sha256:[0-9a-f]{64}$")))] | length == 1)
          ' target-standard-release-before-publish.json >/dev/null
          jq -e \
            --arg tag "$TARGET_STANDARD_RELEASE_TAG" \
            --arg target "$TARGET_STANDARD_TARGET_COMMITISH" '
            .ref == ("refs/tags/" + $tag)
            and .object.type == "commit"
            and .object.sha == $target
          ' target-standard-tag-before-publish.json >/dev/null
          jq -e \
            --argjson release_id "$TARGET_STANDARD_RELEASE_ID" \
            --arg tag "$TARGET_STANDARD_RELEASE_TAG" \
            --arg target "$TARGET_STANDARD_TARGET_COMMITISH" \
            --arg app '${{ inputs.full_content_app_ref }}' \
            --arg shell '${{ inputs.full_content_shell_ref }}' \
            --arg framework '${{ inputs.full_content_framework_ref }}' '
            .carrier_context.publication_model == "same_tag_mutable_standard_addon"
            and .carrier_context.target_standard_release.release_id == $release_id
            and .carrier_context.target_standard_release.tag == $tag
            and .carrier_context.target_standard_release.target_commitish == $target
            and .carrier_context.target_standard_release.immutable == false
            and .carrier_context.target_standard_release.full_asset_append_allowed == true
            and .carrier_context.target_standard_release.standard_asset_overwrite_or_delete_allowed == false
            and .carrier_context.latest_modified == false
            and .carrier_context.updater_metadata_modified == false
            and .carrier_context.release_notes_modified == false
            and .carrier_context.full_content_sources == {
              role: "observational_build_provenance_only",
              may_gate_install_or_runtime: false,
              app_sha: $app,
              shell_sha: $shell,
              framework_sha: $framework
            }
          ' "$full_manifest" >/dev/null
          framework-executor/bin/opl release operation admit \
            --bundle "$BUNDLE_DIGEST" "${operation_args[@]}" \
            --store "$store" --json > publish-operation-admit.json
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-inspect \
            --repo "$GITHUB_REPOSITORY" --tag "$standard_tag" --output remote-before.json
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
            --operation remote_inspect --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-full-before" \
            --release-operation append_full --operation-id "$operation_id" \
            --remote-target "$remote_target" --publication-scope track_assets \
            --bundle "$bundle" --track full --outcome complete \
            --inspection remote-before.json --output remote-before.receipt.json
          framework-executor/bin/opl release publish \
            --bundle "$BUNDLE_DIGEST" --executor-receipt remote-before.receipt.json \
            "${operation_args[@]}" \
            --store "$store" --json > publish-plan.json
          standard_attestation_dir="$RUNNER_TEMP/opl-full-standard-attestation-${GITHUB_RUN_ID}"
          mkdir -p "$standard_attestation_dir"
          gh release download "$standard_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern opl-release-attestation.json \
            --dir "$standard_attestation_dir"
          standard_attestations=()
          while IFS= read -r item; do standard_attestations+=("$item"); done < <(
            find "$standard_attestation_dir" -type f -name opl-release-attestation.json -print
          )
          test "${#standard_attestations[@]}" -eq 1
          standard_attestation="${standard_attestations[0]}"
          test -f "$standard_attestation"
          test ! -L "$standard_attestation"
          target_standard_commitish="$TARGET_STANDARD_TARGET_COMMITISH"
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-apply \
            --bundle "$bundle" --plan publish-plan.json \
            --operation append_full --track full --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --publication-channel stable \
            --operation-id "$operation_id" --attempt-id "gha-${GITHUB_RUN_ID}-full-publish" \
            --operation-started-at "$OPERATION_STARTED_AT" \
            --operation-deadline-at "$OPERATION_DEADLINE_AT" \
            --standard-attestation "$standard_attestation" \
            --executor-app-sha "$full_manifest_executor_app_sha" \
            --mutation-mode rehearsal \
            --output publication-contract-rehearsal.json
          test "$(jq -r .status publication-contract-rehearsal.json)" = rehearsal_complete
          test "$(jq -r .mutation_attempted publication-contract-rehearsal.json)" = false
          test "$(jq -r .target_commitish publication-contract-rehearsal.json)" = "$target_standard_commitish"
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-apply \
            --bundle "$bundle" --plan publish-plan.json \
            --operation append_full --track full --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --publication-channel stable \
            --operation-id "$operation_id" --attempt-id "gha-${GITHUB_RUN_ID}-full-publish" \
            --operation-started-at "$OPERATION_STARTED_AT" \
            --operation-deadline-at "$OPERATION_DEADLINE_AT" \
            --standard-attestation "$standard_attestation" \
            --executor-app-sha "$full_manifest_executor_app_sha" \
            --mutation-mode execute \
            --output publish-apply.json
          apply_status="$(jq -er .status publish-apply.json)"
          if [ "$apply_status" != complete ]; then
            case "$apply_status" in
              outcome_unknown)
                unknown_attempt="$(jq -er '.mutation_attempt_id | strings | select(length > 0)' publish-apply.json)"
                unknown_target="$(jq -er '.remote_target | strings | select(length > 0)' publish-apply.json)"
                test "$unknown_target" = "$remote_target"
                node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
                  --operation remote_inspect --executor remote --attempt-id "$unknown_attempt" \
                  --release-operation append_full --operation-id "$operation_id" \
                  --remote-target "$unknown_target" --publication-scope track_assets \
                  --bundle "$bundle" --track full --outcome unknown --output unknown.receipt.json
                framework-executor/bin/opl release publish \
                  --bundle "$BUNDLE_DIGEST" --executor-receipt unknown.receipt.json \
                  "${operation_args[@]}" \
                  --store "$store" --json > unknown-persisted.json
                test "$(jq -r .release_bundle_publish.status unknown-persisted.json)" = reconcile_only
                framework-executor/bin/opl release checkpoint export \
                  --bundle "$BUNDLE_DIGEST" --output full-github-unknown-checkpoint \
                  --store "$store" --json > unknown-checkpoint-export.json
                ;;
              reconcile_only) ;;
              deadline_elapsed)
                echo "::error::The absolute deadline elapsed before another mutation; reconcile is not authorized without a persisted unknown outcome."
                exit 1
                ;;
              *)
                echo "::error::Unsupported GitHub mutation result: $apply_status"
                exit 1
                ;;
            esac
            framework-executor/bin/opl release status \
              --bundle "$BUNDLE_DIGEST" --store "$store" --json > reconcile-admission-status.json
            test "$(jq -r .release_bundle_status.tracks.full.reconcile_required reconcile-admission-status.json)" = true || {
              echo "::error::Framework did not persist an unknown Full publish outcome; reconcile is forbidden."
              exit 1
            }
            test "$(jq -r '.release_bundle_status.active_unknown_markers | length' reconcile-admission-status.json)" -eq 1
            marker="$(jq -cer '.release_bundle_status.active_unknown_markers[0]' reconcile-admission-status.json)"
            test "$(jq -r .operation_id <<<"$marker")" = "$operation_id"
            test "$(jq -r .operation_kind <<<"$marker")" = append_full
            test "$(jq -r .track <<<"$marker")" = full
            test "$(jq -r .stage_operation <<<"$marker")" = publish
            test "$(jq -r .publication_scope <<<"$marker")" = track_assets
            unknown_attempt="$(jq -er .prior_mutation_attempt_id <<<"$marker")"
            unknown_target="$(jq -er .remote_target <<<"$marker")"
            test "$unknown_target" = "$remote_target"
            reconcile_plan=unknown-persisted.json
            test -s "$reconcile_plan"
            node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-apply \
              --bundle "$bundle" --plan "$reconcile_plan" \
              --operation append_full --track full --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --publication-channel stable \
              --operation-id "$operation_id" --attempt-id "gha-${GITHUB_RUN_ID}-full-reconcile" \
              --operation-started-at "$OPERATION_STARTED_AT" \
              --operation-deadline-at "$OPERATION_DEADLINE_AT" \
              --standard-attestation "$standard_attestation" \
              --executor-app-sha "$full_manifest_executor_app_sha" \
              --mutation-mode execute \
              --output full-read-only-reconcile.json
            test "$(jq -r .status full-read-only-reconcile.json)" = reconcile_only
            test "$(jq -r .mutation_attempted full-read-only-reconcile.json)" = false
            test "$(jq -r .reconciliation.classification full-read-only-reconcile.json)" = complete || {
              echo "::error::Full outcome remains incomplete, conflicting, or unknown after read-only inspection; no retry is authorized."
              exit 1
            }
            jq '.reconciliation.observation' full-read-only-reconcile.json > reconcile-observation.json
            node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
              --operation remote_inspect --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-full-reconcile" \
              --release-operation append_full --operation-id "$operation_id" \
              --remote-target "$unknown_target" --prior-attempt-id "$unknown_attempt" \
              --publication-scope track_assets \
              --bundle "$bundle" --track full --outcome complete \
              --inspection reconcile-observation.json --output reconcile.receipt.json
            framework-executor/bin/opl release reconcile \
              --bundle "$BUNDLE_DIGEST" --executor-receipt reconcile.receipt.json \
              "${operation_args[@]}" \
              --store "$store" --json > reconcile-result.json
            test "$(jq -r .release_bundle_reconcile.status reconcile-result.json)" = complete || {
              echo "::error::Full publish remains incomplete after read-only reconcile; no upload was retried."
              exit 1
            }
          fi
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts github-inspect \
            --repo "$GITHUB_REPOSITORY" --tag "$standard_tag" --output remote-after.json
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > latest-after-full.json
          test "$(jq -c '{id,tag_name,target_commitish}' latest-before-full.json)" = \
            "$(jq -c '{id,tag_name,target_commitish}' latest-after-full.json)"
          node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
            --operation remote_inspect --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-full-after" \
            --release-operation append_full --operation-id "$operation_id" \
            --remote-target "$remote_target" --publication-scope track_assets \
            --bundle "$bundle" --track full --outcome complete \
            --inspection remote-after.json --output remote-after.receipt.json
          framework-executor/bin/opl release publish \
            --bundle "$BUNDLE_DIGEST" --executor-receipt remote-after.receipt.json \
            "${operation_args[@]}" \
            --store "$store" --json > full-published.json
          test "$(jq -r .release_bundle_publish.status full-published.json)" = complete
          full_assets="$checkpoint/tracks/full/assets.json"
          full_qualification="$checkpoint/tracks/full/qualification.json"
          test -f "$full_assets"
          test -f "$full_qualification"
          dmg_name="One-Person-Lab-Full-${RELEASE_VERSION}-mac-arm64.dmg"
          manifest_name=opl-release-manifest.json
          dmg_path="$checkpoint/tracks/full/assets/$dmg_name"
          manifest_path="$checkpoint/tracks/full/assets/$manifest_name"
          test -f "$dmg_path"
          test -f "$manifest_path"
          dmg_sha="sha256:$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          manifest_sha="sha256:$(shasum -a 256 "$manifest_path" | awk '{print $1}')"
          qualification_sha="sha256:$(shasum -a 256 "$full_qualification" | awk '{print $1}')"
          dmg_size="$(wc -c < "$dmg_path" | tr -d ' ')"
          manifest_size="$(wc -c < "$manifest_path" | tr -d ' ')"
          jq -e --arg name "$dmg_name" --arg sha "$dmg_sha" --argjson size "$dmg_size" '
            [.assets[] | select(.name == $name and .sha256 == $sha and .size_bytes == $size)] | length == 1
          ' "$full_assets" >/dev/null
          jq -e --arg name "$manifest_name" --arg sha "$manifest_sha" --argjson size "$manifest_size" '
            [.assets[] | select(.name == $name and .sha256 == $sha and .size_bytes == $size)] | length == 1
          ' "$full_assets" >/dev/null
          test "$(jq -r .track "$full_qualification")" = full
          test "$(jq -r .qualification.result "$full_qualification")" = passed
          test "$(jq -r .bundle_digest "$full_qualification")" = "$BUNDLE_DIGEST"
          published_sha="sha256:$(shasum -a 256 full-published.json | awk '{print $1}')"
          standard_attestation_sha="sha256:$(shasum -a 256 "$standard_attestation" | awk '{print $1}')"
          standard_attestation_size="$(wc -c < "$standard_attestation" | tr -d ' ')"
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/${standard_tag}"
          jq -n \
            --arg authority_run_id "$GITHUB_RUN_ID" --arg authority_head_sha "$GITHUB_SHA" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "$SOURCE_ARTIFACT" \
            --arg checkpoint_transport_executor "$CHECKPOINT_TRANSPORT_EXECUTOR" \
            --arg transport_run_id "$TRANSPORT_RUN_ID" \
            --arg bundle_digest "$BUNDLE_DIGEST" --arg version "$full_version" \
            --arg manifest_sha "$full_manifest_sha" --arg standard_tag "$standard_tag" \
            --arg standard_attestation_sha "$standard_attestation_sha" \
            --argjson standard_attestation_size "$standard_attestation_size" \
            --argjson target_standard_release_id "$TARGET_STANDARD_RELEASE_ID" \
            --arg target_standard_release_tag "$TARGET_STANDARD_RELEASE_TAG" \
            --arg target_standard_target_commitish "$TARGET_STANDARD_TARGET_COMMITISH" \
            --arg app_sha '${{ inputs.full_content_app_ref }}' \
            --arg shell_sha '${{ inputs.full_content_shell_ref }}' \
            --arg framework_sha '${{ inputs.full_content_framework_ref }}' \
            --arg operation_id "$OPERATION_ID" \
            --arg operation_started_at "$OPERATION_STARTED_AT" \
            --arg operation_deadline_at "$OPERATION_DEADLINE_AT" \
            --arg dmg_name "$dmg_name" --arg dmg_sha "$dmg_sha" --argjson dmg_size "$dmg_size" \
            --arg dmg_url "$base_url/$dmg_name" \
            --arg manifest_name "$manifest_name" --arg manifest_sha "$manifest_sha" --argjson manifest_size "$manifest_size" \
            --arg manifest_url "$base_url/$manifest_name" --arg qualification_sha "$qualification_sha" \
            --arg published_sha "$published_sha" '
            {
              schema:"opl_homebrew_full_follower_handoff.v1",status:"ready",operation:"append_full",
              authority:{repository:"gaofeng21cn/one-person-lab-app",workflow:".github/workflows/release-stable.yml",run_id:$authority_run_id,run_attempt:1,executor_head_sha:$authority_head_sha},
              operation_control:{operation_id:$operation_id,operation_started_at:$operation_started_at,operation_deadline_at:$operation_deadline_at},
              source:{run_id:$source_run_id,checkpoint_artifact:$source_artifact,checkpoint_transport_executor:$checkpoint_transport_executor,transport_run_id:$transport_run_id,completed_stage:"full_qualified",qualification_receipt_sha256:$qualification_sha},
              release:{
                version:$version,
                standard_tag:$standard_tag,
                target_standard:{release_id:$target_standard_release_id,tag:$target_standard_release_tag,target_commitish:$target_standard_target_commitish,immutable:false,full_asset_append_allowed:true,standard_asset_overwrite_or_delete_allowed:false},
                standard_attestation:{name:"opl-release-attestation.json",sha256:$standard_attestation_sha,size_bytes:$standard_attestation_size},
                manifest:{name:$manifest_name,sha256:$manifest_sha,size_bytes:$manifest_size},
                artifact:{name:$dmg_name,sha256:$dmg_sha,size_bytes:$dmg_size}
              },
              build_provenance:{
                admission_role:"observational_only",
                may_gate_install_or_runtime:false,
                bundle_digest:$bundle_digest,
                app_sha:$app_sha,
                shell_sha:$shell_sha,
                framework_sha:$framework_sha
              },
              artifact:{name:$dmg_name,size_bytes:$dmg_size,sha256:$dmg_sha,url:$dmg_url},
              manifest:{name:$manifest_name,size_bytes:$manifest_size,sha256:$manifest_sha,url:$manifest_url},
              github_full_publication:{status:"complete",receipt_sha256:$published_sha},homebrew_modified:false,latest_modified:false
            }' > homebrew-full-handoff.json
          jq -n --arg standard_tag "$standard_tag" --arg manifest_sha "$full_manifest_sha" \
            --arg standard_attestation_sha "$standard_attestation_sha" \
            --argjson target_standard_release_id "$TARGET_STANDARD_RELEASE_ID" \
            --arg target_standard_release_tag "$TARGET_STANDARD_RELEASE_TAG" \
            --arg target_standard_target_commitish "$TARGET_STANDARD_TARGET_COMMITISH" \
            '{schema:"opl_app_full_append_boundary_receipt.v1",status:"passed",operation:"append_full",carrier:{kind:"same_standard_release_assets",versioning:"same_standard_tag",standard_tag:$standard_tag,manifest_sha256:$manifest_sha,standard_attestation_sha256:$standard_attestation_sha,target_standard:{release_id:$target_standard_release_id,tag:$target_standard_release_tag,target_commitish:$target_standard_target_commitish,immutable:false,full_asset_append_allowed:true,standard_asset_overwrite_or_delete_allowed:false}},standard_assets_modified:false,prepared_notes_modified:false,standard_updater_metadata_modified:false,homebrew_modified:false,latest_modified:false}' \
            > append-full-boundary.json

      - name: Persist typed Full publication failure
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p release-failure-evidence
          apply_status="$(jq -r '.status // empty' publish-apply.json 2>/dev/null || true)"
          framework_reconcile_authorized=false
          retry_disposition=start_new_admitted_operation_no_framework_reconcile
          if [ "$apply_status" = deadline_elapsed ]; then
            retry_disposition=bounded_read_only_inspect_only_no_framework_reconcile
          elif [ "$apply_status" = outcome_unknown ] || [ "$apply_status" = reconcile_only ]; then
            if [ "$(jq -r '.release_bundle_status.tracks.full.reconcile_required // false' reconcile-admission-status.json 2>/dev/null || true)" = true ]; then
              framework_reconcile_authorized=true
              retry_disposition=fresh_bounded_read_only_inspect_then_framework_reconcile
            else
              retry_disposition=persist_unknown_then_require_fresh_framework_status_no_mutation_retry
            fi
          fi
          jq -n \
            --arg bundle '${{ needs.restore-standard.outputs.bundle_digest }}' \
            --arg source_run '${{ needs.provenance.outputs.source_run_id }}' \
            --arg source_artifact '${{ needs.provenance.outputs.source_artifact }}' \
            --arg apply_status "$apply_status" \
            --arg retry_disposition "$retry_disposition" \
            --argjson framework_reconcile_authorized "$framework_reconcile_authorized" \
            --arg input_digest "$(cat release-failure-evidence/input-digest.txt)" \
            '{schema:"opl_release_mutation_failure_receipt.v1",status:"failed",mutation:"github_full_publish",operation:"append_full",bundle_digest:$bundle,input_digest:$input_digest,source:{run_id:$source_run,artifact:$source_artifact},adapter_status:($apply_status|select(length>0)? // null),framework_reconcile_authorized:$framework_reconcile_authorized,retry_disposition:$retry_disposition}' \
            > release-failure-evidence/full-publication-failure.json

      - name: Upload Full publication receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-release-full-published-${{ github.run_id }}
          path: |
            publish-plan.json
            publication-contract-rehearsal.json
            publish-apply.json
            unknown-persisted.json
            unknown-checkpoint-export.json
            full-github-unknown-checkpoint
            reconcile-admission-status.json
            full-read-only-reconcile.json
            remote-after.json
            target-standard-release-before-publish.json
            latest-before-full.json
            latest-after-full.json
            full-published.json
            append-full-boundary.json
            homebrew-full-handoff.json
            reconcile-observation.json
            reconcile-result.json
            release-failure-evidence
          if-no-files-found: warn
          retention-days: 30
