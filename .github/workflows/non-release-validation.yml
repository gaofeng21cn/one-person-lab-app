name: OPL Source Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opl-source-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-validation:
    name: Source, contract, and focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install App validation dependencies
        run: npm ci --ignore-scripts

      - name: Run source-only App validation
        run: npm test

  release-boundary:
    name: Release boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install App validation dependencies
        run: npm ci --ignore-scripts

      # Cone mode includes root files and only the nested Shell folders the
      # release boundary validator reads, without pulling the resources tree.
      - name: Materialize the active Shell sources
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/gaofeng21cn/opl-aion-shell.git "$RUNNER_TEMP/opl-aion-shell"
          git -C "$RUNNER_TEMP/opl-aion-shell" sparse-checkout set --cone desktop scripts/desktop

      # The suite owns App release admission, dispatch guards, notes, carriers
      # and installers. It used to run only under the manual release workflows,
      # so release-script regressions could sit on main until a release was
      # dispatched. The two W6 cross-fixture cases need the Shell toolchain
      # installed and stay with the Shell qualification lanes.
      - name: Run release boundary validation and tests
        env:
          OPL_APP_SHELL_ROOT: ${{ runner.temp }}/opl-aion-shell
        run: npm run test:release-boundary:pr
