name: OPL Docker WebUI Clean VM Smoke
run-name: Docker WebUI clean ${{ inputs.platform }} VM smoke

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Host platform to validate.
        required: true
        default: linux
        type: choice
        options:
          - linux
          - windows
      runner_labels_json:
        description: JSON array of labels for a clean Windows runner with Docker Desktop/WSL2 available.
        required: false
        default: '["self-hosted","Windows","X64","docker-webui-clean-vm"]'
        type: string
      runner_inventory_json:
        description: Optional JSON array of repository self-hosted runners, used when GITHUB_TOKEN cannot read runner inventory.
        required: false
        default: ''
        type: string
      image:
        description: Docker/WebUI image to validate in a clean Windows runner.
        required: false
        default: ghcr.io/gaofeng21cn/one-person-lab-webui:latest
        type: string
      artifact_name:
        description: Evidence artifact name; use the platform-specific default expected by desktop release intake.
        required: false
        default: docker-webui-clean-windows-vm-evidence
        type: string
      port:
        description: Host port used for the local WebUI smoke.
        required: false
        default: '3000'
        type: string
      health_timeout:
        description: Seconds to wait for WebUI health.
        required: false
        default: '180'
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  clean-linux-vm-smoke:
    if: ${{ inputs.platform == 'linux' }}
    name: Clean Linux VM Docker/WebUI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-webui-clean-linux-vm-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run clean Linux VM Docker/WebUI smoke gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-webui-clean-linux-vm
          node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
            --gate clean_linux_vm \
            --artifacts docker-webui-clean-linux-vm \
            --image "${{ inputs.image }}" \
            --port "${{ inputs.port }}" \
            --health-timeout "${{ inputs.health_timeout }}" \
            --json | tee docker-webui-clean-linux-vm-output.json
          node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
            --validate-result docker-webui-clean-linux-vm/docker-webui-smoke-gate-result.json \
            --json | tee docker-webui-clean-linux-vm-validation.json
      - name: Stop Docker/WebUI smoke container and prune generated volumes
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f docker-webui-clean-linux-vm/home/OnePersonLab/compose.yaml ]; then
            docker compose -f docker-webui-clean-linux-vm/home/OnePersonLab/compose.yaml down --remove-orphans || true
          fi
          sudo rm -rf \
            docker-webui-clean-linux-vm/home/OnePersonLab/data \
            docker-webui-clean-linux-vm/home/OnePersonLab/projects
      - name: Upload clean Linux VM Docker/WebUI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name == 'docker-webui-clean-windows-vm-evidence' && 'docker-webui-clean-linux-vm-evidence' || inputs.artifact_name }}
          path: |
            docker-webui-clean-linux-vm
            docker-webui-clean-linux-vm-output.json
            docker-webui-clean-linux-vm-validation.json
          if-no-files-found: error

  runner-preflight:
    if: ${{ inputs.platform == 'windows' }}
    name: Clean Windows runner preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check clean Windows runner availability
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_LABELS_JSON: ${{ inputs.runner_labels_json }}
          RUNNER_INVENTORY_JSON: ${{ inputs.runner_inventory_json }}
        run: |
          set -euo pipefail
          mkdir -p docker-webui-clean-windows-vm-runner-blocker
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const artifactPath = 'docker-webui-clean-windows-vm-runner-blocker/runner-preflight.json';

          let requiredLabels = [];
          let payload = {
            schema: 'opl_docker_webui_clean_windows_runner_preflight.v1',
            status: 'typed_blocker',
            required_labels: requiredLabels,
            inventory_source: 'github_actions_api',
            eligible_runners: [],
            observed_runners: [],
          };
          let inventoryReadable = false;
          let runners = [];

          function normalizeRunner(runner) {
            return {
              id: runner.id ?? null,
              name: runner.name ?? '',
              os: runner.os ?? '',
              status: runner.status ?? '',
              busy: Boolean(runner.busy),
              labels: (runner.labels || []).map((label) => typeof label === 'string' ? label : label.name).filter(Boolean),
            };
          }

          try {
            requiredLabels = JSON.parse(process.env.RUNNER_LABELS_JSON || '[]');
            if (!Array.isArray(requiredLabels) || requiredLabels.length === 0) {
              throw new Error('runner_labels_json must be a non-empty JSON array');
            }
            payload.required_labels = requiredLabels;
            if ((process.env.RUNNER_INVENTORY_JSON || '').trim()) {
              const supplied = JSON.parse(process.env.RUNNER_INVENTORY_JSON);
              if (!Array.isArray(supplied)) {
                throw new Error('runner_inventory_json must be a JSON array when provided');
              }
              payload.inventory_source = 'workflow_dispatch_input';
              runners = supplied.map(normalizeRunner);
              inventoryReadable = true;
            } else {
              const api = spawnSync('gh', [
                'api',
                `repos/${process.env.GITHUB_REPOSITORY}/actions/runners`,
                '--paginate',
              ], {
                encoding: 'utf8',
                env: process.env,
              });
              if (api.status !== 0) {
                const detail = (api.stderr || api.stdout || 'failed to list self-hosted runners').trim();
                payload.typed_blocker = {
                  code: 'runner_inventory_unreadable',
                  owner: 'release_or_install_validation_operator',
                  message: 'The workflow could not read repository self-hosted runner inventory.',
                  detail,
                  required_next_action: 'Pass runner_inventory_json from an operator token that can read repository Actions runners, or grant a token/scope that can read runner inventory, then rerun clean Windows smoke.',
                };
              } else {
                const pages = api.stdout
                  .split(/\n(?=\{)/)
                  .filter(Boolean)
                  .map((page) => JSON.parse(page));
                runners = pages.flatMap((page) => page.runners || []).map(normalizeRunner);
                inventoryReadable = true;
              };
            }
          } catch (error) {
            payload.typed_blocker = {
              code: 'runner_preflight_failed',
              owner: 'release_or_install_validation_operator',
              message: 'The clean Windows runner preflight failed before it could evaluate runner availability.',
              detail: error instanceof Error ? error.message : String(error),
              required_next_action: 'Fix runner_labels_json or the runner preflight inventory read path, then rerun clean Windows smoke.',
            };
          }
          if (inventoryReadable) {
            const eligible = runners.filter((runner) => {
              const labels = new Set(runner.labels || []);
              return runner.status === 'online' &&
                runner.busy === false &&
                requiredLabels.every((label) => labels.has(label));
            });
            payload = {
              ...payload,
              status: eligible.length > 0 ? 'passed' : 'typed_blocker',
              required_labels: requiredLabels,
              eligible_runners: eligible,
              observed_runners: runners,
            };
          }
          if (payload.status !== 'passed' && !payload.typed_blocker) {
            payload.typed_blocker = {
              code: 'missing_clean_windows_self_hosted_runner',
              owner: 'release_or_install_validation_operator',
              message: 'No online idle self-hosted clean Windows runner matches runner_labels_json.',
              required_next_action: 'Register a clean Windows self-hosted runner with labels self-hosted, Windows, X64, docker-webui-clean-vm, ensure Docker Desktop/WSL2 is running, then rerun this workflow.',
            };
          }
          fs.writeFileSync(
            artifactPath,
            `${JSON.stringify(payload, null, 2)}\n`,
          );
          if (payload.status !== 'passed') {
            process.exitCode = 1;
          }
          NODE

      - name: Upload runner preflight blocker
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-webui-clean-windows-vm-runner-blocker
          path: docker-webui-clean-windows-vm-runner-blocker
          if-no-files-found: error

  clean-windows-vm-smoke:
    name: Clean Windows VM Docker/WebUI smoke
    needs: runner-preflight
    if: ${{ inputs.platform == 'windows' && needs.runner-preflight.result == 'success' }}
    concurrency:
      group: docker-webui-clean-windows-vm-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 45

    steps:
      - name: Checkout App repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Run clean Windows VM Docker/WebUI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell -ExecutionPolicy Bypass `
            -File scripts/install-docker-webui.ps1 `
            -Yes `
            -NoOpen `
            -Image "${{ inputs.image }}" `
            -Port ${{ inputs.port }} `
            -HealthTimeoutSeconds ${{ inputs.health_timeout }} `
            -EvidenceDir windows-clean-evidence `
            -EvidenceArchive windows-clean-evidence.zip

      - name: Import and validate clean Windows VM evidence
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
            --gate clean_windows_vm \
            --evidence windows-clean-evidence.zip \
            --artifacts docker-webui-clean-windows-vm \
            --json | tee docker-webui-clean-windows-vm-output.json
          node --experimental-strip-types scripts/docker-webui-smoke-gate.ts \
            --validate-result docker-webui-clean-windows-vm/docker-webui-smoke-gate-result.json \
            --json | tee docker-webui-clean-windows-vm-validation.json

      - name: Upload clean Windows VM Docker/WebUI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            windows-clean-evidence
            windows-clean-evidence.zip
            docker-webui-clean-windows-vm
            docker-webui-clean-windows-vm-output.json
            docker-webui-clean-windows-vm-validation.json
          if-no-files-found: error

      - name: Stop Docker/WebUI smoke container
        if: ${{ always() }}
        shell: pwsh
        run: |
          $composePath = Join-Path $env:USERPROFILE "OnePersonLab\compose.yaml"
          if (Test-Path -LiteralPath $composePath) {
            docker compose -f $composePath down --remove-orphans
          }
