name: Release Native WebUI Carrier (Reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: canary, prepare, publish, or readback.
        type: string
        default: canary
      stable_authority_run_id:
        description: Successful Stable run that emitted the exact Latest activation handoff.
        type: string
        required: true
      app_ref:
        description: Exact App SHA frozen into the Stable Bundle.
        type: string
        required: true
      shell_ref:
        description: Exact Shell SHA frozen into the Stable Bundle.
        type: string
        required: true
      framework_ref:
        description: Exact Framework SHA frozen into the Stable Bundle.
        type: string
        required: true
      opl_version:
        description: Stable display version shared with Desktop.
        type: string
        required: true
      release_bundle_digest:
        description: Exact immutable Framework Release Bundle digest.
        type: string
        required: true
      source_run_id:
        description: Exact run containing the Standard checkpoint and Native artifacts.
        type: string
        default: ''
      source_artifact:
        description: Exact portable Standard checkpoint artifact.
        type: string
        default: ''
      standard_identity_sha256:
        description: Exact Standard identity receipt digest bound to the Latest handoff.
        type: string
        default: ''
      qualified_artifact_name:
        description: Exact Native qualification artifact name produced by prepare mode.
        type: string
        default: ''
      publication_artifact_name:
        description: Exact Native publication artifact name consumed by readback mode.
        type: string
        default: ''
    outputs:
      prepare_status:
        description: Typed Native preparation result; qualified or qualification_failed.
        value: ${{ jobs.build-and-qualify.outputs.prepare_status }}
      qualified_artifact_name:
        description: Actions artifact containing exact Native assets and qualification evidence.
        value: ${{ jobs.build-and-qualify.outputs.qualified_artifact_name }}
      publication_artifact_name:
        description: Actions artifact containing publication state, Framework checkpoint, and public readback.
        value: ${{ jobs.publish-native-assets.outputs.publication_artifact_name }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Prove Native reusable topology starts without build or publication
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.stable_authority_run_id }}' != ''
          test '${{ inputs.release_bundle_digest }}' != ''
          test '${{ inputs.app_ref }}' != ''
          test '${{ inputs.shell_ref }}' != ''
          test '${{ inputs.framework_ref }}' != ''

  build-and-qualify:
    if: ${{ inputs.mode == 'prepare' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      prepare_status: ${{ steps.qualified.outputs.prepare_status }}
      qualified_artifact_name: ${{ steps.qualified.outputs.qualified_artifact_name }}
    steps:
      - name: Reject partial rerun and root execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-release
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(id -u)" -ne 0

      - name: Checkout current App publication executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: executor-source

      - name: Checkout exact frozen App product authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          path: frozen-app-source

      - name: Checkout exact active Shell source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ inputs.shell_ref }}
          path: shell-source

      - name: Checkout exact Framework source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref }}
          path: framework-source

      - name: Setup Node.js and Bun
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'

      - name: Bind exact source identities and Official Profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-app-source rev-parse HEAD)" = '${{ inputs.app_ref }}'
          test "$(git -C shell-source rev-parse HEAD)" = '${{ inputs.shell_ref }}'
          test "$(git -C framework-source rev-parse HEAD)" = '${{ inputs.framework_ref }}'
          jq -e --slurpfile app frozen-app-source/contracts/app-product-profile.json '
            .official_profile.apply_on == ["first_install", "explicit_restore"]
            and .official_profile.desired_root_package_ids == $app[0].official_profile.desired_root_package_ids
          ' shell-source/packages/desktop/src/common/config/oplProductProfile/oplProductProfile.generated.json >/dev/null

      - name: Materialize exact Framework bootstrap
        env:
          FRAMEWORK_REF: ${{ inputs.framework_ref }}
        shell: bash
        run: |
          set -euo pipefail
          cp framework-source/install.sh shell-source/resources/opl-install.sh
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const installerPath = 'shell-source/resources/opl-install.sh';
          const source = fs.readFileSync(installerPath, 'utf8');
          const anchor = 'set -euo pipefail\n';
          if (source.split(anchor).length !== 2) throw new Error('Framework installer strict-mode anchor is not unique');
          const prelude = [
            `OPL_INSTALL_BRANCH=\${OPL_INSTALL_BRANCH:-${process.env.FRAMEWORK_REF}}`,
            'OPL_INSTALL_SOURCE_MODE=${OPL_INSTALL_SOURCE_MODE:-archive}',
            `OPL_SOURCE_ARCHIVE_URL=\${OPL_SOURCE_ARCHIVE_URL:-https://github.com/gaofeng21cn/one-person-lab/archive/${process.env.FRAMEWORK_REF}.tar.gz}`,
            '',
          ].join('\n');
          fs.writeFileSync(installerPath, source.replace(anchor, `${anchor}${prelude}`));
          NODE
          chmod +x shell-source/resources/opl-install.sh
          grep -F '${{ inputs.framework_ref }}' shell-source/resources/opl-install.sh >/dev/null

      - name: Install exact Shell dependencies and run focused source gates
        working-directory: shell-source
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          bunx tsc --noEmit
          bunx vitest run tests/unit/web-cli/nativeDistribution.test.ts tests/unit/web-cli/packWebCli.test.ts
          bash -n scripts/install-web.sh

      - name: Build Linux x86_64 Native WebUI artifact
        working-directory: shell-source
        env:
          OPL_VERSION: ${{ inputs.opl_version }}
          PACK_PLATFORM: linux
          PACK_ARCH: x64
          OPL_WEBUI_IMAGE_PROFILE: webui-full
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = process.env.OPL_VERSION;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          test "$(node -p "require('./package.json').version")" = "$OPL_VERSION"
          bunx electron-vite build --config packages/desktop/electron.vite.config.ts
          node scripts/pack-web-cli.js
          mkdir -p ../native-release/v${{ inputs.opl_version }}
          cp dist-web-cli/one-person-lab-webui-${{ inputs.opl_version }}-linux-x86_64.tar.gz* \
            ../native-release/v${{ inputs.opl_version }}/
          sed 's|^VERSION="\${VERSION:-__VERSION__}"$|VERSION="${VERSION:-${{ inputs.opl_version }}}"|' scripts/install-web.sh \
            > ../native-release/install-web.sh
          chmod +x ../native-release/install-web.sh
          (cd ../native-release && shasum -a 256 install-web.sh | awk '{print $1"  install-web.sh"}' > install-web.sh.sha256)

      - name: Create synthetic immutable predecessor for lifecycle qualification only
        env:
          TARGET_VERSION: ${{ inputs.opl_version }}
          PREDECESSOR_VERSION: 0.0.1
        shell: bash
        run: |
          set -euo pipefail
          target="native-release/v${TARGET_VERSION}/one-person-lab-webui-${TARGET_VERSION}-linux-x86_64.tar.gz"
          predecessor_dir="native-release/v${PREDECESSOR_VERSION}"
          mkdir -p "$predecessor_dir" "$RUNNER_TEMP/native-predecessor"
          tar -xzf "$target" -C "$RUNNER_TEMP/native-predecessor"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = `${process.env.RUNNER_TEMP}/native-predecessor/aionui-web/package.json`;
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.PREDECESSOR_VERSION;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          predecessor="${predecessor_dir}/one-person-lab-webui-${PREDECESSOR_VERSION}-linux-x86_64.tar.gz"
          tar -czf "$predecessor" -C "$RUNNER_TEMP/native-predecessor" aionui-web
          PREDECESSOR="$predecessor" node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const tarball = process.env.PREDECESSOR;
          const name = path.basename(tarball);
          const digest = crypto.createHash('sha256').update(fs.readFileSync(tarball)).digest('hex');
          const fields = [
            `${digest}  ${name}`,
            'schema=dev.onepersonlab.opl-native-webui-artifact.v1',
            'owner=one-person-lab-app',
            'producer=opl-aion-shell',
            'artifact_role=opl_native_webui_runtime',
            'runtime_form=native_webui',
            `version=${process.env.PREDECESSOR_VERSION}`,
            'platform=linux',
            'architecture=x86_64',
            'entrypoint=aionui-web',
            'bootstrap_entrypoint=opl-install.sh',
            'official_profile_entrypoint=opl-official-profile-apply',
            'container_adapter=opl-webui-entrypoint.sh',
            `tarball=${name}`,
            `sha256=${digest}`,
          ];
          fs.writeFileSync(`${tarball}.sha256`, `${fields.join('\n')}\n`);
          NODE

      - name: Qualify clean non-root install, update, rollback, data, HTTP, and Official Profile
        env:
          TARGET_VERSION: ${{ inputs.opl_version }}
          PREDECESSOR_VERSION: 0.0.1
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/native-home"
          export SHELL=/bin/bash
          export PATH="$HOME/.local/bin:$PATH"
          export INSTALL_DIR="$HOME/.local/share/one-person-lab/webui/runtime"
          export BIN_DIR="$HOME/.local/bin"
          export OPL_BIN="$HOME/.opl/one-person-lab/bin/opl"
          export UPDATE_PATH=0
          mkdir -p "$HOME" "$BIN_DIR"
          installer="$GITHUB_WORKSPACE/native-release/install-web.sh"
          mirror="file://$GITHUB_WORKSPACE/native-release"
          bash "$installer" --mirror "$mirror" --version "$PREDECESSOR_VERSION" --no-path
          test "$(readlink "$INSTALL_DIR/current")" = "versions/$PREDECESSOR_VERSION"
          test -f "$INSTALL_DIR/.official-profile-first-install-complete"
          marker_digest="$(shasum -a 256 "$INSTALL_DIR/.official-profile-first-install-complete" | awk '{print $1}')"
          data_dir="$HOME/.local/share/one-person-lab/webui/data"
          projects_dir="$HOME/OnePersonLab/projects"
          mkdir -p "$data_dir" "$projects_dir"
          printf 'native-user-data\n' > "$data_dir/user-sentinel.txt"
          printf 'native-project-data\n' > "$projects_dir/project-sentinel.txt"
          bash "$installer" --mirror "$mirror" --version "$PREDECESSOR_VERSION" --no-path
          test "$(shasum -a 256 "$INSTALL_DIR/.official-profile-first-install-complete" | awk '{print $1}')" = "$marker_digest"
          bash "$installer" --mirror "$mirror" --version "$TARGET_VERSION" --no-path
          test "$(readlink "$INSTALL_DIR/current")" = "versions/$TARGET_VERSION"
          test "$(readlink "$INSTALL_DIR/previous")" = "versions/$PREDECESSOR_VERSION"
          test "$(shasum -a 256 "$INSTALL_DIR/.official-profile-first-install-complete" | awk '{print $1}')" = "$marker_digest"
          test "$(cat "$data_dir/user-sentinel.txt")" = native-user-data
          test "$(cat "$projects_dir/project-sentinel.txt")" = native-project-data
          bash "$installer" --install-dir "$INSTALL_DIR" --rollback
          test "$(readlink "$INSTALL_DIR/current")" = "versions/$PREDECESSOR_VERSION"
          test "$(cat "$data_dir/user-sentinel.txt")" = native-user-data
          test "$(cat "$projects_dir/project-sentinel.txt")" = native-project-data
          bash "$installer" --install-dir "$INSTALL_DIR" --rollback
          test "$(readlink "$INSTALL_DIR/current")" = "versions/$TARGET_VERSION"
          port=25808
          "$BIN_DIR/aionui-web" start --port "$port" --no-open > native-release/http.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" >/dev/null 2>&1 || true; wait "$web_pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/" > native-release/http-body.html; then
              break
            fi
            if ! kill -0 "$web_pid" >/dev/null 2>&1 || [ "$attempt" -eq 90 ]; then
              cat native-release/http.log >&2
              exit 1
            fi
            sleep 2
          done
          test -s native-release/http-body.html
          kill "$web_pid"
          wait "$web_pid" || true
          trap - EXIT

      - name: Seal qualification receipt and publication manifest
        env:
          OPL_VERSION: ${{ inputs.opl_version }}
          BUNDLE_DIGEST: ${{ inputs.release_bundle_digest }}
          STABLE_AUTHORITY_RUN_ID: ${{ inputs.stable_authority_run_id }}
          APP_SHA: ${{ inputs.app_ref }}
          SHELL_SHA: ${{ inputs.shell_ref }}
          FRAMEWORK_SHA: ${{ inputs.framework_ref }}
        shell: bash
        run: |
          set -euo pipefail
          base="one-person-lab-webui-${OPL_VERSION}-linux-x86_64"
          receipt="native-release/v${OPL_VERSION}/${base}.qualification.json"
          jq -n \
            --arg version "$OPL_VERSION" \
            --arg bundle "$BUNDLE_DIGEST" \
            --arg run "$STABLE_AUTHORITY_RUN_ID" \
            --arg app "$APP_SHA" --arg shell "$SHELL_SHA" --arg framework "$FRAMEWORK_SHA" \
            '{schema:"opl_app_native_webui_qualification_receipt.v1",status:"passed",version:$version,release_bundle_digest:$bundle,stable_authority_run_id:$run,platform:"linux",architecture:"x86_64",non_root:true,cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$framework},lifecycle:{first_install:"passed",same_version_idempotence:"passed",cross_version_update:"passed",rollback:"passed",data_preservation:"passed",http_health:"passed",official_profile_first_install:"passed"},synthetic_predecessor:{version:"0.0.1",published:false,purpose:"exercise target installer activation and rollback without claiming a prior public Native release"}}' \
            > "$receipt"
          node --experimental-strip-types executor-source/scripts/release-native-webui-carrier.ts seal \
            --repository "$GITHUB_REPOSITORY" \
            --version "$OPL_VERSION" \
            --release-bundle-digest "$BUNDLE_DIGEST" \
            --stable-authority-run-id "$STABLE_AUTHORITY_RUN_ID" \
            --app-sha "$APP_SHA" --shell-sha "$SHELL_SHA" --framework-sha "$FRAMEWORK_SHA" \
            --runtime-tarball "native-release/v${OPL_VERSION}/${base}.tar.gz" \
            --runtime-metadata "native-release/v${OPL_VERSION}/${base}.tar.gz.sha256" \
            --installer native-release/install-web.sh \
            --installer-sha256 native-release/install-web.sh.sha256 \
            --qualification-receipt "$receipt" \
            --output native-release/publication-manifest.json \
            > native-release/publication-manifest.stdout.json
          jq -n \
            --arg artifact "native-webui-qualified-${{ inputs.opl_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{schema:"opl_app_native_webui_prepare_status.v1",status:"qualified",qualified_artifact_name:$artifact}' \
            > native-release/prepare-status.json

      - name: Persist typed Native qualification failure
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p native-release
          jq -n \
            --arg artifact "native-webui-qualified-${{ inputs.opl_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{schema:"opl_app_native_webui_prepare_status.v1",status:"qualification_failed",qualified_artifact_name:$artifact,retry_disposition:"fix_source_or_freeze_a_new_standard_bundle"}' \
            > native-release/prepare-status.json

      - name: Upload exact Native qualification result
        if: ${{ always() }}
        id: identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-webui-qualified-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Export qualified artifact identity
        if: ${{ always() }}
        id: qualified
        shell: bash
        run: |
          set -euo pipefail
          status="$(jq -er .status native-release/prepare-status.json)"
          case "$status" in
            qualified|qualification_failed) ;;
            *) echo "::error::Native preparation status is invalid: $status"; exit 1 ;;
          esac
          {
            echo "prepare_status=$status"
            echo "qualified_artifact_name=native-webui-qualified-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

  publish-native-assets:
    if: ${{ inputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    environment: release-stable
    outputs:
      publication_artifact_name: ${{ steps.publication.outputs.publication_artifact_name }}
    steps:
      - name: Reject partial rerun
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ '${{ inputs.source_run_id }}' =~ ^[1-9][0-9]*$ ]]
          [[ '${{ inputs.source_artifact }}' =~ ^[A-Za-z0-9._-]+$ ]]
          [[ '${{ inputs.qualified_artifact_name }}' =~ ^native-webui-qualified-[A-Za-z0-9._-]+$ ]]
          [[ '${{ inputs.standard_identity_sha256 }}' =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Checkout current App publication executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: executor-source

      - name: Download exact qualified Native asset set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.qualified_artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: native-release

      - name: Restore exact Standard checkpoint
        id: checkpoint
        uses: ./executor-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ inputs.framework_ref }}
          source-run-id: ${{ inputs.source_run_id }}
          source-artifact: ${{ inputs.source_artifact }}
          github-token: ${{ github.token }}

      - name: Bind qualified Native bytes to the Standard checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -er .status native-release/prepare-status.json)" = qualified
          test '${{ steps.checkpoint.outputs.bundle_digest }}' = '${{ inputs.release_bundle_digest }}'
          test '${{ steps.checkpoint.outputs.version }}' = '${{ inputs.opl_version }}'
          test '${{ steps.checkpoint.outputs.app_ref }}' = '${{ inputs.app_ref }}'
          test '${{ steps.checkpoint.outputs.shell_ref }}' = '${{ inputs.shell_ref }}'
          test '${{ steps.checkpoint.outputs.framework_source_ref }}' = '${{ inputs.framework_ref }}'
          test '${{ steps.checkpoint.outputs.active_unknown_marker_count }}' = 0
          identity_receipts=()
          while IFS= read -r receipt; do identity_receipts+=("$receipt"); done < <(
            find imported-checkpoint -type f -name standard-identity-receipt.json -print | LC_ALL=C sort
          )
          test "${#identity_receipts[@]}" -eq 1
          identity_sha256="sha256:$(shasum -a 256 "${identity_receipts[0]}" | awk '{print $1}')"
          test "$identity_sha256" = '${{ inputs.standard_identity_sha256 }}'
          cp "${identity_receipts[0]}" native-release/standard-identity-receipt.json
          cmp "${identity_receipts[0]}" native-release/standard-identity-receipt.json
          node --experimental-strip-types executor-source/scripts/release-native-webui-carrier.ts readback \
            --manifest native-release/publication-manifest.json \
            --output native-release/prepublication-readback.json \
            > native-release/prepublication-readback.stdout.json || test "$?" -eq 2
          jq -e '
            .remote_target
            | test("^github-native-webui:gaofeng21cn/one-person-lab-app@v[0-9]+\\.[0-9]+\\.[0-9]+(-r[1-9][0-9]*)?/sha256:[0-9a-f]{64}$")
          ' native-release/prepublication-readback.json >/dev/null

      - name: Append one exact Native asset set through the Framework ledger
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_DIGEST: ${{ steps.checkpoint.outputs.bundle_digest }}
        shell: bash
        run: |
          set -euo pipefail
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          store='${{ steps.checkpoint.outputs.store_dir }}'
          operation_id='${{ steps.checkpoint.outputs.standard_operation_id }}'
          operation_args=(
            --operation standard
            --operation-id "$operation_id"
            --operation-started-at '${{ steps.checkpoint.outputs.standard_operation_started_at }}'
            --operation-deadline-at '${{ steps.checkpoint.outputs.standard_operation_deadline_at }}'
          )
          node --experimental-strip-types executor-source/scripts/release-operation-deadline.ts check \
            --operation standard \
            --started-at '${{ steps.checkpoint.outputs.standard_operation_started_at }}' \
            --deadline-at '${{ steps.checkpoint.outputs.standard_operation_deadline_at }}'
          node --experimental-strip-types executor-source/scripts/framework-release-adapter.ts github-inspect \
            --repo "$GITHUB_REPOSITORY" --tag '${{ steps.checkpoint.outputs.tag }}' \
            --output native-release/standard-remote.json
          node --experimental-strip-types executor-source/scripts/framework-release-adapter.ts executor-receipt \
            --operation remote_inspect --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-native-standard-readback" \
            --release-operation standard --operation-id "$operation_id" \
            --remote-target "github-release:${GITHUB_REPOSITORY}@${{ steps.checkpoint.outputs.tag }}" \
            --publication-scope track_assets --bundle "$bundle" --track standard --outcome complete \
            --inspection native-release/standard-remote.json --output native-release/standard-remote.receipt.json
          framework-executor/bin/opl release publish \
            --bundle "$BUNDLE_DIGEST" --executor-receipt native-release/standard-remote.receipt.json \
            "${operation_args[@]}" --store "$store" --json > native-release/standard-published.json
          mutation_attempt_id="gha-${GITHUB_RUN_ID}-native-webui-assets"
          set +e
          node --experimental-strip-types executor-source/scripts/release-native-webui-carrier.ts publish \
            --manifest native-release/publication-manifest.json \
            --mutation-attempt-id "$mutation_attempt_id" \
            --output native-release/publication-receipt.json \
            > native-release/publication-receipt.stdout.json
          publish_exit=$?
          set -e
          status="$(jq -er .status native-release/publication-receipt.json)"
          remote_target="$(jq -er .remote_target native-release/publication-receipt.json)"
          case "$status" in
            complete|idempotent)
              test "$publish_exit" -eq 0
              node --experimental-strip-types executor-source/scripts/framework-release-adapter.ts executor-receipt \
                --operation remote_inspect --executor remote --attempt-id "$mutation_attempt_id" \
                --release-operation standard --operation-id "$operation_id" \
                --remote-target "$remote_target" --publication-scope external_target \
                --bundle "$bundle" --track standard --outcome complete \
                --output native-release/native-framework.receipt.json
              framework-executor/bin/opl release publish \
                --bundle "$BUNDLE_DIGEST" --executor-receipt native-release/native-framework.receipt.json \
                "${operation_args[@]}" --store "$store" --json > native-release/native-framework-result.json
              test "$(jq -r .release_bundle_publish.status native-release/native-framework-result.json)" = complete
              ;;
            outcome_unknown)
              test "$publish_exit" -eq 2
              node --experimental-strip-types executor-source/scripts/framework-release-adapter.ts executor-receipt \
                --operation remote_inspect --executor remote --attempt-id "$mutation_attempt_id" \
                --release-operation standard --operation-id "$operation_id" \
                --remote-target "$remote_target" --publication-scope external_target \
                --bundle "$bundle" --track standard --outcome unknown \
                --output native-release/native-framework.receipt.json
              framework-executor/bin/opl release publish \
                --bundle "$BUNDLE_DIGEST" --executor-receipt native-release/native-framework.receipt.json \
                "${operation_args[@]}" --store "$store" --json > native-release/native-framework-result.json
              test "$(jq -r .release_bundle_publish.status native-release/native-framework-result.json)" = reconcile_only
              ;;
            *) echo "::error::Native WebUI publication status is invalid: $status"; exit 1 ;;
          esac
          test "$(jq -r .latest_modified native-release/publication-receipt.json)" = false
          test "$(jq -r .container_registry_modified native-release/publication-receipt.json)" = false
          test "$(jq -r .homebrew_modified native-release/publication-receipt.json)" = false
          framework-executor/bin/opl release checkpoint export \
            --bundle "$BUNDLE_DIGEST" --output native-release/native-publication-checkpoint \
            --store "$store" --json > native-release/native-checkpoint-export.json
          framework-executor/bin/opl release status \
            --bundle "$BUNDLE_DIGEST" --store "$store" --json > native-release/native-framework-status.json
          marker_count="$(jq -er '.release_bundle_status.active_unknown_markers | length' native-release/native-framework-status.json)"
          if [ "$status" = outcome_unknown ]; then
            test "$marker_count" -eq 1
            marker="$(jq -cer '.release_bundle_status.active_unknown_markers[0]' native-release/native-framework-status.json)"
            test "$(jq -r .operation_id <<<"$marker")" = "$operation_id"
            test "$(jq -r .operation_kind <<<"$marker")" = standard
            test "$(jq -r .track <<<"$marker")" = standard
            test "$(jq -r .stage_operation <<<"$marker")" = publish
            test "$(jq -r .publication_scope <<<"$marker")" = external_target
            test "$(jq -r .remote_target <<<"$marker")" = "$remote_target"
            test "$(jq -r .prior_mutation_attempt_id <<<"$marker")" = "$mutation_attempt_id"
            test "$(find native-release/native-publication-checkpoint -type f -name checkpoint.json | wc -l | tr -d ' ')" -eq 1
            test -f native-release/publication-manifest.json
            exit 1
          fi
          test "$marker_count" -eq 0
          test "$(find native-release/native-publication-checkpoint -type f -name checkpoint.json | wc -l | tr -d ' ')" -eq 1
          test -f native-release/publication-manifest.json

      - name: Persist typed Native publication failure
        if: ${{ failure() }}
        shell: bash
        run: |
          mkdir -p native-release
          if [ ! -s native-release/publication-receipt.json ]; then
            jq -n \
              '{schema:"opl_app_native_webui_publication_receipt.v1",status:"not_published",retry_disposition:"inspect_prepare_or_checkpoint_evidence_then_freeze_a_new_standard_bundle"}' \
              > native-release/publication-receipt.json
          fi

      - name: Upload Native publication and public readback receipt
        if: ${{ always() }}
        id: identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-webui-publication-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Export publication artifact identity
        if: ${{ always() }}
        id: publication
        shell: bash
        run: echo "publication_artifact_name=native-webui-publication-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  readback-native-assets:
    if: ${{ inputs.mode == 'readback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Reject partial rerun and bind publication artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ '${{ inputs.source_run_id }}' =~ ^[1-9][0-9]*$ ]]
          [[ '${{ inputs.publication_artifact_name }}' =~ ^native-webui-publication-[A-Za-z0-9._-]+$ ]]

      - name: Checkout exact frozen App product authority
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          path: app-source

      - name: Restore Native publication checkpoint
        id: checkpoint
        uses: ./app-source/.github/actions/restore-release-checkpoint
        with:
          framework-executor-ref: ${{ inputs.framework_ref }}
          source-run-id: ${{ inputs.source_run_id }}
          source-artifact: ${{ inputs.publication_artifact_name }}
          github-token: ${{ github.token }}
          allow-reconcile-required: 'true'

      - name: Read back public Native bytes and reconcile an exact unknown marker
        env:
          BUNDLE_DIGEST: ${{ steps.checkpoint.outputs.bundle_digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BUNDLE_DIGEST" = '${{ inputs.release_bundle_digest }}'
          test '${{ steps.checkpoint.outputs.version }}' = '${{ inputs.opl_version }}'
          test '${{ steps.checkpoint.outputs.app_ref }}' = '${{ inputs.app_ref }}'
          test '${{ steps.checkpoint.outputs.shell_ref }}' = '${{ inputs.shell_ref }}'
          [[ '${{ inputs.standard_identity_sha256 }}' =~ ^sha256:[0-9a-f]{64}$ ]]
          native_release=imported-checkpoint
          test -f "$native_release/publication-manifest.json"
          test "sha256:$(shasum -a 256 "$native_release/standard-identity-receipt.json" | awk '{print $1}')" = \
            '${{ inputs.standard_identity_sha256 }}'
          mkdir -p native-readback-root
          ln -s "$GITHUB_WORKSPACE/$native_release" native-readback-root/native-release
          (
            cd native-readback-root
            node --experimental-strip-types ../app-source/scripts/release-native-webui-carrier.ts readback \
              --manifest ../"$native_release"/publication-manifest.json \
              --output ../native-public-readback.json > ../native-public-readback.stdout.json
          )
          test "$(jq -r .status native-public-readback.json)" = complete
          store='${{ steps.checkpoint.outputs.store_dir }}'
          bundle='${{ steps.checkpoint.outputs.bundle_path }}'
          framework-executor/bin/opl release status \
            --bundle "$BUNDLE_DIGEST" --store "$store" --json > native-status-before.json
          marker_count="$(jq -er '.release_bundle_status.active_unknown_markers | length' native-status-before.json)"
          case "$marker_count" in
            0) ;;
            1)
              marker="$(jq -cer '.release_bundle_status.active_unknown_markers[0]' native-status-before.json)"
              test "$(jq -r .operation_id <<<"$marker")" = '${{ steps.checkpoint.outputs.standard_operation_id }}'
              test "$(jq -r .operation_kind <<<"$marker")" = standard
              test "$(jq -r .track <<<"$marker")" = standard
              test "$(jq -r .stage_operation <<<"$marker")" = publish
              test "$(jq -r .publication_scope <<<"$marker")" = external_target
              target="$(jq -er .remote_target <<<"$marker")"
              prior_attempt="$(jq -er .prior_mutation_attempt_id <<<"$marker")"
              test "$target" = "$(jq -er .remote_target native-public-readback.json)"
              node --experimental-strip-types app-source/scripts/framework-release-adapter.ts executor-receipt \
                --operation remote_inspect --executor remote --attempt-id "gha-${GITHUB_RUN_ID}-native-readback" \
                --release-operation standard --operation-id '${{ steps.checkpoint.outputs.standard_operation_id }}' \
                --remote-target "$target" --prior-attempt-id "$prior_attempt" \
                --publication-scope external_target --bundle "$bundle" --track standard --outcome complete \
                --output native-reconcile.receipt.json
              framework-executor/bin/opl release reconcile \
                --bundle "$BUNDLE_DIGEST" --executor-receipt native-reconcile.receipt.json \
                --operation standard \
                --operation-id '${{ steps.checkpoint.outputs.standard_operation_id }}' \
                --operation-started-at '${{ steps.checkpoint.outputs.standard_operation_started_at }}' \
                --operation-deadline-at '${{ steps.checkpoint.outputs.standard_operation_deadline_at }}' \
                --store "$store" --json > native-reconcile-result.json
              reconcile_status="$(jq -er .release_bundle_reconcile.status native-reconcile-result.json)"
              case "$reconcile_status" in complete|late_observation) ;; *) exit 1 ;; esac
              ;;
            *) echo "::error::Native publication checkpoint contains multiple unknown markers."; exit 1 ;;
          esac

      - name: Upload Native public readback evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-webui-public-readback-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-public-readback.json
            native-public-readback.stdout.json
            native-status-before.json
            native-reconcile.receipt.json
            native-reconcile-result.json
          if-no-files-found: warn
          retention-days: 30
