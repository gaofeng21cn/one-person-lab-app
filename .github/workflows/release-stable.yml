name: OPL Stable Release Bundle
run-name: OPL Stable ${{ inputs.operation }} authority:${{ inputs.authority_id }} run:${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: One bounded operation over an immutable Framework Bundle
        required: true
        default: standard
        type: choice
        options:
          - standard
          - resume_standard
          - append_full
      authority_id:
        description: Pre-issued canonical Stable authority identity for this one operation
        required: true
        type: string
      authority_carrier:
        description: Canonical base64url pre-issued Stable authority JSON carrier
        required: true
        type: string
      authority_digest:
        description: SHA-256 digest declared by the pre-issued authority carrier
        required: true
        type: string
      version:
        description: Legacy raw Standard input; must be empty because the admission manifest owns version allocation
        required: false
        default: ''
        type: string
      include_full:
        description: Legacy checkpoint compatibility; new Standard requests must keep this false
        required: false
        default: false
        type: boolean
      shell_ref:
        description: Legacy raw Standard input; must be empty because the admission manifest owns the cohort
        required: false
        default: ''
        type: string
      framework_ref:
        description: Legacy raw Standard input; optional expected Bundle binding only for resume/append
        required: false
        default: ''
        type: string
      source_run_id:
        description: Exact run containing the Framework portable checkpoint
        required: false
        default: ''
        type: string
      source_artifact:
        description: Exact Framework portable checkpoint artifact name
        required: false
        default: ''
        type: string
      source_qualification_run_id:
        description: Legacy external qualification input; must remain empty
        required: false
        default: ''
        type: string
      source_qualification_receipt_digest:
        description: Legacy external qualification digest; must remain empty
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  OPL_APP_STANDARD_PACKAGE_COMPATIBILITY_ABI: opl_packages.v1
  OPL_APP_STANDARD_PACKAGE_COMPATIBILITY_VERSION_RANGE: '>=0.1.0 <1.0.0'
  OPL_APP_STABLE_STAGE_RESULT_SCHEMA: opl_app_stable_stage_result.v1
  OPL_APP_STABLE_STAGE_RESULT_AUTHORITY: attempt_observation_only_no_framework_state_projection

concurrency:
  group: opl-release-bundle-global
  cancel-in-progress: false

jobs:
  protected-operation-admission:
    if: ${{ inputs.operation == 'standard' }}
    runs-on: macos-14
    timeout-minutes: 30
    environment: release-stable
    permissions:
      contents: read
      actions: read
    outputs:
      app_ref: ${{ steps.control.outputs.app_ref }}
      shell_ref: ${{ steps.control.outputs.shell_ref }}
      framework_ref: ${{ steps.control.outputs.framework_ref }}
      operation_id: ${{ steps.control.outputs.operation_id }}
      control_digest: ${{ steps.control.outputs.control_digest }}
      authority_id: ${{ steps.authority.outputs.authority_id }}
    steps:
      - name: Reject bare or rerun Stable request before expensive work
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test '${{ inputs.operation }}' = standard
          test -n '${{ inputs.authority_id }}'
          test -n '${{ inputs.authority_carrier }}'
          [[ '${{ inputs.authority_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
          test -z '${{ inputs.version }}${{ inputs.shell_ref }}${{ inputs.framework_ref }}${{ inputs.source_run_id }}${{ inputs.source_artifact }}${{ inputs.source_qualification_run_id }}${{ inputs.source_qualification_receipt_digest }}'
          test '${{ inputs.include_full }}' = false

      - name: Checkout frozen App source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: app-source
          fetch-depth: 0

      - name: Decode and verify pre-issued Stable authority before dependency installation
        id: authority
        env:
          AUTHORITY_ID: ${{ inputs.authority_id }}
          AUTHORITY_CARRIER: ${{ inputs.authority_carrier }}
          AUTHORITY_DIGEST: ${{ inputs.authority_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts decode-carrier \
            --input "$AUTHORITY_CARRIER" --authority-id "$AUTHORITY_ID" \
            --authority-digest "$AUTHORITY_DIGEST" \
            --output stable-operation-authority.json
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts verify-authority \
            --authority stable-operation-authority.json \
            --authority-id "$AUTHORITY_ID" --authority-digest "$AUTHORITY_DIGEST" \
            --app-root app-source --expected-actor "$GITHUB_ACTOR" --expected-app-sha "$GITHUB_SHA"
          app_sha="$(jq -er .cohort.app_sha stable-operation-authority.json)"
          shell_sha="$(jq -er .cohort.shell_sha stable-operation-authority.json)"
          framework_sha="$(jq -er .cohort.framework_sha stable-operation-authority.json)"
          operation_id="$(jq -er .operation_id stable-operation-authority.json)"
          objective_fingerprint="$(jq -er .objective_fingerprint stable-operation-authority.json)"
          test "$app_sha" = "$GITHUB_SHA"
          for value in "$shell_sha" "$framework_sha"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          {
            echo "authority_id=$AUTHORITY_ID"
            echo "operation_id=$operation_id"
            echo "objective_fingerprint=$objective_fingerprint"
            echo "app_ref=$app_sha"
            echo "shell_ref=$shell_sha"
            echo "framework_ref=$framework_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout frozen Shell authority cohort
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/opl-aion-shell
          ref: ${{ steps.authority.outputs.shell_ref }}
          path: app-source/shells/aionui
          fetch-depth: 0

      - name: Checkout frozen Framework authority cohort
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ steps.authority.outputs.framework_ref }}
          path: framework-source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app-source/package-lock.json

      - name: Install source-gate dependencies
        working-directory: app-source
        run: npm ci --ignore-scripts

      - name: Bind one pre-issued Stable authority to this run
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          app_sha="$(git -C app-source rev-parse HEAD)"
          shell_sha="$(git -C app-source/shells/aionui rev-parse HEAD)"
          framework_sha="$(git -C framework-source rev-parse HEAD)"
          for value in "$app_sha" "$shell_sha" "$framework_sha"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$app_sha" = '${{ steps.authority.outputs.app_ref }}'
          test "$shell_sha" = '${{ steps.authority.outputs.shell_ref }}'
          test "$framework_sha" = '${{ steps.authority.outputs.framework_ref }}'
          node --experimental-strip-types app-source/scripts/validate-release-source-gate.ts \
            --operation-fingerprint '${{ steps.authority.outputs.objective_fingerprint }}' \
            --app-ref "$app_sha" \
            --shell-ref "$shell_sha" \
            --framework-ref "$framework_sha" \
            --repo-root app-source \
            --shell-root app-source/shells/aionui \
            --framework-root framework-source \
            --require-shell-format true \
            --run-shell-tests true \
            --output source-gate.json
          node --experimental-strip-types app-source/scripts/release-dispatch-guard.ts preflight \
            --workflow .github/workflows/release-stable.yml \
            --expected-app-sha "$app_sha" \
            --expected-shell-sha "$shell_sha" \
            --expected-framework-sha "$framework_sha" \
            --current-run-id "$GITHUB_RUN_ID" \
            --authority-id '${{ steps.authority.outputs.authority_id }}' \
            --source-gate-report source-gate.json \
            --output pre-nonce-guard.json
          node - app-source critical-blobs.json <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const [root, output] = process.argv.slice(2);
          const files = [
            '.github/workflows/release-stable.yml',
            '.github/workflows/release-source-qualification.yml',
            '.github/workflows/_release-bundle.yml',
            '.github/workflows/_release-standard-publish.yml',
            '.github/workflows/_release-full-addon.yml',
            '.github/workflows/_release-webui-carrier.yml',
            '.github/workflows/release-webui-publication-promote.yml',
            'contracts/app-release-channel.json',
          ];
          const blobs = Object.fromEntries(files.map((file) => [
            file,
            `sha256:${crypto.createHash('sha256').update(fs.readFileSync(path.join(root, file))).digest('hex')}`,
          ]));
          fs.writeFileSync(output, `${JSON.stringify(blobs, null, 2)}\n`);
          NODE
          source_gate_digest="sha256:$(shasum -a 256 source-gate.json | awk '{print $1}')"
          pre_nonce_guard_digest="sha256:$(shasum -a 256 pre-nonce-guard.json | awk '{print $1}')"
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts bind \
            --authority stable-operation-authority.json \
            --authority-digest '${{ inputs.authority_digest }}' \
            --actor "$GITHUB_ACTOR" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-gate-digest "$source_gate_digest" \
            --pre-nonce-guard-digest "$pre_nonce_guard_digest" \
            --output stable-operation-control.json
          node --experimental-strip-types app-source/scripts/stable-operation-control.ts verify \
            --control stable-operation-control.json --app-root app-source \
            --source-gate source-gate.json --pre-nonce-guard pre-nonce-guard.json \
            --expected-run-id "$GITHUB_RUN_ID" --expected-actor "$GITHUB_ACTOR" \
            --expected-app-sha "$app_sha" --expected-shell-sha "$shell_sha" --expected-framework-sha "$framework_sha"
          {
            echo "app_ref=$app_sha"
            echo "shell_ref=$shell_sha"
            echo "framework_ref=$framework_sha"
            echo "operation_id=$(jq -er .operation_id stable-operation-control.json)"
            echo "control_digest=$(jq -er .authority_digest stable-operation-control.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable operation control evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-operation-control-${{ github.run_id }}
          path: |
            stable-operation-control.json
            stable-operation-authority.json
            source-gate.json
            pre-nonce-guard.json
            critical-blobs.json
          if-no-files-found: error
          retention-days: 30

  source-qualification:
    if: ${{ inputs.operation == 'standard' }}
    needs: [protected-operation-admission]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-source-qualification.yml
    with:
      operation_scope: stable_operation_source_preflight
      app_ref: ${{ needs.protected-operation-admission.outputs.app_ref }}
      shell_ref: ${{ needs.protected-operation-admission.outputs.shell_ref }}
      framework_ref: ${{ needs.protected-operation-admission.outputs.framework_ref }}

  admission:
    needs: [protected-operation-admission, source-qualification]
    if: ${{ always() && (inputs.operation != 'standard' || needs.source-qualification.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      operation: ${{ steps.admission.outputs.operation }}
      version: ${{ steps.admission.outputs.version }}
      include_full: ${{ steps.admission.outputs.include_full }}
      app_ref: ${{ steps.admission.outputs.app_ref }}
      shell_ref: ${{ steps.admission.outputs.shell_ref }}
      framework_ref: ${{ steps.admission.outputs.framework_ref }}
      framework_executor_ref: ${{ steps.admission.outputs.framework_executor_ref }}
      source_run_id: ${{ steps.admission.outputs.source_run_id }}
      source_artifact: ${{ steps.admission.outputs.source_artifact }}
      operation_started_at: ${{ steps.admission.outputs.operation_started_at }}
      operation_deadline_at: ${{ steps.admission.outputs.operation_deadline_at }}
      package_compatibility_abi: ${{ steps.admission.outputs.package_compatibility_abi }}
      package_compatibility_version_range: ${{ steps.admission.outputs.package_compatibility_version_range }}
      source_qualification_run_id: ${{ steps.admission.outputs.source_qualification_run_id }}
      source_qualification_receipt_digest: ${{ steps.admission.outputs.source_qualification_receipt_digest }}
    steps:
      - name: Checkout canonical App executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: app-source
          fetch-depth: 0

      - name: Download same-operation source preflight
        if: ${{ inputs.operation == 'standard' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opl-source-qualification-${{ github.run_id }}
          path: source-qualification-evidence

      - name: Admit one bounded Bundle operation
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          REQUESTED_VERSION: ${{ inputs.version }}
          INCLUDE_FULL: ${{ inputs.include_full }}
          REQUESTED_SHELL_REF: ${{ inputs.shell_ref }}
          REQUESTED_FRAMEWORK_REF: ${{ inputs.framework_ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.source_artifact }}
          LEGACY_SOURCE_QUALIFICATION_RUN_ID: ${{ inputs.source_qualification_run_id }}
          LEGACY_SOURCE_QUALIFICATION_RECEIPT_DIGEST: ${{ inputs.source_qualification_receipt_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || {
            echo "::error::Stable operations are one-shot; use resume_standard with the portable checkpoint."
            exit 1
          }
          app_sha="$(git -C app-source rev-parse HEAD)"
          VERSION="$REQUESTED_VERSION"
          SHELL_REF="$REQUESTED_SHELL_REF"
          FRAMEWORK_REF="$REQUESTED_FRAMEWORK_REF"
          SOURCE_QUALIFICATION_RUN_ID=''
          SOURCE_QUALIFICATION_RECEIPT_DIGEST=''
          case "$OPERATION" in
            standard)
              test -z "$REQUESTED_VERSION$REQUESTED_SHELL_REF$REQUESTED_FRAMEWORK_REF$SOURCE_RUN_ID$SOURCE_ARTIFACT$LEGACY_SOURCE_QUALIFICATION_RUN_ID$LEGACY_SOURCE_QUALIFICATION_RECEIPT_DIGEST" || {
                echo "::error::A new Standard Bundle accepts no external source or qualification artifact."
                exit 1
              }
              SOURCE_QUALIFICATION_RUN_ID="$GITHUB_RUN_ID"
              SOURCE_QUALIFICATION_RECEIPT_DIGEST='${{ needs.source-qualification.outputs.receipt_digest }}'
              [[ "$SOURCE_QUALIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
                echo "::error::A new Standard Bundle requires its same-operation source preflight run id."
                exit 1
              }
              [[ "$SOURCE_QUALIFICATION_RECEIPT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "::error::A new Standard Bundle requires its same-operation source preflight receipt digest."
                exit 1
              }
              test "$INCLUDE_FULL" = false || {
                echo "::error::A new App Standard Bundle cannot bind a future Full Package payload."
                exit 1
              }
              # source-qualification-receipt-resolver:start
              qualification_receipts=()
              while IFS= read -r receipt; do
                qualification_receipts+=("$receipt")
              done < <(
                find source-qualification-evidence -type f -name source-qualification-receipt.json -print \
                  | LC_ALL=C sort
              )
              if [ "${#qualification_receipts[@]}" -ne 1 ]; then
                echo "::error::Source qualification artifact must contain exactly one regular receipt file; found ${#qualification_receipts[@]}."
                exit 1
              fi
              qualification_receipt_path="${qualification_receipts[0]}"
              test -s "$qualification_receipt_path" && test ! -L "$qualification_receipt_path" || {
                echo "::error::Source qualification receipt must be one non-empty regular file, not a symlink."
                exit 1
              }
              # source-qualification-receipt-resolver:end
              node --experimental-strip-types app-source/scripts/source-qualification-receipt.ts verify \
                --receipt "$qualification_receipt_path" \
                --expected-digest "$SOURCE_QUALIFICATION_RECEIPT_DIGEST" \
                --expected-run-id "$SOURCE_QUALIFICATION_RUN_ID" \
                --expected-head-sha "$app_sha" \
                --output verified-source-qualification.json
              test "$(jq -er .execution.operation_scope "$qualification_receipt_path")" = stable_operation_source_preflight || {
                echo "::error::Stable admission requires the same-operation source preflight scope."
                exit 1
              }
              SHELL_REF="$(jq -er .cohort.shell.sha verified-source-qualification.json)"
              FRAMEWORK_REF="$(jq -er .cohort.framework.sha verified-source-qualification.json)"
              verified_app_ref="$(jq -er .cohort.app.sha verified-source-qualification.json)"
              test "$verified_app_ref" = "$app_sha" || {
                echo "::error::Verified source qualification App ref does not match the workflow executor."
                exit 1
              }
              test "$verified_app_ref" = '${{ needs.protected-operation-admission.outputs.app_ref }}'
              test "$SHELL_REF" = '${{ needs.protected-operation-admission.outputs.shell_ref }}'
              test "$FRAMEWORK_REF" = '${{ needs.protected-operation-admission.outputs.framework_ref }}'
              ;;
            resume_standard|append_full)
              [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
                echo "::error::$OPERATION requires an exact source run id."
                exit 1
              }
              [[ "$SOURCE_ARTIFACT" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo "::error::$OPERATION requires one exact Framework checkpoint artifact name."
                exit 1
              }
              test -z "$LEGACY_SOURCE_QUALIFICATION_RUN_ID$LEGACY_SOURCE_QUALIFICATION_RECEIPT_DIGEST" || {
                echo "::error::$OPERATION cannot consume a new source qualification receipt."
                exit 1
              }
              if [ -n "$REQUESTED_FRAMEWORK_REF" ]; then
                [[ "$FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]] || {
                  echo "::error::$OPERATION optional Framework expectation must be an exact lowercase SHA."
                  exit 1
                }
              fi
              ;;
            *) exit 1 ;;
          esac
          operation_started_at=''
          operation_deadline_at=''
          if [ "$OPERATION" = standard ] || [ "$OPERATION" = append_full ]; then
            operation_created_at="$(timeout --foreground --signal=TERM --kill-after=5s 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
            node --experimental-strip-types app-source/scripts/release-operation-deadline.ts resolve \
              --operation "$OPERATION" --started-at "$operation_created_at" \
              --output release-operation-admission.json > /dev/null
            operation_started_at="$(jq -er .started_at release-operation-admission.json)"
            operation_deadline_at="$(jq -er .deadline_at release-operation-admission.json)"
          fi
          {
            echo "operation=$OPERATION"
            echo "version=$VERSION"
            echo "include_full=$INCLUDE_FULL"
            echo "app_ref=$app_sha"
            echo "shell_ref=$SHELL_REF"
            echo "framework_ref=$FRAMEWORK_REF"
            echo "framework_executor_ref=$FRAMEWORK_REF"
            echo "source_run_id=$SOURCE_RUN_ID"
            echo "source_artifact=$SOURCE_ARTIFACT"
            echo "operation_started_at=$operation_started_at"
            echo "operation_deadline_at=$operation_deadline_at"
            echo "package_compatibility_abi=$OPL_APP_STANDARD_PACKAGE_COMPATIBILITY_ABI"
            echo "package_compatibility_version_range=$OPL_APP_STANDARD_PACKAGE_COMPATIBILITY_VERSION_RANGE"
            echo "source_qualification_run_id=$SOURCE_QUALIFICATION_RUN_ID"
            echo "source_qualification_receipt_digest=$SOURCE_QUALIFICATION_RECEIPT_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable operation admission
        if: ${{ steps.admission.outputs.operation != 'resume_standard' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-release-operation-admission-${{ github.run_id }}
          path: |
            release-operation-admission.json
            verified-source-qualification.json
          if-no-files-found: error
          retention-days: 30

  stable-admission-manifest:
    if: ${{ needs.admission.outputs.operation == 'standard' }}
    needs: [admission, protected-operation-admission]
    runs-on: macos-14
    timeout-minutes: 15
    environment: release-stable
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      updater_version: ${{ steps.manifest.outputs.updater_version }}
      app_ref: ${{ needs.admission.outputs.app_ref }}
      shell_ref: ${{ needs.admission.outputs.shell_ref }}
      framework_ref: ${{ needs.admission.outputs.framework_ref }}
      manifest_digest: ${{ steps.manifest.outputs.manifest_digest }}
    steps:
      - name: Checkout exact Stable executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.admission.outputs.app_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Download exact source qualification receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: opl-source-qualification-${{ needs.admission.outputs.source_qualification_run_id }}
          run-id: ${{ needs.admission.outputs.source_qualification_run_id }}
          github-token: ${{ github.token }}
          path: source-qualification-evidence

      - name: Verify protected Apple credentials in the Stable entry
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          IDENTITY: ${{ secrets.IDENTITY }}
        run: |
          node --experimental-strip-types scripts/verify-apple-release-credentials.ts \
            --output "$RUNNER_TEMP/apple-release-credentials-preflight.json"

      - name: Seal one same-run Stable admission manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          APP_REF: ${{ needs.admission.outputs.app_ref }}
          SHELL_REF: ${{ needs.admission.outputs.shell_ref }}
          FRAMEWORK_REF: ${{ needs.admission.outputs.framework_ref }}
          SOURCE_QUALIFICATION_RECEIPT_DIGEST: ${{ needs.admission.outputs.source_qualification_receipt_digest }}
        shell: bash
        run: |
          set -euo pipefail
          # source-qualification-receipt-resolver:start
          qualification_receipts=()
          while IFS= read -r receipt; do
            qualification_receipts+=("$receipt")
          done < <(
            find source-qualification-evidence -type f -name source-qualification-receipt.json -print \
              | LC_ALL=C sort
          )
          if [ "${#qualification_receipts[@]}" -ne 1 ]; then
            echo "::error::Source qualification artifact must contain exactly one regular receipt file; found ${#qualification_receipts[@]}."
            exit 1
          fi
          qualification_receipt_path="${qualification_receipts[0]}"
          test -s "$qualification_receipt_path" && test ! -L "$qualification_receipt_path" || {
            echo "::error::Source qualification receipt must be one non-empty regular file, not a symlink."
            exit 1
          }
          # source-qualification-receipt-resolver:end
          node --experimental-strip-types scripts/validate-source-qualification-receipt.ts \
            --receipt "$qualification_receipt_path" \
            --expected-digest "$SOURCE_QUALIFICATION_RECEIPT_DIGEST" \
            --expected-run-id '${{ needs.admission.outputs.source_qualification_run_id }}' \
            --expected-head-sha "$APP_REF"
          base_version="$(node -e 'const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",year:"2-digit",month:"numeric",day:"numeric"}).formatToParts(new Date());const values=Object.fromEntries(parts.map(part=>[part.type,part.value]));process.stdout.write(`${values.year}.${values.month}.${values.day}`)')"
          node --experimental-strip-types scripts/stable-release-admission-manifest.ts create \
            --base-version "$base_version" \
            --app-ref "$APP_REF" --shell-ref "$SHELL_REF" --framework-ref "$FRAMEWORK_REF" \
            --admission-run-id "$GITHUB_RUN_ID" \
            --source-qualification-receipt "$qualification_receipt_path" \
            --credential-receipt "$RUNNER_TEMP/apple-release-credentials-preflight.json" \
            --output "$RUNNER_TEMP/stable-release-admission-manifest.json"
          node - "$RUNNER_TEMP/stable-release-admission-manifest.json" "$GITHUB_OUTPUT" <<'NODE'
          const fs = require('fs');
          const [manifestPath, outputPath] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          fs.appendFileSync(outputPath, [
            `version=${manifest.version.display}`,
            `updater_version=${manifest.version.updater}`,
            `manifest_digest=${manifest.manifest_digest}`,
            '',
          ].join('\n'));
          NODE
          echo "qualification_receipt_path=$qualification_receipt_path" >> "$GITHUB_OUTPUT"

      - name: Upload same-run protected admission evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opl-stable-admission-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stable-release-admission-manifest.json
            ${{ runner.temp }}/apple-release-credentials-preflight.json
            ${{ steps.manifest.outputs.qualification_receipt_path }}
          if-no-files-found: error
          retention-days: 30

  standard:
    if: ${{ needs.admission.outputs.operation == 'standard' }}
    needs: [admission, protected-operation-admission, stable-admission-manifest]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_release-bundle.yml
    with:
      mode: execute
      operation: standard
      channel: stable
      version: ${{ needs.stable-admission-manifest.outputs.version }}
      include_full: ${{ fromJSON(needs.admission.outputs.include_full) }}
      package_compatibility_abi: ${{ needs.admission.outputs.package_compatibility_abi }}
      package_compatibility_version_range: ${{ needs.admission.outputs.package_compatibility_version_range }}
      app_ref: ${{ needs.protected-operation-admission.outputs.app_ref }}
      shell_ref: ${{ needs.protected-operation-admission.outputs.shell_ref }}
      framework_ref: ${{ needs.protected-operation-admission.outputs.framework_ref }}
      operation_started_at: ${{ needs.admission.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.admission.outputs.operation_deadline_at }}
      stable_operation_control_artifact: opl-stable-operation-control-${{ github.run_id }}
      stable_operation_control_digest: ${{ needs.protected-operation-admission.outputs.control_digest }}
    secrets: inherit

  resume-standard:
    if: ${{ needs.admission.outputs.operation == 'resume_standard' }}
    needs: [admission]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_release-standard-publish.yml
    with:
      mode: execute
      operation: resume_standard
      source_run_id: ${{ needs.admission.outputs.source_run_id }}
      source_artifact: ${{ needs.admission.outputs.source_artifact }}
      framework_executor_ref: ${{ needs.admission.outputs.framework_executor_ref }}
    secrets: inherit

  append-full:
    if: ${{ needs.admission.outputs.operation == 'append_full' }}
    needs: [admission]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/_release-full-addon.yml
    with:
      mode: execute
      operation: append_full
      source_run_id: ${{ needs.admission.outputs.source_run_id }}
      source_artifact: ${{ needs.admission.outputs.source_artifact }}
      framework_executor_ref: ${{ needs.admission.outputs.framework_executor_ref }}
      operation_started_at: ${{ needs.admission.outputs.operation_started_at }}
      operation_deadline_at: ${{ needs.admission.outputs.operation_deadline_at }}
    secrets: inherit
