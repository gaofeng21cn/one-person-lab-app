                  $failed_recovery_v3_run != ""
                  and ($failed_recovery_v3_matches | length) == 1
                  and (($failed_recovery_v3_matches[0].id | tostring) == $failed_recovery_v3_run)
                  and $failed_recovery_v3_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v4_run == "" and ($failed_recovery_v4_matches | length) == 0)
                or (
                  $failed_recovery_v4_run != ""
                  and ($failed_recovery_v4_matches | length) == 1
                  and (($failed_recovery_v4_matches[0].id | tostring) == $failed_recovery_v4_run)
                  and $failed_recovery_v4_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v5_run == "" and ($failed_recovery_v5_matches | length) == 0)
                or (
                  $failed_recovery_v5_run != ""
                  and ($failed_recovery_v5_matches | length) == 1
                  and (($failed_recovery_v5_matches[0].id | tostring) == $failed_recovery_v5_run)
                  and $failed_recovery_v5_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v6_run == "" and ($failed_recovery_v6_matches | length) == 0)
                or (
                  $failed_recovery_v6_run != ""
                  and ($failed_recovery_v6_matches | length) == 1
                  and (($failed_recovery_v6_matches[0].id | tostring) == $failed_recovery_v6_run)
                  and $failed_recovery_v6_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v7_run == "" and ($failed_recovery_v7_matches | length) == 0)
                or (
                  $failed_recovery_v7_run != ""
                  and ($failed_recovery_v7_matches | length) == 1
                  and (($failed_recovery_v7_matches[0].id | tostring) == $failed_recovery_v7_run)
                  and $failed_recovery_v7_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v8_run == "" and ($failed_recovery_v8_matches | length) == 0)
                or (
                  $failed_recovery_v8_run != ""
                  and ($failed_recovery_v8_matches | length) == 1
                  and (($failed_recovery_v8_matches[0].id | tostring) == $failed_recovery_v8_run)
                  and $failed_recovery_v8_matches[0].run_attempt == 1
                )
              )
            ' recovery-runs.json >/dev/null
          else
            test "$TRIGGER_EVENT" = workflow_run
            test -z "$FAILED_FOLLOWER_RUN_ID$FAILED_RECOVERY_RUN_ID$FAILED_RECOVERY_V2_RUN_ID$FAILED_RECOVERY_V3_RUN_ID$FAILED_RECOVERY_V4_RUN_ID$FAILED_RECOVERY_V5_RUN_ID$FAILED_RECOVERY_V6_RUN_ID$FAILED_RECOVERY_V7_RUN_ID$FAILED_RECOVERY_V8_RUN_ID$RECOVERY_CONFIRMATION"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID" \
            > stable-authority-run.json
          jq -e --arg run "$STABLE_AUTHORITY_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' stable-authority-run.json >/dev/null
          activation_artifact="opl-release-activation-${STABLE_AUTHORITY_RUN_ID}"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID/artifacts?per_page=100" \
            > stable-authority-artifacts.json
          artifact_count="$(
            jq -r --arg name "$activation_artifact" '
              [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length
            ' stable-authority-artifacts.json
          )"
          case "$artifact_count" in
            0)
              echo "activation_artifact_found=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "activation_artifact_found=true" >> "$GITHUB_OUTPUT"
              echo "activation_artifact=$activation_artifact" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Stable authority run contains duplicate Latest activation artifacts."
              exit 1
              ;;
          esac

      - name: Download exact Latest activation evidence
        if: ${{ steps.authority.outputs.activation_artifact_found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.authority.outputs.activation_artifact }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: latest-activation

      - name: Bind exact follower handoff
        id: handoff
        if: ${{ always() && steps.authority.outcome == 'success' }}
        env:
          STABLE_AUTHORITY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation || '' }}
          FAILED_FOLLOWER_RUN_ID: ${{ inputs.failed_follower_run_id || '' }}
          FAILED_RECOVERY_RUN_ID: ${{ inputs.failed_recovery_run_id || '' }}
          FAILED_RECOVERY_V2_RUN_ID: ${{ inputs.failed_recovery_v2_run_id || '' }}
          FAILED_RECOVERY_V3_RUN_ID: ${{ inputs.failed_recovery_v3_run_id || '' }}
          FAILED_RECOVERY_V4_RUN_ID: ${{ inputs.failed_recovery_v4_run_id || '' }}
          FAILED_RECOVERY_V5_RUN_ID: ${{ inputs.failed_recovery_v5_run_id || '' }}
          FAILED_RECOVERY_V6_RUN_ID: ${{ inputs.failed_recovery_v6_run_id || '' }}
          FAILED_RECOVERY_V7_RUN_ID: ${{ inputs.failed_recovery_v7_run_id || '' }}
          FAILED_RECOVERY_V8_RUN_ID: ${{ inputs.failed_recovery_v8_run_id || '' }}
          RECOVERY_FRAMEWORK_REF: ${{ steps.authority.outputs.recovery_framework_ref || '' }}
          RECOVERY_EXECUTOR_REF: ${{ steps.authority.outputs.recovery_executor_ref || '' }}
          PRIOR_RECOVERY_AUTHORITY_DIGEST: ${{ steps.authority.outputs.prior_recovery_authority_digest || '' }}
          QUALIFIED_ARTIFACT_RUN_ID: ${{ steps.authority.outputs.qualified_artifact_run_id || '' }}
          QUALIFIED_ARTIFACT_NAME: ${{ steps.authority.outputs.qualified_artifact_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.authority.outputs.activation_artifact_found }}' != true ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          handoffs=()
          while IFS= read -r handoff; do handoffs+=("$handoff"); done < <(
            find latest-activation -type f -name webui-follower-handoff.json -print | LC_ALL=C sort
          )
          test "${#handoffs[@]}" -eq 1 || {
            echo "::error::Latest activation must contain exactly one WebUI follower handoff."
            exit 1
          }
          handoff="${handoffs[0]}"
          status="$(jq -er .status "$handoff")"
          case "$status" in
            skipped_legacy_identity_unavailable)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            ready) ;;
            *)
              echo "::error::WebUI follower handoff status is invalid."
              exit 1
              ;;
          esac
          stable_head_sha="$(jq -er .head_sha stable-authority-run.json)"
          jq -e \
            --arg run "$STABLE_AUTHORITY_RUN_ID" \
            --arg head "$stable_head_sha" '
              .schema == "opl_app_webui_follower_handoff.v1"
              and .status == "ready"
              and .stable_authority == {
                repository: "gaofeng21cn/one-person-lab-app",
                workflow: ".github/workflows/release-stable.yml",
                run_id: $run,
                run_attempt: 1,
                executor_head_sha: $head
              }
              and (.source.artifact_run_id | test("^[1-9][0-9]*$"))
              and (.source.checkpoint_artifact | test("^[A-Za-z0-9][A-Za-z0-9._-]+$"))
              and (.source.standard_identity_sha256 | test("^sha256:[0-9a-f]{64}$"))
              and (.release.version | test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
              and (.release.bundle_digest | test("^sha256:[0-9a-f]{64}$"))
              and (.release.cohort.app_sha | test("^[0-9a-f]{40}$"))
              and (.release.cohort.shell_sha | test("^[0-9a-f]{40}$"))
              and (.release.cohort.framework_sha | test("^[0-9a-f]{40}$"))
              and .latest_activation.admission_schema == "opl_standard_latest_admission_receipt.v1"
              and .latest_activation.admitted == true
              and .latest_activation.framework_terminal_status == "complete"
          ' "$handoff" >/dev/null
          stable_framework_ref="$(jq -er .release.cohort.framework_sha "$handoff")"
          framework_ref="$stable_framework_ref"
          release_cohort_ref="$(jq -er .release.bundle_digest "$handoff")"
          recovery_authority_digest=''
          recovery_executor_ref="$GITHUB_SHA"
          production_recovery=false
          if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v3 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v4 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v6 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v7 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v8 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v9 ]; then
            [[ "$RECOVERY_FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$RECOVERY_FRAMEWORK_REF" != "$stable_framework_ref"
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v9 ]; then
              [[ "$RECOVERY_EXECUTOR_REF" =~ ^[0-9a-f]{40}$ ]]
              recovery_executor_ref="$RECOVERY_EXECUTOR_REF"
            else
              test -z "$RECOVERY_EXECUTOR_REF$PRIOR_RECOVERY_AUTHORITY_DIGEST$QUALIFIED_ARTIFACT_RUN_ID$QUALIFIED_ARTIFACT_NAME"
            fi
            recovery_authority_core="$(jq -cnS \
              --arg stable_run "$STABLE_AUTHORITY_RUN_ID" \
              --arg failed_follower "$FAILED_FOLLOWER_RUN_ID" \
              --arg failed_v1 "$FAILED_RECOVERY_RUN_ID" \
              --arg failed_v2 "$FAILED_RECOVERY_V2_RUN_ID" \
              --arg failed_v3 "$FAILED_RECOVERY_V3_RUN_ID" \
              --arg failed_v4 "$FAILED_RECOVERY_V4_RUN_ID" \
              --arg failed_v5 "$FAILED_RECOVERY_V5_RUN_ID" \
              --arg failed_v6 "$FAILED_RECOVERY_V6_RUN_ID" \
              --arg failed_v7 "$FAILED_RECOVERY_V7_RUN_ID" \
              --arg version "$(jq -er .release.version "$handoff")" \
              --arg bundle "$(jq -er .release.bundle_digest "$handoff")" \
              --arg app "$(jq -er .release.cohort.app_sha "$handoff")" \
              --arg shell "$(jq -er .release.cohort.shell_sha "$handoff")" \
              --arg stable_framework "$stable_framework_ref" \
              --arg executor "$recovery_executor_ref" \
              --arg recovery_framework "$RECOVERY_FRAMEWORK_REF" '
              ({
                schema:"opl_app_webui_framework_recovery_authority.v1",
                status:"admitted",
                stable_authority_run_id:$stable_run,
                failed_follower_run_id:$failed_follower,
                failed_recovery_v1_run_id:$failed_v1,
                failed_recovery_v2_run_id:$failed_v2,
                release:{version:$version,bundle_digest:$bundle},
                stable_cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$stable_framework},
                recovery_source:{executor_app_sha:$executor,framework_sha:$recovery_framework}
              }
              + (if $failed_v3 == "" then {} else {failed_recovery_v3_run_id:$failed_v3} end)
              + (if $failed_v4 == "" then {} else {failed_recovery_v4_run_id:$failed_v4} end)
              + (if $failed_v5 == "" then {} else {failed_recovery_v5_run_id:$failed_v5} end)
              + (if $failed_v6 == "" then {} else {failed_recovery_v6_run_id:$failed_v6} end)
              + (if $failed_v7 == "" then {} else {failed_recovery_v7_run_id:$failed_v7} end))
            ')"
            recovery_authority_digest="sha256:$(printf '%s' "$recovery_authority_core" | shasum -a 256 | awk '{print $1}')"
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v9 ]; then
              test "$recovery_authority_digest" = "$PRIOR_RECOVERY_AUTHORITY_DIGEST"
              test "$FAILED_RECOVERY_V8_RUN_ID" = "$QUALIFIED_ARTIFACT_RUN_ID"
              test "$QUALIFIED_ARTIFACT_NAME" = \
                "webui-qualified-$(jq -er .release.version "$handoff")-${FAILED_RECOVERY_V8_RUN_ID}-1"
            fi
            framework_ref="$RECOVERY_FRAMEWORK_REF"
            release_cohort_ref="$recovery_authority_digest"
            production_recovery=true
          else
            test -z "$RECOVERY_FRAMEWORK_REF$RECOVERY_EXECUTOR_REF$PRIOR_RECOVERY_AUTHORITY_DIGEST$QUALIFIED_ARTIFACT_RUN_ID$QUALIFIED_ARTIFACT_NAME$FAILED_RECOVERY_V8_RUN_ID"
          fi
          {
            echo "eligible=true"
            echo "stable_authority_run_id=$STABLE_AUTHORITY_RUN_ID"
            echo "source_artifact_run_id=$(jq -er .source.artifact_run_id "$handoff")"
            echo "standard_checkpoint_artifact_name=$(jq -er .source.checkpoint_artifact "$handoff")"
            echo "standard_identity_sha256=$(jq -er .source.standard_identity_sha256 "$handoff")"
            echo "app_ref=$(jq -er .release.cohort.app_sha "$handoff")"
            echo "shell_ref=$(jq -er .release.cohort.shell_sha "$handoff")"
            echo "framework_ref=$framework_ref"
            echo "stable_framework_ref=$stable_framework_ref"
            echo "opl_version=$(jq -er .release.version "$handoff")"
            echo "release_bundle_digest=$(jq -er .release.bundle_digest "$handoff")"
            echo "release_cohort_ref=$release_cohort_ref"
            echo "production_recovery=$production_recovery"
            echo "recovery_authority_digest=$recovery_authority_digest"
            echo "qualified_artifact_run_id=$QUALIFIED_ARTIFACT_RUN_ID"
            echo "qualified_artifact_name=$QUALIFIED_ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

  webui-carrier:
    if: ${{ needs.resolve-handoff.outputs.eligible == 'true' }}
    needs: [resolve-handoff]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/_release-webui-carrier.yml
    with:
      mode: execute
      authority_mode: production_follower
      production_recovery: ${{ needs.resolve-handoff.outputs.production_recovery == 'true' }}
      stable_authority_run_id: ${{ needs.resolve-handoff.outputs.stable_authority_run_id }}
      app_ref: ${{ needs.resolve-handoff.outputs.app_ref }}
      shell_ref: ${{ needs.resolve-handoff.outputs.shell_ref }}
      framework_ref: ${{ needs.resolve-handoff.outputs.framework_ref }}
      opl_version: ${{ needs.resolve-handoff.outputs.opl_version }}
      release_bundle_digest: ${{ needs.resolve-handoff.outputs.release_bundle_digest }}
      release_cohort_ref: ${{ needs.resolve-handoff.outputs.release_cohort_ref }}
      source_artifact_run_id: ${{ needs.resolve-handoff.outputs.source_artifact_run_id }}
      standard_checkpoint_artifact_name: ${{ needs.resolve-handoff.outputs.standard_checkpoint_artifact_name }}
      standard_identity_sha256: ${{ needs.resolve-handoff.outputs.standard_identity_sha256 }}
      stable_framework_ref: ${{ needs.resolve-handoff.outputs.stable_framework_ref }}
      recovery_authority_digest: ${{ needs.resolve-handoff.outputs.recovery_authority_digest }}
      failed_follower_run_id: ${{ inputs.failed_follower_run_id || '' }}
      failed_recovery_v1_run_id: ${{ inputs.failed_recovery_run_id || '' }}
      failed_recovery_v2_run_id: ${{ inputs.failed_recovery_v2_run_id || '' }}
      failed_recovery_v3_run_id: ${{ inputs.failed_recovery_v3_run_id || '' }}
      failed_recovery_v4_run_id: ${{ inputs.failed_recovery_v4_run_id || '' }}
      failed_recovery_v5_run_id: ${{ inputs.failed_recovery_v5_run_id || '' }}
      failed_recovery_v6_run_id: ${{ inputs.failed_recovery_v6_run_id || '' }}
      failed_recovery_v7_run_id: ${{ inputs.failed_recovery_v7_run_id || '' }}
      failed_recovery_v8_run_id: ${{ inputs.failed_recovery_v8_run_id || '' }}
      qualified_artifact_run_id: ${{ needs.resolve-handoff.outputs.qualified_artifact_run_id }}
      qualified_artifact_name: ${{ needs.resolve-handoff.outputs.qualified_artifact_name }}

  promote-webui-stable:
    if: ${{ needs.resolve-handoff.outputs.eligible == 'true' }}
    needs: [resolve-handoff, webui-carrier]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: production_follower
      production_recovery: ${{ needs.resolve-handoff.outputs.production_recovery == 'true' }}
      stable_authority_run_id: ${{ needs.resolve-handoff.outputs.stable_authority_run_id }}
      carrier_artifact_name: ${{ needs.webui-carrier.outputs.carrier_artifact_name }}
