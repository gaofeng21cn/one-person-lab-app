name: OPL WebUI Stable Follower
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v5'
    && format('WebUI follower recovery v5 for Stable run {0} failed follower {1} failed recovery v1 {2} failed recovery v2 {3} failed recovery v3 {4} failed recovery v4 {5}', inputs.source_run_id, inputs.failed_follower_run_id, inputs.failed_recovery_run_id, inputs.failed_recovery_v2_run_id, inputs.failed_recovery_v3_run_id, inputs.failed_recovery_v4_run_id)
    || github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v4'
    && format('WebUI follower recovery v4 for Stable run {0} failed follower {1} failed recovery v1 {2} failed recovery v2 {3} failed recovery v3 {4}', inputs.source_run_id, inputs.failed_follower_run_id, inputs.failed_recovery_run_id, inputs.failed_recovery_v2_run_id, inputs.failed_recovery_v3_run_id)
    || github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v3'
    && format('WebUI follower recovery v3 for Stable run {0} failed follower {1} failed recovery v1 {2} failed recovery v2 {3}', inputs.source_run_id, inputs.failed_follower_run_id, inputs.failed_recovery_run_id, inputs.failed_recovery_v2_run_id)
    || github.event_name == 'workflow_dispatch'
    && inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v2'
    && format('WebUI follower recovery v2 for Stable run {0} failed follower {1} failed recovery v1 {2}', inputs.source_run_id, inputs.failed_follower_run_id, inputs.failed_recovery_run_id)
    || github.event_name == 'workflow_dispatch'
    && format('WebUI follower recovery v1 for Stable run {0} failed follower {1}', inputs.source_run_id, inputs.failed_follower_run_id)
    || format('WebUI follower for Stable run {0}', github.event.workflow_run.id) }}

on:
  workflow_run:
    workflows:
      - OPL Stable Release Bundle
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful Standard Stable authority run
        required: true
        type: string
      failed_follower_run_id:
        description: Exact failed first-attempt WebUI follower run with publication skipped
        required: true
        type: string
      failed_recovery_run_id:
        description: Exact failed WebUI follower recovery v1 run; empty for recovery v1
        required: false
        type: string
      failed_recovery_v2_run_id:
        description: Exact failed WebUI follower recovery v2 run; required only for recovery v3
        required: false
        type: string
      failed_recovery_v3_run_id:
        description: Exact failed WebUI follower recovery v3 run; required only for recovery v4
        required: false
        type: string
      failed_recovery_v4_run_id:
        description: Exact failed WebUI follower recovery v4 run; required only for recovery v5
        required: false
        type: string
      recovery_confirmation:
        description: Confirm the exact bounded WebUI follower recovery generation
        required: true
        type: choice
        options:
          - recover_exact_failed_webui_follower_v1
          - recover_exact_failed_webui_follower_v2
          - recover_exact_failed_webui_follower_v3
          - recover_exact_failed_webui_follower_v4
          - recover_exact_failed_webui_follower_v5

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-webui-stable-follower-${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve-handoff:
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || (github.event_name == 'workflow_dispatch'
        && (inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v1'
        || inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v2'
        || inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v3'
        || inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v4'
        || inputs.recovery_confirmation == 'recover_exact_failed_webui_follower_v5')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.handoff.outputs.eligible }}
      stable_authority_run_id: ${{ steps.handoff.outputs.stable_authority_run_id }}
      source_artifact_run_id: ${{ steps.handoff.outputs.source_artifact_run_id }}
      standard_checkpoint_artifact_name: ${{ steps.handoff.outputs.standard_checkpoint_artifact_name }}
      standard_identity_sha256: ${{ steps.handoff.outputs.standard_identity_sha256 }}
      app_ref: ${{ steps.handoff.outputs.app_ref }}
      shell_ref: ${{ steps.handoff.outputs.shell_ref }}
      framework_ref: ${{ steps.handoff.outputs.framework_ref }}
      opl_version: ${{ steps.handoff.outputs.opl_version }}
      release_bundle_digest: ${{ steps.handoff.outputs.release_bundle_digest }}
      release_cohort_ref: ${{ steps.handoff.outputs.release_cohort_ref }}
      production_recovery: ${{ steps.handoff.outputs.production_recovery }}
      stable_framework_ref: ${{ steps.handoff.outputs.stable_framework_ref }}
      recovery_authority_digest: ${{ steps.handoff.outputs.recovery_authority_digest }}
    steps:
      - name: Admit one successful canonical Stable authority run
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_AUTHORITY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          FAILED_FOLLOWER_RUN_ID: ${{ inputs.failed_follower_run_id || '' }}
          FAILED_RECOVERY_RUN_ID: ${{ inputs.failed_recovery_run_id || '' }}
          FAILED_RECOVERY_V2_RUN_ID: ${{ inputs.failed_recovery_v2_run_id || '' }}
          FAILED_RECOVERY_V3_RUN_ID: ${{ inputs.failed_recovery_v3_run_id || '' }}
          FAILED_RECOVERY_V4_RUN_ID: ${{ inputs.failed_recovery_v4_run_id || '' }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation || '' }}
          TRIGGER_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$STABLE_AUTHORITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$TRIGGER_EVENT" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            [[ "$FAILED_FOLLOWER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            case "$RECOVERY_CONFIRMATION" in
              recover_exact_failed_webui_follower_v1)
                test -z "$FAILED_RECOVERY_RUN_ID$FAILED_RECOVERY_V2_RUN_ID$FAILED_RECOVERY_V3_RUN_ID$FAILED_RECOVERY_V4_RUN_ID"
                recovery_title="WebUI follower recovery v1 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID}"
                ;;
              recover_exact_failed_webui_follower_v2)
                [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                test -z "$FAILED_RECOVERY_V2_RUN_ID$FAILED_RECOVERY_V3_RUN_ID$FAILED_RECOVERY_V4_RUN_ID"
                recovery_title="WebUI follower recovery v2 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID}"
                ;;
              recover_exact_failed_webui_follower_v3)
                [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V2_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                test -z "$FAILED_RECOVERY_V3_RUN_ID$FAILED_RECOVERY_V4_RUN_ID"
                recovery_title="WebUI follower recovery v3 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID}"
                ;;
              recover_exact_failed_webui_follower_v4)
                [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V2_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V3_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                test -z "$FAILED_RECOVERY_V4_RUN_ID"
                recovery_title="WebUI follower recovery v4 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID} failed recovery v3 ${FAILED_RECOVERY_V3_RUN_ID}"
                ;;
              recover_exact_failed_webui_follower_v5)
                [[ "$FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V2_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V3_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                [[ "$FAILED_RECOVERY_V4_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                recovery_title="WebUI follower recovery v5 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID} failed recovery v3 ${FAILED_RECOVERY_V3_RUN_ID} failed recovery v4 ${FAILED_RECOVERY_V4_RUN_ID}"
                ;;
              *)
                echo "::error::Unknown WebUI follower recovery confirmation."
                exit 1
                ;;
            esac
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > recovery-run.json
            jq -e --arg run "$GITHUB_RUN_ID" --arg title "$recovery_title" --arg sha "$GITHUB_SHA" '
              (.id | tostring) == $run
              and .repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .path == ".github/workflows/release-webui-follower.yml"
              and .event == "workflow_dispatch"
              and .head_branch == "main"
              and .head_sha == $sha
              and .display_title == $title
              and .run_attempt == 1
            ' recovery-run.json >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID" > failed-follower-run.json
            jq -e --arg run "$FAILED_FOLLOWER_RUN_ID" --arg source "$STABLE_AUTHORITY_RUN_ID" '
              (.id | tostring) == $run
              and .repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
              and .path == ".github/workflows/release-webui-follower.yml"
              and .event == "workflow_run"
              and .head_branch == "main"
              and .display_title == ("WebUI follower for Stable run " + $source)
              and .run_attempt == 1
              and .status == "completed"
              and .conclusion == "failure"
            ' failed-follower-run.json >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID/jobs?per_page=100" > failed-follower-jobs.json
            jq -e '
              .total_count == 5
              and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
              and ([.jobs[] | select(.name == "webui-carrier / build-and-qualify" and .conclusion == "failure")] | length == 1)
              and ([.jobs[] | select(.name == "webui-carrier / startup-canary" and .conclusion == "skipped")] | length == 1)
              and ([.jobs[] | select(.name == "webui-carrier / publish-immutable-carrier" and .conclusion == "skipped")] | length == 1)
              and ([.jobs[] | select(.name == "promote-webui-stable" and .conclusion == "skipped")] | length == 1)
              and ([.jobs[].steps[]? | select(.name == "Qualify exact local runtime before any registry tag is written" and .conclusion == "failure")] | length == 1)
              and ([.jobs[].steps[]? | select(.name == "Package qualified image and evidence for protected immutable publication" and .conclusion == "skipped")] | length == 1)
              and ([.jobs[].steps[]? | select(.name == "Upload qualified image evidence" and .conclusion == "skipped")] | length == 1)
            ' failed-follower-jobs.json >/dev/null
            failed_job_id="$(jq -er '[.jobs[] | select(.name == "webui-carrier / build-and-qualify")] | select(length == 1) | .[0].id' failed-follower-jobs.json)"
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_job_id/logs" > failed-follower.log
            grep -F 'OPL image seed contains broken symlinks:' failed-follower.log >/dev/null
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_FOLLOWER_RUN_ID/artifacts?per_page=100" \
              > failed-follower-artifacts.json
            jq -e --arg run "$FAILED_FOLLOWER_RUN_ID" '
              [.[]?.artifacts[]? | select(.expired == false)] as $artifacts
              | ($artifacts | length) == 1
              and ($artifacts[0].name | test("^webui-runtime-failure-[0-9]+\\.[0-9]+\\.[0-9]+-" + $run + "-1$"))
            ' failed-follower-artifacts.json >/dev/null
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v2 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v3 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v4 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ]; then
              failed_recovery_title="WebUI follower recovery v1 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID}"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID" > failed-recovery-run.json
              jq -e \
                --arg run "$FAILED_RECOVERY_RUN_ID" \
                --arg title "$failed_recovery_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-webui-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and (.head_sha | test("^[0-9a-f]{40}$"))
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-run.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID/jobs?per_page=100" \
                > failed-recovery-jobs.json
              jq -e '
                .total_count == 5
                and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / build-and-qualify" and .conclusion == "failure")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / startup-canary" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / publish-immutable-carrier" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "promote-webui-stable" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Qualify exact local runtime before any registry tag is written" and .conclusion == "failure")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Upload WebUI runtime qualification failure evidence" and .conclusion == "success")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Package qualified image and evidence for protected immutable publication" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Upload qualified image evidence" and .conclusion == "skipped")] | length == 1)
              ' failed-recovery-jobs.json >/dev/null
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_RUN_ID/artifacts?per_page=100" \
                > failed-recovery-artifacts.json
              failed_recovery_artifact_name="$(
                jq -er --arg run "$FAILED_RECOVERY_RUN_ID" '
                  [.[]?.artifacts[]? | select(.expired == false)] as $artifacts
                  | select(($artifacts | length) == 1)
                  | $artifacts[0].name
                  | select(test("^webui-runtime-failure-[0-9]+\\.[0-9]+\\.[0-9]+-" + $run + "-1$"))
                ' failed-recovery-artifacts.json
              )"
              gh run download "$FAILED_RECOVERY_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$failed_recovery_artifact_name" \
                --dir failed-recovery-artifact
              failed_runtime_logs=()
              while IFS= read -r log; do failed_runtime_logs+=("$log"); done < <(
                find failed-recovery-artifact -type f -name container.log -print | LC_ALL=C sort
              )
              test "${#failed_runtime_logs[@]}" -eq 1
              failed_runtime_log="${failed_runtime_logs[0]}"
              grep -F '"failure_code": "opl_seed_payload_symlink_forbidden"' "$failed_runtime_log" >/dev/null
              grep -F '"path": "/opt/opl/seed/payload/codex_cli/bin/codex"' "$failed_runtime_log" >/dev/null
              grep -F '[opl-webui-entrypoint] ERROR: OPL seed apply failed' "$failed_runtime_log" >/dev/null
            fi
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v3 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v4 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ]; then
              failed_recovery_v2_title="WebUI follower recovery v2 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID}"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V2_RUN_ID" \
                > failed-recovery-v2-run.json
              jq -e \
                --arg run "$FAILED_RECOVERY_V2_RUN_ID" \
                --arg title "$failed_recovery_v2_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-webui-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and (.head_sha | test("^[0-9a-f]{40}$"))
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-v2-run.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V2_RUN_ID/jobs?per_page=100" \
                > failed-recovery-v2-jobs.json
              jq -e '
                .total_count == 5
                and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / build-and-qualify" and .conclusion == "failure")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / startup-canary" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / publish-immutable-carrier" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "promote-webui-stable" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Qualify exact local runtime before any registry tag is written" and .conclusion == "failure")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Upload WebUI runtime qualification failure evidence" and .conclusion == "success")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Package qualified image and evidence for protected immutable publication" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Upload qualified image evidence" and .conclusion == "skipped")] | length == 1)
              ' failed-recovery-v2-jobs.json >/dev/null
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V2_RUN_ID/artifacts?per_page=100" \
                > failed-recovery-v2-artifacts.json
              failed_recovery_v2_artifact_name="$(
                jq -er --arg run "$FAILED_RECOVERY_V2_RUN_ID" '
                  [.[]?.artifacts[]? | select(.expired == false)] as $artifacts
                  | select(($artifacts | length) == 1)
                  | $artifacts[0].name
                  | select(test("^webui-runtime-failure-[0-9]+\\.[0-9]+\\.[0-9]+-" + $run + "-1$"))
                ' failed-recovery-v2-artifacts.json
              )"
              gh run download "$FAILED_RECOVERY_V2_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --name "$failed_recovery_v2_artifact_name" \
                --dir failed-recovery-v2-artifact
              failed_recovery_v2_logs=()
              while IFS= read -r log; do failed_recovery_v2_logs+=("$log"); done < <(
                find failed-recovery-v2-artifact -type f -name container.log -print | LC_ALL=C sort
              )
              test "${#failed_recovery_v2_logs[@]}" -eq 1
              node - "${failed_recovery_v2_logs[0]}" <<'NODE'
          const fs = require('node:fs');

          const text = fs.readFileSync(process.argv[2], 'utf8');
          const messages = [];
          const marker = /"message"\s*:\s*"/g;
          let match;
          while ((match = marker.exec(text)) !== null) {
            const start = marker.lastIndex - 1;
            let escaped = false;
            let end = start + 1;
            for (; end < text.length; end += 1) {
              const character = text[end];
              if (!escaped && character === '"') break;
              if (!escaped && character === '\\') escaped = true;
              else escaped = false;
            }
            if (end >= text.length) throw new Error('unterminated JSON message string');
            messages.push(JSON.parse(text.slice(start, end + 1)));
            marker.lastIndex = end + 1;
          }

          function firstJsonObject(value) {
            const start = value.indexOf('{');
            if (start < 0) return null;
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let index = start; index < value.length; index += 1) {
              const character = value[index];
              if (inString) {
                if (!escaped && character === '"') inString = false;
                if (!escaped && character === '\\') escaped = true;
                else escaped = false;
                continue;
              }
              if (character === '"') inString = true;
              else if (character === '{') depth += 1;
              else if (character === '}' && --depth === 0) {
                return JSON.parse(value.slice(start, index + 1));
              }
            }
            return null;
          }

          const typedErrors = messages
            .map(firstJsonObject)
            .filter((value) => value !== null)
            .filter((value) =>
              value.version === 'g2'
              && value.error?.code === 'contract_shape_invalid'
              && value.error?.exit_code === 3
              && value.error?.details?.package_id === 'opl-flow'
              && value.error?.details?.target_version === '0.1.35'
              && value.error?.details?.failure_code === 'configured_codex_plugin_carrier_target_currentness_mismatch');
          if (typedErrors.length !== 1) {
            throw new Error(`expected one exact nested OPL Flow currentness error, found ${typedErrors.length}`);
          }
          NODE

              gh api repos/gaofeng21cn/one-person-lab/commits/main > recovery-framework.json
              recovery_framework_ref="$(jq -er '.sha | select(test("^[0-9a-f]{40}$"))' recovery-framework.json)"
              gh api "repos/gaofeng21cn/one-person-lab/compare/95640c74e0b14ba2e88056de725c417fd1693cf1...${recovery_framework_ref}" \
                > recovery-framework-fix-ancestry.json
              jq -e '
                (.status == "ahead" or .status == "identical")
                and .behind_by == 0
                and .merge_base_commit.sha == "95640c74e0b14ba2e88056de725c417fd1693cf1"
              ' recovery-framework-fix-ancestry.json >/dev/null
              echo "recovery_framework_ref=$recovery_framework_ref" >> "$GITHUB_OUTPUT"
            fi
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v4 ] \
              || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ]; then
              failed_recovery_v3_title="WebUI follower recovery v3 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID}"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V3_RUN_ID" \
                > failed-recovery-v3-run.json
              jq -e \
                --arg run "$FAILED_RECOVERY_V3_RUN_ID" \
                --arg title "$failed_recovery_v3_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-webui-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and .head_sha == "affa8c6712d5750837b81542e406a347b9d9f45b"
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-v3-run.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V3_RUN_ID/jobs?per_page=100" \
                > failed-recovery-v3-jobs.json
              jq -e '
                .total_count == 3
                and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "failure")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "promote-webui-stable" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Admit one successful canonical Stable authority run" and .conclusion == "failure")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Download exact Latest activation evidence" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Bind exact follower handoff" and .conclusion == "skipped")] | length == 1)
              ' failed-recovery-v3-jobs.json >/dev/null
              failed_recovery_v3_job_id="$(jq -er '[.jobs[] | select(.name == "resolve-handoff")] | select(length == 1) | .[0].id' failed-recovery-v3-jobs.json)"
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_recovery_v3_job_id/logs" \
                > failed-recovery-v3.log
              grep -F 'grep -F '\''"failure_code": "configured_codex_plugin_carrier_target_currentness_mismatch"'\''' \
                failed-recovery-v3.log >/dev/null
              grep -F 'Process completed with exit code 1.' failed-recovery-v3.log >/dev/null
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V3_RUN_ID/artifacts?per_page=100" \
                > failed-recovery-v3-artifacts.json
              jq -e '[.[]?.artifacts[]? | select(.expired == false)] | length == 0' \
                failed-recovery-v3-artifacts.json >/dev/null
            fi
            if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ]; then
              failed_recovery_v4_title="WebUI follower recovery v4 for Stable run ${STABLE_AUTHORITY_RUN_ID} failed follower ${FAILED_FOLLOWER_RUN_ID} failed recovery v1 ${FAILED_RECOVERY_RUN_ID} failed recovery v2 ${FAILED_RECOVERY_V2_RUN_ID} failed recovery v3 ${FAILED_RECOVERY_V3_RUN_ID}"
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V4_RUN_ID" \
                > failed-recovery-v4-run.json
              jq -e \
                --arg run "$FAILED_RECOVERY_V4_RUN_ID" \
                --arg title "$failed_recovery_v4_title" '
                  (.id | tostring) == $run
                  and .repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
                  and .path == ".github/workflows/release-webui-follower.yml"
                  and .event == "workflow_dispatch"
                  and .head_branch == "main"
                  and .head_sha == "3b379ea2ab8cdf29638b584ba7070229236c5d50"
                  and .display_title == $title
                  and .run_attempt == 1
                  and .status == "completed"
                  and .conclusion == "failure"
                ' failed-recovery-v4-run.json >/dev/null
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V4_RUN_ID/jobs?per_page=100" \
                > failed-recovery-v4-jobs.json
              jq -e '
                .total_count == 5
                and ([.jobs[] | select(.name == "resolve-handoff" and .conclusion == "success")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / build-and-qualify" and .conclusion == "failure")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / startup-canary" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "webui-carrier / publish-immutable-carrier" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[] | select(.name == "promote-webui-stable" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Verify frozen source identities" and .conclusion == "failure")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Build WebUI image once from frozen inputs" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Qualify exact local runtime before any registry tag is written" and .conclusion == "skipped")] | length == 1)
                and ([.jobs[].steps[]? | select(.name == "Package qualified image and evidence for protected immutable publication" and .conclusion == "skipped")] | length == 1)
              ' failed-recovery-v4-jobs.json >/dev/null
              failed_recovery_v4_job_id="$(jq -er '[.jobs[] | select(.name == "webui-carrier / build-and-qualify")] | select(length == 1) | .[0].id' failed-recovery-v4-jobs.json)"
              gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$failed_recovery_v4_job_id/logs" \
                > failed-recovery-v4.log
              grep -F 'fatal: Not a valid commit name 95640c74e0b14ba2e88056de725c417fd1693cf1' \
                failed-recovery-v4.log >/dev/null
              grep -F 'Process completed with exit code 128.' failed-recovery-v4.log >/dev/null
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RECOVERY_V4_RUN_ID/artifacts?per_page=100" \
                > failed-recovery-v4-artifacts.json
              jq -e '[.[]?.artifacts[]? | select(.expired == false)] | length == 0' \
                failed-recovery-v4-artifacts.json >/dev/null
            fi
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release-webui-follower.yml/runs?event=workflow_dispatch&per_page=100" \
              > recovery-runs.json
            jq -e \
              --arg run "$GITHUB_RUN_ID" \
              --arg title "$recovery_title" \
              --arg failed_recovery_run "$FAILED_RECOVERY_RUN_ID" \
              --arg failed_recovery_title "${failed_recovery_title:-}" \
              --arg failed_recovery_v2_run "$FAILED_RECOVERY_V2_RUN_ID" \
              --arg failed_recovery_v2_title "${failed_recovery_v2_title:-}" \
              --arg failed_recovery_v3_run "$FAILED_RECOVERY_V3_RUN_ID" \
              --arg failed_recovery_v3_title "${failed_recovery_v3_title:-}" \
              --arg failed_recovery_v4_run "$FAILED_RECOVERY_V4_RUN_ID" \
              --arg failed_recovery_v4_title "${failed_recovery_v4_title:-}" '
              [.[]?.workflow_runs[]? | select(.display_title == $title)] as $matches
              | [.[]?.workflow_runs[]? | select(.display_title == $failed_recovery_title)] as $failed_recovery_matches
              | [.[]?.workflow_runs[]? | select(.display_title == $failed_recovery_v2_title)] as $failed_recovery_v2_matches
              | [.[]?.workflow_runs[]? | select(.display_title == $failed_recovery_v3_title)] as $failed_recovery_v3_matches
              | [.[]?.workflow_runs[]? | select(.display_title == $failed_recovery_v4_title)] as $failed_recovery_v4_matches
              | ($matches | length) == 1
              and (($matches[0].id | tostring) == $run)
              and $matches[0].run_attempt == 1
              and (
                ($failed_recovery_run == "" and ($failed_recovery_matches | length) == 0)
                or (
                  $failed_recovery_run != ""
                  and ($failed_recovery_matches | length) == 1
                  and (($failed_recovery_matches[0].id | tostring) == $failed_recovery_run)
                  and $failed_recovery_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v2_run == "" and ($failed_recovery_v2_matches | length) == 0)
                or (
                  $failed_recovery_v2_run != ""
                  and ($failed_recovery_v2_matches | length) == 1
                  and (($failed_recovery_v2_matches[0].id | tostring) == $failed_recovery_v2_run)
                  and $failed_recovery_v2_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v3_run == "" and ($failed_recovery_v3_matches | length) == 0)
                or (
                  $failed_recovery_v3_run != ""
                  and ($failed_recovery_v3_matches | length) == 1
                  and (($failed_recovery_v3_matches[0].id | tostring) == $failed_recovery_v3_run)
                  and $failed_recovery_v3_matches[0].run_attempt == 1
                )
              )
              and (
                ($failed_recovery_v4_run == "" and ($failed_recovery_v4_matches | length) == 0)
                or (
                  $failed_recovery_v4_run != ""
                  and ($failed_recovery_v4_matches | length) == 1
                  and (($failed_recovery_v4_matches[0].id | tostring) == $failed_recovery_v4_run)
                  and $failed_recovery_v4_matches[0].run_attempt == 1
                )
              )
            ' recovery-runs.json >/dev/null
          else
            test "$TRIGGER_EVENT" = workflow_run
            test -z "$FAILED_FOLLOWER_RUN_ID$FAILED_RECOVERY_RUN_ID$FAILED_RECOVERY_V2_RUN_ID$FAILED_RECOVERY_V3_RUN_ID$FAILED_RECOVERY_V4_RUN_ID$RECOVERY_CONFIRMATION"
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID" \
            > stable-authority-run.json
          jq -e --arg run "$STABLE_AUTHORITY_RUN_ID" '
            (.id | tostring) == $run
            and .repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
            and .path == ".github/workflows/release-stable.yml"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .run_attempt == 1
            and .status == "completed"
            and .conclusion == "success"
            and (.head_sha | test("^[0-9a-f]{40}$"))
          ' stable-authority-run.json >/dev/null
          activation_artifact="opl-release-activation-${STABLE_AUTHORITY_RUN_ID}"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_AUTHORITY_RUN_ID/artifacts?per_page=100" \
            > stable-authority-artifacts.json
          artifact_count="$(
            jq -r --arg name "$activation_artifact" '
              [.[]?.artifacts[]? | select(.name == $name and .expired == false)] | length
            ' stable-authority-artifacts.json
          )"
          case "$artifact_count" in
            0)
              echo "activation_artifact_found=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "activation_artifact_found=true" >> "$GITHUB_OUTPUT"
              echo "activation_artifact=$activation_artifact" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Stable authority run contains duplicate Latest activation artifacts."
              exit 1
              ;;
          esac

      - name: Download exact Latest activation evidence
        if: ${{ steps.authority.outputs.activation_artifact_found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.authority.outputs.activation_artifact }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: latest-activation

      - name: Bind exact follower handoff
        id: handoff
        if: ${{ always() && steps.authority.outcome == 'success' }}
        env:
          STABLE_AUTHORITY_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation || '' }}
          FAILED_FOLLOWER_RUN_ID: ${{ inputs.failed_follower_run_id || '' }}
          FAILED_RECOVERY_RUN_ID: ${{ inputs.failed_recovery_run_id || '' }}
          FAILED_RECOVERY_V2_RUN_ID: ${{ inputs.failed_recovery_v2_run_id || '' }}
          FAILED_RECOVERY_V3_RUN_ID: ${{ inputs.failed_recovery_v3_run_id || '' }}
          RECOVERY_FRAMEWORK_REF: ${{ steps.authority.outputs.recovery_framework_ref || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ steps.authority.outputs.activation_artifact_found }}' != true ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          handoffs=()
          while IFS= read -r handoff; do handoffs+=("$handoff"); done < <(
            find latest-activation -type f -name webui-follower-handoff.json -print | LC_ALL=C sort
          )
          test "${#handoffs[@]}" -eq 1 || {
            echo "::error::Latest activation must contain exactly one WebUI follower handoff."
            exit 1
          }
          handoff="${handoffs[0]}"
          status="$(jq -er .status "$handoff")"
          case "$status" in
            skipped_legacy_identity_unavailable)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            ready) ;;
            *)
              echo "::error::WebUI follower handoff status is invalid."
              exit 1
              ;;
          esac
          stable_head_sha="$(jq -er .head_sha stable-authority-run.json)"
          jq -e \
            --arg run "$STABLE_AUTHORITY_RUN_ID" \
            --arg head "$stable_head_sha" '
              .schema == "opl_app_webui_follower_handoff.v1"
              and .status == "ready"
              and .stable_authority == {
                repository: "gaofeng21cn/one-person-lab-app",
                workflow: ".github/workflows/release-stable.yml",
                run_id: $run,
                run_attempt: 1,
                executor_head_sha: $head
              }
              and (.source.artifact_run_id | test("^[1-9][0-9]*$"))
              and (.source.checkpoint_artifact | test("^[A-Za-z0-9][A-Za-z0-9._-]+$"))
              and (.source.standard_identity_sha256 | test("^sha256:[0-9a-f]{64}$"))
              and (.release.version | test("^[0-9]{2}\\.[0-9]{1,2}\\.[0-9]{1,2}(-r[1-9][0-9]*)?$"))
              and (.release.bundle_digest | test("^sha256:[0-9a-f]{64}$"))
              and (.release.cohort.app_sha | test("^[0-9a-f]{40}$"))
              and (.release.cohort.shell_sha | test("^[0-9a-f]{40}$"))
              and (.release.cohort.framework_sha | test("^[0-9a-f]{40}$"))
              and .latest_activation.admission_schema == "opl_standard_latest_admission_receipt.v1"
              and .latest_activation.admitted == true
              and .latest_activation.framework_terminal_status == "complete"
          ' "$handoff" >/dev/null
          stable_framework_ref="$(jq -er .release.cohort.framework_sha "$handoff")"
          framework_ref="$stable_framework_ref"
          release_cohort_ref="$(jq -er .release.bundle_digest "$handoff")"
          recovery_authority_digest=''
          production_recovery=false
          if [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v3 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v4 ] \
            || [ "$RECOVERY_CONFIRMATION" = recover_exact_failed_webui_follower_v5 ]; then
            [[ "$RECOVERY_FRAMEWORK_REF" =~ ^[0-9a-f]{40}$ ]]
            test "$RECOVERY_FRAMEWORK_REF" != "$stable_framework_ref"
            recovery_authority_core="$(jq -cnS \
              --arg stable_run "$STABLE_AUTHORITY_RUN_ID" \
              --arg failed_follower "$FAILED_FOLLOWER_RUN_ID" \
              --arg failed_v1 "$FAILED_RECOVERY_RUN_ID" \
              --arg failed_v2 "$FAILED_RECOVERY_V2_RUN_ID" \
              --arg failed_v3 "$FAILED_RECOVERY_V3_RUN_ID" \
              --arg failed_v4 "$FAILED_RECOVERY_V4_RUN_ID" \
              --arg version "$(jq -er .release.version "$handoff")" \
              --arg bundle "$(jq -er .release.bundle_digest "$handoff")" \
              --arg app "$(jq -er .release.cohort.app_sha "$handoff")" \
              --arg shell "$(jq -er .release.cohort.shell_sha "$handoff")" \
              --arg stable_framework "$stable_framework_ref" \
              --arg executor "$GITHUB_SHA" \
              --arg recovery_framework "$RECOVERY_FRAMEWORK_REF" '
              ({
                schema:"opl_app_webui_framework_recovery_authority.v1",
                status:"admitted",
                stable_authority_run_id:$stable_run,
                failed_follower_run_id:$failed_follower,
                failed_recovery_v1_run_id:$failed_v1,
                failed_recovery_v2_run_id:$failed_v2,
                release:{version:$version,bundle_digest:$bundle},
                stable_cohort:{app_sha:$app,shell_sha:$shell,framework_sha:$stable_framework},
                recovery_source:{executor_app_sha:$executor,framework_sha:$recovery_framework}
              }
              + (if $failed_v3 == "" then {} else {failed_recovery_v3_run_id:$failed_v3} end)
              + (if $failed_v4 == "" then {} else {failed_recovery_v4_run_id:$failed_v4} end))
            ')"
            recovery_authority_digest="sha256:$(printf '%s' "$recovery_authority_core" | shasum -a 256 | awk '{print $1}')"
            framework_ref="$RECOVERY_FRAMEWORK_REF"
            release_cohort_ref="$recovery_authority_digest"
            production_recovery=true
          else
            test -z "$RECOVERY_FRAMEWORK_REF"
          fi
          {
            echo "eligible=true"
            echo "stable_authority_run_id=$STABLE_AUTHORITY_RUN_ID"
            echo "source_artifact_run_id=$(jq -er .source.artifact_run_id "$handoff")"
            echo "standard_checkpoint_artifact_name=$(jq -er .source.checkpoint_artifact "$handoff")"
            echo "standard_identity_sha256=$(jq -er .source.standard_identity_sha256 "$handoff")"
            echo "app_ref=$(jq -er .release.cohort.app_sha "$handoff")"
            echo "shell_ref=$(jq -er .release.cohort.shell_sha "$handoff")"
            echo "framework_ref=$framework_ref"
            echo "stable_framework_ref=$stable_framework_ref"
            echo "opl_version=$(jq -er .release.version "$handoff")"
            echo "release_bundle_digest=$(jq -er .release.bundle_digest "$handoff")"
            echo "release_cohort_ref=$release_cohort_ref"
            echo "production_recovery=$production_recovery"
            echo "recovery_authority_digest=$recovery_authority_digest"
          } >> "$GITHUB_OUTPUT"

  webui-carrier:
    if: ${{ needs.resolve-handoff.outputs.eligible == 'true' }}
    needs: [resolve-handoff]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/_release-webui-carrier.yml
    with:
      mode: execute
      authority_mode: production_follower
      production_recovery: ${{ needs.resolve-handoff.outputs.production_recovery == 'true' }}
      stable_authority_run_id: ${{ needs.resolve-handoff.outputs.stable_authority_run_id }}
      app_ref: ${{ needs.resolve-handoff.outputs.app_ref }}
      shell_ref: ${{ needs.resolve-handoff.outputs.shell_ref }}
      framework_ref: ${{ needs.resolve-handoff.outputs.framework_ref }}
      opl_version: ${{ needs.resolve-handoff.outputs.opl_version }}
      release_bundle_digest: ${{ needs.resolve-handoff.outputs.release_bundle_digest }}
      release_cohort_ref: ${{ needs.resolve-handoff.outputs.release_cohort_ref }}
      source_artifact_run_id: ${{ needs.resolve-handoff.outputs.source_artifact_run_id }}
      standard_checkpoint_artifact_name: ${{ needs.resolve-handoff.outputs.standard_checkpoint_artifact_name }}
      standard_identity_sha256: ${{ needs.resolve-handoff.outputs.standard_identity_sha256 }}
      stable_framework_ref: ${{ needs.resolve-handoff.outputs.stable_framework_ref }}
      recovery_authority_digest: ${{ needs.resolve-handoff.outputs.recovery_authority_digest }}
      failed_follower_run_id: ${{ inputs.failed_follower_run_id || '' }}
      failed_recovery_v1_run_id: ${{ inputs.failed_recovery_run_id || '' }}
      failed_recovery_v2_run_id: ${{ inputs.failed_recovery_v2_run_id || '' }}
      failed_recovery_v3_run_id: ${{ inputs.failed_recovery_v3_run_id || '' }}
      failed_recovery_v4_run_id: ${{ inputs.failed_recovery_v4_run_id || '' }}

  promote-webui-stable:
    if: ${{ needs.resolve-handoff.outputs.eligible == 'true' }}
    needs: [resolve-handoff, webui-carrier]
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: production_follower
      production_recovery: ${{ needs.resolve-handoff.outputs.production_recovery == 'true' }}
      stable_authority_run_id: ${{ needs.resolve-handoff.outputs.stable_authority_run_id }}
      carrier_artifact_name: ${{ needs.webui-carrier.outputs.carrier_artifact_name }}
