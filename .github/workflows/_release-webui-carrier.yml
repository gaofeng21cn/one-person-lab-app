name: Release WebUI Carrier (Reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: execute or canary validation-only startup.
        type: string
        default: execute
      authority_mode:
        description: production_follower, development_validation, or independent_preview.
        type: string
        default: production_follower
      production_recovery:
        description: Execute one strictly bound production follower recovery from canonical control bytes.
        type: boolean
        required: false
        default: false
      stable_authority_run_id:
        description: Exact successful Stable authority run for production follower publication records.
        type: string
        required: false
        default: ''
      app_ref:
        description: Exact App SHA frozen into the Release Bundle.
        type: string
        required: true
      shell_ref:
        description: Exact active Shell SHA frozen into the Release Bundle.
        type: string
        required: true
      framework_ref:
        description: Exact Framework SHA frozen into the Release Bundle.
        type: string
        required: true
      opl_version:
        description: Unified App version shared with the Desktop carrier.
        type: string
        required: true
      release_bundle_digest:
        description: Exact Stable Bundle or independent source-authority digest.
        type: string
        required: false
        default: ''
      release_cohort_ref:
        description: Exact frozen release cohort or source-authority digest.
        type: string
        required: false
        default: ''
      source_artifact_run_id:
        description: Exact source run containing the admitted source artifact.
        type: string
        required: false
        default: ''
      standard_checkpoint_artifact_name:
        description: Exact portable Standard checkpoint or development frozen Bundle artifact.
        type: string
        required: false
        default: ''
      standard_identity_sha256:
        description: Exact Standard identity digest; development mode binds the Bundle digest here.
        type: string
        required: false
        default: ''
      source_authority_artifact_name:
        description: Exact independent WebUI source-authority artifact.
        type: string
        required: false
        default: ''
      stable_framework_ref:
        description: Original Framework SHA frozen in the Stable cohort when production_recovery is true.
        type: string
        required: false
        default: ''
      recovery_authority_digest:
        description: Digest of the exact Stable-to-compatible-Framework recovery authority.
        type: string
        required: false
        default: ''
      failed_follower_run_id:
        description: Exact failed automatic WebUI follower consumed by production recovery.
        type: string
        required: false
        default: ''
      failed_recovery_v1_run_id:
        description: Exact failed WebUI recovery v1 consumed by production recovery.
        type: string
        required: false
        default: ''
      failed_recovery_v2_run_id:
        description: Exact failed WebUI recovery v2 consumed by production recovery.
        type: string
        required: false
        default: ''
      failed_recovery_v3_run_id:
        description: Exact failed WebUI recovery v3 consumed by production recovery v4.
        type: string
        required: false
        default: ''
      failed_recovery_v4_run_id:
        description: Exact failed WebUI recovery v4 consumed by production recovery v5.
        type: string
        required: false
        default: ''
      failed_recovery_v5_run_id:
        description: Exact failed WebUI recovery v5 consumed by production recovery v6.
        type: string
        required: false
        default: ''
      failed_recovery_v6_run_id:
        description: Exact failed WebUI recovery v6 consumed by production recovery v7.
        type: string
        required: false
        default: ''
      failed_recovery_v7_run_id:
        description: Exact failed WebUI recovery v7 consumed by production recovery v8.
        type: string
        required: false
        default: ''
      failed_recovery_v8_run_id:
        description: Exact failed WebUI recovery v8 whose qualified image is reused by production recovery v9.
        type: string
        required: false
        default: ''
      qualified_artifact_run_id:
        description: Exact prior failed publication run whose qualified image artifact is reused without rebuilding.
        type: string
        required: false
        default: ''
      qualified_artifact_name:
        description: Exact qualified image artifact name from qualified_artifact_run_id.
        type: string
        required: false
        default: ''
      image_repository:
        description: GHCR repository without a tag or digest.
        type: string
        default: ghcr.io/gaofeng21cn/one-person-lab-webui
    outputs:
      carrier_artifact_name:
        description: Artifact containing the exact carrier receipt and frozen build input.
        value: ${{ jobs.publish-immutable-carrier.outputs.carrier_artifact_name }}
      image_ref:
        description: Immutable OCI digest reference read back after publication.
        value: ${{ jobs.publish-immutable-carrier.outputs.image_ref }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  startup-canary:
    if: ${{ inputs.mode == 'canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove WebUI reusable topology starts without build or publication
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.release_bundle_digest }}' != ''
          test '${{ inputs.release_cohort_ref }}' != ''
          test '${{ inputs.app_ref }}' != ''
          test '${{ inputs.shell_ref }}' != ''
          test '${{ inputs.framework_ref }}' != ''
          if [ '${{ inputs.authority_mode }}' = independent_preview ]; then
            test '${{ inputs.source_artifact_run_id }}' != ''
            test '${{ inputs.source_authority_artifact_name }}' != ''
          else
            test '${{ inputs.source_artifact_run_id }}' != ''
            test '${{ inputs.standard_checkpoint_artifact_name }}' != ''
            test '${{ inputs.standard_identity_sha256 }}' != ''
          fi

  build-and-qualify:
    if: ${{ inputs.mode == 'execute' && inputs.qualified_artifact_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      packages: read
    outputs:
      image_artifact_name: ${{ steps.identity.outputs.image_artifact_name }}
    steps:
      - name: Checkout exact App source
        if: ${{ inputs.authority_mode == 'production_follower' && !inputs.production_recovery }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}

      - name: Checkout canonical development executor
        if: ${{ inputs.authority_mode == 'development_validation' || inputs.authority_mode == 'independent_preview' || inputs.production_recovery }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Checkout exact frozen App build input
        if: ${{ inputs.authority_mode == 'development_validation' || inputs.authority_mode == 'independent_preview' || inputs.production_recovery }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}
          path: frozen-app-source

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install App validation dependencies
        run: npm ci --ignore-scripts

      - name: Checkout exact active Shell source
        uses: ./.github/actions/setup-active-shell-deps
        with:
          shell-ref: ${{ inputs.shell_ref }}
          install-dependencies: 'false'

      - name: Checkout exact Framework source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ inputs.framework_ref }}
          path: framework-source
          fetch-depth: 0

      - name: Checkout exact WebUI build executor
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: webui-executor-source

      - name: Setup ORAS for exact external build inputs
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Download exact portable Standard checkpoint
        if: ${{ inputs.authority_mode == 'production_follower' || inputs.authority_mode == 'development_validation' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.standard_checkpoint_artifact_name }}
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}
          path: webui-carrier/standard-checkpoint

      - name: Download exact independent WebUI source authority
        if: ${{ inputs.authority_mode == 'independent_preview' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.source_authority_artifact_name }}
          run-id: ${{ inputs.source_artifact_run_id }}
          github-token: ${{ github.token }}
          path: webui-carrier/source-authority

      - name: Verify frozen source identities
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.authority_mode }}' = production_follower \
            || test '${{ inputs.authority_mode }}' = development_validation \
            || test '${{ inputs.authority_mode }}' = independent_preview
          if [ '${{ inputs.production_recovery }}' = true ]; then
            test '${{ inputs.authority_mode }}' = production_follower
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git -C frozen-app-source rev-parse HEAD)" = '${{ inputs.app_ref }}'
            [[ '${{ inputs.stable_authority_run_id }}' =~ ^[1-9][0-9]*$ ]]
            [[ '${{ inputs.stable_framework_ref }}' =~ ^[0-9a-f]{40}$ ]]
            [[ '${{ inputs.recovery_authority_digest }}' =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ '${{ inputs.failed_follower_run_id }}' =~ ^[1-9][0-9]*$ ]]
            [[ '${{ inputs.failed_recovery_v1_run_id }}' =~ ^[1-9][0-9]*$ ]]
            [[ '${{ inputs.failed_recovery_v2_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test -z '${{ inputs.failed_recovery_v3_run_id }}' \
              || [[ '${{ inputs.failed_recovery_v3_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test -z '${{ inputs.failed_recovery_v4_run_id }}' \
              || [[ '${{ inputs.failed_recovery_v4_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test -z '${{ inputs.failed_recovery_v5_run_id }}' \
              || [[ '${{ inputs.failed_recovery_v5_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test -z '${{ inputs.failed_recovery_v6_run_id }}' \
              || [[ '${{ inputs.failed_recovery_v6_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test -z '${{ inputs.failed_recovery_v7_run_id }}' \
              || [[ '${{ inputs.failed_recovery_v7_run_id }}' =~ ^[1-9][0-9]*$ ]]
            test '${{ inputs.stable_framework_ref }}' != '${{ inputs.framework_ref }}'
          elif [ '${{ inputs.authority_mode }}' = production_follower ]; then
            test "$(git rev-parse HEAD)" = '${{ inputs.app_ref }}'
          else
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            test "$(git -C frozen-app-source rev-parse HEAD)" = '${{ inputs.app_ref }}'
          fi
          test "$(git -C shells/aionui rev-parse HEAD)" = '${{ inputs.shell_ref }}'
          test "$(git -C framework-source rev-parse HEAD)" = '${{ inputs.framework_ref }}'
          if [ '${{ inputs.production_recovery }}' = true ]; then
            git -C framework-source merge-base --is-ancestor \
              95640c74e0b14ba2e88056de725c417fd1693cf1 '${{ inputs.framework_ref }}'
          fi
          test "$(git -C webui-executor-source rev-parse HEAD)" = "$GITHUB_SHA"
          test -f webui-executor-source/scripts/materialize-webui-seed-symlinks.ts
          test ! -L webui-executor-source/scripts/materialize-webui-seed-symlinks.ts
          test '${{ inputs.app_ref }}' != '${{ inputs.shell_ref }}'
          test '${{ inputs.framework_ref }}' != '${{ inputs.shell_ref }}'

      - name: Derive WebUI build input from exact Standard identity
        if: ${{ inputs.authority_mode == 'production_follower' }}
        shell: bash
        run: |
          set -euo pipefail
          one_regular_file() {
            local root="$1" name="$2"
            local matches=()
            local match
            while IFS= read -r match; do matches+=("$match"); done < <(
              find "$root" -type f -name "$name" -print | LC_ALL=C sort
            )
            test "${#matches[@]}" -eq 1 || {
              echo "::error::$root must contain exactly one $name; found ${#matches[@]}."
              exit 1
            }
            test -f "${matches[0]}" && test ! -L "${matches[0]}"
            printf '%s\n' "${matches[0]}"
          }
          identity_receipt="$(one_regular_file webui-carrier/standard-checkpoint standard-identity-receipt.json)"
          bundle="$(one_regular_file webui-carrier/standard-checkpoint bundle.json)"
          test "sha256:$(shasum -a 256 "$identity_receipt" | awk '{print $1}')" = '${{ inputs.standard_identity_sha256 }}'
          mkdir -p webui-carrier/frozen-codex
          oras manifest fetch \
            --output webui-carrier/base-image-index.json \
            docker.io/library/node:22-bookworm-slim
          codex_version="$(jq -er '.managed_runtime.codex_cli.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"))' \
            shells/aionui/contracts/aionui-upstream-intake.json)"
          codex_tarball_url="$(npm view --json "@openai/codex@${codex_version}" dist.tarball \
            | jq -er 'select(type == "string" and startswith("https://"))')"
          curl -L --fail --silent --show-error "$codex_tarball_url" \
            --output webui-carrier/frozen-codex/codex-cli.tgz
          source_cutoff_observed_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          app_root=.
          recovery_args=()
          if [ '${{ inputs.production_recovery }}' = true ]; then
            app_root=frozen-app-source
            recovery_args=(
              --stable-framework-ref '${{ inputs.stable_framework_ref }}'
              --webui-recovery-authority-digest '${{ inputs.recovery_authority_digest }}'
              --webui-recovery-stable-authority-run-id '${{ inputs.stable_authority_run_id }}'
              --webui-recovery-failed-follower-run-id '${{ inputs.failed_follower_run_id }}'
              --webui-recovery-failed-v1-run-id '${{ inputs.failed_recovery_v1_run_id }}'
              --webui-recovery-failed-v2-run-id '${{ inputs.failed_recovery_v2_run_id }}'
              --webui-recovery-executor-app-sha "$GITHUB_SHA"
            )
            if [ -n '${{ inputs.failed_recovery_v3_run_id }}' ]; then
              recovery_args+=(
                --webui-recovery-failed-v3-run-id '${{ inputs.failed_recovery_v3_run_id }}'
              )
            fi
            if [ -n '${{ inputs.failed_recovery_v4_run_id }}' ]; then
              recovery_args+=(
                --webui-recovery-failed-v4-run-id '${{ inputs.failed_recovery_v4_run_id }}'
              )
            fi
            if [ -n '${{ inputs.failed_recovery_v5_run_id }}' ]; then
              recovery_args+=(
                --webui-recovery-failed-v5-run-id '${{ inputs.failed_recovery_v5_run_id }}'
              )
            fi
            if [ -n '${{ inputs.failed_recovery_v6_run_id }}' ]; then
              recovery_args+=(
                --webui-recovery-failed-v6-run-id '${{ inputs.failed_recovery_v6_run_id }}'
              )
            fi
            if [ -n '${{ inputs.failed_recovery_v7_run_id }}' ]; then
              recovery_args+=(
                --webui-recovery-failed-v7-run-id '${{ inputs.failed_recovery_v7_run_id }}'
              )
            fi
          fi
          node --experimental-strip-types scripts/framework-release-adapter.ts webui-build-input \
            --standard-identity "$identity_receipt" \
            --bundle "$bundle" \
            --app-root "$app_root" \
            --shell-root shells/aionui \
            --framework-root framework-source \
            "${recovery_args[@]}" \
            --source-cutoff-observed-at "$source_cutoff_observed_at" \
            --base-image-index webui-carrier/base-image-index.json \
            --frozen-codex-tarball webui-carrier/frozen-codex/codex-cli.tgz \
            --output webui-carrier/build-input-draft.json

      - name: Derive WebUI build input from exact development Bundle
        if: ${{ inputs.authority_mode == 'development_validation' }}
        shell: bash
        run: |
          set -euo pipefail
          one_regular_file() {
            local root="$1" name="$2"
            local matches=()
            local match
            while IFS= read -r match; do matches+=("$match"); done < <(
              find "$root" -type f -name "$name" -print | LC_ALL=C sort
            )
            test "${#matches[@]}" -eq 1 || {
              echo "::error::$root must contain exactly one $name; found ${#matches[@]}."
              exit 1
            }
            test -f "${matches[0]}" && test ! -L "${matches[0]}"
            printf '%s\n' "${matches[0]}"
          }
          bundle="$(one_regular_file webui-carrier/standard-checkpoint release-bundle.json)"
          test "$(jq -er .bundle_digest "$bundle")" = '${{ inputs.release_bundle_digest }}'
          mkdir -p webui-carrier/frozen-codex
          oras manifest fetch \
            --output webui-carrier/base-image-index.json \
            docker.io/library/node:22-bookworm-slim
          codex_version="$(jq -er '.managed_runtime.codex_cli.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"))' \
            shells/aionui/contracts/aionui-upstream-intake.json)"
          codex_tarball_url="$(npm view --json "@openai/codex@${codex_version}" dist.tarball \
            | jq -er 'select(type == "string" and startswith("https://"))')"
          curl -L --fail --silent --show-error "$codex_tarball_url" \
            --output webui-carrier/frozen-codex/codex-cli.tgz
          source_cutoff_observed_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node --experimental-strip-types scripts/framework-release-adapter.ts webui-build-input \
            --bundle "$bundle" \
            --app-root frozen-app-source \
            --shell-root shells/aionui \
            --framework-root framework-source \
            --source-cutoff-observed-at "$source_cutoff_observed_at" \
            --base-image-index webui-carrier/base-image-index.json \
            --frozen-codex-tarball webui-carrier/frozen-codex/codex-cli.tgz \
            --output webui-carrier/build-input-draft.json

      - name: Derive WebUI build input from independent exact source authority
        if: ${{ inputs.authority_mode == 'independent_preview' }}
        shell: bash
        run: |
          set -euo pipefail
          one_regular_file() {
            local root="$1" name="$2"
            local matches=()
            local match
            while IFS= read -r match; do matches+=("$match"); done < <(
              find "$root" -type f -name "$name" -print | LC_ALL=C sort
            )
            test "${#matches[@]}" -eq 1 || {
              echo "::error::$root must contain exactly one $name; found ${#matches[@]}."
              exit 1
            }
            test -f "${matches[0]}" && test ! -L "${matches[0]}"
            printf '%s\n' "${matches[0]}"
          }
          source_authority="$(one_regular_file webui-carrier/source-authority source-authority.json)"
          node --experimental-strip-types scripts/webui-source-authority.ts \
            validate --input "$source_authority" \
            > webui-carrier/source-authority-verification.json
          cp "$source_authority" webui-carrier/source-authority.json
          test "$(jq -er .source_authority_digest webui-carrier/source-authority.json)" = '${{ inputs.release_bundle_digest }}'
          test "$(jq -er .release.version webui-carrier/source-authority.json)" = '${{ inputs.opl_version }}'
          mkdir -p webui-carrier/frozen-codex
          oras manifest fetch \
            --output webui-carrier/base-image-index.json \
            docker.io/library/node:22-bookworm-slim
          codex_version="$(jq -er '.managed_runtime.codex_cli.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"))' \
            shells/aionui/contracts/aionui-upstream-intake.json)"
          codex_tarball_url="$(npm view --json "@openai/codex@${codex_version}" dist.tarball \
            | jq -er 'select(type == "string" and startswith("https://"))')"
          curl -L --fail --silent --show-error "$codex_tarball_url" \
            --output webui-carrier/frozen-codex/codex-cli.tgz
          source_cutoff_observed_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
          node --experimental-strip-types scripts/framework-release-adapter.ts webui-build-input \
            --source-authority "webui-carrier/source-authority.json" \
            --app-root frozen-app-source \
            --shell-root shells/aionui \
            --framework-root framework-source \
            --source-cutoff-observed-at "$source_cutoff_observed_at" \
            --base-image-index webui-carrier/base-image-index.json \
            --frozen-codex-tarball webui-carrier/frozen-codex/codex-cli.tgz \
            --output webui-carrier/build-input-draft.json

      - name: Seal and verify exact WebUI build input
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            seal-build-input \
            --input webui-carrier/build-input-draft.json \
            --output webui-carrier/build-input.json \
            > webui-carrier/build-input-seal.json
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            verify-build-input \
            --input webui-carrier/build-input.json \
            --expected-version '${{ inputs.opl_version }}' \
            --expected-bundle-digest '${{ inputs.release_bundle_digest }}' \
            --expected-cohort-ref '${{ inputs.release_cohort_ref }}' \
            --expected-app-sha '${{ inputs.app_ref }}' \
            --expected-shell-sha '${{ inputs.shell_ref }}' \
            --expected-framework-sha '${{ inputs.framework_ref }}' \
            --expected-architecture amd64 \
            > webui-carrier/build-input-verification.json

      - name: Verify and materialize frozen Codex artifact
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            verify-codex-artifact \
            --build-input webui-carrier/build-input.json \
            --artifact-dir webui-carrier/frozen-codex \
            > webui-carrier/codex-artifact-verification.json
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            verify-docker-context-policy \
            --dockerignore shells/aionui/.dockerignore \
            > webui-carrier/docker-context-policy-verification.json
          rm -rf shells/aionui/.opl-frozen-inputs
          mkdir -p shells/aionui/.opl-frozen-inputs
          cp webui-carrier/frozen-codex/codex-cli.tgz \
            shells/aionui/.opl-frozen-inputs/codex-cli.tgz
          cmp -s webui-carrier/frozen-codex/codex-cli.tgz \
            shells/aionui/.opl-frozen-inputs/codex-cli.tgz
          cp webui-executor-source/scripts/materialize-webui-seed-symlinks.ts \
            shells/aionui/.opl-frozen-inputs/materialize-webui-seed-symlinks.ts
          cmp -s webui-executor-source/scripts/materialize-webui-seed-symlinks.ts \
            shells/aionui/.opl-frozen-inputs/materialize-webui-seed-symlinks.ts
          rm -rf webui-carrier/frozen-codex

      - name: Resolve frozen build arguments and materialize digest-pinned Dockerfile
        id: build-inputs
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('webui-carrier/build-input.json', 'utf8'));
          const inputs = new Map(manifest.inputs.map((input) => [input.id, input]));
          const digest = (bytes) => `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
          for (const [id, file] of [
            ['dockerfile', 'shells/aionui/Dockerfile'],
            ['qualification_harness', 'scripts/validate-webui-runtime-image.ts'],
          ]) {
            const bytes = fs.readFileSync(file);
            const input = inputs.get(id);
            if (input.digest !== digest(bytes) || input.size_bytes !== bytes.byteLength) {
              throw new Error(`${id} bytes do not match the frozen build input`);
            }
          }
          const baseRef = inputs.get('base_image').ref;
          const dockerfile = fs.readFileSync('shells/aionui/Dockerfile', 'utf8');
          const marker = 'FROM node:22-bookworm-slim';
          if (!dockerfile.includes(marker)) throw new Error(`Shell Dockerfile no longer contains ${marker}`);
          const onlineCodexInstall = [
            'RUN npm install -g --prefix /opt/codex-cli "${OPL_CODEX_NPM_SPEC}" \\',
            '  && npm cache clean --force \\',
            '  && printf \'%s\\n\' "${OPL_CODEX_NPM_SPEC}" > /opt/codex-cli/OPL_CODEX_NPM_SPEC',
          ].join('\n');
          const frozenCodexInstall = [
            'COPY .opl-frozen-inputs/materialize-webui-seed-symlinks.ts /tmp/materialize-webui-seed-symlinks.ts',
            'COPY .opl-frozen-inputs/codex-cli.tgz /tmp/codex-cli.tgz',
            'RUN npm install -g --prefix /opt/codex-cli /tmp/codex-cli.tgz \\',
            '  && node --experimental-strip-types /tmp/materialize-webui-seed-symlinks.ts --root /opt/codex-cli \\',
            '  && rm -f /tmp/codex-cli.tgz /tmp/materialize-webui-seed-symlinks.ts \\',
            '  && test -z "$(find /opt/codex-cli -type l -print -quit)" \\',
            '  && npm cache clean --force \\',
            '  && printf \'%s\\n\' "${OPL_CODEX_NPM_SPEC}" > /opt/codex-cli/OPL_CODEX_NPM_SPEC',
          ].join('\n');
          const frameworkInstall = [
            'RUN npm ci \\',
            '  && npm run build \\',
            '  && npm prune --omit=dev',
          ].join('\n');
          const materializedFrameworkInstall = [
            'COPY .opl-frozen-inputs/materialize-webui-seed-symlinks.ts /tmp/materialize-webui-seed-symlinks.ts',
            frameworkInstall,
            'RUN node --experimental-strip-types /tmp/materialize-webui-seed-symlinks.ts --root node_modules \\',
            '  && rm -f /tmp/materialize-webui-seed-symlinks.ts \\',
            '  && test -z "$(find node_modules -type l -print -quit)"',
          ].join('\n');
          if (dockerfile.split(onlineCodexInstall).length !== 2) {
            throw new Error('Shell Dockerfile must contain exactly one online Codex install block');
          }
          if (dockerfile.split(frameworkInstall).length !== 2) {
            throw new Error('Shell Dockerfile must contain exactly one Framework install block');
          }
          fs.writeFileSync(
            'webui-carrier/Dockerfile.frozen',
            dockerfile
              .replaceAll(marker, `FROM ${baseRef}`)
              .replace(frameworkInstall, materializedFrameworkInstall)
              .replace(onlineCodexInstall, frozenCodexInstall),
          );
          const outputs = {
            base_ref: baseRef,
            codex_ref: inputs.get('codex_cli').ref,
          };
          fs.appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => `${key}=${value}\n`).join(''));
          NODE

      - name: Build WebUI image once from frozen inputs
        id: build
        shell: bash
        run: |
          set -euo pipefail
          manifest_digest="$(node -e "const fs=require('fs'),c=require('crypto');process.stdout.write('sha256:'+c.createHash('sha256').update(fs.readFileSync('webui-carrier/build-input.json')).digest('hex'))")"
          content_fingerprint="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('webui-carrier/build-input.json')).content_fingerprint)")"
          local_image="opl-webui-qualified:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build \
            --platform linux/amd64 \
            --file webui-carrier/Dockerfile.frozen \
            --build-arg 'OPL_FRAMEWORK_REF=${{ inputs.framework_ref }}' \
            --build-arg 'OPL_CODEX_NPM_SPEC=${{ steps.build-inputs.outputs.codex_ref }}' \
            --build-arg OPL_WEBUI_IMAGE_PROFILE=webui-full \
            --label org.opencontainers.image.source=https://github.com/gaofeng21cn/one-person-lab-app \
            --label 'org.opencontainers.image.revision=${{ inputs.app_ref }}' \
            --label 'org.opencontainers.image.version=${{ inputs.opl_version }}' \
            --label 'dev.onepersonlab.release.bundle-digest=${{ inputs.release_bundle_digest }}' \
            --label 'dev.onepersonlab.release.cohort-ref=${{ inputs.release_cohort_ref }}' \
            --label "dev.onepersonlab.release.build-input-digest=${manifest_digest}" \
            --label "dev.onepersonlab.release.content-fingerprint=${content_fingerprint}" \
            --label 'dev.onepersonlab.release.shell-revision=${{ inputs.shell_ref }}' \
            --label 'dev.onepersonlab.release.framework-revision=${{ inputs.framework_ref }}' \
            --tag "$local_image" \
            shells/aionui
          printf '%s\n' "$local_image" > webui-carrier/local-image-ref.txt
          docker image inspect "$local_image" > webui-carrier/image-inspect.json
          docker image inspect --format '{{.Size}}' "$local_image" > webui-carrier/image-size.txt

      - name: Remove frozen Codex Docker context input
        if: ${{ always() }}
        shell: bash
        run: rm -rf shells/aionui/.opl-frozen-inputs

      - name: Qualify exact local runtime before any registry tag is written
        id: qualify
        shell: bash
        run: |
          set -euo pipefail
          local_image="$(cat webui-carrier/local-image-ref.txt)"
          docker run --rm --entrypoint cat "$local_image" /opt/opl/image-manifest.json > webui-carrier/image-manifest.json
          docker run --rm --entrypoint cat "$local_image" /opt/opl/seed/metadata.json > webui-carrier/seed-metadata.json
          docker run --rm --entrypoint sh "$local_image" -c 'command -v opl >/dev/null && command -v codex >/dev/null'
          node --experimental-strip-types scripts/validate-webui-runtime-image.ts \
            --image-inspect webui-carrier/image-inspect.json \
            --image-manifest webui-carrier/image-manifest.json \
            --seed-metadata webui-carrier/seed-metadata.json \
            --expected-profile webui-full \
            --summary-path webui-carrier/runtime-summary.json
          container_name="opl-webui-qualification-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_dir="$RUNNER_TEMP/webui-data"
          projects_dir="$RUNNER_TEMP/webui-projects"
          mkdir -p "$data_dir" "$projects_dir"
          capture_runtime_diagnostics() {
            docker inspect "$container_name" > webui-carrier/container-inspect.json \
              2> webui-carrier/container-inspect.stderr || true
            docker logs "$container_name" > webui-carrier/container.log 2>&1 || true
            docker ps -a --filter "name=^/${container_name}$" --no-trunc \
              > webui-carrier/container-status.txt 2>&1 || true
          }
          docker run -d --name "$container_name" \
            -p 127.0.0.1::3000 \
            -v "$data_dir:/data" \
            -v "$projects_dir:/projects" \
            "$local_image" > webui-carrier/container-id.txt
          trap 'capture_runtime_diagnostics; docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container_name" 3000/tcp | sed -n 's/.*://p' | tail -1)"
          test -n "$port"
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null; then
              printf '%s\n' passed > webui-carrier/http-health.txt
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name" 2>/dev/null || true)" != true ]; then
              exit 1
            fi
            if [ "$attempt" -eq 90 ]; then
              exit 1
            fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('webui-carrier/runtime-summary.json', 'utf8'));
          summary.http_health = { status: fs.readFileSync('webui-carrier/http-health.txt', 'utf8').trim() };
          summary.runtime_cli_shims = { opl: 'passed', codex: 'passed' };
          fs.writeFileSync('webui-carrier/runtime-summary.json', `${JSON.stringify(summary)}\n`);
          NODE
          docker rm -f "$container_name" >/dev/null
          trap - EXIT

      - name: Upload WebUI runtime qualification failure evidence
        if: ${{ failure() && steps.qualify.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webui-runtime-failure-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            webui-carrier/container-id.txt
            webui-carrier/container-inspect.json
            webui-carrier/container-inspect.stderr
            webui-carrier/container.log
            webui-carrier/container-status.txt
            webui-carrier/image-inspect.json
            webui-carrier/image-manifest.json
            webui-carrier/runtime-summary.json
            webui-carrier/seed-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Package qualified image and evidence for protected immutable publication
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          local_image="$(cat webui-carrier/local-image-ref.txt)"
          docker builder prune --all --force
          docker image inspect "$local_image" >/dev/null
          docker save "$local_image" | gzip -1 > webui-carrier/qualified-image.tar.gz
          image_artifact_name="webui-qualified-${{ inputs.opl_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'image_artifact_name=%s\n' "$image_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload qualified image evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.identity.outputs.image_artifact_name }}
          path: webui-carrier
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish-immutable-carrier:
    if: >-
      ${{ always()
        && inputs.mode == 'execute'
        && ((inputs.qualified_artifact_run_id == '' && needs.build-and-qualify.result == 'success')
        || (inputs.qualified_artifact_run_id != '' && needs.build-and-qualify.result == 'skipped')) }}
    needs: build-and-qualify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.authority_mode == 'independent_preview' && 'release-preview-publication' || 'release-stable' }}
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      carrier_artifact_name: ${{ steps.receipt.outputs.carrier_artifact_name }}
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - name: Checkout exact production App source
        if: ${{ inputs.authority_mode == 'production_follower' && !inputs.production_recovery }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ inputs.app_ref }}

      - name: Checkout canonical publication executor
        if: ${{ inputs.authority_mode == 'development_validation' || inputs.authority_mode == 'independent_preview' || inputs.production_recovery }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}

      - name: Setup ORAS for durable carrier receipt sidecar
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6

      - name: Validate exact qualified artifact recovery authority
        if: ${{ inputs.qualified_artifact_run_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.authority_mode }}' = production_follower
          test '${{ inputs.production_recovery }}' = true
          [[ '${{ inputs.qualified_artifact_run_id }}' =~ ^[1-9][0-9]*$ ]]
          test '${{ inputs.qualified_artifact_run_id }}' = '${{ inputs.failed_recovery_v8_run_id }}'
          test '${{ inputs.qualified_artifact_name }}' = \
            "webui-qualified-${{ inputs.opl_version }}-${{ inputs.qualified_artifact_run_id }}-1"

      - name: Download exact qualified image evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.qualified_artifact_name || needs.build-and-qualify.outputs.image_artifact_name }}
          run-id: ${{ inputs.qualified_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: webui-carrier

      - name: Load locally qualified image
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c webui-carrier/qualified-image.tar.gz | docker load
          local_image="$(cat webui-carrier/local-image-ref.txt)"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$local_image")" = linux/amd64

      - name: Validate exact GHCR repository before registry mutation
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/webui-publication-record.ts \
            validate-repository \
            --image-repository '${{ inputs.image_repository }}' \
            > webui-carrier/image-repository-validation.json

      - name: Authenticate to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish qualified candidate and CAS immutable version tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          local_image="$(cat webui-carrier/local-image-ref.txt)"
          candidate_tag='${{ inputs.image_repository }}:candidate-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}'
          version_tag='${{ inputs.image_repository }}:${{ inputs.opl_version }}'
          docker tag "$local_image" "$candidate_tag"
          docker push "$candidate_tag" | tee webui-carrier/candidate-push.txt
          candidate_readback="$(docker buildx imagetools inspect "$candidate_tag")"
          printf '%s\n' "$candidate_readback" > webui-carrier/candidate-tag-readback.txt
          digest="$(printf '%s\n' "$candidate_readback" | awk '$1 == "Digest:" { print $2; exit }')"
          test -n "$digest"
          image_ref='${{ inputs.image_repository }}'@"$digest"
          docker buildx imagetools inspect "$image_ref" > webui-carrier/immutable-readback.txt

          authority_validator="$RUNNER_TEMP/verify-version-tag-authority.mjs"
          cat >"$authority_validator" <<'VERSION_TAG_AUTHORITY_NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const [rawPath, expectedChildDigest, versionTag, outcome, outputPath] = process.argv.slice(2);
          const digestPattern = /^sha256:[0-9a-f]{64}$/;
          const allowedMediaTypes = new Set([
            'application/vnd.oci.image.index.v1+json',
            'application/vnd.docker.distribution.manifest.list.v2+json',
          ]);
          const allowedOutcomes = new Set([
            'created',
            'preexisting_idempotent',
            'reconciled_after_unknown_write',
          ]);
          const fail = (message) => {
            throw new Error(`WebUI version tag authority rejected: ${message}`);
          };

          if (!digestPattern.test(expectedChildDigest ?? '')) fail('expected child digest is invalid');
          if (!versionTag) fail('version tag is missing');
          if (!allowedOutcomes.has(outcome)) fail('publication outcome is invalid');
          const raw = fs.readFileSync(rawPath);
          let manifest;
          try {
            manifest = JSON.parse(raw.toString('utf8'));
          } catch {
            fail('raw manifest is not valid JSON');
          }
          if (!manifest || typeof manifest !== 'object' || Array.isArray(manifest)) {
            fail('raw manifest must be an object');
          }
          if (!allowedMediaTypes.has(manifest.mediaType)) {
            fail(`top-level media type ${String(manifest.mediaType)} is not a manifest list`);
          }
          if (!Array.isArray(manifest.manifests) || manifest.manifests.length !== 1) {
            fail('top-level manifest list must contain exactly one child');
          }
          const child = manifest.manifests[0];
          if (!child || typeof child !== 'object' || Array.isArray(child)) {
            fail('child descriptor must be an object');
          }
          if (child.digest !== expectedChildDigest) {
            fail(`child digest ${String(child.digest)} does not match ${expectedChildDigest}`);
          }
          if (child.platform?.os !== 'linux' || child.platform?.architecture !== 'amd64') {
            fail('the unique child platform must be linux/amd64');
          }

          const topLevelDigest = `sha256:${crypto.createHash('sha256').update(raw).digest('hex')}`;
          const receipt = {
            schema: 'opl_app_webui_version_tag_authority.v1',
            status: 'passed',
            outcome,
            version_tag: versionTag,
            top_level: {
              media_type: manifest.mediaType,
              digest: topLevelDigest,
              manifest_count: 1,
            },
            child: {
              digest: expectedChildDigest,
              platform: {
                os: 'linux',
                architecture: 'amd64',
              },
            },
          };
          fs.writeFileSync(outputPath, `${JSON.stringify(receipt)}\n`);
          VERSION_TAG_AUTHORITY_NODE

          verify_version_tag_authority() {
            local outcome="$1"
            local human_readback="$2"
            local raw_readback="$3"
            local receipt="$4"
            if ! docker buildx imagetools inspect --raw "$version_tag" >"$raw_readback"; then
              return 1
            fi
            if ! node "$authority_validator" "$raw_readback" "$digest" "$version_tag" "$outcome" "$receipt"; then
              return 1
            fi
            local reported_digest
            local verified_digest
            reported_digest="$(awk '$1 == "Digest:" { print $2; exit }' "$human_readback")"
            verified_digest="$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],'utf8')).top_level.digest)" "$receipt")"
            test -n "$reported_digest" && test "$reported_digest" = "$verified_digest"
          }

          inspect_output="$RUNNER_TEMP/version-tag-inspect.txt"
          if docker buildx imagetools inspect "$version_tag" >"$inspect_output" 2>&1; then
            cp "$inspect_output" webui-carrier/version-tag-readback.txt
            if ! verify_version_tag_authority \
              preexisting_idempotent \
              webui-carrier/version-tag-readback.txt \
              webui-carrier/version-tag-manifest.json \
              webui-carrier/version-tag-authority.json; then
              cat "$inspect_output" >&2
              echo '::error::Immutable WebUI version tag does not prove the expected unique linux/amd64 child digest.'
              exit 1
            fi
          elif grep -Eqi 'not found|manifest unknown|no such manifest' "$inspect_output"; then
            outcome=created
            if ! docker buildx imagetools create --tag "$version_tag" "$image_ref" \
              > webui-carrier/version-tag-create.txt 2>&1; then
              outcome=reconciled_after_unknown_write
            fi
            if ! docker buildx imagetools inspect "$version_tag" \
              > webui-carrier/version-tag-readback.txt 2>&1; then
              if [ "$outcome" = reconciled_after_unknown_write ]; then
                cat webui-carrier/version-tag-create.txt >&2
              fi
              cat webui-carrier/version-tag-readback.txt >&2
              echo '::error::Version tag write result is unknown and bounded read-only reconcile did not prove a readable target.'
              exit 1
            fi
            if ! verify_version_tag_authority \
              "$outcome" \
              webui-carrier/version-tag-readback.txt \
              webui-carrier/version-tag-manifest.json \
              webui-carrier/version-tag-authority.json; then
              if [ "$outcome" = reconciled_after_unknown_write ]; then
                cat webui-carrier/version-tag-create.txt >&2
              fi
              cat webui-carrier/version-tag-readback.txt >&2
              echo '::error::Version tag readback did not prove the expected unique linux/amd64 child digest.'
              exit 1
            fi
          else
            cat "$inspect_output" >&2
            echo '::error::Could not safely distinguish an absent version tag from a registry read failure.'
            exit 1
          fi

          OPL_IMAGE_REF="$image_ref" OPL_IMAGE_DIGEST="$digest" OPL_VERSION_TAG="$version_tag" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = {
            schema: 'opl_app_webui_registry_readback.v1',
            status: 'passed',
            ref: process.env.OPL_IMAGE_REF,
            digest: process.env.OPL_IMAGE_DIGEST,
            version_tag: process.env.OPL_VERSION_TAG,
            version_tag_digest: process.env.OPL_IMAGE_DIGEST,
          };
          fs.writeFileSync('webui-carrier/registry-readback.json', `${JSON.stringify(payload)}\n`);
          NODE
          OPL_IMAGE_DIGEST="$digest" OPL_VERSION_TAG="$version_tag" node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const digestPattern = /^sha256:[0-9a-f]{64}$/;
          const authority = JSON.parse(fs.readFileSync('webui-carrier/version-tag-authority.json', 'utf8'));
          if (
            authority?.schema !== 'opl_app_webui_version_tag_authority.v1'
            || authority?.status !== 'passed'
            || authority?.version_tag !== process.env.OPL_VERSION_TAG
            || authority?.child?.digest !== process.env.OPL_IMAGE_DIGEST
            || authority?.child?.platform?.os !== 'linux'
            || authority?.child?.platform?.architecture !== 'amd64'
            || authority?.top_level?.manifest_count !== 1
            || !digestPattern.test(authority?.top_level?.digest ?? '')
            || ![
              'application/vnd.oci.image.index.v1+json',
              'application/vnd.docker.distribution.manifest.list.v2+json',
            ].includes(authority?.top_level?.media_type)
          ) {
            throw new Error('exact immutable version tag authority is required before durable sidecar publication');
          }
          fs.writeFileSync('webui-carrier/version-descriptor-readback.json', `${JSON.stringify({
            schema: 'opl_app_webui_descriptor_readback.v1',
            status: 'present',
            ref: process.env.OPL_VERSION_TAG,
            digest: authority.top_level.digest,
            child_digest: authority.child.digest,
            manifest_count: authority.top_level.manifest_count,
            media_type: authority.top_level.media_type,
          })}\n`);
          NODE
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Write and verify exact carrier receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            write-carrier-receipt \
            --build-input webui-carrier/build-input.json \
            --image-inspect webui-carrier/image-inspect.json \
            --runtime-summary webui-carrier/runtime-summary.json \
            --registry-readback webui-carrier/registry-readback.json \
            --image-ref '${{ steps.publish.outputs.image_ref }}' \
            --image-size "$(cat webui-carrier/image-size.txt)" \
            --output webui-carrier/carrier-receipt.json \
            > webui-carrier/carrier-receipt-write.json
          node --experimental-strip-types scripts/release-webui-carrier.ts \
            verify-carrier-receipt \
            --build-input webui-carrier/build-input.json \
            --receipt webui-carrier/carrier-receipt.json \
            --image-inspect webui-carrier/image-inspect.json \
            --runtime-summary webui-carrier/runtime-summary.json \
            --registry-readback webui-carrier/registry-readback.json \
            --expected-version '${{ inputs.opl_version }}' \
            --expected-bundle-digest '${{ inputs.release_bundle_digest }}' \
            --expected-cohort-ref '${{ inputs.release_cohort_ref }}' \
            --expected-app-sha '${{ inputs.app_ref }}' \
            --expected-shell-sha '${{ inputs.shell_ref }}' \
            --expected-framework-sha '${{ inputs.framework_ref }}' \
            --expected-architecture amd64 \
            > webui-carrier/carrier-receipt-verification.json
          if [ '${{ inputs.authority_mode }}' = independent_preview ]; then
            test -f webui-carrier/source-authority.json
            node --experimental-strip-types scripts/webui-source-authority.ts \
              validate --input webui-carrier/source-authority.json \
              > webui-carrier/source-authority-final-verification.json
            test "$(jq -er .source_authority_digest webui-carrier/source-authority.json)" = \
              "$(jq -er .release.bundle_digest webui-carrier/carrier-receipt.json)"
            test "$(jq -er .source_authority_digest webui-carrier/source-authority.json)" = \
              "$(jq -er .release.cohort_ref webui-carrier/carrier-receipt.json)"
          fi
          carrier_artifact_name="webui-carrier-${{ inputs.opl_version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'carrier_artifact_name=%s\n' "$carrier_artifact_name" >> "$GITHUB_OUTPUT"

      - name: Publish immutable durable carrier receipt sidecar
        shell: bash
        run: |
          set -euo pipefail
          readonly artifact_media_type='application/vnd.onepersonlab.webui.publication-record.v1+json'
          readonly receipt_ref='${{ inputs.image_repository }}:receipt-${{ inputs.opl_version }}'
          readonly sidecar_root="$RUNNER_TEMP/webui-publication-record-sidecar"
          readonly record_path="$sidecar_root/webui-publication-record.json"
          readonly pull_root="$sidecar_root/pulled"
          rm -rf "$sidecar_root"
          mkdir -p "$pull_root"

          write_reconcile_evidence() {
            local status="$1" outcome="$2"
            OPL_RECONCILE_STATUS="$status" \
              OPL_PUBLICATION_OUTCOME="$outcome" \
              OPL_RECEIPT_REF="$receipt_ref" \
              OPL_RECORD_PATH="$record_path" \
              OPL_RECONCILE_OUTPUT="$sidecar_root/receipt-sidecar-reconcile.json" \
              node --input-type=module <<'WEBUI_SIDECAR_RECONCILE_NODE'
            import crypto from 'node:crypto';
            import fs from 'node:fs';

            const record = fs.readFileSync(process.env.OPL_RECORD_PATH);
            fs.writeFileSync(process.env.OPL_RECONCILE_OUTPUT, `${JSON.stringify({
              schema: 'opl_app_webui_receipt_sidecar_reconcile.v1',
              status: process.env.OPL_RECONCILE_STATUS,
              publication_outcome: process.env.OPL_PUBLICATION_OUTCOME,
              receipt_ref: process.env.OPL_RECEIPT_REF,
              expected_publication_record_sha256: `sha256:${crypto.createHash('sha256').update(record).digest('hex')}`,
            })}\n`);
          WEBUI_SIDECAR_RECONCILE_NODE
          }

          create_args=(
            --authority-mode '${{ inputs.authority_mode }}'
            --carrier-receipt webui-carrier/carrier-receipt.json
            --version-readback webui-carrier/version-descriptor-readback.json
            --image-repository '${{ inputs.image_repository }}'
            --publication-run-id "$GITHUB_RUN_ID"
            --publication-run-attempt "$GITHUB_RUN_ATTEMPT"
            --publication-executor-sha "$GITHUB_SHA"
          )
          case '${{ inputs.authority_mode }}' in
            production_follower)
              stable_authority_run_id='${{ inputs.stable_authority_run_id || github.event.workflow_run.id }}'
              ;;
            development_validation)
              stable_authority_run_id='${{ inputs.source_artifact_run_id }}'
              ;;
            independent_preview)
              source_authority_path='webui-carrier/source-authority.json'
              test -f "$source_authority_path" && test ! -L "$source_authority_path"
              create_args+=(--source-authority "$source_authority_path")
              ;;
            *)
              echo '::error::WebUI publication authority mode is invalid.'
              exit 1
              ;;
          esac
          if [ '${{ inputs.authority_mode }}' != independent_preview ]; then
            [[ "$stable_authority_run_id" =~ ^[1-9][0-9]*$ ]] || {
              echo '::error::Stable-derived durable publication requires one exact Stable authority run id.'
              exit 1
            }
            create_args+=(--stable-authority-run-id "$stable_authority_run_id")
          fi

          node --experimental-strip-types scripts/webui-publication-record.ts \
            create \
            "${create_args[@]}" \
            --output "$record_path" \
            > "$sidecar_root/webui-publication-record-create.json"
          node --experimental-strip-types scripts/webui-publication-record.ts \
            validate \
            --input "$record_path" \
            > "$sidecar_root/webui-publication-record-verification.json"

          lookup_stderr="$sidecar_root/receipt-sidecar-lookup.stderr"
          descriptor_path="$sidecar_root/receipt-sidecar-descriptor.json"
          if oras manifest fetch --descriptor "$receipt_ref" > "$descriptor_path" 2> "$lookup_stderr"; then
            publication_outcome=preexisting_idempotent
          elif grep -Eqi 'not found|manifest unknown|name unknown|no such manifest|404' "$lookup_stderr"; then
            publication_outcome=created
            if ! (
              cd "$sidecar_root"
              oras push \
                --artifact-type "$artifact_media_type" \
                "$receipt_ref" \
                "webui-publication-record.json:$artifact_media_type"
            ) > "$sidecar_root/receipt-sidecar-push.txt" 2>&1; then
              publication_outcome=reconciled_after_unknown_write
              write_reconcile_evidence pending "$publication_outcome"
            fi
          else
            cat "$lookup_stderr" >&2
            echo '::error::Could not safely distinguish an absent receipt sidecar from a registry read failure.'
            exit 1
          fi

          oras manifest fetch --descriptor "$receipt_ref" > "$descriptor_path"
          oras manifest fetch "$receipt_ref" > "$sidecar_root/receipt-sidecar-manifest.json"
          oras pull --output "$pull_root" "$receipt_ref" > "$sidecar_root/receipt-sidecar-pull.txt"
          pulled_records=()
          while IFS= read -r pulled_record; do pulled_records+=("$pulled_record"); done < <(
            find "$pull_root" -type f -name webui-publication-record.json -print | LC_ALL=C sort
          )
          test "${#pulled_records[@]}" -eq 1 || {
            echo '::error::Receipt sidecar pull must contain exactly one webui-publication-record.json.'
            exit 1
          }
          pulled_record="${pulled_records[0]}"
          test -f "$pulled_record" && test ! -L "$pulled_record"
          cmp -s "$record_path" "$pulled_record" || {
            echo '::error::Receipt sidecar bytes differ from the generated canonical publication record.'
            exit 1
          }
          cp "$pulled_record" "$sidecar_root/receipt-sidecar-pulled-record.json"
          cmp -s "$record_path" "$sidecar_root/receipt-sidecar-pulled-record.json"
          node --experimental-strip-types scripts/webui-publication-record.ts \
            validate \
            --input "$sidecar_root/receipt-sidecar-pulled-record.json" \
            > "$sidecar_root/receipt-sidecar-pull-verification.json"

          node --input-type=module - \
            "$descriptor_path" \
            "$sidecar_root/receipt-sidecar-manifest.json" \
            "$record_path" \
            "$sidecar_root/receipt-sidecar-pulled-record.json" \
            "$artifact_media_type" \
            "$publication_outcome" <<'WEBUI_PUBLICATION_RECORD_SIDECAR_NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';

          const [descriptorPath, manifestPath, recordPath, pulledPath, artifactType, outcome] = process.argv.slice(2);
          const digest = (bytes) => `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
          const expected = fs.readFileSync(recordPath);
          const pulled = fs.readFileSync(pulledPath);
          if (!expected.equals(pulled)) throw new Error('receipt sidecar pull bytes differ from the generated record');
          const manifestBytes = fs.readFileSync(manifestPath);
          const descriptor = JSON.parse(fs.readFileSync(descriptorPath, 'utf8'));
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          if (
            descriptor?.mediaType !== 'application/vnd.oci.image.manifest.v1+json'
            || descriptor?.digest !== digest(manifestBytes)
            || descriptor?.size !== manifestBytes.byteLength
            || manifest?.schemaVersion !== 2
            || manifest?.mediaType !== descriptor.mediaType
            || manifest?.artifactType !== artifactType
            || !Array.isArray(manifest?.layers)
            || manifest.layers.length !== 1
          ) {
            throw new Error('receipt sidecar descriptor or manifest is not the exact expected OCI artifact');
          }
          const [layer] = manifest.layers;
          if (
            layer?.mediaType !== artifactType
            || layer?.digest !== digest(expected)
            || layer?.size !== expected.byteLength
            || !['created', 'preexisting_idempotent', 'reconciled_after_unknown_write'].includes(outcome)
          ) {
            throw new Error('receipt sidecar manifest does not bind the exact canonical publication record');
          }
          WEBUI_PUBLICATION_RECORD_SIDECAR_NODE
          if [ "$publication_outcome" = reconciled_after_unknown_write ]; then
            write_reconcile_evidence reconciled "$publication_outcome"
          else
            write_reconcile_evidence not_required "$publication_outcome"
          fi

      - name: Stage exact carrier receipt evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf carrier-artifact
          mkdir -p carrier-artifact
          for file in \
            build-input.json \
            build-input-verification.json \
            codex-artifact-verification.json \
            docker-context-policy-verification.json \
            carrier-receipt.json \
            carrier-receipt-verification.json \
            candidate-tag-readback.txt \
            image-repository-validation.json \
            image-inspect.json \
            immutable-readback.txt \
            registry-readback.json \
            runtime-summary.json \
            version-tag-authority.json \
            version-descriptor-readback.json \
            version-tag-manifest.json \
            version-tag-readback.txt; do
            test -f "webui-carrier/$file"
            cp "webui-carrier/$file" "carrier-artifact/$file"
          done
          sidecar_root="$RUNNER_TEMP/webui-publication-record-sidecar"
          for file in \
            webui-publication-record.json \
            webui-publication-record-create.json \
            webui-publication-record-verification.json \
            receipt-sidecar-descriptor.json \
            receipt-sidecar-manifest.json \
            receipt-sidecar-reconcile.json \
            receipt-sidecar-pulled-record.json \
            receipt-sidecar-pull-verification.json; do
            test -f "$sidecar_root/$file"
            cp "$sidecar_root/$file" "carrier-artifact/$file"
          done
          if [ '${{ inputs.authority_mode }}' = independent_preview ]; then
            for file in source-authority.json source-authority-verification.json source-authority-final-verification.json; do
              test -f "webui-carrier/$file"
              cp "webui-carrier/$file" "carrier-artifact/$file"
            done
          fi

      - name: Upload immutable carrier receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.receipt.outputs.carrier_artifact_name }}
          path: |
            carrier-artifact
          if-no-files-found: error
          retention-days: 90

      - name: Preserve receipt sidecar reconcile evidence after failed publication
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webui-sidecar-reconcile-${{ inputs.opl_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webui-publication-record-sidecar
          if-no-files-found: ignore
          retention-days: 30
