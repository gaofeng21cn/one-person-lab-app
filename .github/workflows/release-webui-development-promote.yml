name: OPL WebUI Independent Preview Latest Promotion
run-name: Promote WebUI Preview carrier run ${{ inputs.carrier_follower_run_id }} to latest

on:
  workflow_dispatch:
    inputs:
      carrier_follower_run_id:
        description: Exact successful first-attempt Preview publication run.
        required: true
        type: string
      carrier_executor_ref:
        description: Exact App SHA that executed the Preview publication.
        required: true
        type: string
      carrier_artifact_name:
        description: Exact unexpired carrier receipt artifact from that run.
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-webui-independent-preview-latest-global
  cancel-in-progress: false

jobs:
  promote-webui-latest:
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: independent_preview
      carrier_follower_run_id: ${{ inputs.carrier_follower_run_id }}
      carrier_executor_ref: ${{ inputs.carrier_executor_ref }}
      carrier_artifact_name: ${{ inputs.carrier_artifact_name }}
