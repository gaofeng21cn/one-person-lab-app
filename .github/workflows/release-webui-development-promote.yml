name: OPL WebUI Independent Promotion
run-name: Promote durable WebUI ${{ inputs.channel }} record ${{ inputs.publication_record_ref }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Moving Docker channel set to update.
        required: true
        type: choice
        options:
          - stable
          - preview
      publication_record_ref:
        description: Exact durable GHCR WebUI Preview publication-record reference.
        required: true
        type: string
      operator_confirmation:
        description: "Exact confirmation: move-docker-stable-and-latest:<version> or move-docker-latest:<version>."
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  promote-webui-latest:
    permissions:
      contents: read
      actions: read
      packages: write
    uses: ./.github/workflows/release-webui-stable.yml
    with:
      mode: execute
      authority_mode: ${{ inputs.channel == 'stable' && 'independent_stable' || 'independent_preview' }}
      publication_record_ref: ${{ inputs.publication_record_ref }}
      operator_confirmation: ${{ inputs.operator_confirmation }}
