name: Prepare frozen clean VM inputs

on:
  workflow_call:
    inputs:
      app_ref:
        description: Frozen App source holding qualification input digests.
        required: true
        type: string
      package_profile:
        description: Standard or Full input namespace.
        required: true
        type: string
      dependency_manifest_artifact:
        description: Same-run frozen Standard dependency manifest; empty skips optional preparation.
        required: false
        default: ''
        type: string
      build_cohort_artifact:
        description: Exact Full build cohort holding frozen qualification runtime identities.
        required: false
        default: ''
        type: string
      build_cohort_run_id:
        description: Original producer run for the Full cohort, including checkpoint recovery.
        required: false
        default: ''
        type: string
      retry_artifact_upload_once:
        description: Retry the exact install tarball artifact upload once after a transport failure.
        required: false
        default: true
        type: boolean
    outputs:
      artifact_name:
        description: Verified install tarballs only; never a qualification receipt.
        value: ${{ jobs.prepare.outputs.artifact_name }}

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: ${{ inputs.dependency_manifest_artifact != '' || inputs.build_cohort_artifact != '' }}
    runs-on: [self-hosted, macOS, ARM64, opl-cert-mac-tart]
    timeout-minutes: 10
    continue-on-error: true
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Checkout frozen qualification inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_ref }}
          path: frozen-inputs
          persist-credentials: false
      - name: Checkout current preparation executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: executor
          persist-credentials: false
      - name: Inspect source VM inventory without allocating a VM
        env:
          SOURCE_VM: ${{ vars.OPL_FIRST_RUN_TART_SOURCE }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen-inputs rev-parse HEAD)" = '${{ inputs.app_ref }}'
          case '${{ inputs.package_profile }}' in standard|full) ;; *) exit 1 ;; esac
          test -n "$SOURCE_VM"
          tart list --source local --quiet | grep -Fx "$SOURCE_VM"
          echo 'VM source available; no VM has been created or started.'
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Download frozen qualification dependencies
        if: ${{ inputs.dependency_manifest_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.dependency_manifest_artifact }}
          path: frozen-dependency-resolution
      - name: Download exact Full qualification cohort
        if: ${{ inputs.dependency_manifest_artifact == '' && inputs.build_cohort_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.build_cohort_artifact }}
          run-id: ${{ inputs.build_cohort_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: frozen-build-cohort
      - name: Restore Codex install asset cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/opl-first-run-vm/codex-package-tarballs
          key: opl-first-run-codex-tarballs-v1-${{ runner.os }}-${{ runner.arch }}-latest
          restore-keys: |
            opl-first-run-codex-tarballs-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare digest-bound install assets from frozen inputs
        id: prefetch
        env:
          OPL_CODEX_PREWARM_MANIFEST: ${{ inputs.dependency_manifest_artifact != '' && 'frozen-dependency-resolution/qualification-input-manifest.json' || '' }}
          OPL_CODEX_BUILD_COHORT_MANIFEST: frozen-build-cohort/opl-build-cohort.json
          CACHE_KEY_PREFIX: opl-first-run-codex-tarballs-v1-${{ runner.os }}-${{ runner.arch }}
          CODEX_CACHE_RESTORE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
        run: node executor/scripts/prefetch-codex-package-install-assets.mjs
      - name: Save verified install assets for the next exact cohort
        if: ${{ github.ref == 'refs/heads/main' && steps.prefetch.outputs.cache_save_required == 'true' }}
        continue-on-error: true
        env:
          OPL_ACTIONS_CACHE_CLASS: first_run_install_seed
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/opl-first-run-vm/codex-package-tarballs
          key: ${{ steps.prefetch.outputs.cache_key }}
      - name: Upload exact install tarballs
        id: upload_tarballs
        continue-on-error: ${{ inputs.retry_artifact_upload_once }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-clean-vm-prepared-${{ inputs.package_profile }}-${{ github.run_id }}
          path: artifacts/opl-first-run-vm/codex-package-tarballs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Retry exact install tarballs upload once
        id: retry_upload_tarballs
        if: ${{ inputs.retry_artifact_upload_once && steps.upload_tarballs.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-clean-vm-prepared-${{ inputs.package_profile }}-${{ github.run_id }}
          path: artifacts/opl-first-run-vm/codex-package-tarballs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true
      - name: Expose successful preparation
        id: identity
        if: ${{ steps.upload_tarballs.outcome == 'success' || steps.retry_upload_tarballs.outcome == 'success' }}
        run: echo 'artifact_name=opl-clean-vm-prepared-${{ inputs.package_profile }}-${{ github.run_id }}' >> "$GITHUB_OUTPUT"
