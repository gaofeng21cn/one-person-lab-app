name: OPL Standard Nightly Release
run-name: OPL Standard Nightly (${{ github.event_name == 'schedule' && 'scheduled-production' || 'development-validation' }})

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      operator_confirmation:
        description: Type publish_nonlatest_nightly for user-explicit development validation
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: opl-standard-nightly
  cancel-in-progress: false

jobs:
  admission:
    name: Freeze exact Nightly request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.request.outputs.version }}
      updater_version: ${{ steps.request.outputs.updater_version }}
      tag: ${{ steps.request.outputs.tag }}
      app_ref: ${{ steps.request.outputs.app_ref }}
      shell_ref: ${{ steps.request.outputs.shell_ref }}
      shell_repository: ${{ steps.profile.outputs.shell_repository }}
      shell_root: ${{ steps.profile.outputs.shell_root }}
      framework_ref: ${{ steps.request.outputs.framework_ref }}
      request_digest: ${{ steps.request.outputs.request_digest }}
      invocation_mode: ${{ steps.request.outputs.invocation_mode }}
      invocation_event: ${{ steps.request.outputs.invocation_event }}
      authority_source: ${{ steps.request.outputs.authority_source }}
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Checkout canonical App source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve active Shell build profile
        id: profile
        run: node --experimental-strip-types scripts/active-shell-build-profile.ts --github-output "$GITHUB_OUTPUT"

      - name: Freeze one exact Standard Nightly request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR_CONFIRMATION: ${{ inputs.operator_confirmation || '' }}
          SHELL_REPOSITORY: ${{ steps.profile.outputs.shell_repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1 || {
            echo "::error::Nightly is one-shot; reruns require a new invocation and version."
            exit 1
          }
          case "$GITHUB_EVENT_NAME" in
            schedule)
              test -z "$OPERATOR_CONFIRMATION"
              invocation_mode=scheduled_production
              authority_source=daily_schedule
              ;;
            workflow_dispatch)
              test "$OPERATOR_CONFIRMATION" = publish_nonlatest_nightly || {
                echo "::error::Development-validation Nightly requires the exact non-Latest confirmation."
                exit 1
              }
              invocation_mode=development_validation
              authority_source=user_explicit
              ;;
            *)
              echo "::error::Nightly requires the daily schedule or user-explicit development validation."
              exit 1
              ;;
          esac
          test "$GITHUB_REF" = refs/heads/main
          app_ref="$(git rev-parse HEAD)"
          remote_app_ref="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$app_ref" = "$remote_app_ref" || {
            echo "::error::Nightly must freeze canonical App main."
            exit 1
          }
          shell_ref="$(git ls-remote "https://github.com/$SHELL_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          framework_ref="$(git ls-remote https://github.com/gaofeng21cn/one-person-lab.git refs/heads/main | awk '{print $1}')"
          [[ "$shell_ref" =~ ^[0-9a-f]{40}$ ]]
          [[ "$framework_ref" =~ ^[0-9a-f]{40}$ ]]
          base_version="$(TZ=Asia/Shanghai date '+%y.%-m.%-d')-nightly"
          existing_refs="$RUNNER_TEMP/nightly-existing-refs.txt"
          {
            git ls-remote --tags origin "refs/tags/v${base_version}" "refs/tags/v${base_version}.r*"
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --exclude-drafts=false --exclude-pre-releases=false --json tagName --jq '.[].tagName'
          } | sort -u > "$existing_refs"
          node --experimental-strip-types scripts/resolve-nightly-release-request.ts \
            --base-version "$base_version" \
            --existing-ref-file "$existing_refs" \
            --app-ref "$app_ref" \
            --shell-ref "$shell_ref" \
            --framework-ref "$framework_ref" \
            --actions-run-id "$GITHUB_RUN_ID" \
            --actions-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --invocation-mode "$invocation_mode" \
            --event "$GITHUB_EVENT_NAME" \
            --authority-source "$authority_source" \
            --operator-confirmation "$OPERATOR_CONFIRMATION" \
            --output opl-nightly-request.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Resolve required Nightly platform matrix
        id: platforms
        run: >-
          node --experimental-strip-types scripts/resolve-release-platform-matrix.ts
          --policy nightly_standard
          --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable Nightly request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-nightly-request-${{ github.run_id }}
          path: opl-nightly-request.json
          if-no-files-found: error
          retention-days: 14

  standard-build:
    name: Build exact Standard preview assets
    needs: [admission]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.admission.outputs.matrix }}
      release_validation_profile: stable
      ref: ${{ needs.admission.outputs.app_ref }}
      shell_ref: ${{ needs.admission.outputs.shell_ref }}
      framework_ref: ${{ needs.admission.outputs.framework_ref }}
      skip_code_quality: false
      append_commit_hash: false
      upload_installers_only: false
      opl_release_version: ${{ needs.admission.outputs.version }}
      opl_updater_version: ${{ needs.admission.outputs.updater_version }}
      require_macos_gatekeeper: false

  qualify-and-publish:
    name: Qualify assets and publish immutable prerelease
    needs: [admission, standard-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-nightly
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact App executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.admission.outputs.app_ref }}
          fetch-depth: 0

      - name: Checkout exact active shell asset adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.admission.outputs.shell_repository }}
          ref: ${{ needs.admission.outputs.shell_ref }}
          path: ${{ needs.admission.outputs.shell_root }}
          fetch-depth: 0

      - name: Checkout exact Framework notes source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/one-person-lab
          ref: ${{ needs.admission.outputs.framework_ref }}
          path: framework-source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install App validation dependencies
        run: npm ci --ignore-scripts

      - name: Download immutable Nightly request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opl-nightly-request-${{ github.run_id }}
          path: nightly-request

      - name: Download Standard build assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-macos-arm64
          path: build-artifacts

      - name: Download Standard build cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-macos-arm64-dmg-cohort
          path: build-cohort

      - name: Normalize and qualify Standard-only assets
        env:
          OPL_RELEASE_VERSION: ${{ needs.admission.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/prepare-release-assets.ts \
            build-artifacts nightly-assets --skip-linux-desktop-payload
          node --experimental-strip-types scripts/generate-frozen-universal-installer.ts \
            --source install.sh \
            --output nightly-assets/opl-install.sh \
            --version '${{ needs.admission.outputs.version }}' \
            --app-sha '${{ needs.admission.outputs.app_ref }}' \
            --shell-sha '${{ needs.admission.outputs.shell_ref }}' \
            --framework-sha '${{ needs.admission.outputs.framework_ref }}' \
            --repository "$GITHUB_REPOSITORY"
          test -f nightly-assets/opl-install.sh
          test ! -L nightly-assets/opl-install.sh
          test -x nightly-assets/opl-install.sh
          bash -n nightly-assets/opl-install.sh
          node --experimental-strip-types scripts/nightly-release-qualification.ts \
            --request nightly-request/opl-nightly-request.json \
            --assets-dir nightly-assets \
            --cohort build-cohort/opl-build-cohort.json \
            --output nightly-qualification.json
          test "$(jq -r .request_digest nightly-qualification.json)" = '${{ needs.admission.outputs.request_digest }}'
          test "$(jq -r .include_full nightly-qualification.json)" = false
          test "$(jq -r .stable_qualified nightly-qualification.json)" = false
          test "$(jq -r .heavy_vm_required nightly-qualification.json)" = false

      - name: Freeze latest usable published release notes baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > published-releases.json
          previous="$(jq -er '
            [.[][]
              | select(.draft == false)
              | select((.published_at | type) == "string")
              | select((.target_commitish | type) == "string"
                  and (.target_commitish | test("^[0-9a-f]{40}$")))
              | select([.assets[]?
                  | select(.name == "opl-app-component-manifest.json")] | length == 1)]
            | sort_by(.published_at, .id)
            | last
            | [.published_at, (.id | tostring), .tag_name, .target_commitish,
                ([.assets[]
                  | select(.name == "opl-app-component-manifest.json")][0].id | tostring)]
            | @tsv
          ' published-releases.json)"
          IFS=$'\t' read -r previous_published_at previous_id previous_tag previous_target manifest_asset_id \
            <<< "$previous"
          [[ "$previous_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$previous_target" =~ ^[0-9a-f]{40}$ ]]
          [[ "$manifest_asset_id" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$manifest_asset_id" \
            -H 'Accept: application/octet-stream' > nightly-baseline-component-manifest.json
          jq -n \
            --argjson release_id "$previous_id" \
            --arg tag "$previous_tag" \
            --arg target "$previous_target" \
            --arg published_at "$previous_published_at" \
            --slurpfile manifest nightly-baseline-component-manifest.json \
            '{schema:"opl_nightly_notes_baseline.v1",release:{id:$release_id,tag:$tag,target_commitish:$target,published_at:$published_at},component_manifest:$manifest[0]}' \
            > nightly-notes-baseline.json
          previous_app_ref="$(jq -er .component_manifest.source_cohort.app_sha nightly-notes-baseline.json)"
          previous_shell_ref="$(jq -er .component_manifest.source_cohort.shell_sha nightly-notes-baseline.json)"
          previous_framework_ref="$(jq -er .component_manifest.source_cohort.framework_sha nightly-notes-baseline.json)"
          git fetch --no-tags origin "$previous_app_ref"
          git -C ${{ needs.admission.outputs.shell_root }} fetch --no-tags origin "$previous_shell_ref"
          git -C framework-source fetch --no-tags origin "$previous_framework_ref"

      - name: Write deterministic Nightly changelog
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/nightly-release-notes.ts \
            --request nightly-request/opl-nightly-request.json \
            --qualification nightly-qualification.json \
            --baseline nightly-notes-baseline.json \
            --app-root . \
            --shell-root ${{ needs.admission.outputs.shell_root }} \
            --framework-root framework-source \
            --output nightly-notes.md \
            --evidence-output nightly-notes-evidence.json

      - name: Publish one immutable non-Latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          node --experimental-strip-types scripts/nightly-release-publisher.ts \
            --request nightly-request/opl-nightly-request.json \
            --qualification nightly-qualification.json \
            --assets-dir nightly-assets \
            --notes nightly-notes.md \
            --output nightly-publication.json
          test "$(jq -r .github_release.prerelease nightly-publication.json)" = true
          test "$(jq -r .github_release.make_latest nightly-publication.json)" = false
          test "$(jq -r .include_full nightly-publication.json)" = false
          test "$(jq -r .invocation.mode nightly-publication.json)" = \
            '${{ needs.admission.outputs.invocation_mode }}'
          test "$(jq -r .invocation.event nightly-publication.json)" = \
            '${{ needs.admission.outputs.invocation_event }}'
          test "$(jq -r .invocation.authority_source nightly-publication.json)" = \
            '${{ needs.admission.outputs.authority_source }}'
          test "$(jq -r .github_release.latest_before nightly-publication.json)" = \
            "$(jq -r .github_release.latest_after nightly-publication.json)"

      - name: Upload exact Nightly publication handoff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opl-nightly-publication-${{ github.run_id }}
          path: |
            nightly-request/opl-nightly-request.json
            nightly-qualification.json
            nightly-notes-baseline.json
            nightly-notes-evidence.json
            nightly-publication.json
          if-no-files-found: error
          retention-days: 30
