name: Codex review advisory

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to re-evaluate after resolving Codex feedback
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-review-gate-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: Codex review advisory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted gate implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm

      - name: Install gate dependencies
        run: npm ci --ignore-scripts

      - name: Wait for and evaluate Codex review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_number || github.event.pull_request.number }}
          CODEX_REVIEW_WAIT_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '0' || '900' }}
          CODEX_REVIEW_POLL_SECONDS: '30'
        run: node --experimental-strip-types scripts/codex-review-gate.ts
