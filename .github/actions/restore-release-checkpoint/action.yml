name: Restore OPL Release Bundle checkpoint
description: Import one Framework-owned portable checkpoint and expose its immutable identity

inputs:
  framework-executor-ref:
    description: Exact Framework executor SHA used to verify and import the checkpoint; independent from the frozen Bundle source SHA
    required: true
  source-run-id:
    description: Exact Actions run containing the checkpoint artifact
    required: true
  source-artifact:
    description: Exact checkpoint artifact name
    required: true
  github-token:
    description: Read-only token used to download an artifact from the exact source run
    required: true
  allow-reconcile-required:
    description: Permit one imported unknown marker only for a caller that immediately performs exact read-only reconcile
    required: false
    default: 'false'
  local-checkpoint-dir:
    description: Existing unpacked checkpoint directory in this job; when set, skip artifact download
    required: false
    default: ''

outputs:
  checkpoint_dir:
    value: ${{ steps.restore.outputs.checkpoint_dir }}
  store_dir:
    value: ${{ steps.restore.outputs.store_dir }}
  bundle_path:
    value: ${{ steps.restore.outputs.bundle_path }}
  bundle_digest:
    value: ${{ steps.restore.outputs.bundle_digest }}
  channel:
    value: ${{ steps.restore.outputs.channel }}
  version:
    value: ${{ steps.restore.outputs.version }}
  updater_version:
    value: ${{ steps.restore.outputs.updater_version }}
  tag:
    value: ${{ steps.restore.outputs.tag }}
  app_ref:
    value: ${{ steps.restore.outputs.app_ref }}
  shell_ref:
    value: ${{ steps.restore.outputs.shell_ref }}
  framework_source_ref:
    value: ${{ steps.restore.outputs.framework_source_ref }}
  framework_executor_ref:
    value: ${{ steps.restore.outputs.framework_executor_ref }}
  checkpoint_import_json:
    value: ${{ steps.restore.outputs.checkpoint_import_json }}
  completed_stage:
    value: ${{ steps.restore.outputs.completed_stage }}
  checkpoint_transport_executor:
    value: ${{ steps.restore.outputs.checkpoint_transport_executor }}
  transport_run_id:
    value: ${{ steps.restore.outputs.transport_run_id }}
  live_mutation_allowed:
    value: ${{ steps.restore.outputs.live_mutation_allowed }}
  active_unknown_marker_count:
    value: ${{ steps.restore.outputs.active_unknown_marker_count }}
  standard_operation_id:
    value: ${{ steps.restore.outputs.standard_operation_id }}
  standard_operation_started_at:
    value: ${{ steps.restore.outputs.standard_operation_started_at }}
  standard_operation_deadline_at:
    value: ${{ steps.restore.outputs.standard_operation_deadline_at }}
  append_full_operation_id:
    value: ${{ steps.restore.outputs.append_full_operation_id }}
  append_full_operation_started_at:
    value: ${{ steps.restore.outputs.append_full_operation_started_at }}
  append_full_operation_deadline_at:
    value: ${{ steps.restore.outputs.append_full_operation_deadline_at }}

runs:
  using: composite
  steps:
    - name: Initialize typed restore evidence
      id: evidence
      shell: bash
      env:
        FRAMEWORK_EXECUTOR_REF: ${{ inputs.framework-executor-ref }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        SOURCE_ARTIFACT: ${{ inputs.source-artifact }}
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/opl-release-checkpoint-restore-$GITHUB_JOB"
        mkdir -p "$evidence_dir"
        touch "$evidence_dir/restore.stdout.log" "$evidence_dir/restore.stderr.log"
        jq -n \
          --arg framework_executor_ref "$FRAMEWORK_EXECUTOR_REF" \
          --arg source_run_id "$SOURCE_RUN_ID" \
          --arg source_artifact "$SOURCE_ARTIFACT" \
          --arg transport_run_id "$GITHUB_RUN_ID" \
          '{framework_executor_ref:$framework_executor_ref,source_run_id:$source_run_id,source_artifact:$source_artifact,checkpoint_transport_executor:"github_actions",transport_run_id:$transport_run_id}' \
          > "$evidence_dir/input.json"
        shasum -a 256 "$evidence_dir/input.json" | awk '{print "sha256:"$1}' > "$evidence_dir/input.sha256"
        echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

    - name: Download exact portable checkpoint
      if: ${{ inputs.local-checkpoint-dir == '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ inputs.source-artifact }}
        path: imported-checkpoint
        run-id: ${{ inputs.source-run-id }}
        github-token: ${{ inputs.github-token }}

    - name: Bind local portable checkpoint
      if: ${{ inputs.local-checkpoint-dir != '' }}
      shell: bash
      env:
        LOCAL_CHECKPOINT_DIR: ${{ inputs.local-checkpoint-dir }}
      run: |
        set -euo pipefail
        test -d "$LOCAL_CHECKPOINT_DIR"
        test ! -L "$LOCAL_CHECKPOINT_DIR"
        mkdir -p imported-checkpoint
        # Reuse the already-downloaded tree; do not copy the portable checkpoint again.
        ln -s "$(cd "$LOCAL_CHECKPOINT_DIR" && pwd)" imported-checkpoint/local

    - name: Resolve the opaque checkpoint transport
      id: binding
      shell: bash
      env:
        EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        FRAMEWORK_EXECUTOR_REF: ${{ inputs.framework-executor-ref }}
        SOURCE_ARTIFACT: ${{ inputs.source-artifact }}
      run: |
        set -euo pipefail
        exec > >(tee -a "$EVIDENCE_DIR/restore.stdout.log") \
          2> >(tee -a "$EVIDENCE_DIR/restore.stderr.log" >&2)
        checkpoints=()
        while IFS= read -r checkpoint; do
          checkpoints+=("$checkpoint")
        done < <(find -L imported-checkpoint -type f -name checkpoint.json -print)
        [ "${#checkpoints[@]}" -eq 1 ] || {
          echo "::error::Artifact $SOURCE_ARTIFACT must contain exactly one portable checkpoint.json."
          exit 1
        }
        checkpoint="${checkpoints[0]}"
        checkpoint_dir="$(dirname "$checkpoint")"
        [[ "$FRAMEWORK_EXECUTOR_REF" =~ ^[0-9a-f]{40}$ ]] || {
          echo "::error::Framework checkpoint executor must be an exact lowercase SHA."
          exit 1
        }

        find -L imported-checkpoint -type f -print0 \
          | sort -z \
          | while IFS= read -r -d '' input_file; do
              jq -cn \
                --arg path "${input_file#imported-checkpoint/}" \
                --arg sha256 "$(shasum -a 256 "$input_file" | awk '{print "sha256:"$1}')" \
                --argjson size_bytes "$(wc -c < "$input_file" | tr -d ' ')" \
                '{path:$path,size_bytes:$size_bytes,sha256:$sha256}'
            done \
          | jq -s . > "$EVIDENCE_DIR/downloaded-inputs.json"
        jq -n \
          --slurpfile request "$EVIDENCE_DIR/input.json" \
          --slurpfile downloaded "$EVIDENCE_DIR/downloaded-inputs.json" \
          --arg framework_executor_ref "$FRAMEWORK_EXECUTOR_REF" \
          '{request:$request[0],framework_executor_ref:$framework_executor_ref,downloaded_inputs:$downloaded[0]}' \
          > "$EVIDENCE_DIR/bound-input.json"
        shasum -a 256 "$EVIDENCE_DIR/bound-input.json" \
          | awk '{print "sha256:"$1}' > "$EVIDENCE_DIR/input.sha256"
        {
          echo "checkpoint=$checkpoint"
          echo "checkpoint_dir=$checkpoint_dir"
          echo "framework_executor_ref=$FRAMEWORK_EXECUTOR_REF"
        } >> "$GITHUB_OUTPUT"

    - name: Checkout exact Framework checkpoint executor
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: gaofeng21cn/one-person-lab
        ref: ${{ steps.binding.outputs.framework_executor_ref }}
        path: framework-executor

    - name: Setup Framework runtime
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: framework-executor/package-lock.json

    - name: Install Framework runtime dependencies
      shell: bash
      env:
        EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
      run: |
        set -euo pipefail
        npm --prefix framework-executor ci --ignore-scripts \
          > >(tee -a "$EVIDENCE_DIR/restore.stdout.log") \
          2> >(tee -a "$EVIDENCE_DIR/restore.stderr.log" >&2)

    - name: Verify and import portable checkpoint
      id: restore
      shell: bash
      env:
        EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        CHECKPOINT: ${{ steps.binding.outputs.checkpoint }}
        CHECKPOINT_DIR: ${{ steps.binding.outputs.checkpoint_dir }}
        FRAMEWORK_EXECUTOR_REF: ${{ steps.binding.outputs.framework_executor_ref }}
        ALLOW_RECONCILE_REQUIRED: ${{ inputs.allow-reconcile-required }}
      run: |
        set -euo pipefail
        exec > >(tee -a "$EVIDENCE_DIR/restore.stdout.log") \
          2> >(tee -a "$EVIDENCE_DIR/restore.stderr.log" >&2)
        [ "$(git -C framework-executor rev-parse HEAD)" = "$FRAMEWORK_EXECUTOR_REF" ] || {
          echo "::error::Framework checkout differs from the exact executor SHA."
          exit 1
        }

        store_dir="$RUNNER_TEMP/opl-release-store-$GITHUB_JOB"
        framework-executor/bin/opl release checkpoint import \
          --checkpoint "$CHECKPOINT" \
          --store "$store_dir" \
          --json \
          > "$EVIDENCE_DIR/framework-executor.stdout.log" \
          2> "$EVIDENCE_DIR/framework-executor.stderr.log"
        cp "$EVIDENCE_DIR/framework-executor.stdout.log" "$EVIDENCE_DIR/checkpoint-import-result.json"

        checkpoint_result="$EVIDENCE_DIR/checkpoint-import-result.json"
        test "$(jq -er .version "$checkpoint_result")" = g2
        checkpoint_import="$(jq -cer '.release_bundle_checkpoint_import' "$checkpoint_result")"
        test "$(jq -r .rebuild_performed <<<"$checkpoint_import")" = false
        test "$(jq -r .publish_state_imported <<<"$checkpoint_import")" = false
        completed_stage="$(jq -er '.checkpoint_stage | strings | select(length > 0)' <<<"$checkpoint_import")"
        bundle_digest="$(jq -er '.bundle_digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$checkpoint_import")"
        framework-executor/bin/opl release status \
          --bundle "$bundle_digest" \
          --store "$store_dir" \
          --json > "$EVIDENCE_DIR/framework-status.json"
        test "$(jq -er .version "$EVIDENCE_DIR/framework-status.json")" = g2
        status="$(jq -cer '.release_bundle_status' "$EVIDENCE_DIR/framework-status.json")"
        test "$(jq -er .bundle_digest <<<"$status")" = "$bundle_digest"
        active_unknown_marker_count="$(jq -er '.active_unknown_markers | length' <<<"$status")"
        live_mutation_allowed="$(jq -er '.live_mutation_allowed | if . then "true" else "false" end' <<<"$status")"
        if [ "$active_unknown_marker_count" -gt 0 ] && [ "$ALLOW_RECONCILE_REQUIRED" != true ]; then
          echo "::error::Imported checkpoint has an unresolved executor outcome; status and exact reconcile are required before ordinary mutation."
          exit 1
        fi
        if [ "$active_unknown_marker_count" -eq 0 ] && [ "$live_mutation_allowed" != true ]; then
          echo "::error::Checkpoint is read-only legacy state and cannot be migrated into live mutation authority."
          exit 1
        fi
        bundle_path="$(jq -er '.bundle_path | strings | select(length > 0)' <<<"$status")"
        test -f "$bundle_path"
        framework_source_ref="$(jq -er '.bundle.sources.framework.source_commit | select(test("^[0-9a-f]{40}$"))' <<<"$status")"
        {
          echo "checkpoint_dir=$CHECKPOINT_DIR"
          echo "store_dir=$store_dir"
          echo "bundle_path=$bundle_path"
          echo "bundle_digest=$bundle_digest"
          echo "channel=$(jq -r .bundle.release.channel <<<"$status")"
          echo "version=$(jq -r .bundle.release.version <<<"$status")"
          echo "updater_version=$(jq -r .bundle.release.updater_version <<<"$status")"
          echo "tag=$(jq -r .bundle.release.tag <<<"$status")"
          echo "app_ref=$(jq -r .bundle.sources.app.source_commit <<<"$status")"
          echo "shell_ref=$(jq -r .bundle.sources.shell.source_commit <<<"$status")"
          echo "framework_source_ref=$framework_source_ref"
          echo "framework_executor_ref=$FRAMEWORK_EXECUTOR_REF"
          echo "checkpoint_import_json=$checkpoint_import"
          echo "completed_stage=$completed_stage"
          echo "checkpoint_transport_executor=github_actions"
          echo "transport_run_id=$GITHUB_RUN_ID"
          echo "live_mutation_allowed=$live_mutation_allowed"
          echo "active_unknown_marker_count=$active_unknown_marker_count"
          echo "standard_operation_id=$(jq -r '.operation_controls.standard.operation_id // ""' <<<"$status")"
          echo "standard_operation_started_at=$(jq -r '.operation_controls.standard.operation_started_at // ""' <<<"$status")"
          echo "standard_operation_deadline_at=$(jq -r '.operation_controls.standard.operation_deadline_at // ""' <<<"$status")"
          echo "append_full_operation_id=$(jq -r '.operation_controls.append_full.operation_id // ""' <<<"$status")"
          echo "append_full_operation_started_at=$(jq -r '.operation_controls.append_full.operation_started_at // ""' <<<"$status")"
          echo "append_full_operation_deadline_at=$(jq -r '.operation_controls.append_full.operation_deadline_at // ""' <<<"$status")"
        } >> "$GITHUB_OUTPUT"

    - name: Finalize typed restore failure evidence
      if: ${{ failure() }}
      shell: bash
      env:
        EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        FRAMEWORK_EXECUTOR_REF: ${{ inputs.framework-executor-ref }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        SOURCE_ARTIFACT: ${{ inputs.source-artifact }}
      run: |
        set -euo pipefail
        evidence_dir="${EVIDENCE_DIR:-$RUNNER_TEMP/opl-release-checkpoint-restore-$GITHUB_JOB}"
        mkdir -p "$evidence_dir"
        touch \
          "$evidence_dir/restore.stdout.log" \
          "$evidence_dir/restore.stderr.log" \
          "$evidence_dir/framework-executor.stdout.log" \
          "$evidence_dir/framework-executor.stderr.log"
        if [ ! -s "$evidence_dir/input.json" ]; then
          jq -n \
            --arg framework_executor_ref "$FRAMEWORK_EXECUTOR_REF" \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_artifact "$SOURCE_ARTIFACT" \
            '{framework_executor_ref:$framework_executor_ref,source_run_id:$source_run_id,source_artifact:$source_artifact}' \
            > "$evidence_dir/input.json"
        fi
        if [ ! -s "$evidence_dir/input.sha256" ]; then
          shasum -a 256 "$evidence_dir/input.json" \
            | awk '{print "sha256:"$1}' > "$evidence_dir/input.sha256"
        fi
        if [ ! -s "$evidence_dir/checkpoint-import-failure.json" ]; then
          jq -n \
            --arg input_digest "$(cat "$evidence_dir/input.sha256")" \
            '{surface_kind:"opl_app_release_checkpoint_restore_failure.v1",failure_kind:"checkpoint_restore_failed",required_next_action:"inspect_typed_evidence_without_redispatch_or_rerun",rebuild_performed:false,input_digest:$input_digest,stdout_path:"restore.stdout.log",stderr_path:"restore.stderr.log"}' \
            > "$evidence_dir/checkpoint-import-failure.json"
        fi

    - name: Upload typed restore failure evidence
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: opl-release-checkpoint-restore-failure-${{ github.run_id }}-${{ github.job }}
        path: ${{ runner.temp }}/opl-release-checkpoint-restore-${{ github.job }}
        if-no-files-found: error
        retention-days: 30
