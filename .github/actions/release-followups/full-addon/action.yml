name: Reconcile Stable Full add-on
description: Reconcile the desired Full same-tag add-on state for one successful Standard source run.
inputs:
  source_run_id:
    description: Exact successful Standard Stable run id.
    required: true
  smoke_harness_ref:
    description: Optional exact Shell verification SHA for unchanged checkpoint bytes.
    required: false
    default: ''
  github_token:
    description: GitHub token used for exact run and artifact readback.
    required: true
runs:
  using: composite
  steps:
    - name: Bind successful Standard publication handoff
      id: source
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        RECONCILE_CONFIRMATION: reconcile_full_addon
      shell: bash
      run: |
        set -euo pipefail
        test "$GITHUB_RUN_ATTEMPT" = 1
        [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
        test "$GITHUB_REF" = refs/heads/main
        test "$RECONCILE_CONFIRMATION" = reconcile_full_addon

        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
        jq -e --arg run "$SOURCE_RUN_ID" '
          (.id | tostring) == $run
          and .repository.full_name == "gaofeng21cn/one-person-lab-app"
          and .head_repository.full_name == "gaofeng21cn/one-person-lab-app"
          and .path == ".github/workflows/release-stable.yml"
          and .event == "workflow_dispatch"
          and .head_branch == "main"
          and .run_attempt == 1
          and .status == "completed"
          and .conclusion == "success"
        ' source-run.json >/dev/null
        gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --name "opl-release-operation-admission-$SOURCE_RUN_ID" --dir source-admission
        mapfile -t admissions < <(find source-admission -type f -name release-operation-admission.json -print | LC_ALL=C sort)
        test "${#admissions[@]}" = 1
        operation="$(jq -er '.operation | strings' "${admissions[0]}")"
        case "$operation" in
          standard) artifact="opl-release-standard-checkpoint-$SOURCE_RUN_ID" ;;
          resume_standard) artifact="opl-release-standard-operation-checkpoint-$SOURCE_RUN_ID" ;;
          *) echo "::error::Full follower requires a successful Standard publication, got $operation."; exit 1 ;;
        esac
        gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --name "$artifact" --dir standard-checkpoint
        mapfile -t checkpoints < <(find standard-checkpoint -type f -name checkpoint.json -print | LC_ALL=C sort)
        mapfile -t bundles < <(find standard-checkpoint -type f -name bundle.json -print | LC_ALL=C sort)
        mapfile -t controls < <(find standard-checkpoint -type f -name stable-operation-control.json -print | LC_ALL=C sort)
        test "${#checkpoints[@]}" = 1
        test "${#bundles[@]}" = 1
        test "${#controls[@]}" = 1
        checkpoint="${checkpoints[0]}"
        bundle="${bundles[0]}"
        control="${controls[0]}"
        case "$(jq -er .checkpoint_stage "$checkpoint")" in standard_built|standard_qualified) ;; *) exit 1 ;; esac
        jq -e '
          .release.channel == "stable"
          and .release.prerelease == false
          and (.release.tag == ("v" + .release.version))
          and (.sources.app.source_commit | test("^[0-9a-f]{40}$"))
          and (.sources.shell.source_commit | test("^[0-9a-f]{40}$"))
          and (.sources.framework.source_commit | test("^[0-9a-f]{40}$"))
        ' "$bundle" >/dev/null
        app="$(jq -er .sources.app.source_commit "$bundle")"
        shell="$(jq -er .sources.shell.source_commit "$bundle")"
        framework="$(jq -er .sources.framework.source_commit "$bundle")"
        tag="$(jq -er .release.tag "$bundle")"
        test "$(jq -er .cohort.app_sha "$control")" = "$app"
        test "$(jq -er .cohort.shell_sha "$control")" = "$shell"
        test "$(jq -er .cohort.framework_sha "$control")" = "$framework"
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > standard-release.json
        jq -e --arg tag "$tag" --arg target "$app" '
          .tag_name == $tag and .target_commitish == $target
          and .draft == false and .prerelease == false and .immutable == false
        ' standard-release.json >/dev/null
        {
          echo "source_run_id=$SOURCE_RUN_ID"
          echo "source_artifact=$artifact"
          echo "app_ref=$app"
          echo "shell_ref=$shell"
          echo "framework_ref=$framework"
          echo "release_tag=$tag"
        } >> "$GITHUB_OUTPUT"

    - name: Reconcile Full target state through the canonical controller
      id: owner
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        APP_REF: ${{ steps.source.outputs.app_ref }}
        SHELL_REF: ${{ steps.source.outputs.shell_ref }}
        FRAMEWORK_REF: ${{ steps.source.outputs.framework_ref }}
        SMOKE_HARNESS_REF: ${{ inputs.smoke_harness_ref }}
      shell: bash
      run: |
        set -euo pipefail
        executor_sha="$(git rev-parse HEAD)"
        [[ "$executor_sha" =~ ^[0-9a-f]{40}$ ]]
        gh api "repos/$GITHUB_REPOSITORY/branches/main" > current-main.json
        test "$(jq -er .commit.sha current-main.json)" = "$executor_sha"
        args=(
          append-full
          --source-run-id "$SOURCE_RUN_ID"
          --app-ref "$APP_REF"
          --shell-ref "$SHELL_REF"
          --framework-ref "$FRAMEWORK_REF"
          --output stable-full-reconcile.json
          --execute
        )
        if [ -n "$SMOKE_HARNESS_REF" ]; then
          [[ "$SMOKE_HARNESS_REF" =~ ^[0-9a-f]{40}$ ]]
          args+=(--smoke-harness-ref "$SMOKE_HARNESS_REF")
        fi
        node --experimental-strip-types scripts/stable-release-dispatch.ts "${args[@]}"
        state="$(jq -er .status stable-full-reconcile.json)"
        case "$state" in published|owner_identified|dispatched) ;; *) exit 1 ;; esac
        owner_run_id="$(jq -er '.owner_run.id | tostring | select(test("^[1-9][0-9]*$"))' stable-full-reconcile.json)"
        mutation_count="$(jq -er '.mutation_invocation_count | select(. == 0 or . == 1)' stable-full-reconcile.json)"
        resolved_source_run_id="$(jq -r '.plan.source.run_id // empty' stable-full-reconcile.json)"
        resolved_source_artifact="$(jq -r '.plan.source.artifact // empty' stable-full-reconcile.json)"
        {
          echo "state=$state"
          echo "owner_run_id=$owner_run_id"
          echo "mutation_invocation_count=$mutation_count"
          echo "resolved_source_run_id=$resolved_source_run_id"
          echo "resolved_source_artifact=$resolved_source_artifact"
        } >> "$GITHUB_OUTPUT"

    - name: Write thin Full follower handoff
      env:
        STATE: ${{ steps.owner.outputs.state }}
        OWNER_RUN_ID: ${{ steps.owner.outputs.owner_run_id }}
        MUTATION_COUNT: ${{ steps.owner.outputs.mutation_invocation_count }}
        SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        SOURCE_ARTIFACT: ${{ steps.source.outputs.source_artifact }}
        RESOLVED_SOURCE_RUN_ID: ${{ steps.owner.outputs.resolved_source_run_id }}
        RESOLVED_SOURCE_ARTIFACT: ${{ steps.owner.outputs.resolved_source_artifact }}
        RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
      shell: bash
      run: |
        set -euo pipefail
        jq -n --arg state "$STATE" --arg owner "$OWNER_RUN_ID" \
          --arg source "$SOURCE_RUN_ID" --arg artifact "$SOURCE_ARTIFACT" --arg tag "$RELEASE_TAG" \
          --arg resolved_source "$RESOLVED_SOURCE_RUN_ID" --arg resolved_artifact "$RESOLVED_SOURCE_ARTIFACT" \
          --argjson mutations "$MUTATION_COUNT" '
            {schema:"opl_app_full_addon_follower.v1",status:$state,root_source_run_id:$source,source_run_id:(if $resolved_source == "" then $source else $resolved_source end),source_artifact:(if $resolved_artifact == "" then $artifact else $resolved_artifact end),release_tag:$tag,owner_run_id:$owner,mutation_invocation_count:$mutations,waits_for_owner_completion:false,remaining:(if $state == "published" then [] else ["full_addon"] end)}
          ' > full-addon-follower.json

    - name: Upload Full follower handoff
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: opl-full-addon-follower-${{ steps.source.outputs.source_run_id }}
        path: full-addon-follower.json
        if-no-files-found: error
        retention-days: 30
