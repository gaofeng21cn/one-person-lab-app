name: Observe Stable attempt
description: Write one non-authoritative observation for an exact completed Stable run.
inputs:
  source_run_id:
    description: Exact completed Stable run id.
    required: true
runs:
  using: composite
  steps:
    - name: Read the exact completed run and all jobs
      env:
        GH_TOKEN: ${{ github.token }}
        STABLE_RUN_ID: ${{ inputs.source_run_id }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$STABLE_RUN_ID" =~ ^[1-9][0-9]*$ ]]

        read_actions_api() {
          local output=$1 attempt error status
          shift
          for attempt in 1 2 3; do
            if error=$(gh api "$@" 2>&1 > "$output"); then
              return 0
            else
              status=$?
            fi
            printf '%s\n' "$error" >&2
            if [[ "$attempt" == 3 || ! "$error" =~ HTTP\ (502|503|504) ]]; then
              return "$status"
            fi
            sleep "$attempt"
          done
        }

        endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN_ID"
        read_actions_api stable-run.json "$endpoint"
        read_actions_api stable-job-pages.json --paginate --slurp "$endpoint/jobs?per_page=100"
        jq -e '
          if type == "array" and length > 0 and all(.[]; (.jobs | type) == "array")
          then {jobs: [.[].jobs[]]}
          else error("Expected a jobs array on each Actions API page")
          end
        ' stable-job-pages.json > stable-jobs.json

    - name: Write one non-authoritative first-terminal observation
      shell: bash
      run: |
        node --experimental-strip-types scripts/release-attempt-observability.ts \
          --run stable-run.json --jobs stable-jobs.json \
          --output release-attempt-observation.json

    - name: Upload append-only per-run observation
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: opl-release-attempt-observation-${{ inputs.source_run_id }}
        path: release-attempt-observation.json
        if-no-files-found: error
        retention-days: 90
