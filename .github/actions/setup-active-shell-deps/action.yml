name: Setup active shell dependencies
description: Checkout the active shell and prepare Node/Bun dependencies for App-owned CI jobs.

inputs:
  shell-ref:
    description: opl-aion-shell ref to checkout for the active shell. Empty means main.
    required: false
    default: main
  fetch-depth:
    description: Git history depth for the active shell checkout.
    required: false
    default: '1'
  install-dependencies:
    description: Whether to run bun install in shells/aionui.
    required: false
    default: 'true'
  run-postinstall:
    description: Whether to run the active shell postinstall script after dependency install.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout active shell
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: gaofeng21cn/opl-aion-shell
        ref: ${{ inputs.shell-ref || 'main' }}
        path: shells/aionui
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'

    - name: Setup bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.14'

    - name: Restore Bun install cache
      id: restore-bun-install-cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.install-dependencies == 'true' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-${{ runner.arch }}-
          bun-install-${{ runner.os }}-

    - name: Install dependencies
      if: ${{ inputs.install-dependencies == 'true' }}
      shell: bash
      working-directory: shells/aionui
      run: bun install --frozen-lockfile

    - name: Run postinstall
      if: ${{ inputs.install-dependencies == 'true' && inputs.run-postinstall == 'true' }}
      shell: bash
      working-directory: shells/aionui
      run: bun run postinstall || true

    - name: Save Bun install cache
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.install-dependencies == 'true' && steps.restore-bun-install-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shells/aionui/package.json', 'shells/aionui/bun.lock') }}
